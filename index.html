<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#f7f3eb">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="古诗文背诵">
  <meta property="og:title" content="上海初高古诗文背诵">
  <meta property="og:description" content="课标与统编教材古诗文背诵：全文学习、逐句翻译、考试重点、默写自测、错题本与复习计划，纯本地离线可用。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23f7f3eb'/%3E%3Crect x='8' y='8' width='48' height='48' rx='4' fill='%23a33a2a'/%3E%3Ctext x='32' y='45' font-family='SimSun,serif' font-size='36' text-anchor='middle' fill='%23f7f3eb'%3E%E8%AF%97%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    /* 主题预置：避免刷新时闪白 / 闪黑（与 app.js 使用同一个 key） */
    (function () {
      var KEY = 'hison-poetry-theme';
      var theme = null;
      try { theme = localStorage.getItem(KEY); } catch (err) { theme = null; }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#130f0b' : '#f7f3eb');
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="app">
    <header class="app-header">
      <div class="app-header-inner">
        <button type="button" id="headerBack" class="header-back" hidden aria-label="返回">←</button>
        <div class="brand-lockup">
          <span class="brand-logo" aria-hidden="true">诗</span>
          <div class="app-title-box">
            <h1 class="app-title">上海初高古诗文背诵</h1>
            <p class="app-subtitle" id="headerSubtitle">初高中古诗文背诵学习系统 · 纯本地运行</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="header-meta" id="headerMeta"></div>
          <button type="button" id="themeToggle" class="icon-btn" aria-label="切换深色 / 浅色模式" title="切换深色 / 浅色模式">🌙</button>
        </div>
      </div>
    </header>

    <main id="main" class="app-main" tabindex="-1">
      <noscript>
        <div class="card">
          <p>本系统需要浏览器启用 JavaScript 才能运行。</p>
        </div>
      </noscript>
      <div id="viewRoot" class="view-root"></div>
    </main>

    <!-- 页脚由 js/brand.js 注入（署名 / 授权 / 版本），被删除也会自动重建 -->
    <footer id="appFooter" class="brand-foot app-footer"></footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/metadata.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/brand.js"></script>
  <script src="data/junior.js"></script>
  <script src="data/senior.js"></script>
  <script src="data/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/study.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/worksheet.js"></script>
  <!-- HOSTED_CLOUD_START -->
  <script src="js/cloud-sync.js"></script>
  <script src="js/cloud-adapter.js"></script>
  <!-- HOSTED_CLOUD_END -->
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
