      text: '君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规。虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。',

      text: '屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。“离骚”者，犹离忧也。夫天者，人之始也；父母者，人之本也。人穷则反本，故劳苦倦极，未尝不呼天也；疾痛惨怛，未尝不呼父母也。屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？屈平之作《离骚》，盖自怨生也。《国风》好色而不淫，《小雅》怨诽而不乱。若《离骚》者，可谓兼之矣。上称帝喾，下道齐桓，中述汤、武，以刺世事。明道德之广崇，治乱之条贯，靡不毕见。其文约，其辞微，其志洁，其行廉。其称文小而其指极大，举类迩而见义远。其志洁，故其称物芳；其行廉，故死而不容。自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。推此志也，虽与日月争光可也。',

        '李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第5篇',
      highlights: [{ type: '名句', text: '师者，所以传道受业解惑也。' }, { type: '名句', text: '是故弟子不必不如师，师不必贤于弟子。' }, { type: '易错字', text: '受业 庸知 句读 或不焉 郯子 苌弘 老聃 贻之' }],
      tags: ['论'] },

    { id: 'e-pang-gong-fu', title: '阿房宫赋', author: '杜牧', dynasty: '唐', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '六王毕，四海一。蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。' +
        '妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦，朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不见者，三十六年。燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。' +
        '嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！' +
        '呜呼！灭六国者六国也，非秦也；族秦者秦也，非天下也。嗟夫！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第6篇',
      highlights: [{ type: '名句', text: '使天下之人，不敢言而敢怒。' }, { type: '名句', text: '秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。' }, { type: '易错字', text: '兀 缦回 囷囷 蜂房水涡 妃嫔媵嫱 辇 辘辘 逦迤 锱铢 庾 呕哑' }],
      tags: ['赋'] },

    { id: 'liu-guo-lun', title: '六国论', author: '苏洵', dynasty: '北宋', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧。盖失强援，不能独完。故曰：弊在赂秦也。' +
        '秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”此言得之。' +
        '齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。' +
        '呜呼！以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！' +
        '夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第7篇',
      highlights: [{ type: '名句', text: '六国破灭，非兵不利，战不善，弊在赂秦。' }, { type: '名句', text: '为国者无使为积威之所劫哉！' }, { type: '易错字', text: '赂秦 厥先祖父 暴霜露 草芥 与嬴 洎牧 革灭殆尽 积威' }],
      tags: ['论'] },

    { id: 'da-si-ma-jian-yi-shu', title: '答司马谏议书', author: '王安石', dynasty: '北宋', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。' +
        '盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。' +
        '人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已。盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。' +
        '无由会晤，不任区区向往之至！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第8篇',
      highlights: [{ type: '名句', text: '至于怨诽之多，则固前知其如此也。' }, { type: '易错字', text: '强聒 卤莽 壬人 汹汹然 盘庚 胥怨 膏泽' }],
      tags: ['书信'] },

    { id: 'chi-bi-fu', title: '赤壁赋', author: '苏轼', dynasty: '北宋', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。' +
        '于是饮酒乐甚，扣舷而歌之。歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。' +
        '苏子愀然，正襟危坐而问客曰：“何为其然也？”客曰：“‘月明星稀，乌鹊南飞’，此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。”' +
        '苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。是造物者之无尽藏也，而吾与子之所共适。”' +
        '客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第9篇',
      highlights: [{ type: '名句', text: '寄蜉蝣于天地，渺沧海之一粟。' }, { type: '名句', text: '惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色。' }, { type: '易错字', text: '属客 窈窕 冯虚御风 桂棹 溯流光 嫠妇 愀然 相缪 舳舻 酾酒 横槊 匏樽 蜉蝣 枕藉' }],
      variants: [{ label: '版本差异', text: '“杯盘狼籍”部分版本作“杯盘狼藉”。' }],
      tags: ['赋'] },

    { id: 'xiang-ji-xuan-zhi', title: '项脊轩志', author: '归有光', dynasty: '明', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。' +
        '然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是。东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰：“某所，而母立于兹。”妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”语未毕，余泣，妪亦泣。余自束发读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”瞻顾遗迹，如在昨日，令人长号不自禁。' +
        '轩东故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。' +
        '余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。' +
        '庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第10篇',
      highlights: [{ type: '名句', text: '庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。' }, { type: '易错字', text: '渗漉 修葺 栏楯 偃仰 斑驳 异爨 逾庖 老妪 先妣 呱呱 象笏 扃牖 枇杷' }],
      tags: ['志'] },

    /* ============ 文言文（32 篇）· 选择性必修（10 篇）============ */

    { id: 'zi-lu-zeng-xi-ran-you-gong-xi-hua', title: '子路、曾皙、冉有、公西华侍坐', author: '《论语》', dynasty: '先秦', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '子路、曾皙、冉有、公西华侍坐。子曰：“以吾一日长乎尔，毋吾以也。居则曰：‘不吾知也。’如或知尔，则何以哉？”' +
        '子路率尔而对曰：“千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比及三年，可使有勇，且知方也。”夫子哂之。' +
        '“求，尔何如？”对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟君子。”' +
        '“赤，尔何如？”对曰：“非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。”' +
        '“点，尔何如？”鼓瑟希，铿尔，舍瑟而作，对曰：“异乎三子者之撰。”子曰：“何伤乎？亦各言其志也。”曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。”夫子喟然叹曰：“吾与点也！”' +
        '三子者出，曾皙后。曾皙曰：“夫三子者之言何如？”子曰：“亦各言其志也已矣。”曰：“夫子何哂由也？”曰：“为国以礼，其言不让，是故哂之。”“唯求则非邦也与？”“安见方六七十如五六十而非邦也者？”“唯赤则非邦也与？”“宗庙会同，非诸侯而何？赤也为之小，孰能为之大？”',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第1篇',
      highlights: [{ type: '名句', text: '莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。' }, { type: '易错字', text: '毋吾以也 率尔 饥馑 哂之 俟君子 端章甫 鼓瑟希 铿尔 舍瑟而作 舞雩 喟然' }],
      tags: ['诸子'] },

    { id: 'bao-ren-an-shu-gao', title: '报任安书（节选）', author: '司马迁', dynasty: '西汉', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》；左丘失明，厥有《国语》；孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》；韩非囚秦，《说难》《孤愤》；《诗》三百篇，大底圣贤发愤之所为作也。此人皆意有所郁结，不得通其道，故述往事、思来者。乃如左丘无目，孙子断足，终不可用，退而论书策，以舒其愤，思垂空文以自见。' +
        '仆窃不逊，近自托于无能之辞，网罗天下放失旧闻，略考其行事，综其终始，稽其成败兴坏之纪，上计轩辕，下至于兹，为十表，本纪十二，书八章，世家三十，列传七十，凡百三十篇。亦欲以究天人之际，通古今之变，成一家之言。草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。仆诚以著此书，藏之名山，传之其人，通邑大都，则仆偿前辱之责，虽万被戮，岂有悔哉！然此可为智者道，难为俗人言也！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第2篇（课标指定节选）',
      highlights: [{ type: '名句', text: '亦欲以究天人之际，通古今之变，成一家之言。' }, { type: '名句', text: '文王拘而演《周易》；仲尼厄而作《春秋》。' }, { type: '易错字', text: '摩灭 倜傥 膑脚 大底 稽其成败 轩辕 愠色 通邑大都 万被戮' }],
      tags: ['书信'] },

    { id: 'guo-qin-lun-shang', title: '过秦论（上）', author: '贾谊', dynasty: '西汉', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具，外连衡而斗诸侯。于是秦人拱手而取西河之外。' +
        '孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。于是六国之士，有宁越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之众，叩关而攻秦。秦人开关延敌，九国之师，逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。延及孝文王、庄襄王，享国之日浅，国家无事。' +
        '及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。' +
        '始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。' +
        '且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄櫌棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及乡时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第3篇',
      highlights: [{ type: '名句', text: '振长策而御宇内，吞二周而亡诸侯。' }, { type: '名句', text: '仁义不施而攻守之势异也。' }, { type: '易错字', text: '崤函 膏腴 合从缔交 逡巡 遗镞 漂橹 隳名城 销锋镝 瓮牖绳枢 氓隶 锄櫌棘矜 度长絜大' }],
      tags: ['论'] },

    { id: 'li-yun-jie-xuan', title: '礼运（节选）', author: '《礼记》', dynasty: '先秦', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第4篇（课标指定节选：大道之行也……是谓大同）',
      highlights: [{ type: '名句', text: '大道之行也，天下为公。' }, { type: '易错字', text: '选贤与能 矜 男有分 货恶' }],
      notes: '同一段文字在统编初中教材中以《大道之行也》出现，高中课标将《礼运》列入选择性必修。',
      tags: ['礼记'] },

    { id: 'chen-qing-biao', title: '陈情表', author: '李密', dynasty: '西晋', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。' +
        '逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当侍东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢。郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许：臣之进退，实为狼狈。' +
        '伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少仕伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。母、孙二人，更相为命，是以区区不能废远。' +
        '臣密今年四十有四，祖母今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土实所共鉴。愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第5篇',
      highlights: [{ type: '名句', text: '臣无祖母，无以至今日；祖母无臣，无以终余年。' }, { type: '名句', text: '茕茕孑立，形影相吊。' }, { type: '易错字', text: '险衅 闵凶 愍臣 门衰祚薄 期功强近 茕茕孑立 床蓐 逋慢 陨首 矜愍 结草' }],
      tags: ['表'] },

    { id: 'gui-qu-lai-xi-ci', title: '归去来兮辞（并序）', author: '陶潜', dynasty: '东晋', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '【序】余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有归欤之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。' +
        '【辞】归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。' +
        '归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓而始流。善万物之得时，感吾生之行休。' +
        '已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流而赋诗。聊乘化以归尽，乐夫天命复奚疑！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第6篇',
      highlights: [{ type: '名句', text: '悟已往之不谏，知来者之可追。' }, { type: '名句', text: '云无心以出岫，鸟倦飞而知还。' }, { type: '易错字', text: '瓶无储粟 眷然 矫厉 一稔 敛裳宵逝 轻飏 熹微 眄庭柯 出岫 翳翳 耘耔 东皋' }],
      tags: ['辞'] },

    { id: 'zhong-shu-guo-tuo-tuo-zhuan', title: '种树郭橐驼传', author: '柳宗元', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。驼闻之曰：“甚善，名我固当。”因舍其名，亦自谓“橐驼”云。' +
        '其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活；且硕茂，早实以蕃。他植者虽窥伺效慕，莫能如也。' +
        '有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然。根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤。旦视而暮抚，已去而复顾。甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之；故不我若也。吾又何能为哉！”' +
        '问者曰：“以子之道，移之官理，可乎？”驼曰：“我知种树而已，官理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？”' +
        '问者曰：“嘻，不亦善夫！吾问养树，得养人术。”传其事以为官戒也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第7篇',
      highlights: [{ type: '名句', text: '能顺木之天，以致其性焉尔。' }, { type: '易错字', text: '橐驼 病偻 隆然 蕃 孳 莳 长人者 勖尔植 缫而绪 辍飧饔' }],
      tags: ['传'] },

    { id: 'wu-dai-shi-ling-guan-zhuan-xu', title: '五代史伶官传序', author: '欧阳修', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。' +
        '世言晋王之将终也，以三矢赐庄宗而告之曰：“梁，吾仇也；燕王，吾所立，契丹与吾约为兄弟，而皆背晋以归梁。此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！”庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。' +
        '方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归，至于誓天断发，泣下沾襟，何其衰也！岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？' +
        '《书》曰：“满招损，谦得益。”忧劳可以兴国，逸豫可以亡身，自然之理也。' +
        '故方其盛也，举天下之豪杰，莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第8篇',
      highlights: [{ type: '名句', text: '忧劳可以兴国，逸豫可以亡身。' }, { type: '名句', text: '夫祸患常积于忽微，而智勇多困于所溺。' }, { type: '易错字', text: '三矢 少牢 锦囊 系燕父子以组 仇雠 誓天断发 逸豫 忽微 所溺' }],
      variants: [{ label: '版本差异', text: '《古文观止》本无“岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？”两句，且“满招损，谦得益”作“满招损，谦受益”，篇末多“作《伶官传》”一句。' }],
      tags: ['序'] },

    { id: 'shi-zhong-shan-ji', title: '石钟山记', author: '苏轼', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '《水经》云：“彭蠡之口有石钟山焉。”郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？' +
        '元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至暮夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵淡澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。因笑谓迈曰：“汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！”' +
        '事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第9篇',
      highlights: [{ type: '名句', text: '事不目见耳闻，而臆断其有无，可乎？' }, { type: '易错字', text: '彭蠡 钟磬 桴止响腾 硿硿 栖鹘 磔磔 鹳鹤 噌吰 穴罅 窾坎镗鞳 无射' }],
      tags: ['记'] },

    { id: 'deng-tai-shan-ji', title: '登泰山记', author: '姚鼐', dynasty: '清', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。' +
        '余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。是月丁未，与知府朱孝纯子颍由南麓登。四十五里，道皆砌石为磴，其级七千有余。泰山正南面有三谷。中谷绕泰安城下，郦道元所谓环水也。余始循以入，道少半，越中岭，复循西谷，遂至其巅。古时登山，循东谷入，道有天门。东谷者，古谓之天门溪水，余所不至也。今所经中岭及山巅崖限当道者，世皆谓之天门云。道中迷雾冰滑，磴几不可登。及既上，苍山负雪，明烛天南。望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。' +
        '戊申晦，五鼓，与子颍坐日观亭，待日出。大风扬积雪击面。亭东自足下皆云漫。稍见云中白若樗蒱数十立者，山也。极天云一线异色，须臾成五采。日上，正赤如丹，下有红光动摇承之。或曰，此东海也。回视日观以西峰，或得日或否，绛皓驳色，而皆若偻。' +
        '亭西有岱祠，又有碧霞元君祠。皇帝行宫在碧霞元君祠东。是日观道中石刻，自唐显庆以来，其远古刻尽漫失。僻不当道者，皆不及往。' +
        '山多石，少土。石苍黑色，多平方，少圜。少杂树，多松，生石罅，皆平顶。冰雪，无瀑水，无鸟兽音迹。至日观数里内无树，而雪与人膝齐。' +
        '桐城姚鼐记。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第10篇',
      highlights: [{ type: '名句', text: '苍山负雪，明烛天南。' }, { type: '名句', text: '极天云一线异色，须臾成五采。' }, { type: '易错字', text: '汶水 砌石为磴 徂徕 戊申晦 樗蒱 绛皓驳色 若偻 石罅 少圜' }],
      tags: ['记'] },

    { id: 'lao-zi-ba-zhang', title: '《老子》八章', author: '老子', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '【第八章】上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，正善治，事善能，动善时。夫唯不争，故无尤。' +
        '【第十二章】五色令人目盲，五音令人耳聋，五味令人口爽，驰骋畋猎令人心发狂，难得之货令人行妨。是以圣人为腹不为目，故去彼取此。' +
        '【第十五章】古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮若冬涉川，犹兮若畏四邻，俨兮其若客，涣兮若冰之将释，敦兮其若朴，旷兮其若谷，混兮其若浊。孰能浊以静之徐清？孰能安以动之徐生？保此道者不欲盈。夫唯不盈，故能蔽而新成。' +
        '【第二十二章】曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。是以圣人抱一为天下式。不自见，故明；不自是，故彰；不自伐，故有功；不自矜，故长。夫唯不争，故天下莫能与之争。古之所谓“曲则全”者，岂虚言哉！诚全而归之。' +
        '【第二十四章】跂者不立，跨者不行，自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行。物或恶之，故有道者不处。' +
        '【第二十七章】善行无辙迹，善言无瑕谪，善数不用筹策，善闭无关楗而不可开，善结无绳约而不可解。是以圣人常善救人，故无弃人；常善救物，故无弃物。是谓袭明。故善人者，不善人之师；不善人者，善人之资。不贵其师，不爱其资，虽智大迷，是谓要妙。' +
        '【第三十三章】知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。不失其所者久，死而不亡者寿。' +
        '【第八十一章】信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。圣人不积，既以为人己愈有，既以与人己愈多。天之道，利而不害；圣人之道，为而不争。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第1篇',
      highlights: [{ type: '名句', text: '上善若水。水善利万物而不争。' }, { type: '名句', text: '知人者智，自知者明。' }, { type: '名句', text: '天之道，利而不害；圣人之道，为而不争。' }, { type: '易错字', text: '畋猎 行妨 强为之容 涣兮 蔽而新成 瑕谪 关楗 袭明 赘行' }],
      variants: [{ label: '版本差异', text: '课标写作“第二十四章‘跂者不立’”，通行本作“企者不立”。' }],
      tags: ['诸子'] },

    { id: 'ji-shi-jiang-fa-zhuan-yu', title: '季氏将伐颛臾', author: '《论语》', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '季氏将伐颛臾。冉有、季路见于孔子曰：“季氏将有事于颛臾。”孔子曰：“求！无乃尔是过与？夫颛臾，昔者先王以为东蒙主，且在邦域之中矣，是社稷之臣也。何以伐为？”' +
        '冉有曰：“夫子欲之，吾二臣者皆不欲也。”孔子曰：“求！周任有言曰：‘陈力就列，不能者止。’危而不持，颠而不扶，则将焉用彼相矣？且尔言过矣。虎兕出于柙，龟玉毁于椟中，是谁之过与？”' +
        '冉有曰：“今夫颛臾，固而近于费。今不取，后世必为子孙忧。”孔子曰：“求！君子疾夫舍曰欲之而必为之辞。丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之。既来之，则安之。今由与求也，相夫子，远人不服而不能来也，邦分崩离析而不能守也，而谋动干戈于邦内。吾恐季孙之忧，不在颛臾，而在萧墙之内也。”',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第2篇',
      highlights: [{ type: '名句', text: '不患寡而患不均，不患贫而患不安。' }, { type: '名句', text: '既来之，则安之。' }, { type: '易错字', text: '颛臾 东蒙主 社稷 周任 虎兕出于柙 龟玉毁于椟中 萧墙' }],
      tags: ['诸子'] },

    { id: 'da-xue-jie-xuan', title: '大学（节选）', author: '《礼记》', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知；致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。自天子以至于庶人，壹是皆以修身为本。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第3篇（课标指定节选）',
      highlights: [{ type: '名句', text: '自天子以至于庶人，壹是皆以修身为本。' }, { type: '易错字', text: '明明德 格物 壹是' }],
      tags: ['礼记'] },

    { id: 'zhong-yong-jie-xuan', title: '中庸（节选）', author: '《礼记》', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '喜怒哀乐之未发，谓之中；发而皆中节，谓之和。中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。' +
        '博学之，审问之，慎思之，明辨之，笃行之。有弗学，学之弗能，弗措也；有弗问，问之弗知，弗措也；有弗思，思之弗得，弗措也；有弗辨，辨之弗明，弗措也；有弗行，行之弗笃，弗措也。人一能之，己百之；人十能之，己千之。果能此道矣，虽愚必明，虽柔必强。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第4篇（课标指定节选）',
      highlights: [{ type: '名句', text: '博学之，审问之，慎思之，明辨之，笃行之。' }, { type: '名句', text: '人一能之，己百之；人十能之，己千之。' }, { type: '易错字', text: '中节 致中和 弗措 笃行' }],
      tags: ['礼记'] },

    { id: 'meng-zi-yi-ze-hao-ran', title: '《孟子》一则（浩然之气）', author: '孟子', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '“敢问夫子恶乎长？”曰：“我知言，我善养吾浩然之气。”“敢问何谓浩然之气？”曰：“难言也。其为气也，至大至刚，以直养而无害，则塞于天地之间。其为气也，配义与道；无是，馁也。是集义所生者，非义袭而取之也。行有不慊于心，则馁矣。我故曰，告子未尝知义，以其外之也。必有事焉，而勿正，心勿忘，勿助长也。无若宋人然：宋人有闵其苗之不长而揠之者，芒芒然归，谓其人曰：‘今日病矣！予助苗长矣！’其子趋而往视之，苗则槁矣。天下之不助苗长者寡矣。以为无益而舍之者，不耘苗者也；助之长者，揠苗者也，非徒无益，而又害之。”' +
        '“何谓知言？”曰：“诐辞知其所蔽，淫辞知其所陷，邪辞知其所离，遁辞知其所穷。生于其心，害于其政；发于其政，害于其事。圣人复起，必从吾言矣。”' +
        '“宰我、子贡善为说辞，冉牛、闵子、颜渊善言德行。孔子兼之，曰：‘我于辞命，则不能也。’”',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第5篇（课标指定节选）',
      highlights: [{ type: '名句', text: '我善养吾浩然之气。' }, { type: '易错字', text: '恶乎长 馁 慊于心 揠之 芒芒然 槁 诐辞 淫辞 遁辞' }],
      tags: ['诸子'] },

    { id: 'xiao-yao-you-jie-xuan', title: '逍遥游（节选）', author: '《庄子》', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '惠子谓庄子曰：“魏王贻我大瓠之种，我树之成而实五石。以盛水浆，其坚不能自举也。剖之以为瓢，则瓠落无所容。非不呺然大也，吾为其无用而掊之。”庄子曰：“夫子固拙于用大矣。宋人有善为不龟手之药者，世世以洴澼絖为事。客闻之，请买其方百金。聚族而谋曰：‘我世世为洴澼絖，不过数金。今一朝而鬻技百金，请与之。’客得之，以说吴王。越有难，吴王使之将。冬，与越人水战，大败越人，裂地而封之。能不龟手一也，或以封，或不免于洴澼絖，则所用之异也。今子有五石之瓠，何不虑以为大樽，而浮乎江湖，而忧其瓠落无所容？则夫子犹有蓬之心也夫！”',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第6篇（课标指定节选：惠子谓庄子曰……则夫子犹有蓬之心也夫）',
      highlights: [{ type: '名句', text: '夫子固拙于用大矣。' }, { type: '易错字', text: '大瓠 瓠落 呺然 掊之 龟手 洴澼絖 鬻技 蓬之心' }],
      tags: ['诸子'] },

    { id: 'jian-zhu-ke-shu', title: '谏逐客书', author: '李斯', dynasty: '秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '臣闻吏议逐客，窃以为过矣。昔缪公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来邳豹、公孙支于晋。此五子者，不产于秦，而缪公用之，并国二十，遂霸西戎。孝公用商鞅之法，移风易俗，民以殷盛，国以富强，百姓乐用，诸侯亲服，获楚、魏之师，举地千里，至今治强。惠王用张仪之计，拔三川之地，西并巴、蜀，北收上郡，南取汉中，包九夷，制鄢、郢，东据成皋之险，割膏腴之壤，遂散六国之从，使之西面事秦，功施到今。昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。此四君者，皆以客之功。由此观之，客何负于秦哉！向使四君却客而不内，疏士而不用，是使国无富利之实，而秦无强大之名也。' +
        '今陛下致昆山之玉，有随、和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。此数宝者，秦不生一焉，而陛下说之，何也？必秦国之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。所以饰后宫、充下陈、娱心意、说耳目者，必出于秦然后可，则是宛珠之簪、傅玑之珥、阿缟之衣、锦绣之饰不进于前，而随俗雅化佳冶窈窕赵女不立于侧也。' +
        '臣闻地广者粟多，国大者人众，兵强则士勇。是以太山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。是以地无四方，民无异国，四时充美，鬼神降福，此五帝三王之所以无敌也。今乃弃黔首以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓“藉寇兵而赍盗粮”者也。' +
        '夫物不产于秦，可宝者多；士不产于秦，而愿忠者众。今逐客以资敌国，损民以益仇，内自虚而外树怨于诸侯，求国无危，不可得也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第7篇',
      highlights: [{ type: '名句', text: '太山不让土壤，故能成其大；河海不择细流，故能就其深。' }, { type: '名句', text: '今逐客以资敌国，损民以益仇。' }, { type: '易错字', text: '缪公 邳豹 穰侯 駃騠 傅玑之珥 阿缟 黔首 藉寇兵而赍盗粮' }],
      tags: ['奏疏'] },

    { id: 'lan-ting-ji-xu', title: '兰亭集序', author: '王羲之', dynasty: '东晋', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。' +
        '是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。' +
        '夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至；及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀，况修短随化，终期于尽！古人云：“死生亦大矣。”岂不痛哉！' +
        '每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦犹今之视昔。悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第8篇',
      highlights: [{ type: '名句', text: '仰观宇宙之大，俯察品类之盛。' }, { type: '名句', text: '固知一死生为虚诞，齐彭殇为妄作。' }, { type: '易错字', text: '修禊 流觞曲水 游目骋怀 趣舍万殊 嗟悼 彭殇' }],
      tags: ['序'] },

    { id: 'teng-wang-ge-xu', title: '滕王阁序', author: '王勃', dynasty: '唐', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。家君作宰，路出名区；童子何知，躬逢胜饯。' +
        '时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿；临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。' +
        '披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。' +
        '遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人？萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？' +
        '嗟乎！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！' +
        '勃，三尺微命，一介书生。无路请缨，等终军之弱冠；有怀投笔，慕宗悫之长风。舍簪笏于百龄，奉晨昏于万里。非谢家之宝树，接孟氏之芳邻。他日趋庭，叨陪鲤对；今兹捧袂，喜托龙门。杨意不逢，抚凌云而自惜；钟期既遇，奏流水以何惭？' +
        '呜呼！胜地不常，盛筵难再；兰亭已矣，梓泽丘墟。临别赠言，幸承恩于伟饯；登高作赋，是所望于群公。敢竭鄙怀，恭疏短引；一言均赋，四韵俱成。请洒潘江，各倾陆海云尔。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第9篇',
      highlights: [{ type: '名句', text: '落霞与孤鹜齐飞，秋水共长天一色。' }, { type: '名句', text: '老当益壮，宁移白首之心？穷且益坚，不坠青云之志。' }, { type: '易错字', text: '翼轸 棨戟 襜帷 潦水 骖騑 鹤汀凫渚 绣闼 雕甍 舸舰 遄飞 睇眄 帝阍 舛 涸辙 赊 簪笏 捧袂' }],
      tags: ['序'] },

    { id: 'huang-gang-zhu-lou-ji', title: '黄冈竹楼记', author: '王禹偁', dynasty: '北宋', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '黄冈之地多竹，大者如椽。竹工破之，刳去其节，用代陶瓦。比屋皆然，以其价廉而工省也。' +
        '子城西北隅，雉堞圮毁，蓁莽荒秽，因作小楼二间，与月波楼通。远吞山光，平挹江濑，幽阒辽夐，不可具状。夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。宜鼓琴，琴调虚畅；宜咏诗，诗韵清绝；宜围棋，子声丁丁然；宜投壶，矢声铮铮然；皆竹楼之所助也。' +
        '公退之暇，被鹤氅衣，戴华阳巾，手执《周易》一卷，焚香默坐，消遣世虑。江山之外，第见风帆沙鸟，烟云竹树而已。待其酒力醒，茶烟歇，送夕阳，迎素月，亦谪居之胜概也。' +
        '彼齐云、落星，高则高矣；井干、丽谯，华则华矣；止于贮妓女，藏歌舞，非骚人之事，吾所不取。' +
        '吾闻竹工云：“竹之为瓦，仅十稔；若重覆之，得二十稔。”噫！吾以至道乙未岁，自翰林出滁上，丙申，移广陵；丁酉，又入西掖；戊戌岁除日，有齐安之命；己亥闰三月，到郡。四年之间，奔走不暇；未知明年又在何处！岂惧竹楼之易朽乎？幸后之人与我同志，嗣而葺之，庶斯楼之不朽也。' +
        '咸平二年八月十五日记。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第10篇',
      highlights: [{ type: '名句', text: '夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。' }, { type: '易错字', text: '刳去其节 雉堞圮毁 蓁莽 平挹江濑 幽阒辽夐 鹤氅 十稔 嗣而葺之' }],
      tags: ['记'] },

    { id: 'shang-shu-mi-han-tai-wei-shu', title: '上枢密韩太尉书', author: '苏辙', dynasty: '北宋', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '太尉执事：辙生好为文，思之至深。以为文者气之所形，然文不可以学而能，气可以养而致。孟子曰：“我善养吾浩然之气。”今观其文章，宽厚宏博，充乎天地之间，称其气之小大。太史公行天下，周览四海名山大川，与燕、赵间豪俊交游，故其文疏荡，颇有奇气。此二子者，岂尝执笔学为如此之文哉？其气充乎其中而溢乎其貌，动乎其言而见乎其文，而不自知也。' +
        '辙生十有九年矣。其居家所与游者，不过其邻里乡党之人；所见不过数百里之间，无高山大野可登览以自广；百氏之书，虽无所不读，然皆古人之陈迹，不足以激发其志气。恐遂汩没，故决然舍去，求天下奇闻壮观，以知天地之广大。过秦、汉之故都，恣观终南、嵩、华之高，北顾黄河之奔流，慨然想见古之豪杰。至京师，仰观天子宫阙之壮，与仓廪、府库、城池、苑囿之富且大也，而后知天下之巨丽。见翰林欧阳公，听其议论之宏辩，观其容貌之秀伟，与其门人贤士大夫游，而后知天下之文章聚乎此也。太尉以才略冠天下，天下之所恃以无忧，四夷之所惮以不敢发，入则周公、召公，出则方叔、召虎。而辙也未之见焉。' +
        '且夫人之学也，不志其大，虽多而何为？辙之来也，于山见终南、嵩、华之高，于水见黄河之大且深，于人见欧阳公，而犹以为未见太尉也。故愿得观贤人之光耀，闻一言以自壮，然后可以尽天下之大观而无憾者矣。' +
        '辙少年，未能通习吏事。向之来，非有取于斗升之禄，偶然得之，非其所乐。然幸得赐归待选，使得优游数年之间，将以益治其文，且学为政。太尉苟以为可教而辱教之，又幸矣！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第11篇',
      highlights: [{ type: '名句', text: '文者气之所形，然文不可以学而能，气可以养而致。' }, { type: '易错字', text: '汩没 恣观 苑囿 仓廪 召虎 斗升之禄 辱教之' }],
      tags: ['书信'] },

    { id: 'gu-dai-wen-lun-xuan-duan', title: '古代文论选段', author: '毛苌、曹丕、钟嵘、白居易、郑燮、王国维', dynasty: '历代', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '【毛诗序】诗者，志之所之也，在心为志，发言为诗。情动于中而形于言，言之不足，故嗟叹之，嗟叹之不足，故永歌之，永歌之不足，不知手之舞之足之蹈之也。' +
        '【典论·论文】盖文章，经国之大业，不朽之盛事。年寿有时而尽，荣乐止乎其身，二者必至之常期，未若文章之无穷。是以古之作者，寄身于翰墨，见意于篇籍，不假良史之辞，不托飞驰之势，而声名自传于后。' +
        '【诗品序】若乃春风春鸟，秋月秋蝉，夏云暑雨，冬月祁寒，斯四候之感诸诗者也。嘉会寄诗以亲，离群托诗以怨。至于楚臣去境，汉妾辞宫；或骨横朔野，或魂逐飞蓬；或负戈外戍，杀气雄边；塞客衣单，孀闺泪尽；又士有解佩出朝，一去忘返；女有扬蛾入宠，再盼倾国：凡斯种种，感荡心灵，非陈诗何以展其义？非长歌何以骋其情？故曰：“《诗》可以群，可以怨。”' +
        '【与元九书】感人心者，莫先乎情，莫始乎言，莫切乎声，莫深乎义。诗者：根情，苗言，华声，实义。' +
        '【题画】江馆清秋，晨起看竹，烟光日影露气，皆浮动于疏枝密叶之间。胸中勃勃遂有画意。其实胸中之竹，并不是眼中之竹也。因而磨墨展纸，落笔倏作变相，手中之竹又不是胸中之竹也。总之，意在笔先者，定则也；趣在法外者，化机也。独画云乎哉！' +
        '【人间词话】词以境界为最上。有境界则自成高格，自有名句。境非独谓景物也。喜怒哀乐，亦人心中之一境界。故能写真景物、真感情者，谓之有境界，否则谓之无境界。古今之成大事业、大学问者，必经过三种之境界：“昨夜西风凋碧树。独上高楼，望尽天涯路。”此第一境也。“衣带渐宽终不悔，为伊消得人憔悴。”此第二境也。“众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。”此第三境也。此等语皆非大词人不能道。然遽以此意解释诸词，恐为晏欧诸公所不许也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第12篇（含毛诗序、典论·论文、诗品序、与元九书、题画、人间词话六个选段）',
      highlights: [{ type: '名句', text: '诗者，志之所之也，在心为志，发言为诗。' }, { type: '名句', text: '盖文章，经国之大业，不朽之盛事。' }, { type: '名句', text: '词以境界为最上。有境界则自成高格，自有名句。' }, { type: '易错字', text: '嗟叹 翰墨 祁寒 孀闺 扬蛾 倏作变相 灯火阑珊' }],
      tags: ['文论'] },

    { id: 'jing-nv', title: '静女', author: '《诗经·邶风》', dynasty: '先秦', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '静女其姝，俟我于城隅。爱而不见，搔首踟蹰。静女其娈，贻我彤管。彤管有炜，说怿女美。自牧归荑，洵美且异。匪女之为美，美人之贻。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第1首',
      highlights: [{ type: '名句', text: '爱而不见，搔首踟蹰。' }, { type: '易错字', text: '姝 俟 城隅 踟蹰 娈 彤管 炜 说怿 自牧归荑' }],
      tags: ['诗经'] },

    { id: 'wu-yi', title: '无衣', author: '《诗经·秦风》', dynasty: '先秦', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '岂曰无衣？与子同袍。王于兴师，修我戈矛。与子同仇！岂曰无衣？与子同泽。王于兴师，修我矛戟。与子偕作！岂曰无衣？与子同裳。王于兴师，修我甲兵。与子偕行！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第2首',
      highlights: [{ type: '名句', text: '岂曰无衣？与子同袍。' }, { type: '易错字', text: '同泽 矛戟 偕作 同裳' }],
      tags: ['诗经', '爱国'] },

    { id: 'li-sao-jie-xuan', title: '离骚（节选）', author: '屈原', dynasty: '战国', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '帝高阳之苗裔兮，朕皇考曰伯庸。摄提贞于孟陬兮，惟庚寅吾以降。皇览揆余初度兮，肇锡余以嘉名：名余曰正则兮，字余曰灵均。纷吾既有此内美兮，又重之以修能。扈江离与辟芷兮，纫秋兰以为佩。汩余若将不及兮，恐年岁之不吾与。朝搴阰之木兰兮，夕揽洲之宿莽。日月忽其不淹兮，春与秋其代序。惟草木之零落兮，恐美人之迟暮。不抚壮而弃秽兮，何不改乎此度？乘骐骥以驰骋兮，来吾道夫先路！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第3首（课标指定节选：帝高阳之苗裔兮……来吾道夫先路）',
      highlights: [{ type: '名句', text: '日月忽其不淹兮，春与秋其代序。' }, { type: '名句', text: '乘骐骥以驰骋兮，来吾道夫先路！' }, { type: '易错字', text: '苗裔 孟陬 揆余 肇锡 扈江离 辟芷 纫 搴阰 宿莽 骐骥' }],
      tags: ['楚辞'] },

    { id: 'she-jiang-cai-fu-rong', title: '涉江采芙蓉', author: '《古诗十九首》', dynasty: '汉', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '涉江采芙蓉，兰泽多芳草。采之欲遗谁？所思在远道。还顾望旧乡，长路漫浩浩。同心而离居，忧伤以终老。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第4首',
      highlights: [{ type: '名句', text: '同心而离居，忧伤以终老。' }, { type: '易错字', text: '芙蓉 兰泽 遗谁 漫浩浩' }],
      tags: ['古诗十九首'] },

    { id: 'duan-ge-xing', title: '短歌行', author: '曹操', dynasty: '东汉', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '对酒当歌，人生几何！譬如朝露，去日苦多。慨当以慷，忧思难忘。何以解忧？唯有杜康。青青子衿，悠悠我心。但为君故，沉吟至今。呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。明明如月，何时可掇？忧从中来，不可断绝。越陌度阡，枉用相存。契阔谈䜩，心念旧恩。月明星稀，乌鹊南飞。绕树三匝，何枝可依？山不厌高，海不厌深。周公吐哺，天下归心。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第5首',
      highlights: [{ type: '名句', text: '青青子衿，悠悠我心。' }, { type: '名句', text: '山不厌高，海不厌深。周公吐哺，天下归心。' }, { type: '易错字', text: '子衿 呦呦 苹 掇 越陌度阡 契阔谈䜩 匝 吐哺' }],
      variants: [{ label: '版本差异', text: '“契阔谈䜩”中“䜩”通“宴”，部分版本直接写作“契阔谈宴”。' }],
      tags: ['建安'] },

    { id: 'gui-yuan-tian-ju-qi-yi', title: '归园田居（其一）', author: '陶潜', dynasty: '东晋', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '少无适俗韵，性本爱丘山。误落尘网中，一去三十年。羁鸟恋旧林，池鱼思故渊。开荒南野际，守拙归园田。方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第6首',
      highlights: [{ type: '名句', text: '羁鸟恋旧林，池鱼思故渊。' }, { type: '名句', text: '久在樊笼里，复得返自然。' }, { type: '易错字', text: '适俗韵 羁鸟 守拙 荫后檐 暧暧 墟里烟 颠 樊笼' }],
      tags: ['田园'] },

    { id: 'ni-xing-lu-nan-qi-si', title: '拟行路难（其四）', author: '鲍照', dynasty: '南朝', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '泻水置平地，各自东西南北流。人生亦有命，安能行叹复坐愁？酌酒以自宽，举杯断绝歌路难。心非木石岂无感？吞声踯躅不敢言。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第7首',
      highlights: [{ type: '名句', text: '心非木石岂无感？吞声踯躅不敢言。' }, { type: '易错字', text: '泻水 酌酒 踯躅' }],
      tags: ['乐府'] },

    { id: 'chun-jiang-hua-yue-ye', title: '春江花月夜', author: '张若虚', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明！江流宛转绕芳甸，月照花林皆似霰。空里流霜不觉飞，汀上白沙看不见。江天一色无纤尘，皎皎空中孤月轮。江畔何人初见月？江月何年初照人？人生代代无穷已，江月年年望相似。不知江月待何人，但见长江送流水。白云一片去悠悠，青枫浦上不胜愁。谁家今夜扁舟子？何处相思明月楼？可怜楼上月裴回，应照离人妆镜台。玉户帘中卷不去，捣衣砧上拂还来。此时相望不相闻，愿逐月华流照君。鸿雁长飞光不度，鱼龙潜跃水成文。昨夜闲潭梦落花，可怜春半不还家。江水流春去欲尽，江潭落月复西斜。斜月沉沉藏海雾，碣石潇湘无限路。不知乘月几人归，落月摇情满江树。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第8首',
      highlights: [{ type: '名句', text: '江畔何人初见月？江月何年初照人？' }, { type: '名句', text: '人生代代无穷已，江月年年望相似。' }, { type: '易错字', text: '滟滟 芳甸 霰 汀上 纤尘 青枫浦 裴回 捣衣砧 碣石潇湘' }],
      variants: [{ label: '版本差异', text: '“可怜楼上月裴回”部分版本作“可怜楼上月徘徊”。' }],
      tags: ['乐府'] },

    { id: 'shan-ju-qiu-ming', title: '山居秋暝', author: '王维', dynasty: '唐', stage: '高中', grade: '选修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      notes: '课标推荐的诗词曲名篇，不在统编必修 / 选择性必修教材内，按选修课程归类。',
      text: '空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。',

      tags: ['山水'] },

    { id: 'shu-dao-nan', title: '蜀道难', author: '李白', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '噫吁嚱，危乎高哉！蜀道之难，难于上青天！蚕丛及鱼凫，开国何茫然！尔来四万八千岁，不与秦塞通人烟。西当太白有鸟道，可以横绝峨眉巅。地崩山摧壮士死，然后天梯石栈相钩连。上有六龙回日之高标，下有冲波逆折之回川。黄鹤之飞尚不得过，猿猱欲度愁攀援。青泥何盘盘，百步九折萦岩峦。扪参历井仰胁息，以手抚膺坐长叹。问君西游何时还？畏途巉岩不可攀。但见悲鸟号古木，雄飞雌从绕林间。又闻子规啼夜月，愁空山。蜀道之难，难于上青天，使人听此凋朱颜！连峰去天不盈尺，枯松倒挂倚绝壁。飞湍瀑流争喧豗，砯崖转石万壑雷。其险也如此，嗟尔远道之人胡为乎来哉！剑阁峥嵘而崔嵬，一夫当关，万夫莫开。所守或匪亲，化为狼与豺。朝避猛虎，夕避长蛇；磨牙吮血，杀人如麻。锦城虽云乐，不如早还家。蜀道之难，难于上青天，侧身西望长咨嗟！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第10首',
      highlights: [{ type: '名句', text: '蜀道之难，难于上青天！' }, { type: '名句', text: '剑阁峥嵘而崔嵬，一夫当关，万夫莫开。' }, { type: '易错字', text: '噫吁嚱 鱼凫 秦塞 石栈 猿猱 萦岩峦 扪参历井 抚膺 巉岩 喧豗 砯崖 崔嵬 吮血 咨嗟' }],
      tags: ['乐府'] },

    { id: 'meng-you-tian-mu-yin-liu-bie', title: '梦游天姥吟留别', author: '李白', dynasty: '唐', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '海客谈瀛洲，烟涛微茫信难求；越人语天姥，云霞明灭或可睹。天姥连天向天横，势拔五岳掩赤城。天台四万八千丈，对此欲倒东南倾。我欲因之梦吴越，一夜飞度镜湖月。湖月照我影，送我至剡溪。谢公宿处今尚在，渌水荡漾清猿啼。脚著谢公屐，身登青云梯。半壁见海日，空中闻天鸡。千岩万转路不定，迷花倚石忽已暝。熊咆龙吟殷岩泉，栗深林兮惊层巅。云青青兮欲雨，水澹澹兮生烟。列缺霹雳，丘峦崩摧。洞天石扉，訇然中开。青冥浩荡不见底，日月照耀金银台。霓为衣兮风为马，云之君兮纷纷而来下。虎鼓瑟兮鸾回车，仙之人兮列如麻。忽魂悸以魄动，恍惊起而长嗟。惟觉时之枕席，失向来之烟霞。世间行乐亦如此，古来万事东流水。别君去兮何时还？且放白鹿青崖间，须行即骑访名山。安能摧眉折腰事权贵，使我不得开心颜！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第11首',
      highlights: [{ type: '名句', text: '安能摧眉折腰事权贵，使我不得开心颜！' }, { type: '易错字', text: '瀛洲 天姥 剡溪 渌水 谢公屐 殷岩泉 栗深林 澹澹 列缺 訇然 魂悸 恍惊起 青崖' }],
      tags: ['古体'] },

    { id: 'qiang-jin-jiu', title: '将进酒', author: '李白', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。烹羊宰牛且为乐，会须一饮三百杯。岑夫子，丹丘生，将进酒，杯莫停。与君歌一曲，请君为我倾耳听。钟鼓馔玉不足贵，但愿长醉不愿醒。古来圣贤皆寂寞，惟有饮者留其名。陈王昔时宴平乐，斗酒十千恣欢谑。主人何为言少钱，径须沽取对君酌。五花马、千金裘，呼儿将出换美酒，与尔同销万古愁。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第12首',
      highlights: [{ type: '名句', text: '天生我材必有用，千金散尽还复来。' }, { type: '名句', text: '钟鼓馔玉不足贵，但愿长醉不愿醒。' }, { type: '易错字', text: '樽 馔玉 恣欢谑 径须沽取 千金裘 销' }],
      tags: ['乐府'] },

    { id: 'yan-ge-xing', title: '燕歌行', author: '高适', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '汉家烟尘在东北，汉将辞家破残贼。男儿本自重横行，天子非常赐颜色。摐金伐鼓下榆关，旌旆逶迤碣石间。校尉羽书飞瀚海，单于猎火照狼山。山川萧条极边土，胡骑凭陵杂风雨。战士军前半死生，美人帐下犹歌舞。大漠穷秋塞草腓，孤城落日斗兵稀。身当恩遇常轻敌，力尽关山未解围。铁衣远戍辛勤久，玉箸应啼别离后。少妇城南欲断肠，征人蓟北空回首。边庭飘飖那可度，绝域苍茫无所有。杀气三时作阵云，寒声一夜传刁斗。相看白刃血纷纷，死节从来岂顾勋。君不见沙场征战苦，至今犹忆李将军。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第13首',
      highlights: [{ type: '名句', text: '战士军前半死生，美人帐下犹歌舞。' }, { type: '名句', text: '君不见沙场征战苦，至今犹忆李将军。' }, { type: '易错字', text: '摐金 旌旆 逶迤 校尉羽书 瀚海 单于 凭陵 塞草腓 玉箸 蓟北 飘飖 刁斗' }],
      variants: [{ label: '版本差异', text: '“身当恩遇常轻敌”部分版本作“身当恩遇恒轻敌”。' }],
      tags: ['边塞'] },

    { id: 'shu-xiang', title: '蜀相', author: '杜甫', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '丞相祠堂何处寻？锦官城外柏森森。映阶碧草自春色，隔叶黄鹂空好音。三顾频烦天下计，两朝开济老臣心。出师未捷身先死，长使英雄泪满襟。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第14首',
      highlights: [{ type: '名句', text: '出师未捷身先死，长使英雄泪满襟。' }, { type: '易错字', text: '柏森森 映阶 黄鹂 频烦 开济 襟' }],
      tags: ['咏史'] },

    { id: 'ke-zhi', title: '客至', author: '杜甫', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '舍南舍北皆春水，但见群鸥日日来。花径不曾缘客扫，蓬门今始为君开。盘飧市远无兼味，樽酒家贫只旧醅。肯与邻翁相对饮，隔篱呼取尽余杯。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第15首',
      highlights: [{ type: '名句', text: '花径不曾缘客扫，蓬门今始为君开。' }, { type: '易错字', text: '盘飧 旧醅 隔篱' }],
      tags: ['生活'] },

    { id: 'deng-gao', title: '登高', author: '杜甫', dynasty: '唐', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。',

      tags: ['登临'] },

    { id: 'deng-yue-yang-lou', title: '登岳阳楼', author: '杜甫', dynasty: '唐', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '昔闻洞庭水，今上岳阳楼。吴楚东南坼，乾坤日夜浮。亲朋无一字，老病有孤舟。戎马关山北，凭轩涕泗流。',

      tags: ['登临'] },

    { id: 'pi-pa-xing', title: '琵琶行（并序）', author: '白居易', dynasty: '唐', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '【序】元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。' +
        '【诗】浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。醉不成欢惨将别，别时茫茫江浸月。忽闻水上琵琶声，主人忘归客不发。寻声暗问弹者谁？琵琶声停欲语迟。移船相近邀相见，添酒回灯重开宴。千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。弦弦掩抑声声思，似诉平生不得志。低眉信手续续弹，说尽心中无限事。轻拢慢捻抹复挑，初为《霓裳》后《六幺》。大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。间关莺语花底滑，幽咽泉流冰下难。冰泉冷涩弦凝绝，凝绝不通声暂歇。别有幽愁暗恨生，此时无声胜有声。银瓶乍破水浆迸，铁骑突出刀枪鸣。曲终收拨当心画，四弦一声如裂帛。东船西舫悄无言，唯见江心秋月白。沉吟放拨插弦中，整顿衣裳起敛容。自言本是京城女，家在虾蟆陵下住。十三学得琵琶成，名属教坊第一部。曲罢曾教善才服，妆成每被秋娘妒。五陵年少争缠头，一曲红绡不知数。钿头银篦击节碎，血色罗裙翻酒污。今年欢笑复明年，秋月春风等闲度。弟走从军阿姨死，暮去朝来颜色故。门前冷落鞍马稀，老大嫁作商人妇。商人重利轻别离，前月浮梁买茶去。去来江口守空船，绕船月明江水寒。夜深忽梦少年事，梦啼妆泪红阑干。我闻琵琶已叹息，又闻此语重唧唧。同是天涯沦落人，相逢何必曾相识！我从去年辞帝京，谪居卧病浔阳城。浔阳地僻无音乐，终岁不闻丝竹声。住近湓江地低湿，黄芦苦竹绕宅生。其间旦暮闻何物？杜鹃啼血猿哀鸣。春江花朝秋月夜，往往取酒还独倾。岂无山歌与村笛，呕哑嘲哳难为听。今夜闻君琵琶语，如听仙乐耳暂明。莫辞更坐弹一曲，为君翻作《琵琶行》。感我此言良久立，却坐促弦弦转急。凄凄不似向前声，满座重闻皆掩泣。座中泣下谁最多？江州司马青衫湿。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第18首',
      highlights: [{ type: '名句', text: '同是天涯沦落人，相逢何必曾相识！' }, { type: '名句', text: '别有幽愁暗恨生，此时无声胜有声。' }, { type: '易错字', text: '湓浦口 铮铮 悯然 漂沦 荻花 嘈嘈 霓裳 六幺 迸 舫 虾蟆陵 教坊 缠头 红绡 钿头银篦 阑干 唧唧 呕哑嘲哳' }],
      tags: ['歌行'] },

    { id: 'li-ping-kong-hou-yin', title: '李凭箜篌引', author: '李贺', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '吴丝蜀桐张高秋，空山凝云颓不流。江娥啼竹素女愁，李凭中国弹箜篌。昆山玉碎凤凰叫，芙蓉泣露香兰笑。十二门前融冷光，二十三丝动紫皇。女娲炼石补天处，石破天惊逗秋雨。梦入神山教神妪，老鱼跳波瘦蛟舞。吴质不眠倚桂树，露脚斜飞湿寒兔。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第19首',
      highlights: [{ type: '名句', text: '昆山玉碎凤凰叫，芙蓉泣露香兰笑。' }, { type: '名句', text: '石破天惊逗秋雨。' }, { type: '易错字', text: '箜篌 江娥 素女 神妪 吴质 露脚' }],
      tags: ['音乐'] },

    { id: 'pu-sa-man-wen-ting-yun', title: '菩萨蛮（小山重叠金明灭）', author: '温庭筠', dynasty: '唐', stage: '高中', grade: '选修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      notes: '课标推荐的诗词曲名篇，不在统编必修 / 选择性必修教材内，按选修课程归类。',
      text: '小山重叠金明灭，鬓云欲度香腮雪。懒起画蛾眉，弄妆梳洗迟。照花前后镜，花面交相映。新帖绣罗襦，双双金鹧鸪。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第20首',
      highlights: [{ type: '名句', text: '照花前后镜，花面交相映。' }, { type: '易错字', text: '鬓云 香腮雪 蛾眉 罗襦 鹧鸪' }],
      tags: ['花间', '词'] },

    { id: 'jin-se', title: '锦瑟', author: '李商隐', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '锦瑟无端五十弦，一弦一柱思华年。庄生晓梦迷蝴蝶，望帝春心托杜鹃。沧海月明珠有泪，蓝田日暖玉生烟。此情可待成追忆？只是当时已惘然。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第21首',
      highlights: [{ type: '名句', text: '沧海月明珠有泪，蓝田日暖玉生烟。' }, { type: '易错字', text: '锦瑟 惘然' }],
      tags: ['感怀'] },

    { id: 'yu-mei-ren', title: '虞美人（春花秋月何时了）', author: '李煜', dynasty: '五代', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '春花秋月何时了？往事知多少。小楼昨夜又东风，故国不堪回首月明中。雕栏玉砌应犹在，只是朱颜改。问君能有几多愁？恰似一江春水向东流。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第22首',
      highlights: [{ type: '名句', text: '问君能有几多愁？恰似一江春水向东流。' }, { type: '易错字', text: '雕栏玉砌 朱颜改' }],
      tags: ['词'] },

    { id: 'wang-hai-chao', title: '望海潮（东南形胜）', author: '柳永', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '东南形胜，三吴都会，钱塘自古繁华。烟柳画桥，风帘翠幕，参差十万人家。云树绕堤沙。怒涛卷霜雪，天堑无涯。市列珠玑，户盈罗绮，竞豪奢。重湖叠巘清嘉。有三秋桂子，十里荷花。羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。千骑拥高牙。乘醉听箫鼓，吟赏烟霞。异日图将好景，归去凤池夸。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第23首',
      highlights: [{ type: '名句', text: '三秋桂子，十里荷花。' }, { type: '易错字', text: '参差 天堑 珠玑 罗绮 叠巘 菱歌 钓叟莲娃 千骑拥高牙' }],
      tags: ['都市', '词'] },

    { id: 'gui-zhi-xiang-jin-ling-huai-gu', title: '桂枝香·金陵怀古', author: '王安石', dynasty: '北宋', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '登临送目。正故国晚秋，天气初肃。千里澄江似练，翠峰如簇。归帆去棹残阳里，背西风、酒旗斜矗。彩舟云淡，星河鹭起，画图难足。念往昔、繁华竞逐。叹门外楼头，悲恨相续。千古凭高对此，谩嗟荣辱。六朝旧事随流水，但寒烟衰草凝绿。至今商女，时时犹唱，《后庭》遗曲。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第24首',
      highlights: [{ type: '名句', text: '千里澄江似练，翠峰如簇。' }, { type: '名句', text: '至今商女，时时犹唱，《后庭》遗曲。' }, { type: '易错字', text: '澄江似练 去棹 斜矗 鹭起 谩嗟 衰草凝绿' }],
      tags: ['怀古', '词'] },

    { id: 'jiang-cheng-zi-yi-mao', title: '江城子·乙卯正月二十日夜记梦', author: '苏轼', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。纵使相逢应不识，尘满面，鬓如霜。夜来幽梦忽还乡。小轩窗，正梳妆。相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第25首',
      highlights: [{ type: '名句', text: '十年生死两茫茫，不思量，自难忘。' }, { type: '易错字', text: '思量 孤坟 鬓如霜 小轩窗 短松冈' }],
      tags: ['悼亡', '词'] },

    { id: 'nian-nu-jiao-chi-bi-huai-gu', title: '念奴娇·赤壁怀古', author: '苏轼', dynasty: '北宋', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第26首',
      highlights: [{ type: '名句', text: '乱石穿空，惊涛拍岸，卷起千堆雪。' }, { type: '名句', text: '人生如梦，一尊还酹江月。' }, { type: '易错字', text: '故垒 纶巾 樯橹 华发 尊 酹' }],
      tags: ['豪放', '怀古', '词'] },

    { id: 'deng-kuai-ge', title: '登快阁', author: '黄庭坚', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '痴儿了却公家事，快阁东西倚晚晴。落木千山天远大，澄江一道月分明。朱弦已为佳人绝，青眼聊因美酒横。万里归船弄长笛，此心吾与白鸥盟。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第27首',
      highlights: [{ type: '名句', text: '落木千山天远大，澄江一道月分明。' }, { type: '易错字', text: '痴儿 倚晚晴 朱弦 青眼 白鸥盟' }],
      tags: ['登临'] },

    { id: 'que-qiao-xian', title: '鹊桥仙（纤云弄巧）', author: '秦观', dynasty: '北宋', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '纤云弄巧，飞星传恨，银汉迢迢暗度。金风玉露一相逢，便胜却人间无数。柔情似水，佳期如梦，忍顾鹊桥归路。两情若是久长时，又岂在朝朝暮暮。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第28首',
      highlights: [{ type: '名句', text: '两情若是久长时，又岂在朝朝暮暮。' }, { type: '易错字', text: '纤云 迢迢 金风玉露 忍顾' }],
      tags: ['七夕', '词'] },

    { id: 'su-mu-zhe', title: '苏幕遮（燎沉香）', author: '周邦彦', dynasty: '北宋', stage: '高中', grade: '选修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      notes: '课标推荐的诗词曲名篇，不在统编必修 / 选择性必修教材内，按选修课程归类。',
      text: '燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。叶上初阳干宿雨，水面清圆，一一风荷举。故乡遥，何日去？家住吴门，久作长安旅。五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第29首',
      highlights: [{ type: '名句', text: '水面清圆，一一风荷举。' }, { type: '易错字', text: '燎沉香 溽暑 侵晓 宿雨 小楫 芙蓉浦' }],
      tags: ['思乡', '词'] },

    { id: 'sheng-sheng-man', title: '声声慢（寻寻觅觅）', author: '李清照', dynasty: '宋', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急！雁过也，正伤心，却是旧时相识。满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑！梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第30首',
      highlights: [{ type: '名句', text: '寻寻觅觅，冷冷清清，凄凄惨惨戚戚。' }, { type: '名句', text: '这次第，怎一个愁字了得！' }, { type: '易错字', text: '将息 憔悴损 堪摘 梧桐 点点滴滴' }],
      tags: ['婉约', '词'] },

    { id: 'shu-fen', title: '书愤（早岁那知世事艰）', author: '陆游', dynasty: '南宋', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '早岁那知世事艰，中原北望气如山。楼船夜雪瓜洲渡，铁马秋风大散关。塞上长城空自许，镜中衰鬓已先斑。出师一表真名世，千载谁堪伯仲间！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第31首',
      highlights: [{ type: '名句', text: '楼船夜雪瓜洲渡，铁马秋风大散关。' }, { type: '易错字', text: '瓜洲渡 大散关 塞上长城 衰鬓 伯仲间' }],
      tags: ['爱国'] },

    { id: 'lin-an-chun-yu-chu-ji', title: '临安春雨初霁', author: '陆游', dynasty: '南宋', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '世味年来薄似纱，谁令骑马客京华。小楼一夜听春雨，深巷明朝卖杏花。矮纸斜行闲作草，晴窗细乳戏分茶。素衣莫起风尘叹，犹及清明可到家。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第32首',
      highlights: [{ type: '名句', text: '小楼一夜听春雨，深巷明朝卖杏花。' }, { type: '易错字', text: '世味 薄似纱 矮纸斜行 细乳戏分茶 素衣' }],
      tags: ['感怀'] },

    { id: 'nian-nu-jiao-guo-dong-ting', title: '念奴娇·过洞庭', author: '张孝祥', dynasty: '南宋', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '洞庭青草，近中秋，更无一点风色。玉鉴琼田三万顷，着我扁舟一叶。素月分辉，明河共影，表里俱澄澈。悠然心会，妙处难与君说。应念岭海经年，孤光自照，肝肺皆冰雪。短发萧骚襟袖冷，稳泛沧浪空阔。尽挹西江，细斟北斗，万象为宾客。扣舷独啸，不知今夕何夕！',
