    { id: 'jiang-nan-feng-li-gui-nian', title: '江南逢李龟年', author: '杜甫', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '岐王宅里寻常见，崔九堂前几度闻。正是江南好风景，落花时节又逢君。',
      source: '统编（部编）语文教材七年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '正是江南好风景，落花时节又逢君。' }, { type: '易错字', text: '岐王 崔九' }], tags: ['感怀'],
      translation: [
        '当年在岐王府里经常见到你，在崔九堂前也多次听到你的歌声。',
        '如今正是江南风景美好的时候，在这落花的时节又遇见了你。',
      ],
      summary: '诗中写诗人在江南暮春时节与流落漂泊的艺人李龟年重逢，回忆当年岐王宅、崔九堂的交往盛况，抒发对世事变迁、人生飘零的深沉感慨。',
      examFocus: [
        { index: 0, reason: '与今日形成盛衰对比，含易错字「岐」' },
        { index: 1, reason: '名句，寄寓身世与时代之悲' },
      ] },

    { id: 'xing-jun-jiu-ri', title: '行军九日思长安故园', author: '岑参', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '强欲登高去，无人送酒来。遥怜故园菊，应傍战场开。',
      source: '统编（部编）语文教材七年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '遥怜故园菊，应傍战场开。' }], tags: ['思乡'],
      translation: [
        '勉强想要按照习俗去登高，却没有人送酒来。',
        '我在远方怜惜故园的菊花，它们应该正靠着战场开放。',
      ],
      summary: '诗中写重阳节行军途中想登高却无人送酒，遥想故园菊花只能在战场边开放，抒发思乡之情，也寄托对饱经战乱的故园和国家的忧虑。',
      examFocus: [
        { index: 0, reason: '含典故「送酒」，表现行军中的孤寂' },
        { index: 1, reason: '主旨句，借故园菊抒思乡忧国' },
      ] },

    { id: 'ye-shang-shou-jiang-cheng', title: '夜上受降城闻笛', author: '李益', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '回乐烽前沙似雪，受降城外月如霜。不知何处吹芦管，一夜征人尽望乡。',
      source: '统编（部编）语文教材七年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '不知何处吹芦管，一夜征人尽望乡。' }], tags: ['边塞'],
      translation: [
        '回乐烽前的沙地像雪一样白，受降城外的月色像霜一样清冷。',
        '不知从哪里吹起了芦管，一整夜戍边的战士都遥望故乡。',
      ],
      summary: '诗中写夜上受降城所见的边塞景象：沙白似雪、月冷如霜，又借不知何处传来的芦管声，写尽征人一夜望乡的思乡之情。',
      examFocus: [
        { index: 0, reason: '名句，比喻写景典型，默写常考' },
        { index: 1, reason: '主旨句，写征人思乡之情' },
      ] },

    { id: 'sun-quan-quan-xue', title: '孙权劝学', author: '《资治通鉴》', dynasty: '北宋', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '初，权谓吕蒙曰：“卿今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。',
      source: '统编（部编）语文教材七年级下册', highlights: [{ type: '名句', text: '士别三日，即更刮目相待。' }, { type: '易错字', text: '当涂掌事 治经为博士邪 涉猎 孰若孤 遂拜蒙母' }], tags: ['史传'],
      translation: [
        '当初，孙权对吕蒙说：“你现在当权管事了，不可以不学习！”吕蒙用军中事务繁多来推托。',
        '孙权说：“我难道想要你研究儒家经典成为专掌经学传授的学官吗！只是应当粗略地阅读，了解历史罢了。你说事务多，谁比得上我呢？我经常读书，自己认为大有益处。”吕蒙于是开始学习。',
        '等到鲁肃经过寻阳，和吕蒙谈论议事，十分吃惊地说：“你现在的才干谋略，不再是过去那个吴下阿蒙了！”吕蒙说：“读书人分别几天，就要重新用新的眼光看待，长兄怎么认清事物这么晚呢！”于是鲁肃拜见吕蒙的母亲，与吕蒙结为朋友后告别。',
      ],
      summary: '本文写孙权劝说吕蒙读书学习，吕蒙就学后才略大有长进，令鲁肃刮目相看，说明只要肯学习就会有进步，也告诉人们要以发展的眼光看待他人。',
      examFocus: [
        { index: 1, reason: '关键论断句，含通假字与古今异义' },
        { index: 2, reason: '名句「士别三日，刮目相待」，默写常考' },
      ] },

    { id: 'mai-you-weng', title: '卖油翁', author: '欧阳修', dynasty: '北宋', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。',
      source: '统编（部编）语文教材七年级下册', highlights: [{ type: '名句', text: '我亦无他，惟手熟尔。' }, { type: '易错字', text: '自矜 家圃 睨之 微颔 酌油 杓 沥' }], tags: ['笔记'],
      translation: [
        '陈康肃公擅长射箭，当世没有第二个人能跟他相比，他也因此自夸。',
        '他曾经在自家园子里射箭，有个卖油的老翁放下担子站着，斜着眼看他很久也不离开。',
        '看到他射出的箭十支能中八九支，只是微微点头。',
        '康肃公问：你也懂射箭吗？我的射技不精吗？老翁说：无他，只是手熟罢了。康肃公气愤地说：你怎敢轻视我的射技！老翁说：凭我倒油知道。于是取来一个葫芦放在地上，用铜钱盖住葫芦口，慢慢用勺子舀油滴进去，油从钱孔穿过，铜钱却没沾湿。',
        '老翁于是说：我也没有别的奥妙，只是手熟罢了。康肃公笑着把他打发走了。',
      ],
      summary: '本文写卖油翁观看陈尧咨射箭后，用酌油穿钱的绝技说明“手熟”的道理，指出高超的技艺来自反复练习，讽刺了恃技自矜、骄傲自满的态度。',
      examFocus: [
        { index: 2, reason: '含词类活用「颔」，常见翻译题' },
        { index: 3, reason: '关键论断句，含通假字与词类活用' },
        { index: 4, reason: '主旨句，点明熟能生巧的道理' },
      ] },

    { id: 'he-zhong-shi-shou', title: '河中石兽', author: '纪昀', dynasty: '清', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '沧州南一寺临河干，山门圮于河，二石兽并沉焉。阅十余岁，僧募金重修，求二石兽于水中，竟不可得，以为顺流下矣。棹数小舟，曳铁钯，寻十余里无迹。一讲学家设帐寺中，闻之笑曰：“尔辈不能究物理。是非木杮，岂能为暴涨携之去？乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。沿河求之，不亦颠乎？”众服为确论。一老河兵闻之，又笑曰：“凡河中失石，当求之于上流。盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴。渐激渐深，至石之半，石必倒掷坎穴中。如是再啮，石又再转。转转不已，遂反溯流逆上矣。求之下流，固颠；求之地中，不更颠乎？”如其言，果得于数里外。然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？',
      source: '统编（部编）语文教材七年级下册', highlights: [{ type: '名句', text: '然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？' }, { type: '易错字', text: '河干 圮 棹 曳 木杮 湮 啮 坎穴 臆断' }], tags: ['笔记'],
      translation: [
        '沧州南边有一座寺庙靠近河岸，佛寺的外门倒塌到河里，两只石兽一起沉到水里去了。',
        '经过十多年，僧人募集钱财重修寺庙，在水中寻找那两只石兽，竟然找不到，认为它们顺着水流下去了。',
        '他们划着几只小船，拖着铁钯，寻找了十多里也没有找到石兽的踪迹。',
        '一位讲学家在寺里设馆讲学，听后笑着说：“你们不能推究事理。这不是木片，怎能被大水带走？石头坚重，沙子松浮，石兽埋在沙上，只会越沉越深。沿河去找，不是颠倒吗？”众人佩服，认为是正确论断。',
        '一位老河兵听后，又笑着说：“凡是河中失落的石头，都应当到上游去找。石头坚硬沉重，沙子松软浮动，水冲不动石头，反激的力量必在石头下面迎水处冲沙成坑。越冲越深，冲到石头一半时，石头必定倒翻进坑里。这样再冲，石头再翻。翻个不停，就反而逆流而上了。到下游去找固然颠倒，到地下找不更颠倒吗？”照他的话去找，果然在几里外找到了。',
        '既然这样，那么天下的事，只知其一、不知其二的情况太多了，怎能凭某个道理就主观推断呢？',
      ],
      summary: '本文记叙寻找河中石兽的经过，讲学家主张求于下游，老河兵根据实践经验主张求于上游，果然找到。文章由此说明只知其一、不知其二者很多，不能只据常理主观推断。',
      examFocus: [
        { index: 0, reason: '开篇交代故事的起因，含易错字「圮」' },
        { index: 4, reason: '老河兵的关键论断，含词类活用与易错字' },
        { index: 5, reason: '主旨句，揭示不可据理臆断的道理' },
      ] },

    { id: 'zhu-li-guan', title: '竹里馆', author: '王维', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '独坐幽篁里，弹琴复长啸。深林人不知，明月来相照。',
      source: '统编（部编）语文教材七年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '深林人不知，明月来相照。' }, { type: '易错字', text: '幽篁 长啸' }], tags: ['山水'],
      translation: [
        '独自闲坐在幽静茂密的竹林里，一边弹琴，一边又发出长长的啸声。',
        '深林中没有人知道我在哪里，只有明月升起照耀着我。',
      ],
      summary: '本诗写诗人月夜独坐竹林，弹琴长啸，只有明月相伴的情景，表现诗人远离尘嚣、闲适自得的心境和高雅脱俗的生活情趣。',
      examFocus: [
        { index: 0, reason: '名句，写幽居之乐与高雅情趣' },
        { index: 1, reason: '名句，以明月相伴写闲适心境' },
      ] },

    { id: 'chun-ye-luo-cheng-wen-di', title: '春夜洛城闻笛', author: '李白', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '谁家玉笛暗飞声，散入春风满洛城。此夜曲中闻折柳，何人不起故园情。',
      source: '统编（部编）语文教材七年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '此夜曲中闻折柳，何人不起故园情。' }], tags: ['思乡'],
      translation: [
        '是谁家的玉笛悄悄传出乐曲声，随着春风飘散，传遍整个洛阳城。',
        '今夜听到笛曲《折杨柳》，哪个人能不生出思念故乡的感情呢。',
      ],
      summary: '本诗写春夜洛阳城中笛声随春风飘散，诗人听到《折杨柳》曲调而触动情怀，抒发客居在外的游子对故乡的深切思念。',
      examFocus: [
        { index: 0, reason: '名句，写笛声随春风传遍洛城' },
        { index: 1, reason: '主旨句，以闻折柳抒发思乡之情' },
      ] },

    { id: 'feng-ru-jing-shi', title: '逢入京使', author: '岑参', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安。',
      source: '统编（部编）语文教材七年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '马上相逢无纸笔，凭君传语报平安。' }, { type: '易错字', text: '漫漫 龙钟' }], tags: ['思乡'],
      translation: [
        '向东遥望故乡，道路漫长遥远，两只袖子已经湿透，泪水还流个不停。',
        '在马上与你相遇，没有纸笔写信，只好托你给我捎个口信，告诉家人我一切平安。',
      ],
      summary: '本诗写诗人赴边途中与回京使者马上相遇，托他捎口信向家人报平安的情景，表现思念家乡亲人的深情和赴边建功的豪迈气概。',
      examFocus: [
        { index: 0, reason: '写思乡落泪，易错字「龙钟」密集' },
        { index: 1, reason: '主旨句，名句，写托人传语报平安' },
      ] },

    { id: 'wan-chun', title: '晚春', author: '韩愈', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '草树知春不久归，百般红紫斗芳菲。杨花榆荚无才思，惟解漫天作雪飞。',
      source: '统编（部编）语文教材七年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '杨花榆荚无才思，惟解漫天作雪飞。' }, { type: '易错字', text: '芳菲 榆荚' }], tags: ['写景'],
      translation: [
        '花草树木知道春天不久就要归去，万紫千红都争相展示各自的芬芳。',
        '杨花和榆荚没有才思，只知道漫天飞舞，像雪花一样飘扬。',
      ],
      summary: '本诗写暮春时节草树争芳斗艳、杨花榆荚漫天飞舞的景象，用拟人手法表现诗人对春光将逝的惋惜和珍惜光阴、积极进取的人生态度。',
      examFocus: [
        { index: 0, reason: '名句，写暮春百花争艳，默写常考' },
        { index: 1, reason: '托物寓意句，含易错字「惟解」' },
      ] },

    { id: 'yu-zhu-yuan-si-shu', title: '与朱元思书', author: '吴均', dynasty: '南朝', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。',
      source: '统编（部编）语文教材八年级上册', highlights: [{ type: '名句', text: '鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。' }, { type: '易错字', text: '缥碧 急湍 轩邈 泠泠 嘤嘤 鸢飞戾天 横柯' }], tags: ['书'],
      translation: [
        '风停了，烟雾都消散净尽，天空和远山呈现出相同的颜色。',
        '我乘船随着江流飘荡，任凭它向东向西。',
        '从富阳到桐庐大约一百里，奇异的山、独特的的水，是天下独一无二的。',
        '水都是青白色的，千丈深处也能看到水底。',
        '游动的鱼儿和细小的石子，一直看下去可以看得清清楚楚，毫无障碍。',
        '湍急的水流比箭还快，凶猛的巨浪像飞奔的骏马。',
        '两岸的高山上都生长着使人感到寒意的树，它们凭借着高峻的山势争着向上，互相比高比远，争着往高处和远处伸展，笔直地向上，形成了千百座山峰。',
        '泉水冲击着石头，发出泠泠的清响；美丽的鸟儿相互和鸣，唱出嘤嘤的和谐声音。',
        '蝉长久不停地叫着，猿猴也不停地啼叫着。',
        '那些像老鹰飞到天上一样追求高位的人，望见这些山峰就平息了热衷功名的心；那些筹划治理世事的人，看到这些幽美的山谷就流连忘返。',
        '横斜的树枝在上面遮蔽着，即使在白天也像黄昏一样昏暗；稀疏的枝条互相掩映，有时还能见到阳光。',
      ],
      summary: '本文描写乘船游览富春江所见的水清山峻、生机盎然的景色，抒发作者厌弃世俗、寄情山水、向往归隐自然的情怀，并含有规劝世人放下功名之心之意。',

    { id: 'yu-gong-yi-shan', title: '愚公移山', author: '《列子》', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”杂曰：“投诸渤海之尾，隐土之北。”遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。河曲智叟笑而止之曰：“甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？”北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”河曲智叟亡以应。操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。',
      source: '统编（部编）语文教材八年级上册', highlights: [{ type: '名句', text: '子子孙孙无穷匮也，而山不加增，何苦而不平？' }, { type: '易错字', text: '万仞 惩 迂 魁父 箕畚 孀妻 始龀 穷匮 一厝朔东' }], tags: ['寓言'],
      translation: [
        '太行、王屋两座山，方圆七百里，高七八千丈，本来在冀州的南面、河阳的北面。',
        '北山有个叫愚公的人，年纪将近九十岁，面对着山居住。',
        '他苦于山北面道路阻塞，进出都要绕远，于是召集全家商量说：我和你们尽全力铲平险峻的大山，一直通到豫州南部，到达汉水南岸，可以吗？大家纷纷表示赞同。',
        '他的妻子说：凭你的力气，连魁父那样的小山都挖不平，能把太行、王屋怎样？况且土石放哪里？大家说：扔到渤海边上、隐土北边。愚公带三个挑担的子孙，用箕畚运到渤海边。',
        '邻居京城氏的寡妇有个遗腹子，刚换牙，也蹦蹦跳跳地去帮助他们。',
        '冬夏换季，才往返一次。',
        '智叟笑他太不聪明，凭残余力气连山上的草都毁不掉，怎能奈何土石？愚公叹道：你顽固不开窍。我死有子，子生孙，子子孙孙无穷而山不增高，怎会挖不平？智叟无言以对。',
        '手里拿着蛇的山神听说了这件事，怕他不停地挖下去，就把这件事报告给天帝。',
        '天帝被他的诚心感动，命令夸娥氏的两个儿子背走两座山，一座放在朔方东部，一座放在雍州南部。',
        '从此，冀州的南部、汉水的南岸，再也没有山冈阻隔了。',
      ],
      summary: '本文记叙年近九十的愚公不顾智叟嘲笑，率领子孙挖山不止，终于感动天帝命人移走大山的故事，说明只要坚持不懈、不畏艰难，就能战胜困难。',
      examFocus: [
        { index: 0, reason: '开篇交代两山的高大广阔，含易错字「仞」' },
        { index: 3, reason: '妻献疑的关键情节，含「箕畚」词类活用' },
        { index: 6, reason: '愚公反驳智叟的中心句，含通假字与倒装句' },
        { index: 9, reason: '结局句，交代移山结果，含易错字「厝」' },
      ] },

    { id: 'zhou-ya-fu-jun-xi-liu', title: '周亚夫军细柳', author: '司马迁', dynasty: '西汉', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：以备胡。上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰：“天子且至！”军门都尉曰：“将军令曰：‘军中闻将军令，不闻天子之诏。’”居无何，上至，又不得入。于是上乃使使持节诏将军：“吾欲入劳军。”亚夫乃传言开壁门。壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。至营，将军亚夫持兵揖曰：“介胄之士不拜，请以军礼见。”天子为动，改容式车。使人称谢：“皇帝敬劳将军。”成礼而去。既出军门，群臣皆惊。文帝曰：“嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！”称善者久之。',
      source: '统编（部编）语文教材八年级上册', highlights: [{ type: '名句', text: '军中闻将军令，不闻天子之诏。' }, { type: '易错字', text: '彀弓弩 持满 都尉 按辔徐行 介胄 式车 曩者' }], tags: ['史记'],
      translation: [
        '汉文帝后元六年，匈奴大举侵入边境。',
        '于是任命宗正刘礼为将军，驻军在霸上；任命祝兹侯徐厉为将军，驻军在棘门；任命河内郡守周亚夫为将军，驻军在细柳：用来防备匈奴。',
        '皇帝亲自去慰劳军队。',
        '到了霸上和棘门的军营，皇帝直接骑马驰入，将领们用下马的礼节迎送。',
        '不久到了细柳军营，只见官兵都披着铠甲，兵器锋利，弓弩张开，拉得满满的。',
        '皇帝的先行卫队到了，不能进入军营。',
        '先行卫队说天子将要到了，守卫营门的都尉说将军有令，军中只听将军的命令，不听天子的诏令。过了不久，皇帝到了，也不能进入。',
        '于是皇帝就派使者拿着符节下诏给将军说我想进去慰劳军队，周亚夫这才传令打开营门。',
        '守卫营门的官兵对随从的车骑说将军有规定，军中不准驱车奔驰，于是天子就控制着缰绳慢慢前行。',
        '到了营中，将军周亚夫手持兵器行礼说穿戴着铠甲头盔的将士不行跪拜之礼，请允许我以军礼相见。天子为之动容，脸色也变得严肃，扶着车前横木俯身表示敬意。',
        '皇帝派人向周亚夫致意说皇帝恭敬地慰劳将军。慰劳的仪式结束后就离开了。',
        '出了细柳军营门以后，大臣们都很吃惊。',
        '文帝说唉，这才是真正的将军啊！先前霸上、棘门的军营，简直像儿戏罢了，那里的将军一定可以偷袭并俘虏。至于周亚夫，难道能够侵犯吗！他称赞了周亚夫很久。',
      ],
      summary: '本文记叙汉文帝慰劳细柳营军队的经过，通过细柳营军纪严明、周亚夫以军礼相见等情节和文帝的赞语，表现周亚夫治军严明、刚正不阿的真将军形象。',
      examFocus: [
        { index: 4, reason: '写细柳营戒备森严，含通假字「被」' },
        { index: 6, reason: '人物关键语，表现治军严明，易错字「诏」' },
        { index: 9, reason: '周亚夫以军礼相见，表现刚正不阿，含「式」通假' },
        { index: 12, reason: '点睛句，借文帝之口评价周亚夫' },
      ] },

    { id: 'ting-zhong-you-qi-shu', title: '庭中有奇树', author: '《古诗十九首》', dynasty: '汉', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '庭中有奇树，绿叶发华滋。攀条折其荣，将以遗所思。馨香盈怀袖，路远莫致之。此物何足贵？但感别经时。',
      source: '统编（部编）语文教材八年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '馨香盈怀袖，路远莫致之。' }, { type: '易错字', text: '发华滋 遗所思 馨香 盈怀袖' }], tags: ['古诗十九首'],
      translation: [
        '庭院里有一棵珍贵的树，绿色的叶子间开出繁密的花朵。',
        '我攀着枝条折下它的花，想要把它送给所思念的人。',
        '花的香气充满了我的衣袖，可是路途遥远无法送到。',
        '这花又有什么值得珍贵的呢？',
        '只是感慨分别已经很久了。',
      ],
      summary: '本诗写思妇看到庭中花树盛开，折下花枝想送给远方的丈夫，却因路远无法送到，由花及人，表现独处女子的寂寞和对丈夫的深切思念。',
      examFocus: [
        { index: 2, reason: '名句，写折花难送，易错字「馨」' },
        { index: 4, reason: '主旨句，点明思念远人、感伤离别' },
      ] },

    { id: 'gui-sui-shou', title: '龟虽寿', author: '曹操', dynasty: '东汉', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '神龟虽寿，犹有竟时。腾蛇乘雾，终为土灰。老骥伏枥，志在千里。烈士暮年，壮心不已。盈缩之期，不但在天；养怡之福，可得永年。幸甚至哉，歌以咏志。',
      source: '统编（部编）语文教材八年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '老骥伏枥，志在千里。烈士暮年，壮心不已。' }, { type: '易错字', text: '老骥伏枥 盈缩 养怡' }],
      variants: [{ label: '版本差异', text: '“腾蛇乘雾”部分版本作“螣蛇乘雾”。' }], tags: ['言志'],
      translation: [
        '神龟虽然长寿，还是有死亡的时候。',
        '腾蛇能腾云驾雾，最终也会化为泥土灰尘。',
        '年老的千里马伏在马槽旁，志向仍在千里之外。',
        '有壮志的人到了晚年，雄心也不会停止。',
        '人寿命的长短，不只由上天决定；保养身心的福分，可以使人长寿。',
        '幸运得很，好极了，用诗歌来抒发我的心志。',
      ],
      summary: '本诗以神龟、腾蛇终有尽时说明生命有限，又以老骥自比，表现诗人年老而壮志不衰、积极进取的人生态度和自强不息的豪情。',
      examFocus: [
        { index: 0, reason: '以神龟起兴，说明生命有限，易错字「竟」' },
        { index: 2, reason: '名句，以老骥自比，默写常考' },
        { index: 3, reason: '主旨句，直接表达壮志不已的情怀' },
        { index: 5, reason: '乐府套语收束全篇，默写常考' },
      ] },

    { id: 'zeng-cong-di', title: '赠从弟（其二）', author: '刘桢', dynasty: '东汉', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '亭亭山上松，瑟瑟谷中风。风声一何盛，松枝一何劲！冰霜正惨凄，终岁常端正。岂不罹凝寒？松柏有本性。',
      source: '统编（部编）语文教材八年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '岂不罹凝寒？松柏有本性。' }, { type: '易错字', text: '瑟瑟 罹凝寒' }], tags: ['咏物'],
      translation: [
        '高高挺立在山上的松树，山谷中吹着瑟瑟的风。',
        '风声是多么猛烈，松枝又是多么刚劲！',
        '冰霜正下得凄惨寒冷，松树却一年到头始终端正挺拔。',
        '难道它没有遭受严寒的侵袭吗？',
        '是因为松柏有它坚贞的本性。',
      ],
      summary: '本诗描写山上松树在谷中狂风和冰霜严寒中依然挺拔端正，赞美松柏耐寒不凋的本性，借此勉励堂弟坚守节操、坚贞不屈。',
      examFocus: [
        { index: 2, reason: '名句，写松树经冬不凋，易错字「罹」' },
        { index: 4, reason: '主旨句，以松柏本性喻坚贞品格' },
      ] },

    { id: 'liang-fu-xing', title: '梁甫行', author: '曹植', dynasty: '三国', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '八方各异气，千里殊风雨。剧哉边海民，寄身于草野。妻子象禽兽，行止依林阻。柴门何萧条，狐兔翔我宇。',
      source: '统编（部编）语文教材八年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '柴门何萧条，狐兔翔我宇。' }, { type: '易错字', text: '殊风雨 剧哉 林阻 翔我宇' }], tags: ['民生'],
      translation: [
        '各地气候不同，相隔千里风雨也不一样。',
        '海边的百姓多么艰难啊，栖身在海边的荒野之中。',
        '妻子儿女像禽兽一样，行动起居都依傍山林险阻。',
        '柴门多么冷落凄凉，狐狸野兔在我的房屋里穿来穿去。',
      ],
      summary: '本诗写边海百姓寄身草野、妻子儿女如禽兽般生活在山林险阻之中，柴门萧条、狐兔出没，表现百姓生活的困苦和诗人对人民的深切同情。',
      examFocus: [
        { index: 1, reason: '主旨句，写边海百姓寄身草野之苦' },
        { index: 3, reason: '名句，以狐兔出没写民生凋敝，易错字「翔」' },
      ] },

    { id: 'zhuang-zi-yu-hui-zi', title: '庄子与惠子游于濠梁之上', author: '《庄子》', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '庄子与惠子游于濠梁之上。庄子曰：“鲦鱼出游从容，是鱼之乐也。”惠子曰：“子非鱼，安知鱼之乐？”庄子曰：“子非我，安知我不知鱼之乐？”惠子曰：“我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣！”庄子曰：“请循其本。子曰‘汝安知鱼乐’云者，既已知吾知之而问我，我知之濠上也。”',
      source: '统编（部编）语文教材八年级下册', highlights: [{ type: '名句', text: '子非鱼，安知鱼之乐？' }, { type: '易错字', text: '濠梁 鲦鱼 请循其本' }], tags: ['诸子'],
      translation: [
        '庄子和惠子在濠水的桥上游玩。',
        '庄子说：鲦鱼游得从容自在，这是鱼的快乐。惠子说：你不是鱼，怎么知道鱼的快乐？庄子说：你不是我，怎么知道我不知道鱼的快乐？惠子说：我不是你，固然不知道你；你本来不是鱼，你不知道鱼的快乐，这是可以完全确定的。庄子说：请从最初说起。你说你怎么知道鱼快乐，是已经知道我知道才问我，我是在濠水桥上知道的。',
      ],
      summary: '本文写庄子与惠子在濠梁之上的一场辩论：惠子从认知常理发问，庄子则以巧辩应对并归结为“我知之濠上”，表现两人不同的思想旨趣，也反映庄子崇尚自然、物我相通、追求精神自由的旷达心境。',
      examFocus: [
        { index: 1, reason: '名句，含通假字“汝”与词类活用，默写常考' },

    { id: 'da-dao-zhi-xing-ye', title: '大道之行也', author: '《礼记》', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。',
      source: '统编（部编）语文教材八年级下册', highlights: [{ type: '名句', text: '大道之行也，天下为公。' }, { type: '易错字', text: '选贤与能 讲信修睦 矜 男有分 货恶 谋闭而不兴' }], tags: ['礼记'],
      translation: [
        '在大道施行的时候，天下是天下人所共有的。',
        '把品德高尚的人、有才能的人选拔出来，讲求诚信，培养和睦。',
        '所以人们不只敬爱自己的父母，不只疼爱自己的子女，要使老人有归宿，壮年人有用处，孩子能成长，鳏寡孤独和残疾的人都有人供养，男子有职业，女子有归宿。',
        '人们憎恶财物被丢弃在地上，却不一定要藏在自己家里；憎恶力气不从自己身上使出来，却不一定是为自己。',
        '因此奸诈的图谋被堵住而不兴起，盗窃、作乱、害人的事不会发生，所以大门可以从外面掩上而不用关闭。',
        '这就叫做大同社会。',
      ],
      summary: '本文阐述儒家理想中的“大同”社会：天下为公，选贤与能，讲信修睦，人人得其所养、各尽其力，社会安定无争，表达了作者对公平和睦、天下为公的理想社会的向往。',
      examFocus: [
        { index: 0, reason: '中心句，概括大同社会总纲' },
        { index: 2, reason: '名句，含词类活用与通假字，默写常考' },
        { index: 5, reason: '结论句，点明全文主旨' },
      ] },

    { id: 'he-zhou-ji', title: '核舟记', author: '魏学洢', dynasty: '明', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。其船背稍夷，则题名其上，文曰“天启壬戌秋日，虞山王毅叔远甫刻”，细若蚊足，钩画了了，其色墨。又用篆章一，文曰“初平山人”，其色丹。通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。而计其长曾不盈寸。盖简桃核修狭者为之。嘻，技亦灵怪矣哉！',
      source: '统编（部编）语文教材八年级下册', highlights: [{ type: '名句', text: '嘻，技亦灵怪矣哉！' }, { type: '易错字', text: '罔不因势象形 箬篷 石青糁之 峨冠 髯 衣褶 椎髻 篆章 修狭' }], tags: ['说明文'],
      translation: [
        '明朝有个手艺奇妙精巧的人叫王叔远，能用直径一寸的木头雕刻宫室、器皿、人物，甚至鸟兽、树木、石头，无不顺着木头原来的样子模拟它们的形状，各有各的神情姿态。',
        '他曾经送给我一只用桃核雕成的小船，刻的原来是苏轼游赤壁的情景。',
        '船从头到尾长约八分多，大约有两个黄米粒那么高。',
        '中间高起而宽敞的部分是船舱，上面盖着用箬竹叶做的船篷。',
        '船舱旁边开着小窗，左右各四扇，一共八扇。',
        '打开窗子来看，雕刻着花纹的栏杆左右相对。',
        '关上窗子，就见右边刻着山高月小、水落石出，左边刻着清风徐来、水波不兴，用石青涂在刻着字的凹处。',
        '船头坐着三个人，中间戴着高高的帽子、长着浓密胡须的是苏东坡，佛印在右边，鲁直在左边。',
        '苏东坡、黄鲁直共同看着一幅书画长卷。',
        '苏东坡右手拿着画卷的右端，左手轻按在鲁直的背上。',
        '鲁直左手拿着画卷的左端，右手指着画卷，好像在说什么话。',
        '苏东坡露出右脚，鲁直露出左脚，各自略微侧着身子，他们互相靠近的两膝，都隐藏在手卷下边的衣褶里。',
        '佛印极像弥勒佛，敞开胸襟露出乳部，抬头仰望，神情跟苏、黄两人不相类似。',
        '他平放着右膝，弯曲着右臂支撑在船上，又竖起左膝，左臂挂着念珠靠在左膝上，那念珠可以清清楚楚地数出来。',
        '船尾横放着一支桨。',
        '桨的左右两旁各有一个撑船的人。',
        '位于右边的人梳着椎形发髻，仰着脸，左手靠在一根横木上，右手扳着右脚趾，好像在大声呼叫的样子。',
        '位于左边的人右手拿着蒲葵扇，左手抚着茶炉，炉上有个壶，那个人眼睛正视茶炉，神色平静，好像在听茶水烧开了没有的样子。',
        '那只船的顶部较平，就在上面题写名字，文字是天启壬戌秋日虞山王毅叔远甫刻，字迹细得像蚊子的脚，笔画清清楚楚，它的颜色是黑的。',
        '又刻了一个篆字图章，文字是初平山人，它的颜色是红的。',
        '总计一只船上，刻了五个人，八扇窗，箬竹船篷、船桨、火炉、茶壶、手卷、念珠各一件，对联、题名和篆文，刻的字共三十四个。',
        '可是计算它的长度，竟然不满一寸。',
        '原来是挑选长而窄的桃核来雕刻的。',
        '啊，技艺也真神奇啊！',
      ],
      summary: '本文细致描述核舟的形制及各个人物、器物的情态，突出王叔远“因势象形”的精巧技艺，赞美我国古代民间工艺美术的高超成就和工匠的聪明才智。',
      examFocus: [
        { index: 0, reason: '总起句，点明技艺奇巧与写作缘由' },
        { index: 7, reason: '名句，含词类活用，常作翻译题' },
        { index: 13, reason: '含通假字“诎”，易错字密集' },
        { index: 21, reason: '主旨句，赞叹雕刻技艺灵怪' },
      ] },

    { id: 'ti-po-shan-si-hou-chan-yuan', title: '题破山寺后禅院', author: '常建', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '清晨入古寺，初日照高林。曲径通幽处，禅房花木深。山光悦鸟性，潭影空人心。万籁此都寂，但余钟磬音。',
      source: '统编（部编）语文教材八年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '曲径通幽处，禅房花木深。' }, { type: '易错字', text: '万籁 钟磬' }],
      variants: [{ label: '版本差异', text: '“万籁此都寂”部分版本作“万籁此俱寂”。' }], tags: ['山水'],
      translation: [
        '清晨我走进这座古寺，初升的太阳照耀着高高的树林。',
        '曲折的小路通向幽静的地方，禅房掩映在繁茂的花木深处。',
        '山中的风光使鸟儿更加欢悦，潭中的倒影使人心中杂念全消。',
        '此时此刻各种声音都寂静下来，只留下敲钟击磬的声音。',
      ],
      summary: '这首诗写清晨游破山寺后禅院的所见所感，以曲径、花木、山光、潭影等景物营造幽静深远的意境，抒发了诗人寄情山水、追求清净、超脱尘俗的隐逸情怀。',
      examFocus: [
        { index: 1, reason: '名句，默写常考，意境幽深' },
        { index: 2, reason: '名句，“悦”“空”为词类活用考点' },
        { index: 3, reason: '名句，以声衬静，易错字“籁”“磬”' },
      ] },

    { id: 'song-you-ren', title: '送友人', author: '李白', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '青山横北郭，白水绕东城。此地一为别，孤蓬万里征。浮云游子意，落日故人情。挥手自兹去，萧萧班马鸣。',
      source: '统编（部编）语文教材八年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '浮云游子意，落日故人情。' }, { type: '易错字', text: '孤蓬 萧萧班马鸣' }], tags: ['送别'],
      translation: [
        '青山横亘在城北，白水环绕着东城。',
        '在这里一分别，你就像孤飞的蓬草，踏上万里征程。',
        '天上的浮云像游子漂泊不定的心意，落日像故人依依不舍的情谊。',
        '我们挥手从此分别，两匹马临别时萧萧长鸣。',
      ],
      summary: '这首送别诗写诗人与友人在城外分别的情景，借青山白水、孤蓬浮云、落日班马等形象，抒发对友人远行的深切关切与依依惜别之情。',
      examFocus: [
        { index: 1, reason: '名句，以“孤蓬”喻远行友人，默写常考' },
        { index: 2, reason: '名句，借景抒情，对仗工整' },
        { index: 3, reason: '易错字密集，“萧萧”“班马”常考' },
      ] },

    { id: 'bu-suan-zi-huang-zhou', title: '卜算子·黄州定慧院寓居作', author: '苏轼', dynasty: '北宋', stage: '初中', grade: '八年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '缺月挂疏桐，漏断人初静。谁见幽人独往来？缥缈孤鸿影。惊起却回头，有恨无人省。拣尽寒枝不肯栖，寂寞沙洲冷。',
      source: '统编（部编）语文教材八年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '拣尽寒枝不肯栖，寂寞沙洲冷。' }, { type: '易错字', text: '疏桐 漏断 缥缈 省' }], tags: ['词'],
      translation: [
        '残缺的月亮挂在稀疏的梧桐树上，更漏声停了，人们刚刚安静下来。',
        '有谁看见幽居的人独自往来呢？',
        '只有那隐约缥缈的孤雁身影。',
        '它受惊飞起却又回头张望，心中有怨恨却没有人理解。',
        '它挑遍了寒冷的树枝也不肯栖息，寂寞的沙洲一片清冷。',
      ],
      summary: '这首词写深夜定慧院中所见所感，借缺月、疏桐与缥缈孤鸿的形象托物寄怀，表现词人被贬黄州后幽独凄凉的心境和孤高自守、不肯随俗的品格。',
      examFocus: [
        { index: 1, reason: '名句，设问句，突出幽人孤独' },
        { index: 4, reason: '主旨句，借孤鸿自比高洁不随俗' },
      ] },

    { id: 'bu-suan-zi-yong-mei', title: '卜算子·咏梅', author: '陆游', dynasty: '南宋', stage: '初中', grade: '八年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '驿外断桥边，寂寞开无主。已是黄昏独自愁，更着风和雨。无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。',
      source: '统编（部编）语文教材八年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '零落成泥碾作尘，只有香如故。' }, { type: '易错字', text: '更着 群芳妒 碾作尘' }], tags: ['咏物', '词'],
      translation: [
        '在驿站外断桥的旁边，梅花寂寞地开放，没有人来照管。',
        '已经是黄昏时分独自忧愁，又遭受风雨的摧残。',
        '它没有心思苦苦争夺春光，任凭百花嫉妒。',
        '即使凋零飘落被碾成尘土，只有香气依旧不变。',
      ],
      summary: '这首词写梅花在驿外断桥边寂寞开放、又遭风雨摧折的境遇，赞颂它不与群芳争春、即使零落成泥也芳香如故的品格，借以表现词人坚贞自守、不慕荣利的高尚情操。',
      examFocus: [
        { index: 1, reason: '名句，写环境恶劣，烘托梅花' },
        { index: 2, reason: '名句，拟人手法，默写常考' },
        { index: 3, reason: '主旨句，托物言志，易错字“碾”' },
      ] },

    { id: 'qin-yuan-chun-xue', title: '沁园春·雪', author: '毛泽东', dynasty: '现代', stage: '初中', grade: '九年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽；大河上下，顿失滔滔。山舞银蛇，原驰蜡象，欲与天公试比高。须晴日，看红装素裹，分外妖娆。江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。',
      source: '统编（部编）语文教材九年级上册', highlights: [{ type: '名句', text: '江山如此多娇，引无数英雄竞折腰。' }, { type: '名句', text: '俱往矣，数风流人物，还看今朝。' }, { type: '易错字', text: '惟余莽莽 顿失滔滔 红装素裹 妖娆 稍逊风骚 天骄' }], tags: ['现代', '词'],
      translation: [
        '北方的风光，千里大地被冰封冻，万里长空雪花飘舞。',
        '远望长城内外，只剩下白茫茫的一片；黄河上下，顿时失去了波涛滚滚的气势。',
        '群山像银蛇一样舞动，高原像白象一样奔驰，都想和老天爷比一比高低。',
        '等到晴天，看红日与白雪交相辉映，格外娇艳美好。',
        '江山如此娇媚多姿，引得无数英雄竞相为之倾倒。',
        '可惜秦始皇和汉武帝，文采方面略微差一些；唐太宗和宋太祖，文学才华也稍显不足。',
        '称雄一世的成吉思汗，只懂得拉弓射大雕。',
        '这些人都已过去了，要数能建功立业的风流人物，还得看今天。',
      ],
      summary: '这首词上片描绘北国壮丽的雪景，下片评点历代英雄人物，指出他们文治不足，从而歌颂当代风流人物的英雄气概，抒发词人作为革命领袖的豪情壮志与坚定自信。',
      examFocus: [
        { index: 2, reason: '名句，比喻拟人，默写常考' },
        { index: 4, reason: '过渡名句，承上启下，默写常考' },
        { index: 7, reason: '主旨句，抒发革命英雄气概' },
      ] },

    { id: 'yue-ye-yi-she-di', title: '月夜忆舍弟', author: '杜甫', dynasty: '唐', stage: '初中', grade: '九年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '戍鼓断人行，边秋一雁声。露从今夜白，月是故乡明。有弟皆分散，无家问死生。寄书长不达，况乃未休兵。',
      source: '统编（部编）语文教材九年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '露从今夜白，月是故乡明。' }, { type: '易错字', text: '戍鼓 况乃' }], tags: ['思亲'],
      translation: [
        '戍楼上的更鼓声断绝了人行，边塞的秋天传来一声孤雁的鸣叫。',
        '从今夜起露水变得洁白，月亮还是故乡的最明亮。',
        '虽有兄弟却都分散了，没有家可以打听他们的生死。',
        '寄出的书信常常不能送到，何况战乱还没有停止。',
      ],
      summary: '这首诗写诗人在战乱中月夜思念失散兄弟的情景，通过边塞秋夜的凄凉景象和家书难达的境况，表达对兄弟的牵挂与忧虑，以及对战乱不息、生离死别的沉痛感慨。',
      examFocus: [

        { index: 2, reason: '主旨句，写兄弟离散，含古今异义' },
        { index: 3, reason: '含“况乃”等考点，点明战乱之痛' },
      ] },

    { id: 'shang-shan-zao-xing', title: '商山早行', author: '温庭筠', dynasty: '唐', stage: '初中', grade: '九年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。',
      source: '统编（部编）语文教材九年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '鸡声茅店月，人迹板桥霜。' }, { type: '易错字', text: '征铎 槲叶 枳花 驿墙 凫雁' }], tags: ['羁旅'],
      translation: [
        '清晨起床，车马的铃铛已经响动，远行的人因思念故乡而悲伤。',
        '鸡叫声中，荒村茅草店沐浴着残月；行人的足迹印在板桥的寒霜上。',
        '槲树的叶子落满了山路，枳树的白花在驿站墙边格外显眼。',
        '因而想起梦中回到杜陵的家乡，那里成群的野鸭大雁落满了曲折的池塘。',
      ],
      summary: '这首诗写诗人清晨动身赶路的所见所感，以鸡声、残月、板桥霜迹等典型意象勾勒早行图景，抒发了漂泊在外的羁旅愁思和对故乡的深切思念。',
      examFocus: [
        { index: 0, reason: '点明早行，“悲故乡”奠定情感基调' },
        { index: 1, reason: '名句，纯名词意象组合，默写常考' },
        { index: 3, reason: '以梦境收束，突出思乡之情' },
      ] },

    { id: 'tang-ju-bu-ru-shi-ming', title: '唐雎不辱使命', author: '《战国策》', dynasty: '先秦', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '秦王使人谓安陵君曰：“寡人欲以五百里之地易安陵，安陵君其许寡人！”安陵君曰：“大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！”秦王不说。安陵君因使唐雎使于秦。秦王谓唐雎曰：“寡人以五百里之地易安陵，安陵君不听寡人，何也？且秦灭韩亡魏，而君以五十里之地存者，以君为长者，故不错意也。今吾以十倍之地，请广于君，而君逆寡人者，轻寡人与？”唐雎对曰：“否，非若是也。安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？”秦王怫然怒，谓唐雎曰：“公亦尝闻天子之怒乎？”唐雎对曰：“臣未尝闻也。”秦王曰：“天子之怒，伏尸百万，流血千里。”唐雎曰：“大王尝闻布衣之怒乎？”秦王曰：“布衣之怒，亦免冠徒跣，以头抢地耳。”唐雎曰：“此庸夫之怒也，非士之怒也。夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。若士必怒，伏尸二人，流血五步，天下缟素，今日是也。”挺剑而起。秦王色挠，长跪而谢之曰：“先生坐！何至于此！寡人谕矣：夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。”',
      source: '统编（部编）语文教材九年级下册', highlights: [{ type: '名句', text: '若士必怒，伏尸二人，流血五步，天下缟素。' }, { type: '易错字', text: '怫然 免冠徒跣 以头抢地 韩傀 休祲 缟素 色挠 长跪而谢' }], tags: ['史传'],
      translation: [
        '秦王派人对安陵君说：“我想用五百里地换安陵，安陵君可要答应我！”安陵君说：“大王给予恩惠，用大的换小的，很好；即使这样，我从先王那里继承了这块土地，希望终生守护它，不敢交换！”秦王很不高兴。',
        '安陵君于是派唐雎出使到秦国。',
        '秦王对唐雎说：“我用五百里地换安陵，安陵君不听我，为什么？况且秦灭韩亡魏，安陵君凭五十里地存下来，是因为我把他看作长者，所以不打他主意。如今我用十倍的地请他扩地，他却违背我，是轻视我吗？”唐雎答道：“不，不是这样。安陵君从先王那里继承土地并守护它，即使千里也不敢换，哪里只是五百里呢？”秦王大怒，问唐雎：“你曾听说天子发怒吗？”唐雎答道：“我没听说过。”秦王说：“天子发怒，死人百万，流血千里。”唐雎说：“大王曾听说平民发怒吗？”秦王说：“平民发怒，不过摘帽赤脚、用头撞地罢了。”唐雎说：“这是庸人发怒，不是有胆识的人发怒。专诸刺杀王僚时，彗星扫过月亮；聂政刺杀韩傀时，白虹穿过太阳；要离刺杀庆忌时，苍鹰扑到殿上。这三人都是平民中的有识之士，心中愤怒未发，上天就降下征兆，加上我将成四人。若有识之士真发怒，就两人倒地，血流五步，天下穿白，今天就是这样。”他拔剑站起。',
        '秦王变了脸色，直身而跪向唐雎道歉说：“先生请坐！怎么会到这种地步！我明白了：韩国、魏国灭亡，可是安陵却凭着五十里的土地保存下来，只是因为有先生您啊。”',
      ],
      summary: '本文写唐雎奉命出使秦国，面对秦王以易地为名的威胁毫不畏惧，针锋相对地陈述“布衣之怒”，终于折服秦王、保全安陵，表现唐雎不畏强暴、有胆有识、不辱使命的形象。',
      examFocus: [
        { index: 3, reason: '关键论断句，兼以秦王折服反衬唐雎' },
      ] },

    { id: 'ding-feng-bo', title: '定风波（莫听穿林打叶声）', author: '苏轼', dynasty: '北宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。',
      source: '统编（部编）语文教材九年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。' }, { type: '易错字', text: '吟啸 芒鞋 料峭 萧瑟' }], tags: ['豪放', '词'],
      translation: [
        '不要去听那穿过树林敲打树叶的雨声，不妨吟诗长啸，慢慢地走。',
        '拄着竹杖穿着草鞋，比骑马还轻快，有什么可怕的？',
        '披一件蓑衣任凭烟雨，就这样度过一生。',
        '微寒的春风吹醒酒意，感到有些冷，山头的斜阳却迎面照来。',
        '回头看看刚才风雨萧瑟的地方，回去时，既没有风雨也没有晴天。',
      ],
      summary: '这首词写途中遇雨的寻常小事，词人不惧风雨、吟啸徐行，并以“一蓑烟雨任平生”“也无风雨也无晴”收束，表现他乐观旷达、宠辱不惊、超然物外的人生态度。',
      examFocus: [
        { index: 0, reason: '名句，表现从容面对风雨的态度' },
        { index: 2, reason: '名句，旷达胸怀，默写常考' },
        { index: 4, reason: '主旨句，双关哲理，默写常考' },
      ] },

    { id: 'lin-jiang-xian-ye-deng-xiao-ge', title: '临江仙·夜登小阁，忆洛中旧游', author: '陈与义', dynasty: '宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。杏花疏影里，吹笛到天明。二十余年如一梦，此身虽在堪惊。闲登小阁看新晴。古今多少事，渔唱起三更。',
      source: '统编（部编）语文教材九年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '杏花疏影里，吹笛到天明。' }, { type: '易错字', text: '午桥 长沟流月 堪惊 渔唱' }], tags: ['怀旧', '词'],
      translation: [
        '回忆从前在午桥上饮酒，在座的大多是英雄豪杰。',
        '长长的河沟里月影随水流去，悄然无声。',
        '在杏花稀疏的花影里，我们吹着笛子一直到天亮。',
        '二十多年就像一场梦，我这个人虽然还在，回想起来却令人心惊。',
        '闲来登上小阁，观赏雨后初晴的景色。',
        '古往今来有多少事，都化作三更时分渔人的歌声。',
      ],
      summary: '这首词回忆洛阳午桥的豪英聚会，感慨二十年往事如梦、此身虽在堪惊，借登阁所见与渔唱抒发对国事沧桑、人生易老的深沉叹惋。',
      examFocus: [
        { index: 0, reason: '回忆旧游的名句，默写常考' },
        { index: 2, reason: '名句，意境优美，默写常考' },
        { index: 5, reason: '主旨句，抒发沧桑之叹' },
      ] },

    { id: 'tai-chang-yin-jian-kang', title: '太常引·建康中秋夜为吕叔潜赋', author: '辛弃疾', dynasty: '南宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '一轮秋影转金波，飞镜又重磨。把酒问姮娥：被白发、欺人奈何？乘风好去，长空万里，直下看山河。斫去桂婆娑，人道是、清光更多。',
      source: '统编（部编）语文教材九年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '斫去桂婆娑，人道是、清光更多。' }, { type: '易错字', text: '金波 飞镜 姮娥 斫 婆娑' }], tags: ['中秋', '词'],
      translation: [
        '一轮秋月的影子转动着金色的波光，像重新磨过的飞镜挂在天上。',
        '我端起酒杯问嫦娥：被白头发欺负人，该怎么办呢？',
        '我要乘风飞去，在万里长空中一直向下看祖国山河。',
        '砍去月中摇曳的桂树，人们说，这样清朗的月光就会更多。',
      ],
      summary: '这首词借中秋明月展开想象，抒发年华虚度、功业未成的感慨，并借斫去桂树表达扫清障碍、收复山河的宏愿。',
      examFocus: [
        { index: 1, reason: '主旨句，抒发功业未成之慨' },
        { index: 2, reason: '名句，展现豪迈气象，默写常考' },
        { index: 3, reason: '名句，含象征意义，默写常考' },
      ] },

    { id: 'xi-jiang-yue-ye-xing-huang-sha', title: '西江月·夜行黄沙道中', author: '辛弃疾', dynasty: '南宋', stage: '初中', grade: '六年级', genre: '词', sourceType: '上海地区', required: false, recommended: true,

      translation: [

      examFocus: [

      ] },

    { id: 'jiang-nan-chun', title: '江南春', author: '杜牧', dynasty: '唐', stage: '初中', grade: '六年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,

      examFocus: [

    { id: 'tiao-tiao-qian-niu-xing', title: '迢迢牵牛星', author: '《古诗十九首》', dynasty: '汉', stage: '初中', grade: '六年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,
      text: '迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许？盈盈一水间，脉脉不得语。',

      translation: [
        '遥远的牵牛星，明亮的织女星。',
        '她伸出纤细洁白的手，札札地摆弄着织布机。',
        '一整天也织不成一段布，眼泪像雨一样落下。',
        '银河又清又浅，两人相距又有多远呢？',
        '只隔着一条清浅的河水，却含情相视不能说话。',
      ],
      summary: '这首诗写织女因相思而无心织布、泣涕如雨，虽与牵牛仅一水之隔却不得相见，表现离别相思之苦，也暗含人间离别之痛。',
      examFocus: [
        { index: 0, reason: '名句，叠词起句，默写常考' },
        { index: 3, reason: '含反问句式，常作翻译题' },
        { index: 4, reason: '主旨句，写尽相思之苦' },
      ] },

    { id: 'zhu-shi', title: '竹石', author: '郑燮', dynasty: '清', stage: '初中', grade: '六年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,
      text: '咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。',
      source: '原项目题库（上海中考自测 · 沪教版六年级）', highlights: [{ type: '名句', text: '千磨万击还坚劲，任尔东西南北风。' }, { type: '易错字', text: '破岩 坚劲' }], tags: ['咏物'],

      examFocus: [

        { index: 1, reason: '主旨句，表现坚贞不屈的品格' },
      ] },

    { id: 'hui-xiang-ou-shu-qi-yi', title: '回乡偶书（其一）', author: '贺知章', dynasty: '唐', stage: '初中', grade: '六年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,
      text: '少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。',
      source: '原项目题库（上海中考自测 · 沪教版六年级）', highlights: [{ type: '名句', text: '儿童相见不相识，笑问客从何处来。' }, { type: '易错字', text: '鬓毛衰' }], tags: ['感怀'],

      highlights: [{ type: '名句', text: '朝闻道，夕死可矣。' }, { type: '名句', text: '士不可以不弘毅，任重而道远。' }, { type: '名句', text: '己所不欲，勿施于人。' }, { type: '易错字', text: '弘毅 一篑 迩之事父 克己复礼' }],
      notes: '课标指定的十二章与统编选择性必修上册课文一致。', tags: ['诸子'],
      translation: [
        '孔子说：人没有仁德，怎么对待礼呢？人没有仁德，怎么对待乐呢？孔子说：早晨明白道，晚上死去也可以。孔子说：君子明白道义，小人懂得利益。孔子说：见贤就想着看齐，见不贤就反省自己。孔子说：质朴超过文采就粗野，文采超过质朴就虚浮，文采质朴配合恰当才是君子。曾子说：士人不可以不志向远大、意志坚强，因为责任重、路程远。以仁为己任，不也重吗？到死才停止，不也远吗？孔子说：如堆山，只差一筐土就停下，是我自己要停；如填洼，虽只倒一筐土，继续前进，是我自己要前进。孔子说：智者不惑，仁者不忧，勇者不惧。子贡问：有没有一个字可终身奉行？孔子说：大概就是恕吧！自己不想要的，不要强加给别人。孔子说：为什么不学《诗经》呢？诗可以激发感情、观察社会、结交朋友、抒发怨恨，近可事父，远可事君，还能多认识鸟兽草木的名称。孔子说：君子饮食不求饱足，居处不求安逸，做事敏捷、说话谨慎，到有道的人那里端正自己，可以说是好学了。颜渊问什么是仁。',
        '孔子说：约束自己使言行合于礼就是仁。一旦做到，天下人就会称许你仁德。实践仁德在于自己，难道在于别人吗？颜渊说：请问条目。孔子说：不合礼的不看，不合礼的不听，不合礼的不说，不合礼的不做。颜渊说：我虽不聪明，也要照这些话去做。',
      ],
      summary: '课文选录孔子及弟子的言论，从学习、仁德、修身、处世等方面阐述儒家主张：以仁为核心，主张克己复礼、见贤思齐、文质彬彬，强调士人应弘毅担当、坚守道义，学习要持之以恒、善始善终。',
      examFocus: [
        { index: 0, reason: '名句集中，默写常考，含“知者不惑”等名句' },
        { index: 1, reason: '核心论断句，孔子论仁的名句默写常考' },
      ] },

    { id: 'quan-xue-gao', title: '劝学', author: '《荀子》', dynasty: '先秦', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规。虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第2篇（课标指定范围：学不可以已……用心躁也）',
      highlights: [{ type: '名句', text: '青，取之于蓝，而青于蓝。' }, { type: '名句', text: '锲而不舍，金石可镂。' }, { type: '易错字', text: '輮以为轮 槁暴 就砺 参省 跂 舆马 跬步 骐骥 驽马 锲 镂 鳝' }],
      variants: [{ label: '用字差异', text: '“輮以为轮”统编教材用字为“𫐓”（车+柔，同“煣”），为便于各设备显示，此处采用通行写法“輮”。' }],
      tags: ['诸子'],
      translation: [
        '君子说：学习是不可以停止的。',
        '靛青是从蓝草里提取的，却比蓝草颜色更深；冰是水凝成的，却比水更寒冷。',
        '木材直得合乎墨线，用煣的工艺把它弯成车轮，它的弧度就合乎圆规。',
        '即使又晒干了，也不再挺直，这是煣的工艺使它变成这样的。',
        '所以木材经墨线量过就能取直，金属刀剑在磨刀石上磨过就能锋利，君子广泛学习并且每天检验反省自己，就会智慧明达而行为没有过错了。',
        '我曾经整天地思考，却不如片刻学习所得；我曾经踮起脚跟远望，却不如登上高处看得广阔。',
        '登上高处招手，手臂并没有加长，可是远处的人也能看见；顺着风呼喊，声音并没有加强，可是听的人却听得清楚。',
        '借助车马的人，并不是脚走得快，却能到达千里之外；借助船只的人，并不是会游泳，却能横渡江河。',
        '君子的天性并没有什么不同，只是善于借助外物罢了。',
        '堆积土石成为高山，风雨就从这里兴起；汇积水流成为深渊，蛟龙就在这里生长；积累善行养成品德，精神智慧自然获得，圣人的心境就具备了。',
        '所以不积累半步一步，就无法到达千里之外；不汇集细小的水流，就无法形成江海。',
        '骏马一跃，也不能超过十步；劣马拉车走十天，成功在于不肯放弃。',
        '用刀刻东西，刻几下就放弃，腐朽的木头也刻不断；不停地刻下去，金石也能雕刻成功。',
        '蚯蚓没有锐利的爪牙和强健的筋骨，却能向上吃泥土，向下喝地下水，这是因为它用心专一。',
        '螃蟹有六条腿和两只钳夹，没有蛇、鳝的洞穴就无处容身，这是因为它用心浮躁。',
      ],
      summary: '本文论述学习的重要性，指出学习不可以停止；以青出于蓝、木受绳则直等比喻说明学习能改变人、提高人，主张君子应善假于物，并强调积累、坚持与用心专一，非天生资质决定人的成就。',
      examFocus: [
        { index: 0, reason: '全文中心论点句' },
        { index: 1, reason: '比喻论证的名句，默写常考，含通假字' },
        { index: 4, reason: '含通假字与词类活用，常见翻译题' },
        { index: 8, reason: '分论点总结句，默写常考' },
        { index: 10, reason: '名句，以积累设喻，含易错字“跬”“至”' },
        { index: 12, reason: '名句，以雕刻设喻论坚持，含易错字“锲”“镂”' },
        { index: 13, reason: '结句，含宾语前置句式，易错字密集' },
      ] },

    { id: 'qu-yuan-lie-zhuan-gao', title: '屈原列传（节选）', author: '司马迁', dynasty: '西汉', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。“离骚”者，犹离忧也。夫天者，人之始也；父母者，人之本也。人穷则反本，故劳苦倦极，未尝不呼天也；疾痛惨怛，未尝不呼父母也。屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？屈平之作《离骚》，盖自怨生也。《国风》好色而不淫，《小雅》怨诽而不乱。若《离骚》者，可谓兼之矣。上称帝喾，下道齐桓，中述汤、武，以刺世事。明道德之广崇，治乱之条贯，靡不毕见。其文约，其辞微，其志洁，其行廉。其称文小而其指极大，举类迩而见义远。其志洁，故其称物芳；其行廉，故死而不容。自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。推此志也，虽与日月争光可也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第3篇（课标指定节选）',
      highlights: [{ type: '名句', text: '其文约，其辞微，其志洁，其行廉。' }, { type: '名句', text: '推此志也，虽与日月争光可也。' }, { type: '易错字', text: '谗谄 惨怛 帝喾 靡不毕见 濯淖 蝉蜕 皭然' }],
      tags: ['史记'],
      translation: [
        '屈原痛心楚怀王听信谗言不能分辨是非，谄媚的小人蒙蔽了君王的明察，邪恶之人损害公正，端方正直的人不被容纳，所以忧愁深思而写下了《离骚》。',
        '《离骚》就是遭遇忧愁的意思。',
        '上天是人的起源，父母是人的根本。',
        '人处境困窘就会追念根本，所以劳累辛苦疲倦到极点时，没有不呼喊上天的；生病痛苦悲伤时，没有不呼唤父母的。',
        '屈原行为正直，竭尽忠诚和智慧来侍奉他的君王，却被谗佞小人离间，可以说是处境困窘了。',
        '诚信却被怀疑，忠诚却被诽谤，能没有怨恨吗？',
        '屈原创作《离骚》，大概是由怨恨而生的。',
        '《国风》写男女之情但不过分，《小雅》有怨恨讽刺但不悖乱。',
        '至于《离骚》，可以说是兼有这两者的优点了。',
        '往上称述帝喾，往下谈到齐桓公，中间叙述商汤、周武王，用来讽刺当时的政事。',
        '阐明道德的广大崇高，国家治乱的条理，没有不完全显现出来的。',
        '他的文笔简练，他的言辞含蓄，他的志趣高洁，他的品行方正。',
        '他称引的事物细小，但表达的意思极为博大；列举的事例浅近，但体现的意义深远。',
        '他的志趣高洁，所以称引的事物是芳香的；他的品行方正，所以至死也不被世俗容纳。',
        '他自动远离污泥浊水，像蝉蜕壳一样脱离污浊，浮游在尘世之外，不沾染世俗的污垢，洁白干净，虽在污泥中却不受污染。',
        '推究他的这种志趣，即使与日月争光也是可以的。',
      ],
      summary: '本文记述屈原因君王听信谗言、方正之士不被容纳而忧愁幽思创作《离骚》，并评述其作品文约辞微、志洁行廉，可与日月争光；作者借此表达对屈原忠贞高洁的敬仰和对其不幸遭遇的深切同情。',
      examFocus: [
        { index: 0, reason: '主旨句，说明《离骚》创作缘由，含判断句式' },
        { index: 5, reason: '含被动句与反问句式，常见翻译题' },
        { index: 11, reason: '名句，高度概括屈原的为人与文风' },
        { index: 12, reason: '名句，含词类活用与古今异义，翻译常考' },
        { index: 13, reason: '名句，默写常考，易错字密集' },
        { index: 15, reason: '名句，对屈原志行的高度评价' },
      ] },

    { id: 'jian-tai-zong-shi-si-shu', title: '谏太宗十思疏', author: '魏征', dynasty: '唐', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。源不深而望流之远，根不固而求木之长，德不厚而思国之理，臣虽下愚，知其不可，而况于明哲乎！人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。' +
        '凡百元首，承天景命，莫不殷忧而道著，功成而德衰。有善始者实繁，能克终者盖寡。岂取之易而守之难乎？昔取之而有余，今守之而不足，何也？夫在殷忧，必竭诚以待下；既得志，则纵情以傲物。竭诚则吴越为一体，傲物则骨肉为行路。虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。怨不在大，可畏惟人；载舟覆舟，所宜深慎。奔车朽索，其可忽乎！' +
        '君人者，诚能见可欲则思知足以自戒，将有作则思知止以安人，念高危则思谦冲而自牧，惧满溢则思江海下百川，乐盘游则思三驱以为度，忧懈怠则思慎始而敬终，虑壅蔽则思虚心以纳下，想谗邪则思正身以黜恶，恩所加则思无因喜以谬赏，罚所及则思无因怒而滥刑。总此十思，弘兹九德，简能而任之，择善而从之，则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。文武争驰，在君无事，可以尽豫游之乐，可以养松乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第4篇',
      highlights: [{ type: '名句', text: '求木之长者，必固其根本；欲流之远者，必浚其泉源。' }, { type: '名句', text: '载舟覆舟，所宜深慎。' }, { type: '易错字', text: '浚 殷忧 傲物 董之 壅蔽 黜恶 谬赏 垂拱' }],
      variants: [{ label: '版本差异', text: '“德不厚而思国之理”部分版本作“德不厚而思国之安”。' }],
      tags: ['奏疏'],
      translation: [
        '我听说想要树木生长得高，一定要稳固它的根；想要水流得远，一定要疏通它的源头；想要国家安定，一定要积累德行和道义。',
        '源头不深却希望水流得远，根不牢固却要求树木生长，德行不深厚却想要国家治理好，我虽然愚笨，也知道这是不可能的，何况明智的人呢！',
        '国君掌握着国家的重要权力，处在天地间重要的地位，就要推崇皇权的高峻，永远保住无穷的福禄。',
        '不考虑处在安乐中要想到危险，用节俭来戒除奢侈，德行不能保持深厚，情感不能战胜欲望，这也就像砍断树根却要求树木茂盛、堵塞源头却希望水流长远一样。',
        '所有的君主，承受上天的大命，没有谁不是在深重忧患中德行显著，而功业建成后德行就衰退了。',
        '有好的开端的人实在很多，能够坚持到底的人却大概很少。',
        '难道是取得天下容易而守住天下困难吗？',
        '过去取得天下时力量有余，如今守住天下却力量不足，这是为什么呢？',
        '处在深重忧患中时，一定竭尽诚意来对待下属；一旦得志，就放纵性情傲视他人。',
        '竭尽诚意，那么吴国和越国也能结成一个整体；傲视他人，那么亲骨肉也会变成陌路人。',
        '即使用严酷的刑罚督察他们，用威严的怒斥震慑他们，最终也只是苟且免于刑罚却不怀念仁德，表面恭敬而内心不服。',
        '怨恨不在于大小，可怕的是民心；百姓像水一样能载船也能翻船，这是应当深切谨慎对待的。',
        '用腐朽的绳索驾驭奔驰的车马，怎么可以疏忽大意呢！',
        '统治百姓的人，如果真的能够做到：看见能引起爱好的东西，就想到知足来自我警戒；将要有所兴建，就想到适可而止来使百姓安定；想到地位高而危险，就想到谦虚自守来修养自身；害怕骄傲自满，就想到江海居于百川之下；喜爱游乐打猎，就想到以一年三次为限度；担心意志懈怠，就想到善始善终；忧虑言路被堵塞蒙蔽，就想到虚心采纳下面的意见；想到谗佞邪恶的人，就想到端正自身来斥退恶人；施加恩惠，就想到不要因为高兴而错误地奖赏；施行惩罚，就想到不要因为发怒而滥用刑罚。',

    { id: 'shi-shuo-gao', title: '师说', author: '韩愈', dynasty: '唐', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。' +
        '嗟乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎？爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰：“彼与彼年相若也，道相似也。位卑则足羞，官盛则近谀。”呜呼！师道之不复可知矣。巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！' +
        '圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒，其贤不及孔子。孔子曰：三人行，则必有我师。是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。' +
        '李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。',

    { id: 'e-pang-gong-fu', title: '阿房宫赋', author: '杜牧', dynasty: '唐', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '六王毕，四海一。蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。' +
        '妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦，朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不见者，三十六年。燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。' +

        '呜呼！灭六国者六国也，非秦也；族秦者秦也，非天下也。嗟夫！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第6篇',
      highlights: [{ type: '名句', text: '使天下之人，不敢言而敢怒。' }, { type: '名句', text: '秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。' }, { type: '易错字', text: '兀 缦回 囷囷 蜂房水涡 妃嫔媵嫱 辇 辘辘 逦迤 锱铢 庾 呕哑' }],
      tags: ['赋'],
      translation: [
        '六国灭亡了，天下统一了。',

        '像明星闪亮，是她们打开了梳妆镜；像乌云纷扰，是她们早晨在梳头；渭水浮起一层油脂，是她们倒掉的胭脂水；烟雾弥漫，是她们在焚烧椒兰香料。',

      ],
      summary: '本文铺写阿房宫的宏伟与秦宫生活的奢靡，指出秦统治者穷奢极欲、不爱惜民力，最终导致灭亡。作者借古讽今，指出六国与秦灭亡都在于自身，希望当世统治者引以为鉴，戒除骄奢、爱惜百姓。',
      examFocus: [

    { id: 'liu-guo-lun', title: '六国论', author: '苏洵', dynasty: '北宋', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧。盖失强援，不能独完。故曰：弊在赂秦也。' +
        '秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”此言得之。' +
        '齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。' +
        '呜呼！以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！' +
        '夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第7篇',
      highlights: [{ type: '名句', text: '六国破灭，非兵不利，战不善，弊在赂秦。' }, { type: '名句', text: '为国者无使为积威之所劫哉！' }, { type: '易错字', text: '赂秦 厥先祖父 暴霜露 草芥 与嬴 洎牧 革灭殆尽 积威' }],
      tags: ['论'],
      translation: [
        '六国的灭亡，不是武器不锋利，仗打得不好，弊病在于贿赂秦国。',
        '贿赂秦国就使国力亏损，这是灭亡的原因啊。',
        '有人说：六国相继灭亡，都是因为贿赂秦国吗？',

    { id: 'da-si-ma-jian-yi-shu', title: '答司马谏议书', author: '王安石', dynasty: '北宋', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。' +
        '盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。' +
        '人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已。盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。' +
        '无由会晤，不任区区向往之至！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第8篇',
      highlights: [{ type: '名句', text: '至于怨诽之多，则固前知其如此也。' }, { type: '易错字', text: '强聒 卤莽 壬人 汹汹然 盘庚 胥怨 膏泽' }],
      tags: ['书信'],
      translation: [
        '我启禀：昨天承蒙您来信指教，我私下认为与您交好的日子很久，可是议事常常意见不合，因为所持主张大多不同。',
        '虽然想勉强多说，最终一定得不到您的谅解，所以只简略地回信，不再一条条为自己辩解。',
        '又想到承蒙您厚待，回信不应该鲁莽草率，所以如今详细说明原因，希望您或许能宽恕我。',
        '大概读书人所争论的，尤其在于名义和实际是否相符，名义和实际弄明白了，天下的道理也就清楚了。',
        '如今您指教我的，是认为我侵犯官员职权、惹事生非、搜刮钱财、拒绝劝谏，因而招来怨谤。',
        '我认为受命于君主，议订法令并在朝廷修改，交给有关部门执行，不算侵犯职权；施行先王政令，兴利除弊，不算惹事生非；替天下理财，不算搜刮钱财；驳斥错误言论和巧言谄媚之人，不算拒绝劝谏。',
        '至于怨恨诽谤很多，那是我本来就预料到它会这样的。',
        '人们习惯于得过且过已不是一天了，士大夫大多把不顾国事、附和世俗、讨好众人当作好事，皇上却想改变这种风气，我不估量反对者的多少，想出力帮皇上抵抗他们，众人怎么会不吵嚷反对呢？',
        '盘庚迁都的时候，埋怨他的是百姓，不只是朝廷里的士大夫罢了。',
        '盘庚不因为有人埋怨就改变自己的计划，他考虑到这样做合乎道义然后才行动，认为做得对，看不出有什么可后悔的缘故。',
        '如果您责备我身居高位时间很久，没能帮助皇上有大的作为，使这些百姓得到恩惠，那么我承认有罪；如果说如今应当什么事都不做，只守着以前的老规矩就行了，那就不是我敢领教的。',
        '没有机会见面，我内心对您不胜仰慕思念到极点！',
      ],
      summary: '这是王安石回复司马光的一封信，先辨明名实，再逐条反驳侵官、生事、征利、拒谏等指责，并以盘庚迁都为据表明自己坚持变法、不避怨谤的决心，表现了作者坚守己见、以天下为己任的政治态度。',
      examFocus: [
        { index: 3, reason: '关键论断句，提出名实之辨' },
        { index: 5, reason: '反驳的核心句，含词类活用与判断句式' },
        { index: 9, reason: '论据句，用盘庚迁都说明坚持之必要' },
        { index: 10, reason: '名句，表明坚持变法、不避怨谤的态度' },
      ] },

    { id: 'chi-bi-fu', title: '赤壁赋', author: '苏轼', dynasty: '北宋', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。' +
        '于是饮酒乐甚，扣舷而歌之。歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。' +
        '苏子愀然，正襟危坐而问客曰：“何为其然也？”客曰：“‘月明星稀，乌鹊南飞’，此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。”' +
        '苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。是造物者之无尽藏也，而吾与子之所共适。”' +
        '客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第9篇',
      highlights: [{ type: '名句', text: '寄蜉蝣于天地，渺沧海之一粟。' }, { type: '名句', text: '惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色。' }, { type: '易错字', text: '属客 窈窕 冯虚御风 桂棹 溯流光 嫠妇 愀然 相缪 舳舻 酾酒 横槊 匏樽 蜉蝣 枕藉' }],
      variants: [{ label: '版本差异', text: '“杯盘狼籍”部分版本作“杯盘狼藉”。' }],
      tags: ['赋'],
      translation: [
        '壬戌年秋天，七月十六日，我和客人乘船在赤壁之下游玩。',
        '清风缓缓吹来，水面不起波澜。',
        '我举起酒杯劝客人饮酒，吟诵明月之诗，歌唱窈窕这一章。',
        '不多时，月亮从东山上升起，在斗宿和牛宿之间徘徊。',
        '白茫茫的水气横贯江面，水光与天光相接。',
        '任凭这一片苇叶似的小船随意漂流，越过茫茫万顷的江面。',
        '浩浩荡荡如同凌空驾风，却不知道将停在哪里；飘飘然如同脱离人世独立，长出翅膀登上仙境。',
        '于是饮酒极其快乐，敲着船舷唱起歌来。',
        '歌中唱道：桂木的棹啊兰木的桨，划开清澈的江水啊逆着流动的月光而上。我的情怀多么悠远啊，望着天边的美人。',
        '客人中有会吹洞箫的，依着歌声应和。',
        '那箫声呜呜地响，像是怨恨又像是思慕，像是哭泣又像是倾诉，余音婉转悠长，像细丝一样连续不断。',
        '能使深谷中的蛟龙起舞，使孤舟中的寡妇哭泣。',
        '我神色凄然，整理衣襟端坐，问客人说：为什么箫声这样悲凉呢？',
        '客人说：月明星稀，乌鹊南飞，这不是曹操的诗吗？向西望是夏口，向东望是武昌，山水盘绕，草木茂盛，这不是曹操被周瑜围困的地方吗？',
      ],
      summary: '本文写苏轼与客夜游赤壁，借主客问答由眼前江水明月悟出变与不变的哲理，以江上清风、山间明月为无尽之藏，消解了人生短暂渺小的悲哀，表现出作者旷达超脱、随缘自适的人生态度。',
      examFocus: [
        { index: 1, reason: '写景名句，默写常考' },
        { index: 4, reason: '名句，易错字密集' },
        { index: 6, reason: '名句，含通假字，默写常考' },
        { index: 9, reason: '名句，写箫声，默写常考' },
        { index: 10, reason: '名句，含使动用法，常见翻译题' },
        { index: 11, reason: '全篇说理核心句，含词类活用，翻译常考' },
        { index: 12, reason: '结句，默写常考' },
      ] },

    { id: 'xiang-ji-xuan-zhi', title: '项脊轩志', author: '归有光', dynasty: '明', stage: '高中', grade: '必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。' +
        '然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是。东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰：“某所，而母立于兹。”妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”语未毕，余泣，妪亦泣。余自束发读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”瞻顾遗迹，如在昨日，令人长号不自禁。' +
        '轩东故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。' +
        '余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。' +
        '庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·必修第10篇',
      highlights: [{ type: '名句', text: '庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。' }, { type: '易错字', text: '渗漉 修葺 栏楯 偃仰 斑驳 异爨 逾庖 老妪 先妣 呱呱 象笏 扃牖 枇杷' }],
      tags: ['志'],
      translation: [
        '项脊轩，就是原来的南阁子。',
        '屋子只有一丈见方，可以容纳一个人居住。',
        '这是间百年的老屋，灰尘泥土从上面漏下来，雨水往下流；每次移动书桌，环顾四周都没有可以放置的地方。',
        '屋子又朝北，得不到阳光，太阳过了中午屋里就昏暗了。',
        '我略微修补了一下，使它上面不再漏雨。',
        '在前面开了四扇窗子，围着院子砌上墙，用来挡住南边的阳光，日光反射过来，屋里才明亮起来。',
        '又在院子里错杂地种上兰花、桂树、竹子等花木，从前的栏杆也因此增添了光彩。',
        '借来的书堆满书架，我仰卧起坐、长啸高歌，静静地独自端坐，各种声音都能听到；而庭院台阶一片寂静，小鸟时常来啄食，人到了也不飞走。',

    { id: 'zi-lu-zeng-xi-ran-you-gong-xi-hua', title: '子路、曾皙、冉有、公西华侍坐', author: '《论语》', dynasty: '先秦', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '子路、曾皙、冉有、公西华侍坐。子曰：“以吾一日长乎尔，毋吾以也。居则曰：‘不吾知也。’如或知尔，则何以哉？”' +
        '子路率尔而对曰：“千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比及三年，可使有勇，且知方也。”夫子哂之。' +
        '“求，尔何如？”对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟君子。”' +
        '“赤，尔何如？”对曰：“非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。”' +
        '“点，尔何如？”鼓瑟希，铿尔，舍瑟而作，对曰：“异乎三子者之撰。”子曰：“何伤乎？亦各言其志也。”曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。”夫子喟然叹曰：“吾与点也！”' +
        '三子者出，曾皙后。曾皙曰：“夫三子者之言何如？”子曰：“亦各言其志也已矣。”曰：“夫子何哂由也？”曰：“为国以礼，其言不让，是故哂之。”“唯求则非邦也与？”“安见方六七十如五六十而非邦也者？”“唯赤则非邦也与？”“宗庙会同，非诸侯而何？赤也为之小，孰能为之大？”',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第1篇',
      highlights: [{ type: '名句', text: '莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。' }, { type: '易错字', text: '毋吾以也 率尔 饥馑 哂之 俟君子 端章甫 鼓瑟希 铿尔 舍瑟而作 舞雩 喟然' }],

        '孔子问：冉求，你怎么样？冉有回答说：纵横六七十里或者五六十里的地方，让我来治理，等到三年，可以使百姓富足。至于礼乐教化，那就要等待君子来做了。孔子问：公西赤，你怎么样？公西华回答说：我不敢说能做到，但愿意学习。祭祀宗庙的事，或者诸侯会盟的事，我愿意穿着礼服、戴着礼帽，做一个小小的司仪。孔子问：曾点，你怎么样？弹瑟的声音渐渐稀疏，铿的一声停下来，曾皙放下瑟站起身，回答说：我的志向和他们三位所说的不同。孔子说：有什么妨害呢？也不过是各人说说自己的志向罢了。曾皙说：暮春三月，春天的衣服已经穿上了，我和五六个成年人、六七个少年，在沂水里洗澡，在舞雩台上吹风，一路唱着歌回来。孔子长叹一声说：我赞同曾点的想法！那三个人出去了，曾皙留在后面。',
        '曾皙问：那三位同学的话怎么样？孔子说：也不过是各人说说自己的志向罢了。曾皙问：您为什么笑仲由呢？孔子说：治理国家要用礼，他的话却不谦让，所以我笑他。曾皙问：那么冉求讲的就不是治理国家的事吗？孔子说：怎么见得纵横六七十里或者五六十里的地方就不是国家呢？曾皙问：那么公西赤讲的就不是治理国家的事吗？孔子说：有宗庙祭祀、诸侯会盟，不是诸侯的事又是什么呢？如果公西赤只能做小事，谁又能做大司仪呢？',

    { id: 'bao-ren-an-shu-gao', title: '报任安书（节选）', author: '司马迁', dynasty: '西汉', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》；左丘失明，厥有《国语》；孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》；韩非囚秦，《说难》《孤愤》；《诗》三百篇，大底圣贤发愤之所为作也。此人皆意有所郁结，不得通其道，故述往事、思来者。乃如左丘无目，孙子断足，终不可用，退而论书策，以舒其愤，思垂空文以自见。' +

      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第2篇（课标指定节选）',
      highlights: [{ type: '名句', text: '亦欲以究天人之际，通古今之变，成一家之言。' }, { type: '名句', text: '文王拘而演《周易》；仲尼厄而作《春秋》。' }, { type: '易错字', text: '摩灭 倜傥 膑脚 大底 稽其成败 轩辕 愠色 通邑大都 万被戮' }],

        '这些人心意郁结，无法实现自己的主张，所以追述往事，期望后来的人。',

        '我不自量力，近年用拙劣文辞，收集天下散失旧闻，考察史事始末，考查成败兴亡的规律，上从黄帝，下到现在，为十表、十二本纪、八书、三十世家、七十列传，共一百三十篇。',

    { id: 'guo-qin-lun-shang', title: '过秦论（上）', author: '贾谊', dynasty: '西汉', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具，外连衡而斗诸侯。于是秦人拱手而取西河之外。' +
        '孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。于是六国之士，有宁越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之众，叩关而攻秦。秦人开关延敌，九国之师，逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。延及孝文王、庄襄王，享国之日浅，国家无事。' +
        '及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。' +
        '始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。' +
        '且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄櫌棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及乡时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第3篇',
      highlights: [{ type: '名句', text: '振长策而御宇内，吞二周而亡诸侯。' }, { type: '名句', text: '仁义不施而攻守之势异也。' }, { type: '易错字', text: '崤函 膏腴 合从缔交 逡巡 遗镞 漂橹 隳名城 销锋镝 瓮牖绳枢 氓隶 锄櫌棘矜 度长絜大' }],
      tags: ['论'],
      translation: [
        '秦孝公占据崤山、函谷关的险固地势，拥有雍州的土地，君臣固守，窥视周朝政权，怀有席卷天下、吞并宇内、囊括四海、并吞八方的野心。',
        '在这个时候，商鞅辅佐他，对内确立法令制度，致力于耕作纺织，修造防守和进攻的器械，对外实行连衡的策略，使诸侯之间互相争斗。',
        '于是秦国人毫不费力地取得了西河以外的土地。',
        '秦孝公死后，惠文王、武王、昭襄王承接了先王的基业，沿袭前代的策略，向南夺取汉中，向西攻取巴、蜀，向东割占肥沃的土地，向北收取地势险要的郡县。',
        '诸侯们十分害怕，聚会结盟商议削弱秦国，不吝惜珍贵的器物、贵重的财宝和肥沃富饶的土地，用来招纳天下的贤士，采用合从的策略缔结盟约，彼此结为一体。',
        '在这个时候，齐国有孟尝君，赵国有平原君，楚国有春申君，魏国有信陵君。',
        '这四位公子都明智忠信，宽厚爱人，尊贤重士，相约合从，拆散秦国的连衡，聚集了韩、魏、燕、楚、齐、赵、宋、卫、中山等国的人众。',
        '于是六国士人，宁越、徐尚、苏秦、杜赫为之谋划，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅沟通意见，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢统率军队。',
        '他们曾经用十倍于秦国的土地、上百万的军队，攻打函谷关进攻秦国。',
        '秦国人打开关门迎击敌人，九国的军队却犹豫退缩，不敢前进。',
        '秦国没有耗费一支箭、一个箭头，天下的诸侯就已经困顿了。',
        '于是合从的盟约解散，盟约被破坏，诸侯们争着割让土地来贿赂秦国。',
        '秦国有余力利用他们的弱点，追赶逃亡的败兵，横尸上百万，流的血能漂起大盾；趁着有利的形势，宰割天下，分裂山河。',
        '强国请求归顺，弱国前来朝见。',
        '延续到孝文王、庄襄王，他们在位的时间很短，国家没有发生大事。',
        '到了秦始皇，他发扬六代君主遗留的功业，像挥动长鞭一样驾驭天下，吞并东西二周、灭亡诸侯，登上至尊皇位统治天下，用严酷刑罚奴役百姓，威震四海。',
        '向南夺取百越一带的土地，把它设置为桂林郡、象郡；百越的首领低着头，颈上系着绳子投降，把自己的性命交给秦朝的下级官吏。',
        '于是派蒙恬向北修筑长城，守卫边疆，击退匈奴七百多里；胡人不敢向南下来放牧，勇士不敢拉弓射箭来报仇。',
        '于是废除先王的制度，焚烧诸子百家的著作，用来愚弄百姓；毁坏名城，杀害豪杰；收缴天下的兵器，聚集到咸阳，熔化刀箭，铸成十二个铜人，用来削弱天下的百姓。',
        '然后凭借华山作为城墙，依靠黄河作为护城河，占据高耸的城防，面临深不可测的深渊，把这当作坚固的屏障。',
        '良将拿着强弩守卫要害的地方，忠诚的大臣和精锐的士兵摆开锋利的武器盘问来往的人。',
        '天下已经安定，秦始皇的心里，自认为关中的坚固、千里的金城，是子孙称帝称王万世不朽的基业。',
        '秦始皇死后，他留下的威势还震慑着边远地区。',
        '陈涉不过是穷人家子，戍边的役夫；才能不如常人，没有仲尼、墨翟的贤德；置身戍卒之中，从田野间兴起，率几百疲兵攻秦；砍木为兵器，举竿为旗帜，天下人云集响应随他。',
        '崤山以东的豪杰于是一同起兵，灭亡了秦朝。',
        '况且天下并没有变小变弱，雍州的土地、崤山函谷关的险固，还是跟从前一样。',
        '陈涉的地位，不比齐、楚、燕、赵、韩、魏、宋、卫、中山的国君尊贵；锄头木棍，不比钩戟长矛锋利；戍边人众，不比九国军队强大；谋略和用兵才能，比不上先前六国的人士。',
        '然而成功与失败发生了变化，功业完全相反，这是为什么呢？',
        '假使让崤山以东的六国跟陈涉比一比长短大小，衡量一下权势和实力，那就不能相提并论了。',
        '然而秦以狭小之地，发展到万乘之势，使八州诸侯排列有序、同列来朝，已有一百多年；以天下为家，以崤山函谷关为宫墙；平民发难，宗庙被毁，自己被杀，为天下耻笑，为什么？',
        '因为不施行仁义，进攻和防守的形势也就不同了。',
      ],
      summary: '本文叙述秦由崛起、强盛到速亡的全过程，以六国与陈涉对比，指出秦亡不在兵力地势，而在不施仁义。文章借古讽今，意在告诫汉初统治者吸取秦亡教训，施行仁政。',
      examFocus: [
        { index: 0, reason: '名句，含席卷、包举等词类活用与排比' },
        { index: 15, reason: '名句，含振长策、履至尊等常考词语' },
        { index: 17, reason: '含却、愚等使动用法，常见翻译题' },
        { index: 21, reason: '名句，含瓮牖绳枢与名词作状语' },
        { index: 26, reason: '对比设问句，为下文点明主旨作势' },
        { index: 30, reason: '中心论点句，揭示秦亡原因' },
      ] },

    { id: 'li-yun-jie-xuan', title: '礼运（节选）', author: '《礼记》', dynasty: '先秦', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第4篇（课标指定节选：大道之行也……是谓大同）',
      highlights: [{ type: '名句', text: '大道之行也，天下为公。' }, { type: '易错字', text: '选贤与能 矜 男有分 货恶' }],
      notes: '同一段文字在统编初中教材中以《大道之行也》出现，高中课标将《礼运》列入选择性必修。',
      tags: ['礼记'],
      translation: [
        '在大道施行的时候，天下是天下人共有的。',
        '选拔贤能的人，推举有才能的人，讲求诚信，培养和睦。',
        '所以人们不只是敬爱自己的父母，不只是慈爱自己的子女，要使老人安享晚年，壮年人发挥才干，幼年人顺利成长，孤苦残疾的人都得到供养，男子有职业，女子有归宿。',
        '对于财物，人们恨它被丢弃在地上，但不一定藏在自己家里；对于力气，人们恨它不从自己身上使出来，但不一定是为了自己。',
        '因此奸邪的阴谋被堵塞而不能兴起，盗窃、造反和害人的事不会发生，所以大门都不用关上。',
        '这就叫做大同。',
      ],
      summary: '本文描绘天下为公的大同社会：选贤任能、讲信修睦，人人各得其所、各尽其力，路不拾遗、门户不闭。文章表达儒家对公平和谐理想社会的向往，是礼运思想的集中体现。',
      examFocus: [
        { index: 0, reason: '全文总纲句，大同社会的根本原则' },
        { index: 1, reason: '纲领句，含与、睦等通假字与易错字' },
        { index: 2, reason: '名句，含亲其亲等词类活用与易错字' },
        { index: 5, reason: '总结句，点明大同的含义' },
      ] },

    { id: 'chen-qing-biao', title: '陈情表', author: '李密', dynasty: '西晋', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。' +
        '逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当侍东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢。郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许：臣之进退，实为狼狈。' +
        '伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少仕伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。母、孙二人，更相为命，是以区区不能废远。' +
        '臣密今年四十有四，祖母今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土实所共鉴。愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第5篇',
      highlights: [{ type: '名句', text: '臣无祖母，无以至今日；祖母无臣，无以终余年。' }, { type: '名句', text: '茕茕孑立，形影相吊。' }, { type: '易错字', text: '险衅 闵凶 愍臣 门衰祚薄 期功强近 茕茕孑立 床蓐 逋慢 陨首 矜愍 结草' }],
      tags: ['表'],
      translation: [
        '臣李密上言：我因为命运坎坷，早年就遭遇忧患凶丧之事。',
        '我出生才六个月，慈爱的父亲就去世了；长到四岁，舅舅逼迫母亲改嫁。',
        '祖母刘氏怜悯我孤单弱小，亲自抚养我。',
        '我小时候多病，九岁还不会走路，孤苦伶仃，直到长大成人。',
        '既没有伯父叔父，又始终没有兄弟，门庭衰微福分浅薄，很晚才有儿子。',
        '外面没有关系较近的亲戚，家里没有照应门户的童仆，孤单无依地独自生活，只有身形和影子相互安慰。',
        '而刘氏一向疾病缠身，常常卧床不起，我侍奉她喝水吃药，从未停止、离开过。',
        '等到晋朝建立，我蒙受着清明的教化。',
        '先前太守逵考察推举我为孝廉，后来刺史荣又推举我为秀才。',
        '我因为供养祖母的事无人承担，就辞谢没有接受任命。',
        '皇上下诏书特地下来，任命我为郎中，不久又蒙受国家恩典，任命我为太子洗马。',
        '我凭借卑微低贱的身份，担当侍奉太子的职务，这不是我杀身所能报答的。',
        '我把自己的苦衷全都写在表章里禀告，辞谢不去就职。',
        '皇上的诏书急切严厉，责备我逃避命令、怠慢不敬。',
        '郡县长官逼迫我，催我上路；州官上门催促，比流星的火光还急。',
        '我想奉诏为皇上奔走效劳，但刘氏的病一天比一天重；想暂且迁就私情，可申诉又不被允许：我的处境实在进退两难。',
        '我想圣朝用孝道治理天下，凡是年老的人尚且受到怜悯养育，何况我孤单困苦，情况更为严重。',
        '况且我年轻时曾在蜀汉做官，历任郎官职务，本来就希图仕途显达，并不顾惜名声节操。',
        '如今我是亡国的卑贱俘虏，极其卑微浅陋，却受到过分的提拔，恩宠优厚，怎敢犹豫不决，另有企求。',
        '只是祖母刘氏已像西山的落日，气息微弱，生命危险，早上都难保晚上。',
        '我没有祖母，就无法活到今天；祖母没有我，就无法度过余下的岁月。',
        '我们祖孙二人，相依为命，因此我的一点私心使我不能停止奉养而远离她。',
        '我李密今年四十四岁，祖母今年九十六岁，这样我向陛下尽忠的日子还长，报答奉养祖母的日子却短。',
        '我怀着乌鸦反哺般的私情，请求允许我为祖母养老送终。',
        '我的苦衷，不只是蜀地人士和两州长官了解得清楚，天地神明实在也都明察。',
        '希望陛下怜悯我愚拙的诚心，准许我微小的心愿，或许祖母能侥幸保全，安然度过余生。',
        '我活着应当为国献身，死了也要像结草人那样报恩。',
        '我怀着犬马般惶恐惧怕的心情，恭敬地呈上这份表章来禀告陛下。',
      ],
      summary: '本文是李密呈给晋武帝的表文，陈述自己孤苦的身世与祖孙相依为命的处境，说明忠孝难以两全。文章以孝为立身之本，恳请暂缓赴任、留家奉养祖母，情辞恳切，终获朝廷体谅。',
      examFocus: [
        { index: 5, reason: '名句，含茕茕孑立等易错字' },
        { index: 15, reason: '含告诉、狼狈等古今异义，写进退两难' },
        { index: 20, reason: '名句，含日薄西山、气息奄奄等成语' },
        { index: 21, reason: '主旨句，祖孙相依为命不能废远' },
        { index: 23, reason: '以尽节之日长与报养之日短对比说理' },
        { index: 27, reason: '名句，誓以生死报恩，归结全文主旨' },
      ] },

    { id: 'gui-qu-lai-xi-ci', title: '归去来兮辞（并序）', author: '陶潜', dynasty: '东晋', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '【序】余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有归欤之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。' +
        '【辞】归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。' +
        '归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓而始流。善万物之得时，感吾生之行休。' +
        '已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流而赋诗。聊乘化以归尽，乐夫天命复奚疑！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第6篇',
      highlights: [{ type: '名句', text: '悟已往之不谏，知来者之可追。' }, { type: '名句', text: '云无心以出岫，鸟倦飞而知还。' }, { type: '易错字', text: '瓶无储粟 眷然 矫厉 一稔 敛裳宵逝 轻飏 熹微 眄庭柯 出岫 翳翳 耘耔 东皋' }],
      tags: ['辞'],
      translation: [
        '【序】我家境贫困，种田耕植不足以维持自己的生活。',
        '孩子满屋，米缸里没有存粮，维持生计所依靠的办法，我还没有找到。',
        '亲戚朋友大多劝我去做官，我心里也忽然有了这个念头，可是寻求门路没有途径。',
        '恰好遇到有出使外地的事情，地方长官把爱惜人才当作美德，叔父因为我贫苦，我就被任用在一个小县做官。',
        '那时战乱的风波还没有平息，我心里害怕到远处服役，彭泽县离我家只有一百里，公田的收益足够用来酿酒。',

        '终于望见了自己的家门，我一边高兴一边奔跑。',

        '每天到园中散步成了乐趣，园门虽然设置着却常常关闭。',
        '我拄着手杖走走歇歇，常常抬起头来向远处眺望。',
        '云彩无意中从山穴里飘出来，鸟儿飞倦了就知道回巢。',

        '为什么心神不定地想到哪里去呢？',
        '富贵不是我的心愿，仙境也不可期望。',

      ],
      summary: '本文写陶潜辞去彭泽令、归隐田园的经过与心境，描写归家之乐与田园山水之美，表明不愿违心从仕。文章表达对官场的厌弃、对田园自由生活的热爱和乐天知命的人生态度。',

    { id: 'zhong-shu-guo-tuo-tuo-zhuan', title: '种树郭橐驼传', author: '柳宗元', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。驼闻之曰：“甚善，名我固当。”因舍其名，亦自谓“橐驼”云。' +
        '其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活；且硕茂，早实以蕃。他植者虽窥伺效慕，莫能如也。' +
        '有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然。根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤。旦视而暮抚，已去而复顾。甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之；故不我若也。吾又何能为哉！”' +
        '问者曰：“以子之道，移之官理，可乎？”驼曰：“我知种树而已，官理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？”' +
        '问者曰：“嘻，不亦善夫！吾问养树，得养人术。”传其事以为官戒也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第7篇',
      highlights: [{ type: '名句', text: '能顺木之天，以致其性焉尔。' }, { type: '易错字', text: '橐驼 病偻 隆然 蕃 孳 莳 长人者 勖尔植 缫而绪 辍飧饔' }],
      tags: ['传'],
      translation: [
        '郭橐驼，不知道他起初叫什么名字。',
        '他患了脊背弯曲的病，背部高高隆起，弯着腰走路，有点像骆驼的样子，所以乡里人给他起个外号叫“驼”。',
        '橐驼听到这个外号说：“很好，这样称呼我确实恰当。”于是他舍弃了原来的名字，也自称起“橐驼”来。',
        '他的家乡叫丰乐乡，在长安城西边。',
        '橐驼以种树为职业，凡是长安城里经营园林观赏游览的富豪以及做水果买卖的人，都争着把他迎接到家里供养。',
        '看橐驼所种的树，有的移植过来，没有不成活的；而且长得高大茂盛，结果早而且多。',
        '其他种树的人虽然暗中观察、羡慕效仿，也没有人能比得上他。',
        '有人问他种树的诀窍，他回答说：“我橐驼并不能使树木活得长久而且繁殖得快，只是能顺应树木生长的自然规律，让它的本性得到充分发展罢了。大凡种树的方法，它的根要舒展，培土要均匀，土要是原来的，捣土要细密。这样做了以后，不要再去动它，不要担心它，离开后就不再回头看。栽种的时候像对待孩子一样细心，栽好后放在一边像丢弃一样，那么树木生长的自然本性就能保全，它的天性就能得到了。所以我只是不妨害它的生长罢了，并没有什么能使它高大茂盛的特殊本领；只是不抑制损耗它的果实罢了，并没有什么能使它结果早而且多的窍门。别的种树人却不是这样。他们让树根拳曲着又换了新土，培土的时候，不是过多就是不足。即使有人能够不这样做，却又对树爱得太深，担心得太多。早晨去看，晚上去摸，已经离开了又回头看看。更严重的，用指甲划破树皮来检验它是活是死，摇晃树根来查看土的松紧，这样树木的本性就一天天丧失了。虽然说是爱它，其实是害它；虽然说是担心它，其实是仇视它；所以他们种树都比不上我。我又有什么本领呢！”问他的人说：“把你种树的道理，移到做官治理百姓上，可以吗？”橐驼说：“我只知道种树罢了，治理百姓不是我的本行。不过我住在乡里，看见做官的人喜欢频繁地发布命令，好像很怜爱百姓，结果却因此给百姓带来灾祸。早晚差役跑来喊道：‘官府命令催促你们耕种，勉励你们种植，督促你们收获，早些煮茧抽丝，早些纺线织布，养育好你们的小孩，喂大你们的鸡和猪。’他们敲鼓把大家集合起来，敲梆子把大家召来。我们小百姓停下吃饭来慰劳差役，尚且没有空闲，又怎么能使我们人口兴旺、生活安定呢？所以我们既困苦又疲乏。像这样，那么和我种树的道理大概也有相似之处吧？”问他的人说：“哈哈，这不是很好吗！我问种树的方法，却得到了养民的办法。”我记下这件事，把它作为做官的鉴戒。',
      ],
      summary: '本文借郭橐驼种树顺应天性而树无不活的经验，对比他植者爱护太恩、忧之太勤反而害树，说明为官治民也应顺应百姓本性、不可政令烦苛。文章以养树之道喻养人之术，意在告诫官吏不要扰民。',
      examFocus: [
        { index: 5, reason: '名句，以他植者之失反衬顺天致性之理' },
        { index: 6, reason: '名句，顺木之天以致其性为全文要领' },
        { index: 7, reason: '总结句，点明写作意图在于官戒' },
      ] },

    { id: 'wu-dai-shi-ling-guan-zhuan-xu', title: '五代史伶官传序', author: '欧阳修', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。' +
        '世言晋王之将终也，以三矢赐庄宗而告之曰：“梁，吾仇也；燕王，吾所立，契丹与吾约为兄弟，而皆背晋以归梁。此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！”庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。' +
        '方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归，至于誓天断发，泣下沾襟，何其衰也！岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？' +
        '《书》曰：“满招损，谦得益。”忧劳可以兴国，逸豫可以亡身，自然之理也。' +
        '故方其盛也，举天下之豪杰，莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第8篇',
      highlights: [{ type: '名句', text: '忧劳可以兴国，逸豫可以亡身。' }, { type: '名句', text: '夫祸患常积于忽微，而智勇多困于所溺。' }, { type: '易错字', text: '三矢 少牢 锦囊 系燕父子以组 仇雠 誓天断发 逸豫 忽微 所溺' }],
      variants: [{ label: '版本差异', text: '《古文观止》本无“岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？”两句，且“满招损，谦得益”作“满招损，谦受益”，篇末多“作《伶官传》”一句。' }],
      tags: ['序'],
      translation: [
        '唉！',
        '国家兴盛衰亡的道理，虽然说是天命，难道不是人的作为吗！',
        '推究庄宗得到天下的原因，以及他失去天下的原因，就可以知道了。',
        '世人传说晋王临死的时候，把三支箭赐给庄宗并告诉他说：“梁国是我的仇敌；燕王是我扶立的，契丹同我约为兄弟，可是他们都背叛晋国而归附梁国。这三件事，是我的遗恨。给你三支箭，你可不要忘记你父亲的志向！”庄宗接过箭，把它们收藏在宗庙里。',
        '此后出兵作战，就派属官用猪羊祭告宗庙，取出那些箭，装在锦缎袋子里，背着它走在队伍前面，等到胜利归来再把箭放回宗庙。',
        '当他用绳索捆绑燕王父子，用木匣装着梁国君臣的头颅，进入太庙，把箭还给先王，并把成功的消息禀告先王时，他意气旺盛，可以说很雄壮啊！',
        '等到仇敌已经消灭，天下已经平定，一个人在夜里呼喊，作乱的人四方响应，他匆忙向东逃出，还没见到叛军而士兵已经离散，君臣相对而视，不知该回到哪里去，以至于对天发誓，剪断头发，眼泪沾湿了衣襟，多么衰败啊！',
        '难道是取得天下艰难而失去天下容易吗？',
        '还是推究他成功与失败的事迹，都出于人为呢？',
        '《尚书》说：“自满招来损害，谦虚得到益处。”忧患勤劳可以使国家兴盛，安闲享乐可以使自身灭亡，这是自然的道理。',
        '所以当他在兴盛的时候，全天下的豪杰没有谁能同他争锋；等到他衰败的时候，几十个伶人围困他，就使他身死国灭，被天下人耻笑。',
        '祸患常常从细微的事情中积累起来，聪明勇敢的人往往被自己溺爱的事物所困扰，难道只是伶人吗！',
      ],
      summary: '本文就后唐庄宗得天下又失天下的史实发论，指出盛衰成败取决于人事而非天命。文章以忧劳兴国、逸豫亡身告诫北宋统治者吸取教训，居安思危，防微杜渐。',
      examFocus: [
        { index: 1, reason: '中心论点句，提出盛衰由人事' },
        { index: 9, reason: '名句，忧劳兴国、逸豫亡身为议论点睛' },
        { index: 10, reason: '对比句，概括庄宗盛衰，论证主旨' },
        { index: 11, reason: '名句，含忽微、所溺等常考词语' },
      ] },

    { id: 'shi-zhong-shan-ji', title: '石钟山记', author: '苏轼', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '《水经》云：“彭蠡之口有石钟山焉。”郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？' +
        '元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至暮夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵淡澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。因笑谓迈曰：“汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！”' +

      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选择性必修第9篇',

        '我正心里惊惧想要回去，这时水面上发出巨大的声音，噌吰作响像钟鼓声连续不断。',

        '郦道元所看到听到的，大概和我相同，但说得不详细；士大夫们始终不肯坐小船在夜里停泊在绝壁下面，所以没有人能知道；而渔夫船工虽然知道却说不出来。',

        '而浅陋的人竟然用斧头敲击来寻求答案，自以为得到了它的真相。',

    { id: 'deng-tai-shan-ji', title: '登泰山记', author: '姚鼐', dynasty: '清', stage: '高中', grade: '选择性必修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。' +
        '余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。是月丁未，与知府朱孝纯子颍由南麓登。四十五里，道皆砌石为磴，其级七千有余。泰山正南面有三谷。中谷绕泰安城下，郦道元所谓环水也。余始循以入，道少半，越中岭，复循西谷，遂至其巅。古时登山，循东谷入，道有天门。东谷者，古谓之天门溪水，余所不至也。今所经中岭及山巅崖限当道者，世皆谓之天门云。道中迷雾冰滑，磴几不可登。及既上，苍山负雪，明烛天南。望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。' +
        '戊申晦，五鼓，与子颍坐日观亭，待日出。大风扬积雪击面。亭东自足下皆云漫。稍见云中白若樗蒱数十立者，山也。极天云一线异色，须臾成五采。日上，正赤如丹，下有红光动摇承之。或曰，此东海也。回视日观以西峰，或得日或否，绛皓驳色，而皆若偻。' +

    { id: 'lao-zi-ba-zhang', title: '《老子》八章', author: '老子', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '【第八章】上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，正善治，事善能，动善时。夫唯不争，故无尤。' +
        '【第十二章】五色令人目盲，五音令人耳聋，五味令人口爽，驰骋畋猎令人心发狂，难得之货令人行妨。是以圣人为腹不为目，故去彼取此。' +
        '【第十五章】古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮若冬涉川，犹兮若畏四邻，俨兮其若客，涣兮若冰之将释，敦兮其若朴，旷兮其若谷，混兮其若浊。孰能浊以静之徐清？孰能安以动之徐生？保此道者不欲盈。夫唯不盈，故能蔽而新成。' +
        '【第二十二章】曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。是以圣人抱一为天下式。不自见，故明；不自是，故彰；不自伐，故有功；不自矜，故长。夫唯不争，故天下莫能与之争。古之所谓“曲则全”者，岂虚言哉！诚全而归之。' +
        '【第二十四章】跂者不立，跨者不行，自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行。物或恶之，故有道者不处。' +

        '【第三十三章】知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。不失其所者久，死而不亡者寿。' +
        '【第八十一章】信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。圣人不积，既以为人己愈有，既以与人己愈多。天之道，利而不害；圣人之道，为而不争。',

    { id: 'ji-shi-jiang-fa-zhuan-yu', title: '季氏将伐颛臾', author: '《论语》', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '季氏将伐颛臾。冉有、季路见于孔子曰：“季氏将有事于颛臾。”孔子曰：“求！无乃尔是过与？夫颛臾，昔者先王以为东蒙主，且在邦域之中矣，是社稷之臣也。何以伐为？”' +
        '冉有曰：“夫子欲之，吾二臣者皆不欲也。”孔子曰：“求！周任有言曰：‘陈力就列，不能者止。’危而不持，颠而不扶，则将焉用彼相矣？且尔言过矣。虎兕出于柙，龟玉毁于椟中，是谁之过与？”' +
        '冉有曰：“今夫颛臾，固而近于费。今不取，后世必为子孙忧。”孔子曰：“求！君子疾夫舍曰欲之而必为之辞。丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之。既来之，则安之。今由与求也，相夫子，远人不服而不能来也，邦分崩离析而不能守也，而谋动干戈于邦内。吾恐季孙之忧，不在颛臾，而在萧墙之内也。”',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第2篇',
      highlights: [{ type: '名句', text: '不患寡而患不均，不患贫而患不安。' }, { type: '名句', text: '既来之，则安之。' }, { type: '易错字', text: '颛臾 东蒙主 社稷 周任 虎兕出于柙 龟玉毁于椟中 萧墙' }],
      tags: ['诸子'],
      translation: [
        '季氏将要攻打颛臾。',
        '冉有、季路告诉孔子，孔子责备冉有：颛臾是先王封的东蒙主，在鲁国境内，不该攻打；冉有推说是季氏要打，孔子说治国不怕贫穷而怕不均不安，远方人不服就该修文德招来安顿，忧患在宫墙之内。',

      examFocus: [
        { index: 1, reason: '含无乃尔是过与等固定句式与反问句' },
      ] },

    { id: 'da-xue-jie-xuan', title: '大学（节选）', author: '《礼记》', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知；致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。自天子以至于庶人，壹是皆以修身为本。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第3篇（课标指定节选）',
      highlights: [{ type: '名句', text: '自天子以至于庶人，壹是皆以修身为本。' }, { type: '易错字', text: '明明德 格物 壹是' }],

      summary: '本文论述儒家修身治国的道理，指出从天子到百姓都应以修身为根本，而修身须从诚意、正心、致知、格物做起，再由身及家、由家及国，最终达到天下太平。',

    { id: 'zhong-yong-jie-xuan', title: '中庸（节选）', author: '《礼记》', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '喜怒哀乐之未发，谓之中；发而皆中节，谓之和。中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。' +
        '博学之，审问之，慎思之，明辨之，笃行之。有弗学，学之弗能，弗措也；有弗问，问之弗知，弗措也；有弗思，思之弗得，弗措也；有弗辨，辨之弗明，弗措也；有弗行，行之弗笃，弗措也。人一能之，己百之；人十能之，己千之。果能此道矣，虽愚必明，虽柔必强。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第4篇（课标指定节选）',
      highlights: [{ type: '名句', text: '博学之，审问之，慎思之，明辨之，笃行之。' }, { type: '名句', text: '人一能之，己百之；人十能之，己千之。' }, { type: '易错字', text: '中节 致中和 弗措 笃行' }],
      tags: ['礼记'],
      translation: [

        '达到中和的境界，天地就各安其位，万物就生长繁育。',
        '广泛地学习，详细地询问，谨慎地思考，清楚地辨别，切实地实行。',
        '要么不学，学了不会就不停止；要么不问，问了不懂就不停止；要么不想，想了没有心得就不停止；要么不辨，辨了不明白就不停止；要么不做，做了不踏实就不停止。',
        '别人一次就能做到的，自己就做一百次；别人十次能做的，自己就做一千次。',
        '果真能实行这个道理，即使愚笨也一定会变得聪明，即使柔弱也一定会变得坚强。',

        { index: 6, reason: '易错字密集，含虽愚必明、虽柔必强的论断' },
