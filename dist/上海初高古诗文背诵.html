/* ===== data/database.js ===== */
/* 古诗文背诵学习系统 —— 题库读取层
   把 junior.js / senior.js 的原始数组整理成统一结构，并提供查询接口。
   页面与出题逻辑只依赖这里的接口，方便以后继续扩充题库。 */
(function (global) {
  'use strict';

  var Utils = global.PoetryUtils;
  var Meta = global.PoetryMeta || { genres: [], sourceTypes: [] };
  var problems = [];
  var rawTotal = 0;

  /** 把“年级 / 课程模块”统一成数组：支持 grade 单值 + grades 多年级（如《孟子》三则） */
  function gradeList(poem) {
    var list = Utils.toArray(poem.grades)
      .filter(function (item) {
        return typeof item === 'string' && item.trim();
      })
      .map(function (item) {
        return item.trim();
      });
    if (!list.length) {
      var single = String(poem.grade || '').trim();
      if (single) list = [single];
    }
    return Utils.unique(list);
  }

  /** 查询参数既支持单个值，也支持多选数组 */
  function toList(value) {
    if (Array.isArray(value)) {
      return value.filter(function (item) {
        return typeof item === 'string' && item;
      });
    }
    return value ? [String(value)] : [];
  }

  /** 单选字段（体裁 / 来源）也支持多选：命中任意一个即可 */
  function matchesAny(value, wanted) {
    var list = toList(wanted);
    if (!list.length) return true;
    return list.indexOf(value) !== -1;
  }

  function normalize(raw, index) {
    var poem = raw && typeof raw === 'object' ? raw : {};
    var title = String(poem.title || '').trim();
    var text = String(poem.text || '').trim();
    var id = String(poem.id || '').trim() || 'poem-' + index;
    var stage = poem.stage === '高中' ? '高中' : '初中';
    var grades = gradeList(poem);

    return {
      id: id,
      title: title,
      author: String(poem.author || '佚名').trim(),
      dynasty: String(poem.dynasty || '不详').trim(),
      stage: stage,
      grade: String(poem.grade || grades.join('、') || (stage === '初中' ? '初中' : '高中')).trim(),
      grades: grades,
      genre: String(poem.genre || '其他').trim(),
      sourceType: String(poem.sourceType || '拓展').trim(),
      required: !!poem.required,
      recommended: poem.recommended !== false,
      text: text,
      source: String(poem.source || '').trim(),
      notes: String(poem.notes || '').trim(),
      highlights: Utils.toArray(poem.highlights).filter(function (item) {
        return item && typeof item.text === 'string' && item.text.trim();
      }),
      variants: Utils.toArray(poem.variants).filter(function (item) {
        return item && typeof item.text === 'string' && item.text.trim();
      }),
      tags: Utils.toArray(poem.tags).filter(function (tag) {
        return typeof tag === 'string' && tag;
      }),
      order: index,
    };
  }

  function build() {
    var rawAll = Utils.toArray(global.POETRY_JUNIOR).concat(Utils.toArray(global.POETRY_SENIOR));
    rawTotal = rawAll.length;
    var seen = Object.create(null);
    var rawSeen = Object.create(null);
    var poems = [];

    /* 原始数据层先查一遍：normalize 遇到重复 id 会自动改名以保证页面可用，
       但不能因此掩盖“题库文件里 id 真的重复了”这个错误，这里单独记录下来。 */
    rawAll.forEach(function (raw, index) {
      var rawId = String((raw && raw.id) || '').trim();
      if (!rawId) {
        problems.push('第 ' + (index + 1) + ' 条数据在原始数据层缺少 id。');
        return;
      }
      if (rawSeen[rawId]) problems.push('原始数据 id 重复：' + rawId + '（第 ' + (index + 1) + ' 条）。');
      rawSeen[rawId] = true;
    });

    rawAll.forEach(function (raw, index) {
      var poem = normalize(raw, index);
      if (!poem.title || !poem.text) {
        problems.push('第 ' + (index + 1) + ' 条数据缺少标题或正文，已跳过。');
        return;
      }
      if (seen[poem.id]) {
        problems.push('篇目 id 重复：' + poem.id + '（' + poem.title + '），已自动改名。');
        poem.id = poem.id + '-' + (index + 1);
      }
      seen[poem.id] = true;
      poems.push(poem);
    });

    if (problems.length) {
      // 只在控制台提示，不影响页面运行
      console.warn('[题库] ' + problems.join('\n'));
    }
    return poems;
  }

  var poems = build();

  function byId(id) {
    for (var i = 0; i < poems.length; i += 1) {
      if (poems[i].id === id) return poems[i];
    }
    return null;
  }

  function byStage(stage) {
    return poems.filter(function (poem) {
      return poem.stage === stage;
    });
  }

  function countBy(list, key) {
    var map = Object.create(null);
    list.forEach(function (item) {
      var value = item[key];
      map[value] = (map[value] || 0) + 1;
    });
    return map;
  }

  /** 依据筛选条件查询篇目（全部条件都可为空） */
  function query(options) {
    var opts = options || {};
    var keyword = String(opts.keyword || '').trim().toLowerCase();

    return poems.filter(function (poem) {
      if (opts.stage && poem.stage !== opts.stage) return false;
      var wantedGrades = toList(opts.grade);
      if (wantedGrades.length && !wantedGrades.some(function (grade) {
        return poem.grades.indexOf(grade) !== -1;
      })) return false;
      if (!matchesAny(poem.genre, opts.genre)) return false;
      if (!matchesAny(poem.sourceType, opts.sourceType)) return false;
      if (opts.onlyRequired && !poem.required) return false;
      if (opts.onlySelected && Utils.toArray(opts.selectedIds).indexOf(poem.id) === -1) return false;
      if (opts.ids && Utils.toArray(opts.ids).indexOf(poem.id) === -1) return false;
      if (keyword) {
        var haystack = [poem.title, poem.author, poem.dynasty, poem.grade, poem.genre, poem.sourceType, poem.notes]
          .join(' ')
          .toLowerCase();
        var inText = poem.text.toLowerCase().indexOf(keyword) !== -1;
        if (haystack.indexOf(keyword) === -1 && !inText) return false;
      }
      return true;
    });
  }

  /** 年级展示顺序（按 Meta 中的设置，找不到的排在最后） */
  function gradeOrder(stage) {
    var list = (Meta.grades && Meta.grades[stage]) || [];
    return list.slice();
  }

  function sortPoems(list) {
    return list.slice().sort(function (a, b) {
      if (a.stage !== b.stage) return a.stage === '初中' ? -1 : 1;
      var order = gradeOrder(a.stage).concat(gradeOrder(b.stage));
      var oa = 99;
      var ob = 99;
      (a.grades.length ? a.grades : [a.grade]).forEach(function (grade) {
        var index = order.indexOf(grade);
        if (index !== -1 && index < oa) oa = index;
      });
      (b.grades.length ? b.grades : [b.grade]).forEach(function (grade) {
        var index = order.indexOf(grade);
        if (index !== -1 && index < ob) ob = index;
      });
      if (oa !== ob) return oa - ob;
      if (a.sourceType !== b.sourceType) {
        var sa = ['课标推荐', '统编教材', '上海地区', '拓展'].indexOf(a.sourceType);
        var sb = ['课标推荐', '统编教材', '上海地区', '拓展'].indexOf(b.sourceType);
        return (sa === -1 ? 9 : sa) - (sb === -1 ? 9 : sb);
      }
      return a.order - b.order;
    });
  }

  function highlightMap(poem) {
    var map = Object.create(null);
    Utils.toArray(poem.highlights).forEach(function (item) {
      var type = item.type || '名句';
      if (!map[type]) map[type] = [];
      map[type].push(item);
    });
    return map;
  }

  global.PoetryDatabase = {
    rawCount: function () {
      return rawTotal;
    },
    all: function () {
      return poems.slice();
    },
    byId: byId,
    byStage: byStage,
    query: query,
    sort: sortPoems,
    countBy: countBy,
    gradeOrder: gradeOrder,
    highlightMap: highlightMap,
    stats: function (stage) {
      var list = stage ? byStage(stage) : poems.slice();
      return {
        total: list.length,
        required: list.filter(function (item) {
          return item.required;
        }).length,
        bySource: countBy(list, 'sourceType'),
        byGenre: countBy(list, 'genre'),
        byGrade: countBy(list, 'grade'),
      };
    },
    problems: problems,
  };
})(window);

/* ===== js/storage.js ===== */
/* 古诗文背诵学习系统 —— 本地数据存储
   纯静态站点没有后端账户，学习和错题数据全部保存在 localStorage。
   这里对损坏 / 禁用 / 配额异常做了容错，保证任何情况下页面都能打开。 */
(function (global) {
  'use strict';

  var Utils = global.PoetryUtils;
  var STORAGE_KEY = 'ruishao-poetry-study-v1';
  var SCHEMA_VERSION = 1;
  var DAILY_LIMIT = 60;
  var RECENT_LIMIT = 20;
  var WRONG_LIMIT = 200;

  /* 合法题型白名单（与 js/quiz.js 的 MODES 保持一致，unit test 会校验两者相等）。
     非法值必须被丢弃：空数组按现有设计表示“随机组合”。 */
  var MODE_KEYS = ['blank-full', 'next', 'prev', 'keyword', 'mixed', 'full'];

  /* 页面 UI 只提供这四档题量；localStorage 里的其它数值一律吸附到最近的档位，
     避免出现“没有任何 chip 处于选中态”的不可见状态。 */
  var QUIZ_COUNT_OPTIONS = [5, 10, 20, 30];
  var QUIZ_COUNT_MIN = 1;
  var QUIZ_COUNT_MAX = 60;

  var memoryFallback = null; // localStorage 不可用时退化为内存存储

  function defaults() {
    return {
      version: SCHEMA_VERSION,
      stage: '',              // 最近选择的学习阶段
      selectedIds: [],        // 已选择篇目
      learnedIds: {},         // 已学习篇目 { id: timestamp }
      recents: [],            // 最近学习篇目 [{ id, time }]
      quizStats: {
        total: 0,
        correct: 0,
        wrong: 0,
        byPoem: {},           // { id: { total, correct, wrong, lastTime } }
      },
      wrongBook: [],          // 错题本 [{ id, time, count, mode }]
      daily: {},              // { '2026-09-12': { quiz, correct } }
      prefs: {
        quizCount: 10,
        modes: [],            // 空数组表示“随机组合”
        autoNext: false,
        hideKeywords: false,
      },
    };
  }

  function getRaw() {
    if (memoryFallback) return memoryFallback;
    try {
      return global.localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      return null;
    }
  }

  function setRaw(value) {
    try {
      global.localStorage.setItem(STORAGE_KEY, value);
      memoryFallback = null;
      return true;
    } catch (err) {
      // 隐私模式 / 配额满：退化成内存存储，保证本次会话可用
      memoryFallback = value;
      return false;
    }
  }

  function toStringArray(value) {
    return Utils.toArray(value).filter(function (item) {
      return typeof item === 'string' && item;
    });
  }

  function toNumber(value) {
    var n = Number(value);
    return isFinite(n) && n > 0 ? n : 0;
  }

  /** 计数值：非负整数（小数向下取整，负数 / NaN / Infinity → 0） */
  function toCount(value) {
    var n = Number(value);
    if (!isFinite(n) || n <= 0) return 0;
    return Math.floor(n);
  }

  /**
   * 统计项业务不变量：correct + wrong === total（两者都是非负整数）。
   * 数据损坏时不猜 total，而是以“对 / 错”两个细粒度计数为准重建 total，
   * 这样正确率永远不可能超过 100%。
   */
  function normalizeStats(item) {
    item.correct = toCount(item.correct);
    item.wrong = toCount(item.wrong);
    item.total = item.correct + item.wrong;
    return item;
  }

  /** 题量规范化：非法值回落到默认 10，合法值吸附到 UI 提供的档位 */
  function normalizeQuizCount(value) {
    var n = Number(value);
    if (!isFinite(n) || n <= 0) return 10;
    n = Utils.clamp(Math.round(n), QUIZ_COUNT_MIN, QUIZ_COUNT_MAX);
    var best = QUIZ_COUNT_OPTIONS[0];
    var bestGap = Math.abs(n - best);
    for (var i = 1; i < QUIZ_COUNT_OPTIONS.length; i += 1) {
      var gap = Math.abs(n - QUIZ_COUNT_OPTIONS[i]);
      if (gap < bestGap) {
        best = QUIZ_COUNT_OPTIONS[i];
        bestGap = gap;
      }
    }
    return best;
  }

  function isPlainObject(value) {
    return !!value && typeof value === 'object' && !Array.isArray(value);
  }

  /** 把任意（可能损坏的）数据整理成合法状态 */
  function sanitize(raw) {
    var base = defaults();
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return base;

    base.stage = raw.stage === '初中' || raw.stage === '高中' ? raw.stage : '';
    base.selectedIds = Utils.unique(toStringArray(raw.selectedIds));

    if (isPlainObject(raw.learnedIds)) {
      Object.keys(raw.learnedIds).forEach(function (id) {
        if (typeof id === 'string' && id) base.learnedIds[id] = toNumber(raw.learnedIds[id]) || Date.now();
      });
    }

    if (Array.isArray(raw.recents)) {
      var recents = raw.recents
        .filter(function (item) {
          return item && typeof item === 'object' && typeof item.id === 'string';
        })
        .map(function (item) {
          return { id: item.id, time: toNumber(item.time) };
        });
      // 同一篇目只保留最近一次，并按时间倒序（“最近学习”必须有确定顺序）
      var recentSeen = Object.create(null);
      base.recents = recents
        .sort(function (a, b) {
          return b.time - a.time;
        })
        .filter(function (item) {
          if (!item.id || recentSeen[item.id]) return false;
          recentSeen[item.id] = true;
          return true;
        })
        .slice(0, RECENT_LIMIT);
    }

    var stats = raw.quizStats;
    if (isPlainObject(stats)) {
      base.quizStats.total = toCount(stats.total);
      base.quizStats.correct = toCount(stats.correct);
      base.quizStats.wrong = toCount(stats.wrong);
      normalizeStats(base.quizStats);
      if (isPlainObject(stats.byPoem)) {
        Object.keys(stats.byPoem).forEach(function (id) {
          var item = stats.byPoem[id];
          if (!id || !isPlainObject(item)) return;
          base.quizStats.byPoem[id] = normalizeStats({
            total: toCount(item.total),
            correct: toCount(item.correct),
            wrong: toCount(item.wrong),
            lastTime: toNumber(item.lastTime),
          });
        });
      }
    }

    if (Array.isArray(raw.wrongBook)) {
      var wrongList = raw.wrongBook
        .filter(function (item) {
          return item && typeof item === 'object' && typeof item.id === 'string';
        })
        .map(function (item) {
          return {
            id: item.id,
            time: toNumber(item.time),
            count: toCount(item.count) || 1,
            mode: typeof item.mode === 'string' && MODE_KEYS.indexOf(item.mode) !== -1 ? item.mode : '',
          };
        });
      var wrongSeen = Object.create(null);
      base.wrongBook = wrongList
        .sort(function (a, b) {
          return b.time - a.time;
        })
        .filter(function (item) {
          if (!item.id || wrongSeen[item.id]) return false; // 同一篇目只保留一条记录
          wrongSeen[item.id] = true;
          return true;
        })
        .slice(0, WRONG_LIMIT);
    }

    if (isPlainObject(raw.daily)) {
      // 只认合法日期键（非法 / 空 / 明显不合理的日期直接丢弃），按日期升序后取最近 60 天
      Utils.sortDayKeys(Object.keys(raw.daily)).slice(-DAILY_LIMIT).forEach(function (day) {
        var item = raw.daily[day];
        if (!item || typeof item !== 'object') return;
        var quiz = toCount(item.quiz);
        base.daily[day] = { quiz: quiz, correct: Utils.clamp(toCount(item.correct), 0, quiz) };
      });
    }

    if (isPlainObject(raw.prefs)) {
      base.prefs.quizCount = normalizeQuizCount(raw.prefs.quizCount);
      base.prefs.modes = Utils.unique(
        toStringArray(raw.prefs.modes).filter(function (key) {
          return MODE_KEYS.indexOf(key) !== -1;
        })
      );
      base.prefs.autoNext = !!raw.prefs.autoNext;
      base.prefs.hideKeywords = !!raw.prefs.hideKeywords;
    }

    return base;
  }

  /**
   * 校验一份数据是否满足 schema 与业务不变量（sanitize 之后必须返回空数组）。
   * 供测试与自检使用，不参与正常页面流程。
   */
  function validate(target) {
    var issues = [];
    var data = target || {};
    if (!isPlainObject(data)) return ['state 不是对象'];
    if (data.version !== SCHEMA_VERSION) issues.push('version 非法: ' + data.version);
    if (data.stage !== '' && data.stage !== '初中' && data.stage !== '高中') issues.push('stage 非法: ' + data.stage);
    if (!Array.isArray(data.selectedIds)) issues.push('selectedIds 不是数组');
    else {
      if (data.selectedIds.some(function (id) { return typeof id !== 'string' || !id; })) issues.push('selectedIds 含非法元素');
      if (Utils.unique(data.selectedIds).length !== data.selectedIds.length) issues.push('selectedIds 有重复');
    }
    if (!isPlainObject(data.learnedIds)) issues.push('learnedIds 不是对象');
    else {
      Object.keys(data.learnedIds).forEach(function (id) {
        if (typeof data.learnedIds[id] !== 'number' || !isFinite(data.learnedIds[id]) || data.learnedIds[id] <= 0) {
          issues.push('learnedIds[' + id + '] 时间戳非法');
        }
      });
    }
    if (!Array.isArray(data.recents)) issues.push('recents 不是数组');
    if (!isPlainObject(data.quizStats)) issues.push('quizStats 不是对象');
    else {
      var stats = data.quizStats;
      ['total', 'correct', 'wrong'].forEach(function (key) {
        if (!Number.isInteger(stats[key]) || stats[key] < 0) issues.push('quizStats.' + key + ' 非法: ' + stats[key]);
      });
      if (stats.correct + stats.wrong !== stats.total) {
        issues.push('quizStats 不满足 correct + wrong === total（' + stats.correct + '+' + stats.wrong + '≠' + stats.total + '）');
      }
      if (!isPlainObject(stats.byPoem)) issues.push('quizStats.byPoem 不是对象');
      else {
        Object.keys(stats.byPoem).forEach(function (id) {
          var item = stats.byPoem[id];
          if (!isPlainObject(item)) { issues.push('quizStats.byPoem[' + id + '] 不是对象'); return; }
          if (item.correct + item.wrong !== item.total) issues.push('byPoem[' + id + '] 不满足 correct + wrong === total');
          if (item.total > 0 && item.correct / item.total > 1) issues.push('byPoem[' + id + '] 正确率超过 100%');
        });
      }
      if (stats.total > 0 && stats.correct / stats.total > 1) issues.push('整体正确率超过 100%');
    }
    if (!Array.isArray(data.wrongBook)) issues.push('wrongBook 不是数组');
    else {
      data.wrongBook.forEach(function (item) {
        if (!item || typeof item.id !== 'string' || !item.id) issues.push('wrongBook 含非法 id');
        if (!Number.isInteger(item && item.count) || item.count < 1) issues.push('wrongBook.count 非法');
        if (item && item.mode && MODE_KEYS.indexOf(item.mode) === -1) issues.push('wrongBook.mode 非法: ' + item.mode);
      });
    }
    if (!isPlainObject(data.daily)) issues.push('daily 不是对象');
    else {
      Object.keys(data.daily).forEach(function (day) {
        if (!Utils.isValidDayKey(day)) issues.push('daily 日期键非法: ' + day);
        var item = data.daily[day];
        if (!isPlainObject(item)) { issues.push('daily[' + day + '] 不是对象'); return; }
        if (!Number.isInteger(item.quiz) || item.quiz < 0) issues.push('daily[' + day + '].quiz 非法');
        if (!Number.isInteger(item.correct) || item.correct < 0 || item.correct > item.quiz) issues.push('daily[' + day + '].correct 非法');
      });
    }
    if (!isPlainObject(data.prefs)) issues.push('prefs 不是对象');
    else {
      if (QUIZ_COUNT_OPTIONS.indexOf(data.prefs.quizCount) === -1) issues.push('prefs.quizCount 非法: ' + data.prefs.quizCount);
      if (!Array.isArray(data.prefs.modes)) issues.push('prefs.modes 不是数组');
      else if (data.prefs.modes.some(function (key) { return MODE_KEYS.indexOf(key) === -1; })) issues.push('prefs.modes 含非法题型');
    }
    return issues;
  }

  /**
   * 清理数据库中已经不存在的“幽灵 ID”（题库升级 / 换设备合并数据后可能残留）。
   * 返回清理条数；默认写入模块内 state，也可传入自定义对象（测试用）。
   */
  function pruneUnknownIds(target, allowedIds) {
    var data = target || state;
    var ids = allowedIds;
    if (!ids) {
      if (!global.PoetryDatabase || typeof global.PoetryDatabase.all !== 'function') return 0;
      ids = global.PoetryDatabase.all().map(function (poem) {
        return poem.id;
      });
    }
    var allowed = Object.create(null);
    Utils.toArray(ids).forEach(function (id) {
      allowed[id] = true;
    });
    var removed = 0;

    data.selectedIds = Utils.toArray(data.selectedIds).filter(function (id) {
      if (allowed[id]) return true;
      removed += 1;
      return false;
    });
    Object.keys(data.learnedIds || {}).forEach(function (id) {
      if (!allowed[id]) {
        delete data.learnedIds[id];
        removed += 1;
      }
    });
    data.recents = Utils.toArray(data.recents).filter(function (item) {
      if (item && allowed[item.id]) return true;
      removed += 1;
      return false;
    });
    Object.keys(data.quizStats && data.quizStats.byPoem ? data.quizStats.byPoem : {}).forEach(function (id) {
      if (!allowed[id]) {
        delete data.quizStats.byPoem[id];
        removed += 1;
      }
    });
    data.wrongBook = Utils.toArray(data.wrongBook).filter(function (item) {
      if (item && allowed[item.id]) return true;
      removed += 1;
      return false;
    });
    return removed;
  }

  var state = defaults();
  var loadIssue = '';

  function load() {
    var raw = getRaw();
    if (raw == null) {
      state = defaults();
      return state;
    }
    try {
      var parsed = JSON.parse(raw);
      state = sanitize(parsed);
    } catch (err) {
      loadIssue = '本地数据格式异常，已自动重置学习记录。';
      state = defaults();
      setRaw(JSON.stringify(state));
      return state;
    }
    var removed = pruneUnknownIds(state);
    if (removed) loadIssue = '已清理 ' + removed + ' 条题库中不存在的本地记录。';
    var normalized = JSON.stringify(state);
    if (normalized !== raw) setRaw(normalized); // 把修正后的安全状态写回，避免错误数据反复进入系统
    return state;
  }

  function save() {
    state.version = SCHEMA_VERSION;
    return setRaw(JSON.stringify(state));
  }

  function patch(partial) {
    if (partial && typeof partial === 'object') {
      Object.keys(partial).forEach(function (key) {
        state[key] = partial[key];
      });
    }
    // 合并后重新走一遍 schema / 业务校验，避免非法数据直接落盘
    state = sanitize(state);
    save();
    return state;
  }

  function reset() {
    state = defaults();
    try {
      global.localStorage.removeItem(STORAGE_KEY);
    } catch (err) {
      /* 忽略：内存模式 */
    }
    memoryFallback = null;
    save();
    return state;
  }

  function getState() {
    return state;
  }

  function touchRecent(poemId) {
    if (!poemId) return;
    var list = state.recents.filter(function (item) {
      return item.id !== poemId;
    });
    list.unshift({ id: poemId, time: Date.now() });
    state.recents = list.slice(0, RECENT_LIMIT);
  }

  function markLearned(poemId) {
    if (!poemId) return state;
    state.learnedIds[poemId] = Date.now();
    touchRecent(poemId);
    save();
    return state;
  }

  function recordQuiz(poemId, isCorrect, mode) {
    var day = Utils.todayKey();
    if (!state.daily[day]) state.daily[day] = { quiz: 0, correct: 0 };
    state.daily[day].quiz += 1;
    if (isCorrect) state.daily[day].correct += 1;
    // daily 只保留最近 60 天，避免长时间使用后无限增长
    Utils.sortDayKeys(Object.keys(state.daily)).slice(0, -DAILY_LIMIT).forEach(function (oldDay) {
      delete state.daily[oldDay];
    });

    state.quizStats.total += 1;
    if (isCorrect) state.quizStats.correct += 1;
    else state.quizStats.wrong += 1;

    if (poemId) {
      var item = state.quizStats.byPoem[poemId] || { total: 0, correct: 0, wrong: 0, lastTime: 0 };
      item.total += 1;
      if (isCorrect) item.correct += 1;
      else item.wrong += 1;
      item.lastTime = Date.now();
      state.quizStats.byPoem[poemId] = item;
      touchRecent(poemId);
      /* 产品设计：答对一次即认为该篇目已经掌握，整条错题记录移除（不是 count-1）。
         这样错题本只保留“当前还没背熟的篇目”，unit test 覆盖了这一行为。 */
      if (isCorrect) removeWrong(poemId, true);
      else addWrong(poemId, mode, true);
    }
    save();
    return state;
  }

  function addWrong(poemId, mode, silent) {
    if (!poemId) return state;
    var safeMode = MODE_KEYS.indexOf(mode) !== -1 ? mode : '';
    var found = null;
    state.wrongBook.forEach(function (item) {
      if (item.id === poemId) found = item;
    });
    if (found) {
      found.count += 1;
      found.time = Date.now();
      found.mode = safeMode || found.mode;
    } else {
      state.wrongBook.unshift({ id: poemId, time: Date.now(), count: 1, mode: safeMode });
    }
    state.wrongBook = state.wrongBook.slice(0, WRONG_LIMIT);
    if (!silent) save();
    return state;
  }

  function removeWrong(poemId, silent) {
    state.wrongBook = state.wrongBook.filter(function (item) {
      return item.id !== poemId;
    });
    if (!silent) save();
    return state;
  }

  function todayStats() {
    var day = Utils.todayKey();
    return state.daily[day] || { quiz: 0, correct: 0 };
  }

  global.PoetryStorage = {
    KEY: STORAGE_KEY,
    MODE_KEYS: MODE_KEYS,
    QUIZ_COUNT_OPTIONS: QUIZ_COUNT_OPTIONS,
    defaults: defaults,
    load: load,
    save: save,
    patch: patch,
    reset: reset,
    sanitize: sanitize,
    validate: validate,
    pruneUnknownIds: pruneUnknownIds,
    normalizeQuizCount: normalizeQuizCount,
    getState: getState,
    getLoadIssue: function () {
      return loadIssue;
    },
    markLearned: markLearned,
    recordQuiz: recordQuiz,
    addWrong: addWrong,
    removeWrong: removeWrong,
    touchRecent: function (poemId) {
      touchRecent(poemId);
      save();
    },
    todayStats: todayStats,
  };
})(window);

/* ===== js/study.js ===== */
/* 古诗文背诵学习系统 —— 全文学习模式
   交互：点击句子隐藏/显示、显示全部、逐句隐藏、关键词隐藏、上一句/下一句。 */
(function (global) {
  'use strict';

  var Utils = global.PoetryUtils;
  var DB = global.PoetryDatabase;
  var Storage = global.PoetryStorage;

  var state = {
    poemId: '',
    hidden: {},      // { sentenceIndex: true }
    keywordMode: false,
    activeIndex: -1,
    list: [],
  };

  /** 作者隐形指纹：随正文复制而传播（零宽字符，不参与阅读与判分） */
  function brandSig() {
    var brand = global.PoetryBrand;
    return brand && brand.signature ? brand.signature() : '';
  }

  function resetState(poemId, list) {
    state.poemId = poemId;
    state.hidden = {};
    state.keywordMode = false;
    state.activeIndex = -1;
    state.list = list;
  }

  function currentPoem() {
    return DB.byId(state.poemId);
  }

  function renderSentences(poem) {
    var sentences = Utils.splitSentences(poem.text);
    return sentences
      .map(function (sentence, index) {
        var hidden = !!state.hidden[index];
        var shown = hidden
          ? state.keywordMode
            ? Utils.splitClauses(sentence)
                .map(function (clause) {
                  return Utils.blankKeepFirst(clause);
                })
                .join('')
            : Utils.makeBlank(sentence, null)
          : Utils.escapeHtml(sentence);
        var cls = 'line-item' + (hidden ? ' is-hidden' : '') + (state.activeIndex === index ? ' is-active' : '');
        return (
          '<button type="button" class="' + cls + '" data-line="' + index + '" aria-pressed="' + (hidden ? 'true' : 'false') + '">' +
          '<span class="line-text">' + shown + brandSig() + '</span>' +
          '</button>'
        );
      })
      .join('');
  }

  function renderHints(poem) {
    var map = DB.highlightMap(poem);
    var groups = Object.keys(map);
    if (!groups.length) return '';
    return groups
      .map(function (type) {
        return (
          '<dt>背诵提示 · ' + Utils.escapeHtml(type) + '</dt>' +
          '<dd><div class="hint-list">' +
          map[type]
            .map(function (item) {
              return (
                '<button type="button" class="hint-item" data-hint="' + Utils.escapeHtml(item.text) + '">' +
                Utils.escapeHtml(item.text) +
                (item.note ? '<span class="tiny muted"> · ' + Utils.escapeHtml(item.note) + '</span>' : '') +
                '</button>'
              );
            })
            .join('') +
          '</div></dd>'
        );
      })
      .join('');
  }

  function renderMeta(poem) {
    var sourceInfo = (global.PoetryMeta.sources || {})[poem.sourceType === '上海地区' ? 'shanghai' : poem.sourceType === '统编教材' ? 'textbook' : poem.stage === '高中' ? 'senior' : 'junior'];
    var rows = [
      ['学段年级', poem.stage + ' · ' + poem.grade],
      ['作者朝代', poem.author + ' · ' + poem.dynasty],
      ['体裁', poem.genre],
      ['来源类型', poem.sourceType + (poem.required ? '（核心必背）' : '')],
      ['数据来源', poem.source || (sourceInfo ? sourceInfo.name : '')],
    ];
    var html = rows
      .filter(function (row) {
        return row[1];
      })
      .map(function (row) {
        return '<dt>' + Utils.escapeHtml(row[0]) + '</dt><dd>' + Utils.escapeHtml(row[1]) + '</dd>';
      })
      .join('');

    if (poem.notes) html += '<dt>说明</dt><dd>' + Utils.escapeHtml(poem.notes) + '</dd>';

    if (poem.variants.length) {
      html += '<dt>版本差异</dt><dd>' + poem.variants
        .map(function (variant) {
          return '<div>' + Utils.escapeHtml(variant.label || '异文') + '：' + Utils.escapeHtml(variant.text) + '</div>';
        })
        .join('') + '</dd>';
    }
    return html;
  }

  function render(root) {
    var poem = currentPoem();
    if (!poem) {
      root.innerHTML =
        '<div class="card"><div class="empty-state">当前没有可学习的篇目，请先返回选择篇目。</div></div>';
      return;
    }

    var learned = !!Storage.getState().learnedIds[poem.id];
    var options = state.list
      .map(function (item) {
        return (
          '<option value="' + Utils.escapeHtml(item.id) + '"' + (item.id === poem.id ? ' selected' : '') + '>' +
          Utils.escapeHtml(item.title + ' · ' + item.author) +
          '</option>'
        );
      })
      .join('');

    root.innerHTML =
      '<section class="card">' +
        '<div class="poem-switch">' +
          '<label class="filter-label" for="studyPoemSelect">切换篇目（共 ' + state.list.length + ' 篇）</label>' +
          '<select id="studyPoemSelect">' + options + '</select>' +
        '</div>' +
        '<div class="study-toolbar">' +
          '<button type="button" class="btn btn-sm" data-action="reveal-all">显示全部</button>' +
          '<button type="button" class="btn btn-sm" data-action="hide-all">逐句隐藏</button>' +
          '<button type="button" class="btn btn-sm' + (state.keywordMode ? ' btn-primary' : '') + '" data-action="toggle-keyword">关键词隐藏</button>' +
          '<button type="button" class="btn btn-sm" data-action="prev-line">上一句</button>' +
          '<button type="button" class="btn btn-sm" data-action="next-line">下一句</button>' +
        '</div>' +
      '</section>' +
      '<section class="card">' +
        '<div class="poem-head">' +
          '<h2>' + Utils.escapeHtml(poem.title) + '</h2>' +
          '<p class="poem-byline">' + Utils.escapeHtml(poem.author + ' · ' + poem.dynasty) + '</p>' +
          '<div class="poem-tags">' +
            '<span class="badge badge-primary">' + Utils.escapeHtml(poem.stage + ' ' + poem.grade) + '</span>' +
            '<span class="badge">' + Utils.escapeHtml(poem.genre) + '</span>' +
            '<span class="badge' + (poem.required ? ' badge-success' : '') + '">' + Utils.escapeHtml(poem.sourceType) + '</span>' +
            (learned ? '<span class="badge badge-warn">已学习</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="poem-body" id="poemBody">' + renderSentences(poem) + '</div>' +
        '<div class="hint-bar">' +
          '<span class="tiny muted">点击任意句子可以隐藏 / 显示，方便自己先背一遍。</span>' +
          '<span class="tiny muted" id="studyProgress">' +
            Object.keys(state.hidden).length + ' / ' + Utils.splitSentences(poem.text).length + ' 句已隐藏' +
          '</span>' +
        '</div>' +
        '<dl class="poem-meta-block">' + renderMeta(poem) + renderHints(poem) + '</dl>' +
      '</section>';
  }

  function updateCounters(root) {
    var counter = root.querySelector('#studyProgress');
    var poem = currentPoem();
    if (counter && poem) {
      counter.textContent = Object.keys(state.hidden).length + ' / ' + Utils.splitSentences(poem.text).length + ' 句已隐藏';
    }
  }

  function refreshBody(root) {
    var poem = currentPoem();
    var body = root.querySelector('#poemBody');
    if (!poem || !body) return;
    body.innerHTML = renderSentences(poem);
    var keywordBtn = root.querySelector('[data-action="toggle-keyword"]');
    if (keywordBtn) {
      keywordBtn.classList.toggle('btn-primary', state.keywordMode);
      keywordBtn.setAttribute('aria-pressed', state.keywordMode ? 'true' : 'false');
    }
    updateCounters(root);
  }

  function setPoem(root, poemId, options) {
    var poem = DB.byId(poemId);
    if (!poem) return;
    var list = options && options.list ? options.list : state.list;
    // 只允许在“当前已选篇目”范围内切换，异常 URL / 旧状态不会把别的篇目标记为已学习
    if (
      !list.some(function (item) {
        return item.id === poem.id;
      })
    ) {
      return;
    }
    resetState(poem.id, list);
    Storage.markLearned(poem.id);
    render(root);
    if (global.scrollTo) global.scrollTo(0, 0);
  }

  function move(root, delta) {
    var poem = currentPoem();
    if (!poem) return;
    var total = Utils.splitSentences(poem.text).length;
    if (!total) return;
    var next = state.activeIndex + delta;
    if (next < 0) next = 0;
    if (next >= total) next = total - 1;
    state.activeIndex = next;
    refreshBody(root);
    var active = root.querySelector('.line-item.is-active');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function handleClick(root, event) {
    var line = event.target.closest ? event.target.closest('[data-line]') : null;
    if (line) {
      var index = Number(line.getAttribute('data-line'));
      if (state.hidden[index]) delete state.hidden[index];
      else state.hidden[index] = true;
      state.activeIndex = index;
      refreshBody(root);
      return;
    }

    var hint = event.target.closest ? event.target.closest('[data-hint]') : null;
    if (hint && global.PoetryApp) {
      global.PoetryApp.toast('提示：' + hint.getAttribute('data-hint'));
      return;
    }

    var button = event.target.closest ? event.target.closest('[data-action]') : null;
    if (!button) return;
    var action = button.getAttribute('data-action');
    var poem = currentPoem();
    if (!poem) return;

    if (action === 'reveal-all') {
      state.hidden = {};
      state.keywordMode = false;
      state.activeIndex = -1;
      refreshBody(root);
    } else if (action === 'hide-all') {
      Utils.splitSentences(poem.text).forEach(function (_, index) {
        state.hidden[index] = true;
      });
      refreshBody(root);
    } else if (action === 'toggle-keyword') {
      state.keywordMode = !state.keywordMode;
      if (state.keywordMode) {
        Utils.splitSentences(poem.text).forEach(function (_, index) {
          state.hidden[index] = true;
        });
      }
      refreshBody(root);
    } else if (action === 'prev-line') {
      move(root, -1);
    } else if (action === 'next-line') {
      move(root, 1);
    }
  }

  function mount(root, options) {
    var opts = options || {};
    var list = opts.list && opts.list.length ? opts.list : [];
    if (!list.length) {
      root.innerHTML = '<div class="card"><div class="empty-state">还没有选择篇目，请先返回选择要背诵的篇目。</div></div>';
      return;
    }
    var wanted = opts.poemId && DB.byId(opts.poemId) ? opts.poemId : '';
    var inList = list.some(function (item) {
      return item.id === wanted;
    });
    var poemId = inList ? wanted : list[0].id;
    resetState(poemId, list);
    Storage.markLearned(poemId);
    render(root);

    root.addEventListener('click', function (event) {
      handleClick(root, event);
    });
    root.addEventListener('change', function (event) {
      if (event.target && event.target.id === 'studyPoemSelect') {
        setPoem(root, event.target.value, opts);
      }
    });
  }

  global.PoetryStudy = {
    mount: mount,
    currentPoemId: function () {
      return state.poemId;
    },
  };
})(window);

/* ===== js/quiz.js ===== */
/* 古诗文背诵学习系统 —— 默写自测
   出题思路参考原“上海中考古诗词默写自测”：卡片 + 眼睛按钮展开答案 + 显示全部答案。
   在此基础上增加多种题型、随机组合、判分与错题本。 */
(function (global) {
  'use strict';

  var Utils = global.PoetryUtils;
  var DB = global.PoetryDatabase;
  var Storage = global.PoetryStorage;

  var MODES = [
    { key: 'blank-full', label: '整句挖空', desc: '给出篇目，整句用 □ 表示，自己默写整句。' },
    { key: 'next', label: '给上句写下句', desc: '给出上句，默写下句。' },
    { key: 'prev', label: '给下句写上句', desc: '给出下句，默写上句。' },
    { key: 'keyword', label: '关键词提示', desc: '只保留首字与关键词，提示下完成默写。' },
    { key: 'mixed', label: '随机挖空', desc: '在句中随机挖空词语或易错字。' },
    { key: 'full', label: '整句默写', desc: '只给篇目和句序，完整默写该句。' },
  ];
  var MODE_KEY_LIST = MODES.map(function (item) {
    return item.key;
  });

  var state = {
    questions: [],
    answered: {},
    showAll: false,
    notice: '',       // 题目数量不足 / 错题本为空等提示
    scope: 'all', // 'all' | 'wrong' | 'focus'
    focusPoemId: '', // 指定“只练某一篇”时的篇目 id
  };
  var lastBatchKeys = [];

  /** 作者隐形指纹：随题目 / 答案复制而传播 */
  function brandSig() {
    return global.PoetryBrand && global.PoetryBrand.signature ? global.PoetryBrand.signature() : '';
  }

  function modeLabel(key) {
    for (var i = 0; i < MODES.length; i += 1) {
      if (MODES[i].key === key) return MODES[i].label;
    }
    return '默写';
  }

  function blankHtml(text, hideChars) {
    var blanked = Utils.makeBlank(text, hideChars || null);
    return Utils.escapeHtml(blanked).replace(/□+/g, function (run) {
      return '<span class="blank-unit">' + run + '</span>';
    });
  }

  function keywordOf(poem, sentence) {
    var highlights = poem.highlights || [];
    for (var i = 0; i < highlights.length; i += 1) {
      var item = highlights[i];
      var key = Utils.stripPunctuation(item.text).slice(0, 2);
      if (key && (item.type === '名句' || item.type === '关键词') && sentence.indexOf(key) !== -1) {
        return item.text;
      }
    }
    var clauses = Utils.splitClauses(sentence);
    if (!clauses.length) return '';
    return Utils.stripPunctuation(clauses[0]).slice(0, 2);
  }

  function errataOf(poem, sentence) {
    var found = [];
    (poem.highlights || []).forEach(function (item) {
      if (item.type !== '易错字' && item.type !== '错别字') return;
      Utils.stripPunctuation(item.text)
        .split('')
        .forEach(function (ch) {
          if (sentence.indexOf(ch) !== -1 && found.indexOf(ch) === -1) found.push(ch);
        });
    });
    return found.join('');
  }

  /** 为一个篇目收集所有可出题素材 */
  function unitsOf(poem) {
    var sentences = Utils.splitSentences(poem.text);
    var units = [];
    sentences.forEach(function (sentence, sIndex) {
      var clauses = Utils.splitClauses(sentence);
      if (!Utils.stripPunctuation(sentence).length) return;
      units.push({ kind: 'sentence', sentence: sentence, index: sIndex, clauses: clauses });
      for (var i = 0; i + 1 < clauses.length; i += 1) {
        if (Utils.stripPunctuation(clauses[i]).length < 2) continue;
        if (Utils.stripPunctuation(clauses[i + 1]).length < 2) continue;
        units.push({ kind: 'pair', sentence: sentence, index: sIndex, left: clauses[i], right: clauses[i + 1], pairIndex: i });
      }
    });
    return units;
  }

  function buildQuestion(poem, unit, mode) {
    var question = {
      poemId: poem.id,
      poemTitle: poem.title,
      poemAuthor: poem.author,
      mode: mode,
      modeLabel: modeLabel(mode),
      key: poem.id + '|' + mode + '|' + unit.index + '|' + (unit.pairIndex == null ? 's' : unit.pairIndex),
      hint: '',
      promptHtml: '',
      answerText: unit.sentence,
      position: unit.index + 1,
    };

    if (mode === 'next') {
      var pair = unit.kind === 'pair' ? unit : null;
      if (!pair) return null;
      question.promptHtml = Utils.escapeHtml(pair.left) + blankHtml(pair.right);
      question.answerText = pair.left + pair.right;
      question.hint = '写出下句（可与标点一起默写）';
      return question;
    }
    if (mode === 'prev') {
      var pairPrev = unit.kind === 'pair' ? unit : null;
      if (!pairPrev) return null;
      question.promptHtml = blankHtml(pairPrev.left) + Utils.escapeHtml(pairPrev.right);
      question.answerText = pairPrev.left + pairPrev.right;
      question.hint = '补出上句';
      return question;
    }
    if (unit.kind !== 'sentence') return null;

    if (mode === 'blank-full') {
      question.promptHtml = blankHtml(unit.sentence);
      question.hint = '整句默写';
      return question;
    }
    if (mode === 'full') {
      /* 本题型只给篇目与句序，连 □ 长度提示都不给，和“整句挖空”区分开 */
      question.promptHtml = '<span class="context-hint">请默写本篇第 ' + (unit.index + 1) + ' 句（共 ' + Utils.splitSentences(poem.text).length + ' 句）</span>';
      question.hint = '整句默写';
      return question;
    }
    if (mode === 'keyword') {
      question.promptHtml = unit.clauses
        .map(function (clause) {
          return Utils.escapeHtml(Utils.blankKeepFirst(clause));
        })
        .join('');
      question.hint = '关键词提示：' + keywordOf(poem, unit.sentence);
      return question;
    }
    if (mode === 'mixed') {
      var errata = errataOf(poem, unit.sentence);
      if (errata) {
        question.promptHtml = blankHtml(unit.sentence, errata);
        question.hint = '重点挖空易错字';
      } else if (unit.clauses.length > 1) {
        var blankIndex = Math.floor(Utils.random() * unit.clauses.length);
        question.promptHtml = unit.clauses
          .map(function (clause, idx) {
            return idx === blankIndex ? blankHtml(clause) : Utils.escapeHtml(clause);
          })
          .join('');
        question.hint = '随机挖空其中一句';
      } else {
        question.promptHtml = blankHtml(unit.sentence);
        question.hint = '整句默写';
      }
      return question;
    }
    return null;
  }

  /**
   * 枚举这批篇目 + 这批题型下所有可能的题目。
   * 这样“最多能出多少题”是算出来的，而不是靠概率去碰，
   * 素材不足时可以如实告诉用户本次只能生成多少题。
   */
  function allCandidates(poems, modes) {
    var seen = Object.create(null);
    var out = [];
    Utils.shuffle(poems).forEach(function (poem) {
      unitsOf(poem).forEach(function (unit) {
        modes.forEach(function (mode) {
          var question = buildQuestion(poem, unit, mode);
          if (!question || seen[question.key]) return;
          seen[question.key] = true;
          out.push(question);
        });
      });
    });
    return out;
  }

  function pickQuestions(poems, options) {
    var opts = options || {};
    var count = Utils.clamp(Math.floor(Number(opts.count)) || 10, 1, 60);
    // 非法题型直接丢弃；全部非法时按“随机组合”处理
    var modes = Utils.unique(
      Utils.toArray(opts.modes).filter(function (key) {
        return MODE_KEY_LIST.indexOf(key) !== -1;
      })
    );
    if (!modes.length) modes = MODE_KEY_LIST.slice();

    var candidates = allCandidates(poems, modes);
    var fresh = candidates.filter(function (question) {
      return lastBatchKeys.indexOf(question.key) === -1;
    });
    var ordered =
      fresh.length >= count
        ? Utils.shuffle(fresh)
        : Utils.shuffle(fresh).concat(
            Utils.shuffle(
              candidates.filter(function (question) {
                return fresh.indexOf(question) === -1;
              })
            )
          );
    var questions = ordered.slice(0, count);
    lastBatchKeys = questions.map(function (item) {
      return item.key;
    });
    return questions;
  }

  function renderQuestion(question, index) {
    var answered = state.answered[question.key];
    var show = state.showAll || (answered && answered.showAnswer);
    return (
      '<article class="quiz-card" data-key="' + Utils.escapeHtml(question.key) + '">' +
        '<div class="card-header">' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="card-meta">' +
              '<span>第 ' + (index + 1) + ' 题</span>' +
              '<span class="badge mode-badge">' + Utils.escapeHtml(question.modeLabel) + '</span>' +
              '<span class="badge badge-primary">《' + Utils.escapeHtml(question.poemTitle) + '》· ' + Utils.escapeHtml(question.poemAuthor) + '</span>' +
              (answered ? '<span class="badge ' + (answered.correct ? 'badge-success' : 'badge-danger') + '">' + (answered.correct ? '答对' : '答错') + '</span>' : '') +
            '</div>' +
            '<div class="question-text">' + question.promptHtml + brandSig() + '</div>' +
            (question.hint ? '<div class="tiny muted">' + Utils.escapeHtml(question.hint) + '</div>' : '') +
          '</div>' +
          '<button type="button" class="btn-eye" data-action="toggle-answer" aria-label="显示或隐藏答案" aria-expanded="' + (show ? 'true' : 'false') + '">' +
            '<svg viewBox="0 0 24 24" class="show-eye' + (show ? ' hidden' : '') + '" aria-hidden="true"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>' +
            '<svg viewBox="0 0 24 24" class="hide-eye' + (show ? '' : ' hidden') + '" aria-hidden="true"><path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>' +
          '</button>' +
        '</div>' +
        '<div class="answer-wrapper' + (show ? ' show' : '') + '">' +
          '<div class="answer-content"><div class="answer-inner">' +
            '<div class="answer-badge-text"><span class="badge badge-success">答案</span><span class="answer-text">' + Utils.escapeHtml(question.answerText) + brandSig() + '</span></div>' +
          '</div></div>' +
        '</div>' +
        '<div class="grade-row">' +
          '<button type="button" class="btn btn-sm btn-success" data-action="mark-right" data-key="' + Utils.escapeHtml(question.key) + '"' + (answered ? ' disabled' : '') + '>✔ 默写正确</button>' +
          '<button type="button" class="btn btn-sm" data-action="mark-wrong" data-key="' + Utils.escapeHtml(question.key) + '"' + (answered ? ' disabled' : '') + '>✘ 加入错题</button>' +
          (answered ? '<span class="tiny muted">已判定 ' + (answered.correct ? '答对' : '答错') + '，换一批或清空本轮可重做</span>' : '') +
        '</div>' +
      '</article>'
    );
  }

  function statsLine() {
    var answered = Object.keys(state.answered).length;
    var correct = Object.keys(state.answered).filter(function (key) {
      return state.answered[key].correct;
    }).length;
    return '本轮 ' + state.questions.length + ' 题 · 已作答 ' + answered + ' 题 · 正确 ' + correct + ' 题';
  }

  /** 当前是否处于“只练某一篇”模式 */
  function focusOf(list) {
    if (!state.focusPoemId) return null;
    var found = null;
    Utils.toArray(list).forEach(function (poem) {
      if (poem.id === state.focusPoemId) found = poem;
    });
    return found;
  }

  /** 按当前练习范围取出篇目；错题本为空时回退到全部已选篇目 */
  function scopePoems(list, focusPoem) {
    if (state.scope === 'focus') {
      if (focusPoem) return { list: [focusPoem], notice: '' };
      state.scope = 'all'; // 兜底：focus 篇目不存在时不允许停留在 focus 状态
    }
    if (state.scope === 'wrong') {
      var wrongIds = Storage.getState().wrongBook.map(function (item) {
        return item.id;
      });
      var filtered = list.filter(function (poem) {
        return wrongIds.indexOf(poem.id) !== -1;
      });
      if (filtered.length) return { list: filtered, notice: '' };
      return { list: list, notice: '错题本是空的，已按全部已选篇目出题。' };
    }
    return { list: list, notice: '' };
  }

  function renderQuestions(root, options) {
    var box = root.querySelector('#quizList');
    if (!box) return;
    if (!state.questions.length) {
      box.innerHTML = '<div class="card"><div class="empty-state">还没有题目，点击「生成题目 / 换一批」开始默写自测。</div></div>';
      return;
    }
    box.innerHTML = state.questions.map(renderQuestion).join('');
    var counter = root.querySelector('#quizCounter');
    if (counter) counter.textContent = statsLine();
    var notice = root.querySelector('#quizNotice');
    if (notice) {
      notice.textContent = state.notice || '';
      notice.hidden = !state.notice;
    }
    var btn = root.querySelector('[data-action="toggle-all"]');
    if (btn) btn.textContent = state.showAll ? '隐藏全部答案' : '显示全部答案';
    if (options && options.onProgress) options.onProgress();
  }

  function render(root, options) {
    var opts = options || {};
    var prefs = Storage.getState().prefs;
    var modes = prefs.modes && prefs.modes.length ? prefs.modes : [];
    var focusPoem = focusOf(opts.list);
    var wrongCount = Storage.getState().wrongBook.filter(function (item) {
      return opts.list.some(function (poem) {
        return poem.id === item.id;
      });
    }).length;

    root.innerHTML =
      '<section class="card">' +
        '<h2 class="section-title">默写自测</h2>' +

        '<div class="quiz-settings" style="margin-top:0.9rem;">' +
          '<div class="filter-group">' +
            '<span class="filter-label">题型（不选表示随机组合）</span>' +

                var checked = modes.indexOf(mode.key) !== -1;
                return (

                    '<input type="checkbox" data-mode="' + mode.key + '"' + (checked ? ' checked' : '') + '>' +

            '<span class="filter-label">题目数量</span>' +

            '</div>' +
          '</div>' +
          '<div class="filter-group">' +
            '<span class="filter-label">练习范围</span>' +

              '<button type="button" class="chip' + (state.scope === 'all' ? ' active' : '') + '" data-scope="all">全部已选篇目</button>' +
              (focusPoem
                ? '<button type="button" class="chip' + (state.scope === 'focus' ? ' active' : '') + '" data-scope="focus">只练《' + Utils.escapeHtml(focusPoem.title) + '》</button>'
                : '') +
              '<button type="button" class="chip' + (state.scope === 'wrong' ? ' active' : '') + '" data-scope="wrong">优先错题（' + wrongCount + '）</button>' +
            '</div>' +

          '<div class="select-actions">' +
            '<button type="button" class="btn btn-primary" data-action="generate">生成题目 / 换一批</button>' +

        '</div>' +
      '</section>' +
      '<div id="quizList" style="margin-top:1rem;"></div>';

    renderQuestions(root, opts);
  }

  function generate(root, options) {
    var prefs = Storage.getState().prefs;
    var picked = scopePoems(options.list, focusOf(options.list));
    var requested = Storage.normalizeQuizCount(prefs.quizCount);
    state.questions = pickQuestions(picked.list, { count: requested, modes: prefs.modes });
    state.answered = {};
    state.showAll = false;
    var short =
      state.questions.length < requested
        ? '当前条件最多可生成 ' + state.questions.length + ' 题，本次生成 ' + state.questions.length + ' / ' + requested + ' 题。'
        : '';
    state.notice = [picked.notice, short].filter(Boolean).join(' ');
    renderQuestions(root, options);
    if (global.PoetryApp) {
      global.PoetryApp.toast((state.notice ? state.notice + ' ' : '') + '已生成 ' + state.questions.length + ' 道题');
    }
  }

  function handleClick(root, event, options) {
    var target = event.target;
    var actionEl = target.closest ? target.closest('[data-action]') : null;
    var countEl = target.closest ? target.closest('[data-count]') : null;
    var scopeEl = target.closest ? target.closest('[data-scope]') : null;

    if (countEl) {
      Storage.getState().prefs.quizCount = Number(countEl.getAttribute('data-count')) || 10;
      Storage.save();
      root.querySelectorAll('[data-count]').forEach(function (el) {
        el.classList.toggle('active', el === countEl);
      });
      return;
    }
    if (scopeEl) {
      var scope = scopeEl.getAttribute('data-scope');
      state.scope = scope === 'wrong' || scope === 'focus' ? scope : 'all';
      root.querySelectorAll('[data-scope]').forEach(function (el) {
        el.classList.toggle('active', el === scopeEl);
      });
      return;
    }
    if (!actionEl) return;

    var action = actionEl.getAttribute('data-action');
    if (action === 'generate') {
      generate(root, options);
      return;
    }
    if (action === 'toggle-all') {
      state.showAll = !state.showAll;
      renderQuestions(root, options);
      return;
    }
    if (action === 'clear') {
      state.questions = [];
      state.answered = {};
      state.showAll = false;
      renderQuestions(root, options);
      return;
    }
    if (action === 'toggle-answer') {
      var card = actionEl.closest('.quiz-card');
      var key = card ? card.getAttribute('data-key') : '';
      var wrapper = card ? card.querySelector('.answer-wrapper') : null;
      if (!wrapper) return;
      var willShow = !wrapper.classList.contains('show');
      wrapper.classList.toggle('show', willShow);
      var showEye = actionEl.querySelector('.show-eye');
      var hideEye = actionEl.querySelector('.hide-eye');
      if (showEye) showEye.classList.toggle('hidden', willShow);
      if (hideEye) hideEye.classList.toggle('hidden', !willShow);
      actionEl.setAttribute('aria-expanded', willShow ? 'true' : 'false');
      if (state.answered[key]) state.answered[key].showAnswer = willShow;
      return;
    }
    if (action === 'mark-right' || action === 'mark-wrong') {
      var qKey = actionEl.getAttribute('data-key');
      var question = null;
      state.questions.forEach(function (item) {
        if (item.key === qKey) question = item;
      });
      if (!question) return;
      /* 一题只计一次分：重复点击不会把统计和错题次数刷高 */
      if (state.answered[qKey]) {
        if (global.PoetryApp) {
          global.PoetryApp.toast(state.answered[qKey].correct ? '本题已判定：默写正确' : '本题已判定：已加入错题本');
        }
        return;
      }
      var correct = action === 'mark-right';
      Storage.recordQuiz(question.poemId, correct, question.mode);
      state.answered[qKey] = { correct: correct, showAnswer: true };

      var cardEl = actionEl.closest('.quiz-card');
      var wrapperEl = cardEl ? cardEl.querySelector('.answer-wrapper') : null;
      if (wrapperEl) wrapperEl.classList.add('show');
      var eye = cardEl ? cardEl.querySelector('.btn-eye') : null;
      if (eye) {
        var s = eye.querySelector('.show-eye');
        var h = eye.querySelector('.hide-eye');
        if (s) s.classList.add('hidden');
        if (h) h.classList.remove('hidden');
      }
      renderQuestions(root, options);
      if (global.PoetryApp) {
        global.PoetryApp.toast(correct ? '已记录：默写正确' : '已加入错题本，下次优先练习');
      }
    }
  }

  function mount(root, options) {
    var opts = options || {};
    if (!opts.list || !opts.list.length) {
      root.innerHTML = '<div class="card"><div class="empty-state">还没有选择篇目，请先返回选择要背诵的篇目。</div></div>';
      return;
    }
    /* 链接里的 focus 篇目必须是当前已选篇目，否则一律回退到“全部已选篇目”，
       不允许出现 scope === 'focus' 但画面上没有 focus 篇目的状态。 */
    var focus = null;
    Utils.toArray(opts.list).forEach(function (poem) {
      if (opts.focusPoemId && poem.id === opts.focusPoemId) focus = poem;
    });
    state.focusPoemId = focus ? focus.id : '';
    state.scope = state.focusPoemId ? 'focus' : 'all';
    render(root, opts);
    root.addEventListener('click', function (event) {
      handleClick(root, event, opts);
    });
    root.addEventListener('change', function (event) {
      var input = event.target;
      if (input && input.getAttribute && input.getAttribute('data-mode') != null) {

          if (el.checked) modes.push(el.getAttribute('data-mode'));
        });
        Storage.getState().prefs.modes = modes;

      }
    });
    generate(root, opts);
  }

          '<div class="search-box">' +
            '<input type="search" id="poemSearch" placeholder="搜索篇名 / 作者 / 朝代 / 关键词（如：李白）" value="' + Utils.escapeHtml(state.filters.keyword) + '" aria-label="搜索篇目">' +
            '<button type="button" class="search-clear" data-action="clear-search" aria-label="清空搜索">✕</button>' +
          '</div>' +
          '<div class="filter-group"><span class="filter-label">' + Utils.escapeHtml((Meta.gradeLabels && Meta.gradeLabels[stage]) || '年级') + '（可多选）</span><div class="chips">' + chips(grades, 'grade', state.filters.grade, stage === '高中' ? '全部模块' : '全部年级') + '</div></div>' +
          '<div class="filter-group"><span class="filter-label">体裁（可多选）</span><div class="chips">' + chips(genres, 'genre', state.filters.genre, '全部体裁') + '</div></div>' +
          '<div class="filter-group"><span class="filter-label">来源（可多选）</span><div class="chips">' + chips(sources, 'sourceType', state.filters.sourceType, '全部来源') + '</div></div>' +
          '<div class="select-actions">' +
            '<button type="button" class="btn btn-sm" data-action="select-all">全选当前结果</button>' +
            '<button type="button" class="btn btn-sm" data-action="select-none">取消全选</button>' +
            '<button type="button" class="btn btn-sm" data-action="select-required">只选课标必背</button>' +
            '<span class="select-summary">已选择 ' + selectedInStage.length + ' 篇</span>' +
          '</div>' +
          (selectedInStage.length
            ? '<details class="selected-panel"><summary>已选篇目快速查看（' + selectedInStage.length + '）</summary><div class="selected-list">' +
              selectedInStage
                .map(function (poem) {
                  return '<span class="selected-chip">' + Utils.escapeHtml(poem.title) + '<button type="button" data-remove="' + Utils.escapeHtml(poem.id) + '" aria-label="移除' + Utils.escapeHtml(poem.title) + '">✕</button></span>';
                })
                .join('') +
              '</div></details>'
            : '') +
        '</div>' +
        '<div style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;">' +
          '<button type="button" class="btn btn-primary" data-action="start" ' + (selectedInStage.length ? '' : 'disabled') + '>进入学习（已选 ' + selectedInStage.length + ' 篇）</button>' +
          '<span class="tiny muted" id="selectCountLabel">' + (activeFilterCount() ? '已应用 ' + activeFilterCount() + ' 个筛选条件 · 当前 ' + filteredCount + ' 篇' : '当前显示 ' + filteredCount + ' 篇') + '</span>' +
        '</div>' +
      '</section>' +
      '<section class="card" id="selectResultsCard"><div id="selectResults">' + selectResultsHtml() + '</div></section>';
  }

  /* ---------------- 视图：工作台 ---------------- */

  function renderHome(root) {
    var summary = progressSummary();
    var list = summary.list;
    if (!list.length) {
      root.innerHTML = '<section class="card"><div class="empty-state">还没有选择篇目，请先选择要背诵的篇目。<div style="margin-top:0.9rem;"><button type="button" class="btn btn-primary" data-action="to-select">去选择篇目</button></div></div></section>';
      return;
    }
    var total = list.length;
    var learnedPct = total ? Math.round((summary.learned / total) * 100) : 0;
    var recent = summary.recent[0];

    root.innerHTML =
      '<section class="card">' +
        '<h2 class="section-title">' + Utils.escapeHtml(state.stage) + '背诵工作台</h2>' +
        '<p class="section-desc">已选择 ' + total + ' 篇 · 最近学习：' + (recent ? Utils.escapeHtml(recent.poem.title) + '（' + Utils.escapeHtml(Utils.formatDateTime(recent.item.time)) + '）' : '还没有开始') + '</p>' +
        '<div class="stat-row">' +
          '<div class="stat-box"><div class="stat-num">' + summary.learned + ' / ' + total + '</div><div class="stat-label">已学习篇目</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.today.quiz + '</div><div class="stat-label">今日默写次数</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.stats.correct + ' / ' + summary.stats.total + '</div><div class="stat-label">累计正确 / 总次数</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.wrongBook.length + '</div><div class="stat-label">错题本篇目</div></div>' +
        '</div>' +
        '<div class="bar" aria-hidden="true"><span style="width:' + learnedPct + '%"></span></div>' +
      '</section>' +
      '<div class="feature-grid">' +
        '<button type="button" class="feature-card" data-action="study"><span class="fc-ico" aria-hidden="true">📖</span><h3>背诵学习</h3><p>逐句显示 / 隐藏、关键词隐藏、上一句下一句，先自己背一遍。</p></button>' +
        '<button type="button" class="feature-card" data-action="quiz"><span class="fc-ico" aria-hidden="true">✍️</span><h3>默写自测</h3><p>整句挖空、给上句写下句、关键词提示等 6 种题型随机组合。</p></button>' +
        '<button type="button" class="feature-card" data-action="to-select"><span class="fc-ico" aria-hidden="true">🗂️</span><h3>篇目列表</h3><p>查看、搜索并调整要背诵的篇目（当前 ' + total + ' 篇）。</p></button>' +
        '<button type="button" class="feature-card" data-action="progress"><span class="fc-ico" aria-hidden="true">📊</span><h3>我的进度</h3><p>学习进度、默写正确率与错题本，全部保存在本机。</p></button>' +
      '</div>' +
      (summary.wrongBook.length
        ? '<section class="card"><h3 class="section-title" style="font-size:1rem;">错题优先练</h3><div class="selected-list">' +
          summary.wrongBook.slice(0, 8).map(function (row) {
            return '<span class="selected-chip">' + Utils.escapeHtml(row.poem.title) + '<span class="tiny muted">×' + row.entry.count + '</span></span>';
          }).join('') +
          '</div><div style="margin-top:0.8rem;"><button type="button" class="btn btn-sm btn-primary" data-action="quiz-wrong">练习错题</button></div></section>'
        : '');
  }

  /* ---------------- 视图：进度 ---------------- */

  function renderProgress(root) {
    var summary = progressSummary();
    var saved = Storage.getState();
    var rows = summary.byPoem
      .sort(function (a, b) {
        return (b.item.lastTime || 0) - (a.item.lastTime || 0);
      })
      .map(function (row) {
        var rate = row.item.total ? Math.round((row.item.correct / row.item.total) * 100) : 0;
        return (
          '<div class="progress-item">' +
            '<div class="pi-main"><div>' + Utils.escapeHtml(row.poem.title) + '</div>' +
            '<div class="pi-sub">' + Utils.escapeHtml(row.poem.author) + ' · 练习 ' + row.item.total + ' 次 · 正确率 ' + rate + '%</div></div>' +
            '<button type="button" class="btn btn-sm" data-study="' + Utils.escapeHtml(row.poem.id) + '">复习</button>' +
          '</div>'
        );
      })
      .join('');

    root.innerHTML =
      '<section class="card">' +
        '<h2 class="section-title">我的进度</h2>' +
        '<div class="stat-row">' +
          '<div class="stat-box"><div class="stat-num">' + summary.learned + ' / ' + summary.list.length + '</div><div class="stat-label">已学习 / 已选择</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.stats.total + '</div><div class="stat-label">累计默写次数</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.accuracy + '%</div><div class="stat-label">整体正确率</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.today.quiz + '</div><div class="stat-label">今日默写</div></div>' +
        '</div>' +
        '<p class="tiny muted" style="margin-top:0.6rem;">数据保存在本机浏览器 localStorage 中，清除浏览器数据会同时清除进度。</p>' +
      '</section>' +
      '<section class="card">' +
        '<h3 class="section-title" style="font-size:1rem;">错题本（' + summary.wrongBook.length + '）</h3>' +
        (summary.wrongBook.length
          ? '<div class="progress-list">' + summary.wrongBook
              .map(function (row) {
                return (
                  '<div class="progress-item"><div class="pi-main"><div>' + Utils.escapeHtml(row.poem.title) + '</div>' +
                  '<div class="pi-sub">错 ' + row.entry.count + ' 次 · ' + Utils.escapeHtml(Utils.formatDateTime(row.entry.time)) + '</div></div>' +
                  '<div style="display:flex;gap:0.4rem;"><button type="button" class="btn btn-sm btn-primary" data-practice="' + Utils.escapeHtml(row.poem.id) + '">再练一次</button>' +
                  '<button type="button" class="btn btn-sm" data-remove-wrong="' + Utils.escapeHtml(row.poem.id) + '">移除</button></div></div>'
                );
              })
              .join('') + '</div>'
          : '<div class="empty-state">还没有错题 —— 默写时会自动记录答错的篇目。</div>') +
      '</section>' +
      '<section class="card">' +
        '<h3 class="section-title" style="font-size:1rem;">练习记录</h3>' +
        (rows || '<div class="empty-state">还没有练习记录，去做一组默写自测吧。</div>') +
      '</section>' +
      '<section class="card">' +
        '<h3 class="section-title" style="font-size:1rem;">数据来源与说明</h3>' +
        '<p class="tiny muted">初中：' + Utils.escapeHtml(Meta.sources.junior.name) + '（' + Utils.escapeHtml(Meta.sources.junior.detail) + '）</p>' +
        '<p class="tiny muted">高中：' + Utils.escapeHtml(Meta.sources.senior.name) + '（' + Utils.escapeHtml(Meta.sources.senior.detail) + '）</p>' +
        '<p class="tiny muted">题库共 ' + DB.all().length + ' 篇，其中课标推荐 ' + DB.query({ onlyRequired: true }).length + ' 篇；所有正文均可人工核对后修改 data/ 目录下的数据文件。</p>' +
        '<div class="danger-zone">' +
          '<button type="button" class="btn btn-sm" data-action="reset">重置全部本地数据</button>' +
          '<span class="tiny muted" style="margin-left:0.5rem;">选中的篇目、进度、错题都会清空（不可恢复）。</span>' +
        '</div>' +
      '</section>';
  }

  /* ---------------- 渲染与事件 ---------------- */

  function updateHeader() {
    if (!els.subtitle) return;
    var summary = {
      stage: state.stage,
      selected: Storage.getState().selectedIds.length,
    };
    var title = VIEW_TITLES[state.view] || Meta.slogan;
    els.subtitle.textContent = title;
    if (els.meta) {
      els.meta.innerHTML = summary.stage
        ? '<span class="badge badge-primary">' + Utils.escapeHtml(summary.stage) + '</span><span class="badge">已选 ' + summary.selected + ' 篇</span>'
        : '';
    }
    if (els.back) {
      els.back.hidden = state.view === 'stage';
      els.back.setAttribute('aria-label', state.view === 'select' ? '返回选择学习阶段' : '返回');
    }
  }

  function render() {
    var container = document.createElement('div');
    container.className = 'view-inner';

    try {
      if (!DB.all().length) {
        container.innerHTML = '<section class="card"><div class="empty-state">题库为空：请在 data/junior.js、data/senior.js 中补充篇目数据。</div></section>';
      } else if (state.view === 'stage') renderStage(container);
      else if (state.view === 'select') renderSelect(container);
      else if (state.view === 'home') renderHome(container);
      else if (state.view === 'study') {
        var studyList = selectedPoems();
        var lastPoem = hashParam('poem') || global.PoetryStudy.currentPoemId();
        var inList = studyList.some(function (poem) {
          return poem.id === lastPoem;
        });
        global.PoetryStudy.mount(container, {
          list: studyList,
          poemId: inList ? lastPoem : '',
        });
      } else if (state.view === 'quiz') {
        global.PoetryQuiz.mount(container, {
          list: selectedPoems(),
          focusPoemId: hashParam('poem'),
          onProgress: updateHeader,
        });
      } else if (state.view === 'progress') renderProgress(container);
    } catch (err) {
      console.error('[渲染失败]', err);
      container.innerHTML =
        '<section class="card"><div class="empty-state">页面渲染出现异常，已保护性停止。<br>可以点击下方按钮重置本地数据后重试。</div>' +
        '<div style="margin-top:0.9rem;display:flex;gap:0.5rem;justify-content:center;"><button type="button" class="btn btn-sm" data-safe="home">返回首页</button><button type="button" class="btn btn-sm" data-safe="reset">重置本地数据</button></div></section>';
    }

    els.root.innerHTML = '';
    els.root.appendChild(container);
    updateHeader();
    if (global.PoetryBrand && global.PoetryBrand.refresh) {
      try {
        global.PoetryBrand.refresh();
      } catch (err) {
        /* 品牌层异常不影响主流程 */
      }
    }
  }

  function handleGlobalClick(event) {
    var target = event.target;
    var el = target.closest ? target.closest('[data-stage],[data-action],[data-poem],[data-remove],[data-filter],[data-study],[data-practice],[data-remove-wrong],[data-safe]') : null;
    if (!el) return;

    if (el.hasAttribute('data-stage')) {
      state.stage = el.getAttribute('data-stage');
      Storage.patch({ stage: state.stage });
      state.filters = { keyword: '', grade: [], genre: [], sourceType: [] };
      navigate('select');
      return;
    }
    if (el.hasAttribute('data-filter')) {
      var key = el.getAttribute('data-filter');
      var value = el.getAttribute('data-value') || '';
      // 年级 / 课程模块、体裁、来源都支持多选：点“全部”清空，点某一项将其加入或移出
      if (!value) {
        state.filters[key] = [];
      } else {
        var picked = state.filters[key].slice();
        var pickedIndex = picked.indexOf(value);
        if (pickedIndex === -1) picked.push(value);
        else picked.splice(pickedIndex, 1);
        state.filters[key] = picked;
      }
      render();
      return;
    }
    if (el.hasAttribute('data-poem')) {
      var id = el.getAttribute('data-poem');
      var ids = Storage.getState().selectedIds.slice();
      var index = ids.indexOf(id);
      if (index === -1) ids.push(id);
      else ids.splice(index, 1);
      Storage.patch({ selectedIds: ids });
      render();
      return;
    }
    if (el.hasAttribute('data-remove')) {
      var removeId = el.getAttribute('data-remove');
      Storage.patch({
        selectedIds: Storage.getState().selectedIds.filter(function (item) {
          return item !== removeId;
        }),
      });
      render();
      return;
    }
    if (el.hasAttribute('data-study')) {
      navigate('study', '?poem=' + encodeURIComponent(el.getAttribute('data-study')));
      return;
    }
    if (el.hasAttribute('data-practice')) {
      /* 只练这一篇：错误次数由判分逻辑维护，打开练习本身不算答错 */
      navigate('quiz', '?poem=' + encodeURIComponent(el.getAttribute('data-practice')));
      return;
    }
    if (el.hasAttribute('data-remove-wrong')) {
      Storage.removeWrong(el.getAttribute('data-remove-wrong'));
      toast('已从错题本移除');
      render();
      return;
    }
    if (el.hasAttribute('data-safe')) {
      if (el.getAttribute('data-safe') === 'reset') {
        Storage.reset();
        toast('本地数据已重置');
      }
      navigate('stage');
      return;
    }

    // data-action
    var action = el.getAttribute('data-action');
    if (action === 'continue') {
      var savedStage = Storage.getState().stage;
      if (!savedStage) {
        var first = Storage.getState().selectedIds[0];
        var poem = first ? DB.byId(first) : null;
        savedStage = poem ? poem.stage : '';
      }
      if (!savedStage) return;
      state.stage = savedStage;
      navigate('home');
    } else if (action === 'to-select') {
      navigate('select');
    } else if (action === 'study') {
      navigate('study');
    } else if (action === 'quiz' || action === 'quiz-wrong') {
      navigate('quiz');
    } else if (action === 'progress') {
      navigate('progress');
    } else if (action === 'start') {
      if (!Storage.getState().selectedIds.length) {
        toast('请先勾选至少一篇要背诵的篇目');
        return;
      }
      navigate('home');
    } else if (action === 'select-all') {
      var filteredIds = DB.query({
        stage: state.stage,
        grade: state.filters.grade,
        genre: state.filters.genre,
        sourceType: state.filters.sourceType,
        keyword: state.filters.keyword,
      }).map(function (poem) {
        return poem.id;
      });
      Storage.patch({ selectedIds: Utils.unique(Storage.getState().selectedIds.concat(filteredIds)) });
      render();
    } else if (action === 'select-none') {
      var stageIds = DB.byStage(state.stage).map(function (poem) {
        return poem.id;
      });
      Storage.patch({
        selectedIds: Storage.getState().selectedIds.filter(function (id) {
          return stageIds.indexOf(id) === -1;
        }),
      });
      render();
    } else if (action === 'select-required') {
      var requiredIds = DB.byStage(state.stage)
        .filter(function (poem) {
          return poem.required;
        })
        .map(function (poem) {
          return poem.id;
        });
      Storage.patch({ selectedIds: Utils.unique(Storage.getState().selectedIds.concat(requiredIds)) });
      toast('已选中课标必背篇目 ' + requiredIds.length + ' 篇');
      render();
    } else if (action === 'clear-search') {
      state.filters.keyword = '';
      var input = document.getElementById('poemSearch');
      if (input) input.value = '';
      refreshSelectResults();
    } else if (action === 'reset') {
      if (global.confirm('确定要清空全部本地学习数据吗？此操作不可恢复。')) {
        Storage.reset();
        toast('本地数据已重置');
        navigate('stage');
      }
    }
  }

  function handleGlobalInput(event) {
    if (event.target && event.target.id === 'poemSearch') {
      state.filters.keyword = event.target.value;
      debouncedSearch();
    }
  }

  var debouncedSearch = Utils.debounce(function () {
    refreshSelectResults();
  }, 120);

  function goBack() {
    if (state.view === 'study' || state.view === 'quiz' || state.view === 'progress') navigate('home');
    else if (state.view === 'home') navigate('select');
    else if (state.view === 'select') navigate('stage');
  }

  function handleHashChange() {
    var rawHash = global.location.hash || '';
    var hash = rawHash.replace(/^#\/?/, '');
    var parts = hash.split('?');
    var view = parts[0] || '';
    if (VIEWS.indexOf(view) === -1) return;
    if (!state.stage) {
      var savedStage = Storage.getState().stage;
      if (savedStage) state.stage = savedStage;
    }
    if (!canShow(view)) {
      navigate(canShow('select') ? 'select' : 'stage');
      return;
    }
    /* 同一个视图但 ?poem= 变了（例如手改地址栏、外部链接）也要重新渲染，
       否则只练某一篇 / 学习某一篇的链接会停留在旧状态。 */
    if (state.view !== view || rawHash !== lastHash) {
      state.view = view;
      lastHash = rawHash;
      render();
      if (global.scrollTo) global.scrollTo(0, 0);
    }
  }

  function boot() {
    els.root = document.getElementById('viewRoot');
    els.toast = document.getElementById('toast');
    els.subtitle = document.getElementById('headerSubtitle');
    els.meta = document.getElementById('headerMeta');
    els.back = document.getElementById('headerBack');
    els.themeToggle = document.getElementById('themeToggle');

    var saved = Storage.load();
    state.stage = saved.stage || '';

    applyTheme(readTheme());
    if (els.themeToggle) els.themeToggle.addEventListener('click', toggleTheme);

    if (global.PoetryBrand && global.PoetryBrand.install) {
      try {
        global.PoetryBrand.install();
      } catch (err) {
        console.warn('[品牌层] 初始化失败', err);
      }
    }

    var issue = Storage.getLoadIssue();
    if (issue) toast(issue);

    var hash = (global.location.hash || '').replace(/^#\/?/, '').split('?')[0];
    if (VIEWS.indexOf(hash) !== -1 && canShow(hash)) state.view = hash;
    else if (saved.selectedIds.length && state.stage) state.view = 'home';
    else state.view = 'stage';
    lastHash = global.location.hash || '';

    document.addEventListener('click', handleGlobalClick);
    document.addEventListener('input', handleGlobalInput);
    global.addEventListener('hashchange', handleHashChange);
    if (els.back) els.back.addEventListener('click', goBack);

    render();

    if (DB.problems && DB.problems.length) {
      console.warn('[题库校验]', DB.problems.join('\n'));
    }
  }

  global.PoetryApp = {
    toast: toast,
    navigate: navigate,
    render: render,
    getState: function () {
      return state;
    },
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);
  </script>
</body>
</html>
