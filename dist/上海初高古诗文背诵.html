/* 古诗文背诵学习系统 —— 基础样式
   设计语言参考「英语语法填空练习（English Grammar Lab）」：
   玻璃卡片 + 蓝紫渐变主色 + 深色模式 + 圆角胶囊。 */

/* ============ 主题变量 ============ */

:root {
  --bg1: #f4f7ff;
  --bg2: #eef2ff;
  --bg3: #eae6ff;
  --ink: #101528;
  --ink-dim: #4a5470;
  --ink-faint: #7c86a4;
  --glass: rgba(255, 255, 255, 0.72);
  --glass-strong: rgba(255, 255, 255, 0.9);
  --stroke: rgba(16, 21, 40, 0.1);
  --stroke-strong: rgba(16, 21, 40, 0.16);
  --accent: #4a6cf7;
  --accent2: #7c5cff;
  --accent-ink: #3550c8;
  --accent-bg: rgba(74, 108, 247, 0.12);
  --ok: #0f9d63;
  --ok-bg: rgba(15, 157, 99, 0.12);
  --bad: #e11d48;
  --bad-bg: rgba(225, 29, 72, 0.12);
  --warn: #a15c07;
  --warn-bg: rgba(245, 158, 11, 0.16);
  --glow: #b06a00;
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 9px;
  --shadow: 0 18px 44px rgba(24, 32, 72, 0.12);
  --shadow-sm: 0 6px 18px rgba(24, 32, 72, 0.08);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --topbar: rgba(247, 249, 255, 0.82);
  --tap-min: 2.75rem;
  --font-serif: "Songti SC", "SimSun", "Noto Serif SC", "Source Han Serif SC", serif;
  color-scheme: light;

  /* 兼容旧变量名（组件层继续复用） */
  --bg-main: var(--bg1);
  --bg-soft: rgba(16, 21, 40, 0.05);
  --text-main: var(--ink);
  --text-dark: var(--ink);
  --text-muted: var(--ink-dim);
  --text-faint: var(--ink-faint);
  --text-info: var(--ink-dim);
  --primary: var(--accent);
  --primary-hover: var(--accent-ink);
  --primary-bg: var(--accent-bg);
  --primary-border: rgba(74, 108, 247, 0.32);
  --success: var(--ok);
  --success-hover: var(--ok);
  --success-bg: var(--ok-bg);
  --danger: var(--bad);
  --danger-bg: var(--bad-bg);
  --card-bg: var(--glass);
  --border-color: var(--stroke);
  --border-soft: var(--stroke);
  --radius-lg: var(--radius);
  --radius-md: var(--radius-sm);
  --shadow-md: var(--shadow);
}

html[data-theme='dark'] {
  --bg1: #0b1020;
  --bg2: #141a33;
  --bg3: #1d2450;
  --ink: #eef1fb;
  --ink-dim: #b8c2e0;
  --ink-faint: #8e9abf;
  --glass: rgba(255, 255, 255, 0.055);
  --glass-strong: rgba(255, 255, 255, 0.09);
  --stroke: rgba(255, 255, 255, 0.13);
  --stroke-strong: rgba(255, 255, 255, 0.2);
  --accent: #5b8cff;
  --accent2: #7c6bff;
  --accent-ink: #a8c0ff;
  --accent-bg: rgba(91, 140, 255, 0.16);
  --ok: #3ecf8e;
  --ok-bg: rgba(62, 207, 142, 0.14);
  --bad: #ff5d7a;
  --bad-bg: rgba(255, 93, 122, 0.14);
  --warn: #ffb84d;
  --warn-bg: rgba(255, 184, 77, 0.14);
  --glow: #ffe082;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
  --shadow-sm: 0 8px 22px rgba(0, 0, 0, 0.32);
  --topbar: rgba(10, 14, 30, 0.72);
  --bg-soft: rgba(255, 255, 255, 0.06);
  --primary-border: rgba(91, 140, 255, 0.42);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  background-color: var(--bg1);
  color-scheme: light;
}
html[data-theme='dark'] { color-scheme: dark; }

body {
  margin: 0;
  color: var(--ink);
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background: transparent;
}

/* 背景光晕层：单独铺满可视区，滚动时不会露出白边 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(1100px 620px at 85% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
    radial-gradient(900px 560px at -10% 110%, color-mix(in srgb, var(--accent2) 20%, transparent), transparent 55%),
    linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
}

button, input, select { font-family: inherit; }

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--glass-strong);
  padding: 0.5rem 1rem;
  border-radius: var(--radius-sm);
  z-index: 90;
}
.skip-link:focus { left: 0.5rem; top: 0.5rem; }

.app {
  max-width: 68rem;
  margin: 0 auto;
  padding: 0 0.9rem 3rem;
}

/* ============ 顶栏 ============ */

.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  margin: 0 -0.9rem 1rem;
  padding: 0.55rem 0.9rem;
  background: var(--topbar);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border-bottom: 1px solid var(--stroke);
}

.app-header-inner {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  max-width: 68rem;
  margin: 0 auto;
}

.header-back {
  flex: none;
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 12px;
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  color: var(--ink-dim);
  font-size: 1.05rem;
  line-height: 1;
  cursor: pointer;
  transition: color 0.18s var(--ease), border-color 0.18s var(--ease), transform 0.15s var(--ease);
}
.header-back:hover { color: var(--accent); border-color: var(--primary-border); }
.header-back:active { transform: scale(0.95); }

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
  flex: 1;
}

.brand-logo {
  flex: none;
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 1.05rem;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent);
}

.app-title-box {
  min-width: 0;
  max-width: 34rem;
  overflow: hidden;
  opacity: 1;
  transition: max-width 0.3s var(--ease), opacity 0.24s var(--ease);
}

.app-title {
  margin: 0;
  font-size: 1.0625rem;
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.app-subtitle {
  margin: 0;
  font-size: 0.6875rem;
  color: var(--ink-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-actions {
  flex: none;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.75rem;
  color: var(--ink-dim);
}

.icon-btn {
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 12px;
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  color: var(--ink-dim);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: color 0.18s var(--ease), border-color 0.18s var(--ease), transform 0.15s var(--ease);
}
.icon-btn:hover { color: var(--accent); border-color: var(--primary-border); }
.icon-btn:active { transform: scale(0.95); }

@media (max-width: 560px) {
  /* 窄屏（含竖屏手机）：标题与小标题一起收起，只留左上角图标 */
  .brand-lockup { gap: 0; }
  .brand-lockup .app-title-box { max-width: 0; opacity: 0; }
}

/* 竖屏（手机 / 平板）：同样只留图标，旋转屏幕时带动画收起 / 展开 */
@media (max-width: 900px) and (orientation: portrait) {
  .brand-lockup { gap: 0; }
  .brand-lockup .app-title-box { max-width: 0; opacity: 0; }
}

/* ============ 卡片与通用排版 ============ */

.card {
  background: var(--glass);
  border: 1px solid var(--stroke);
  border-radius: var(--radius);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  box-shadow: var(--shadow-sm);
  padding: 1.05rem;
}

.card + .card, .card + .feature-grid, .feature-grid + .card { margin-top: 0.9rem; }

.section-title {
  margin: 0 0 0.25rem;
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: 0.2px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.section-title .ico { font-size: 1.15rem; }

.section-desc {
  margin: 0;
  font-size: 0.8125rem;
  color: var(--ink-dim);
}

.muted { color: var(--ink-dim); }
.tiny { font-size: 0.75rem; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.1rem 0.5rem;
  border-radius: 999px;
  font-size: 0.6875rem;
  font-weight: 700;
  background: var(--glass-strong);
  color: var(--ink-dim);
  border: 1px solid var(--stroke);
  white-space: nowrap;
}
.badge-primary { background: var(--accent-bg); color: var(--accent-ink); border-color: var(--primary-border); }
.badge-success { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 34%, transparent); }
.badge-warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 34%, transparent); }
.badge-danger { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 34%, transparent); }

/* ============ 按钮 ============ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-height: var(--tap-min);
  padding: 0.5rem 1rem;
  border-radius: 14px;
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  color: var(--ink);
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s var(--ease), filter 0.18s var(--ease), box-shadow 0.2s var(--ease), border-color 0.18s var(--ease), color 0.18s var(--ease);
}
.btn:hover { border-color: var(--primary-border); color: var(--accent); }
.btn:active { transform: scale(0.96); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn[disabled]:active { transform: none; }

.btn-primary {
  border-color: transparent;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 32%, transparent);
}
.btn-primary:hover { color: #fff; filter: brightness(1.06); }

.btn-success {
  border-color: transparent;
  color: #052; /* 深色文字保证浅色底可读，暗色主题下由滤镜修正 */
  background: linear-gradient(135deg, color-mix(in srgb, var(--ok) 82%, #fff), var(--ok));
  box-shadow: 0 10px 24px color-mix(in srgb, var(--ok) 28%, transparent);
}
html[data-theme='dark'] .btn-success { color: #06231a; }
.btn-success:hover { filter: brightness(1.05); }

.btn-sm { min-height: 2.3rem; padding: 0.3rem 0.75rem; font-size: 0.8125rem; border-radius: 12px; }

.btn:focus-visible,
.chip:focus-visible,
.poem-card:focus-visible,
.line-item:focus-visible,
.hint-item:focus-visible,
.stage-card:focus-visible,
.feature-card:focus-visible,
.icon-btn:focus-visible,
.header-back:focus-visible,
.brand-seal:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ============ 胶囊标签（筛选 / 选项） ============ */

.chips { display: flex; flex-wrap: wrap; gap: 0.375rem; }

.chip {
  border: 1px solid var(--stroke);
  background: var(--glass);
  color: var(--ink-dim);
  padding: 0.35rem 0.75rem;
  border-radius: 999px;
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 2.25rem;
  transition: color 0.18s var(--ease), border-color 0.18s var(--ease), background 0.18s var(--ease);
}
.chip:hover { border-color: var(--primary-border); color: var(--accent); }
.chip.active {
  background: var(--accent-bg);
  border-color: var(--primary-border);
  color: var(--accent-ink);
}

/* ============ 表单 ============ */

.toolbar { display: grid; gap: 0.7rem; }

.search-box {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--glass-strong);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  padding: 0 0.75rem;
}
.search-box input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  font-size: 0.9375rem;
  padding: 0.7rem 0;
  background: transparent;
  color: var(--ink);
}
.search-box input::placeholder { color: var(--ink-faint); }
.search-box .search-clear {
  border: none;
  background: none;
  color: var(--ink-faint);
  cursor: pointer;
  font-size: 1rem;
  padding: 0.5rem;
}

.filter-group { display: grid; gap: 0.4rem; }
.filter-label { font-size: 0.75rem; font-weight: 700; color: var(--ink-faint); }

select {
  width: 100%;
  min-height: var(--tap-min);
  border-radius: 14px;
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  padding: 0.5rem 0.7rem;
  font-size: 0.9375rem;
  color: var(--ink);
}

.empty-state {
  text-align: center;
  padding: 2.25rem 1rem;
  color: var(--ink-dim);
  font-size: 0.875rem;
}

/* ============ 首页 Hero ============ */

.hero { position: relative; overflow: hidden; }
.hero::after {
  content: "";
  position: absolute;
  right: -60px;
  top: -80px;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent2) 34%, transparent), transparent 70%);
  pointer-events: none;
}
.hero-kicker {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
  margin: 0 0 0.35rem;
}
.hero-title {
  margin: 0;
  font-size: 1.5rem;
  line-height: 1.35;
  font-weight: 800;
  letter-spacing: 0.3px;
  color: var(--ink);
}
.hero-title .accent {
  background: linear-gradient(120deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-sub {
  margin: 0.4rem 0 0;
  font-size: 0.875rem;
  color: var(--ink-dim);
  max-width: 44rem;
}
/* 作者品牌小标签（由 brand.js 注入，视图重渲染后自动补回） */
.brand-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.85rem;
  padding: 0.3rem 0.7rem;
  border-radius: 999px;
  border: 1px dashed var(--stroke-strong);
  background: var(--glass-strong);
  color: var(--ink-dim);
  font-size: 0.75rem;
  cursor: pointer;
  max-width: 100%;
  flex-wrap: wrap;
}
.brand-chip:hover { color: var(--accent); border-color: var(--primary-border); }
.brand-chip .dot { color: var(--ink-faint); }

/* ============ 学段选择 ============ */

.stage-grid {
  display: grid;
  gap: 0.9rem;
  grid-template-columns: 1fr;
  margin-top: 0.9rem;
}
@media (min-width: 640px) { .stage-grid { grid-template-columns: 1fr 1fr; } }

.stage-card {
  position: relative;
  text-align: left;
  cursor: pointer;
  padding: 1.2rem;
  border-radius: var(--radius);
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s var(--ease), border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  min-height: 8.5rem;
  overflow: hidden;
}
.stage-card::after {
  content: "";
  position: absolute;
  inset: auto -30% -60% auto;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
  pointer-events: none;
}
.stage-card:hover { border-color: var(--primary-border); box-shadow: var(--shadow); transform: translateY(-2px); }
.stage-card:active { transform: translateY(0); }
.stage-card .sc-ico { font-size: 1.6rem; }
.stage-card h3 { margin: 0.35rem 0 0.15rem; font-size: 1.35rem; color: var(--ink); }
.stage-card p { margin: 0; font-size: 0.8125rem; color: var(--ink-dim); }
.stage-card .stage-stat { margin-top: 0.75rem; }
.stage-card .sc-go {
  margin-top: 0.7rem;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--accent);
}

/* ============ 篇目选择 ============ */

.select-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
}
.select-summary { margin-left: auto; font-size: 0.8125rem; font-weight: 700; color: var(--accent-ink); }

.selected-panel { margin-top: 0.25rem; }
.selected-panel summary {
  cursor: pointer;
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--ink-dim);
  min-height: 2.25rem;
  display: flex;
  align-items: center;
}
.selected-list { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }
.selected-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: var(--glass-strong);
  border: 1px solid var(--stroke);
  border-radius: 999px;
  padding: 0.25rem 0.5rem 0.25rem 0.7rem;
  font-size: 0.8125rem;
}
.selected-chip button {
  border: none;
  background: none;
  color: var(--ink-faint);
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  padding: 0.2rem 0.3rem;
}
.selected-chip button:hover { color: var(--bad); }

.group-block { margin-top: 1.15rem; }
.group-heading {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8125rem;
  font-weight: 800;
  color: var(--ink-dim);
  border-bottom: 1px solid var(--stroke);
  padding-bottom: 0.35rem;
  margin-bottom: 0.6rem;
}
.group-heading .group-line { flex: 1; height: 1px; background: var(--stroke); }

.poem-grid { display: grid; gap: 0.5rem; grid-template-columns: 1fr; }
@media (min-width: 640px) { .poem-grid { grid-template-columns: 1fr 1fr; } }

.poem-card {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  text-align: left;
  padding: 0.7rem 0.8rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--stroke);
  background: var(--glass);
  cursor: pointer;
  min-height: var(--tap-min);
  transition: border-color 0.18s var(--ease), background 0.18s var(--ease), transform 0.15s var(--ease);
}
.poem-card:hover { border-color: var(--primary-border); transform: translateY(-1px); }
.poem-card.checked { background: var(--accent-bg); border-color: var(--primary-border); }
.poem-card .check {
  flex: none;
  width: 1.15rem;
  height: 1.15rem;
  margin-top: 0.2rem;
  border-radius: 0.35rem;
  border: 1.5px solid var(--stroke-strong);
  background: transparent;
  display: grid;
  place-items: center;
  font-size: 0.75rem;
  color: #fff;
}
.poem-card.checked .check {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-color: transparent;
}
.poem-card .poem-main { min-width: 0; flex: 1; }
.poem-card .poem-title { font-weight: 700; color: var(--ink); font-size: 0.9375rem; display: block; }
.poem-card .poem-sub { font-size: 0.75rem; color: var(--ink-dim); margin-top: 0.1rem; display: block; }
.poem-card .poem-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.35rem; }

/* ============ 工作台 ============ */

.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
  gap: 0.6rem;
  margin-top: 0.85rem;
}
.stat-box {
  background: var(--glass-strong);
  border: 1px solid var(--stroke);
  border-radius: var(--radius-sm);
  padding: 0.7rem 0.8rem;
}
.stat-box .stat-num { font-size: 1.35rem; font-weight: 800; color: var(--ink); line-height: 1.3; }
.stat-box .stat-label { font-size: 0.6875rem; color: var(--ink-faint); }

.bar {
  height: 0.5rem;
  background: var(--glass-strong);
  border: 1px solid var(--stroke);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 0.6rem;
}
.bar > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 999px;
  transition: width 0.35s var(--ease);
}

.feature-grid { display: grid; gap: 0.7rem; grid-template-columns: 1fr; margin-top: 0.9rem; }

.feature-card {
  text-align: left;
  cursor: pointer;
  padding: 1.1rem 1rem;
  border-radius: var(--radius);
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  box-shadow: var(--shadow-sm);
  min-height: 5.4rem;
  transition: transform 0.2s var(--ease), border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
.feature-card:hover { border-color: var(--primary-border); box-shadow: var(--shadow); transform: translateY(-2px); }
.feature-card:active { transform: translateY(0); }
.feature-card .fc-ico {
  width: 2.3rem;
  height: 2.3rem;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 1.15rem;
  background: var(--accent-bg);
  border: 1px solid var(--primary-border);
  margin-bottom: 0.5rem;
}
.feature-card h3 { margin: 0 0 0.15rem; font-size: 1rem; color: var(--ink); }
.feature-card p { margin: 0; font-size: 0.8125rem; color: var(--ink-dim); }

/* ============ 全文学习 ============ */

.study-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

.poem-switch { margin-bottom: 0.75rem; }

.poem-head { border-bottom: 1px dashed var(--stroke); padding-bottom: 0.75rem; margin-bottom: 0.75rem; }
.poem-head h2 { margin: 0; font-size: 1.3rem; color: var(--ink); }
.poem-head .poem-byline { font-size: 0.8125rem; color: var(--ink-dim); margin-top: 0.2rem; }
.poem-head .poem-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.5rem; }

.poem-body {
  font-family: var(--font-serif);
  font-size: 1.0625rem;
  line-height: 2;
  color: var(--ink);
}

.line-item {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  border-radius: var(--radius-xs);
  padding: 0.35rem 0.5rem;
  margin: 0 -0.5rem;
  font: inherit;
  color: inherit;
  cursor: pointer;
  transition: background 0.18s var(--ease), color 0.18s var(--ease), border-color 0.18s var(--ease);
}
.line-item:hover { background: var(--glass-strong); }
.line-item.is-hidden .line-text { color: var(--ink-faint); letter-spacing: 0.08em; }
.line-item.is-active { background: var(--accent-bg); border-color: var(--primary-border); }
.hint-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.75rem;
}

.poem-meta-block { margin-top: 1rem; font-size: 0.8125rem; color: var(--ink-dim); }
.poem-meta-block dt { font-weight: 700; color: var(--ink-faint); margin-top: 0.5rem; }
.poem-meta-block dd { margin: 0.15rem 0 0; }

.hint-list { display: grid; gap: 0.3rem; margin-top: 0.35rem; }
.hint-item {
  text-align: left;
  font-size: 0.8125rem;
  color: var(--ink-dim);
  background: var(--glass-strong);
  border: 1px solid var(--stroke);
  border-radius: var(--radius-xs);
  padding: 0.4rem 0.55rem;
  cursor: pointer;
  transition: color 0.18s var(--ease), border-color 0.18s var(--ease);
}
.hint-item:hover { color: var(--accent); border-color: var(--primary-border); }

/* ============ 默写自测 ============ */

.quiz-settings { display: grid; gap: 0.75rem; }
.quiz-mode-list { display: grid; gap: 0.4rem; }
.mode-option {
  display: flex;
  gap: 0.5rem;
  align-items: flex-start;
  font-size: 0.875rem;
  cursor: pointer;
  padding: 0.5rem 0.55rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--stroke);
  background: var(--glass);
  transition: border-color 0.18s var(--ease), background 0.18s var(--ease);
}
.mode-option:hover { border-color: var(--primary-border); }
.mode-option input { margin-top: 0.28rem; accent-color: var(--accent); width: 1rem; height: 1rem; }
.mode-option .mode-desc { display: block; font-size: 0.75rem; color: var(--ink-dim); font-weight: 400; }
.mode-option:has(input:checked) { background: var(--accent-bg); border-color: var(--primary-border); }

.quiz-card {
  background: var(--glass);
  border: 1px solid var(--stroke);
  border-radius: var(--radius);
  backdrop-filter: blur(14px) saturate(1.15);
  -webkit-backdrop-filter: blur(14px) saturate(1.15);
  box-shadow: var(--shadow-sm);
  padding: 1rem;
}
.quiz-card + .quiz-card { margin-top: 0.75rem; }

.card-header { display: flex; align-items: flex-start; gap: 0.75rem; }
.card-meta {
  font-size: 0.75rem;
  color: var(--ink-faint);
  font-weight: 600;
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  align-items: center;
}

.question-text {
  font-family: var(--font-serif);
  font-size: 1.0625rem;
  line-height: 1.9;
  color: var(--ink);
  margin-top: 0.35rem;
  word-break: break-word;
}
.question-text .blank-unit { color: var(--accent); letter-spacing: 0.1em; }
.question-text .context-hint { color: var(--ink-faint); }

.btn-eye {
  flex: none;
  border: 1px solid var(--stroke);
  background: var(--glass-strong);
  color: var(--ink-dim);
  border-radius: 12px;
  width: 2.5rem;
  height: 2.5rem;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: color 0.18s var(--ease), border-color 0.18s var(--ease), transform 0.15s var(--ease);
}
.btn-eye:hover { color: var(--accent); border-color: var(--primary-border); }
.btn-eye:active { transform: scale(0.95); }
.btn-eye svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-eye .hidden { display: none; }

/* 沿用原项目的答案展开动画：grid-template-rows 0fr -> 1fr */
.answer-wrapper {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.22s var(--ease), opacity 0.18s ease;
  opacity: 0;
}
.answer-wrapper.show { grid-template-rows: 1fr; opacity: 1; margin-top: 0.6rem; }
.answer-content { overflow: hidden; }
.answer-inner {
  padding-top: 0.7rem;
  border-top: 1px dashed var(--stroke);
  font-family: var(--font-serif);
  font-size: 1rem;
  line-height: 1.9;
}
.answer-badge-text {
  color: var(--ok);
  font-weight: 700;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-items: baseline;
}
.answer-badge-text .answer-text { color: var(--ink); font-weight: 700; }

.grade-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; }

/* ============ 我的进度 ============ */

.progress-list { display: grid; gap: 0.5rem; margin-top: 0.75rem; }
.progress-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.65rem 0.75rem;
  background: var(--glass-strong);
  border: 1px solid var(--stroke);
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
}
.progress-item .pi-main { min-width: 0; }
.progress-item .pi-sub { font-size: 0.75rem; color: var(--ink-dim); }

.danger-zone { margin-top: 1.25rem; border-top: 1px solid var(--stroke); padding-top: 0.75rem; }

/* ============ 提示条 ============ */

.toast {
  position: fixed;
  left: 50%;
  bottom: 1.5rem;
  transform: translate(-50%, 1rem);
  background: var(--glass-strong);
  color: var(--ink);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 0.6rem 1.05rem;
  border-radius: 999px;
  font-size: 0.8125rem;
  max-width: min(90vw, 26rem);
  text-align: center;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
  z-index: 60;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
  .toast { bottom: 4.6rem; }   /* 避开右下角作者印章 */
}

/* ============ 动画 ============ */

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.view-inner { animation: fadeUp 0.28s var(--ease); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============ 适配 ============ */

@media (max-width: 420px) {
  body { font-size: 15px; }
  .app-title { font-size: 1rem; }
  .app-header { padding: 0.5rem 0.75rem; }
  .hero-title { font-size: 1.3rem; }
  .poem-body { font-size: 1rem; line-height: 1.95; }
  .brand-logo { width: 1.9rem; height: 1.9rem; border-radius: 10px; font-size: 0.95rem; }
}

@media (max-width: 540px) {
  .quiz-mode-list { grid-template-columns: 1fr 1fr; display: grid; gap: 0.35rem; }
  .mode-option { align-items: center; padding: 0.42rem 0.45rem; font-size: 0.8125rem; }
  .mode-option input { margin-top: 0; }
  .mode-option .mode-desc { display: none; }
  .stat-row { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 900px) {
  .feature-grid { grid-template-columns: repeat(4, 1fr); }
}

@media print {
  .app-header, .app-footer, .btn, .btn-eye, .study-toolbar, .brand-seal { display: none !important; }
  .answer-wrapper { grid-template-rows: 1fr; opacity: 1; }
  body::before { display: none; }
}

      text: '关关雎鸠，在河之洲。窈窕淑女，君子好逑。参差荇菜，左右流之。窈窕淑女，寤寐求之。求之不得，寤寐思服。悠哉悠哉，辗转反侧。参差荇菜，左右采之。窈窕淑女，琴瑟友之。参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第1篇',
      highlights: [{ type: '名句', text: '关关雎鸠，在河之洲。窈窕淑女，君子好逑。' }, { type: '名句', text: '求之不得，寤寐思服。悠哉悠哉，辗转反侧。' }],
      tags: ['诗经', '爱情'] },

    { id: 'jian-jia', title: '蒹葭', author: '《诗经》', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭萋萋，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第2篇',
      highlights: [{ type: '名句', text: '蒹葭苍苍，白露为霜。所谓伊人，在水一方。' }, { type: '易错字', text: '溯洄 晞 湄 跻 坻 涘 沚' }],
      tags: ['诗经'] },

    { id: 'shi-wu-cong-jun-zheng', title: '十五从军征', author: '《乐府诗集》', dynasty: '汉', stage: '初中', grade: '九年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '十五从军征，八十始得归。道逢乡里人：“家中有阿谁？”“遥看是君家，松柏冢累累。”兔从狗窦入，雉从梁上飞。中庭生旅谷，井上生旅葵。舂谷持作饭，采葵持作羹。羹饭一时熟，不知贻阿谁。出门东向看，泪落沾我衣。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第3篇',
      highlights: [{ type: '名句', text: '十五从军征，八十始得归。' }, { type: '易错字', text: '冢 狗窦 雉 旅葵 舂 羹' }],
      notes: '标题亦作《十五从军征》，属汉乐府。',
      variants: [{ label: '教材异文', text: '“不知贻阿谁”部分版本作“不知饴阿谁”（饴，同“贻”，赠送）。' }],
      tags: ['乐府'] },

    { id: 'guan-cang-hai', title: '观沧海', author: '曹操', dynasty: '东汉', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。幸甚至哉，歌以咏志。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第4篇',
      highlights: [{ type: '名句', text: '日月之行，若出其中；星汉灿烂，若出其里。' }, { type: '易错字', text: '碣石 澹澹 竦峙 萧瑟' }],
      tags: ['建安', '山水'] },

    { id: 'yin-jiu-qi-wu', title: '饮酒（其五）', author: '陶潜', dynasty: '东晋', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第5篇',
      highlights: [{ type: '名句', text: '采菊东篱下，悠然见南山。' }, { type: '易错字', text: '喧 辨' }],
      tags: ['田园'] },

    { id: 'mu-lan-shi', title: '木兰诗', author: '北朝民歌', dynasty: '南北朝', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵。军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄。愿为市鞍马，从此替爷征。东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边。不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头。不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床。脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第6篇',
      highlights: [{ type: '名句', text: '万里赴戎机，关山度若飞。' }, { type: '名句', text: '将军百战死，壮士十年归。' }, { type: '易错字', text: '杼 军帖 可汗 鞍鞯 辔头 溅溅 金柝 策勋 著我旧时裳 云鬓 帖花黄' }],
      notes: '课标作《木兰辞》，统编教材作《木兰诗》，为同一篇北朝民歌。',
      tags: ['乐府', '民歌'] },

    { id: 'song-du-shao-fu', title: '送杜少府之任蜀州', author: '王勃', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '城阙辅三秦，风烟望五津。与君离别意，同是宦游人。海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第7篇',
      highlights: [{ type: '名句', text: '海内存知己，天涯若比邻。' }],
      variants: [{ label: '版本差异', text: '“无为在歧路”部分版本作“无为在岐路”。' }],
      tags: ['送别'] },

    { id: 'deng-you-zhou-tai-ge', title: '登幽州台歌', author: '陈子昂', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '前不见古人，后不见来者。念天地之悠悠，独怆然而涕下！',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第8篇',
      highlights: [{ type: '名句', text: '念天地之悠悠，独怆然而涕下！' }, { type: '易错字', text: '怆然' }],
      tags: ['怀古'] },

    { id: 'ci-bei-gu-shan-xia', title: '次北固山下', author: '王湾', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '客路青山外，行舟绿水前。潮平两岸阔，风正一帆悬。海日生残夜，江春入旧年。乡书何处达？归雁洛阳边。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第9篇',
      highlights: [{ type: '名句', text: '海日生残夜，江春入旧年。' }, { type: '易错字', text: '归雁' }],
      variants: [{ label: '版本差异', text: '首句部分版本作“客路青山下”。' }],
      tags: ['羁旅'] },

    { id: 'shi-zhi-sai-shang', title: '使至塞上', author: '王维', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '单车欲问边，属国过居延。征蓬出汉塞，归雁入胡天。大漠孤烟直，长河落日圆。萧关逢候骑，都护在燕然。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第10篇',
      highlights: [{ type: '名句', text: '大漠孤烟直，长河落日圆。' }, { type: '易错字', text: '征蓬 候骑 燕然' }],
      tags: ['边塞'] },

    { id: 'wen-wang-chang-ling', title: '闻王昌龄左迁龙标遥有此寄', author: '李白', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '杨花落尽子规啼，闻道龙标过五溪。我寄愁心与明月，随君直到夜郎西。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第11篇',
      highlights: [{ type: '名句', text: '我寄愁心与明月，随君直到夜郎西。' }],
      variants: [{ label: '版本差异', text: '“随君直到夜郎西”部分版本作“随风直到夜郎西”。' }],
      tags: ['赠友'] },

    { id: 'xing-lu-nan-qi-yi', title: '行路难（其一）', author: '李白', dynasty: '唐', stage: '初中', grade: '九年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食，拔剑四顾心茫然。欲渡黄河冰塞川，将登太行雪满山。闲来垂钓碧溪上，忽复乘舟梦日边。行路难，行路难，多歧路，今安在？长风破浪会有时，直挂云帆济沧海。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第12篇',
      highlights: [{ type: '名句', text: '长风破浪会有时，直挂云帆济沧海。' }, { type: '易错字', text: '樽 羞 箸 歧路 沧' }],
      tags: ['言志'] },

    { id: 'huang-he-lou', title: '黄鹤楼', author: '崔颢', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。晴川历历汉阳树，芳草萋萋鹦鹉洲。日暮乡关何处是？烟波江上使人愁。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第13篇',
      highlights: [{ type: '名句', text: '日暮乡关何处是？烟波江上使人愁。' }, { type: '易错字', text: '萋萋 鹦鹉洲' }],
      variants: [{ label: '版本差异', text: '首句部分版本作“昔人已乘白云去”。' }],
      tags: ['登临'] },

    { id: 'wang-yue', title: '望岳', author: '杜甫', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '岱宗夫如何？齐鲁青未了。造化钟神秀，阴阳割昏晓。荡胸生曾云，决眦入归鸟。会当凌绝顶，一览众山小。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第14篇',
      highlights: [{ type: '名句', text: '会当凌绝顶，一览众山小。' }, { type: '易错字', text: '岱宗 决眦' }],
      variants: [{ label: '版本差异', text: '“荡胸生曾云”部分版本作“荡胸生层云”。' }],
      tags: ['登临'] },

    { id: 'chun-wang', title: '春望', author: '杜甫', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第15篇',
      highlights: [{ type: '名句', text: '烽火连三月，家书抵万金。' }, { type: '易错字', text: '搔 簪' }],
      tags: ['忧国'] },

    { id: 'mao-wu-wei-qiu-feng-suo-po-ge', title: '茅屋为秋风所破歌', author: '杜甫', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '八月秋高风怒号，卷我屋上三重茅。茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。南村群童欺我老无力，忍能对面为盗贼。公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。自经丧乱少睡眠，长夜沾湿何由彻！安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第16篇',
      highlights: [{ type: '名句', text: '安得广厦千万间，大庇天下寒士俱欢颜！' }, { type: '易错字', text: '挂罥 塘坳 俄顷 布衾 突兀' }],
      tags: ['民生'] },

    { id: 'bai-xue-ge', title: '白雪歌送武判官归京', author: '岑参', dynasty: '唐', stage: '初中', grade: '九年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '北风卷地白草折，胡天八月即飞雪。忽如一夜春风来，千树万树梨花开。散入珠帘湿罗幕，狐裘不暖锦衾薄。将军角弓不得控，都护铁衣冷难着。瀚海阑干百丈冰，愁云惨淡万里凝。中军置酒饮归客，胡琴琵琶与羌笛。纷纷暮雪下辕门，风掣红旗冻不翻。轮台东门送君去，去时雪满天山路。山回路转不见君，雪上空留马行处。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第17篇',
      highlights: [{ type: '名句', text: '忽如一夜春风来，千树万树梨花开。' }, { type: '名句', text: '山回路转不见君，雪上空留马行处。' }, { type: '易错字', text: '锦衾 瀚海 阑干 辕门 掣' }],
      tags: ['边塞', '送别'] },

    { id: 'chou-le-tian', title: '酬乐天扬州初逢席上见赠', author: '刘禹锡', dynasty: '唐', stage: '初中', grade: '九年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '巴山楚水凄凉地，二十三年弃置身。怀旧空吟闻笛赋，到乡翻似烂柯人。沉舟侧畔千帆过，病树前头万木春。今日听君歌一曲，暂凭杯酒长精神。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第18篇',
      highlights: [{ type: '名句', text: '沉舟侧畔千帆过，病树前头万木春。' }, { type: '易错字', text: '烂柯 畔' }],
      tags: ['酬赠'] },

    { id: 'mai-tan-weng', title: '卖炭翁', author: '白居易', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。卖炭得钱何所营？身上衣裳口中食。可怜身上衣正单，心忧炭贱愿天寒。夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇。翩翩两骑来是谁？黄衣使者白衫儿。手把文书口称敕，回车叱牛牵向北。一车炭，千余斤，宫使驱将惜不得。半匹红纱一丈绫，系向牛头充炭直。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第19篇',
      highlights: [{ type: '名句', text: '可怜身上衣正单，心忧炭贱愿天寒。' }, { type: '易错字', text: '鬓 辗 辙 敕 叱 绫 炭直' }],
      tags: ['讽喻'] },

    { id: 'qian-tang-hu-chun-xing', title: '钱塘湖春行', author: '白居易', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '孤山寺北贾亭西，水面初平云脚低。几处早莺争暖树，谁家新燕啄春泥。乱花渐欲迷人眼，浅草才能没马蹄。最爱湖东行不足，绿杨阴里白沙堤。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第20篇',
      highlights: [{ type: '名句', text: '几处早莺争暖树，谁家新燕啄春泥。' }, { type: '易错字', text: '莺 啄 没马蹄 堤' }],
      tags: ['写景'] },

    { id: 'yan-men-tai-shou-xing', title: '雁门太守行', author: '李贺', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '黑云压城城欲摧，甲光向日金鳞开。角声满天秋色里，塞上燕脂凝夜紫。半卷红旗临易水，霜重鼓寒声不起。报君黄金台上意，提携玉龙为君死。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第21篇',
      highlights: [{ type: '名句', text: '黑云压城城欲摧，甲光向日金鳞开。' }, { type: '易错字', text: '燕脂 提携' }],
      tags: ['边塞'] },

    { id: 'chi-bi', title: '赤壁', author: '杜牧', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '折戟沉沙铁未销，自将磨洗认前朝。东风不与周郎便，铜雀春深锁二乔。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第22篇',
      highlights: [{ type: '名句', text: '东风不与周郎便，铜雀春深锁二乔。' }, { type: '易错字', text: '折戟 销' }],
      tags: ['咏史'] },

    { id: 'bo-qin-huai', title: '泊秦淮', author: '杜牧', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '烟笼寒水月笼沙，夜泊秦淮近酒家。商女不知亡国恨，隔江犹唱后庭花。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第23篇',
      highlights: [{ type: '名句', text: '商女不知亡国恨，隔江犹唱后庭花。' }],
      tags: ['咏史'] },

    { id: 'ye-yu-ji-bei', title: '夜雨寄北', author: '李商隐', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第24篇',
      highlights: [{ type: '名句', text: '何当共剪西窗烛，却话巴山夜雨时。' }],
      tags: ['思念'] },

    { id: 'wu-ti', title: '无题', author: '李商隐', dynasty: '唐', stage: '初中', grade: '九年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。晓镜但愁云鬓改，夜吟应觉月光寒。蓬山此去无多路，青鸟殷勤为探看。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第25篇',
      highlights: [{ type: '名句', text: '春蚕到死丝方尽，蜡炬成灰泪始干。' }, { type: '易错字', text: '鬓 殷勤' }],
      tags: ['爱情'] },

    { id: 'xiang-jian-huan', title: '相见欢（无言独上西楼）', author: '李煜', dynasty: '五代', stage: '初中', grade: '九年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '无言独上西楼，月如钩。寂寞梧桐深院锁清秋。剪不断，理还乱，是离愁，别是一般滋味在心头。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第26篇',
      highlights: [{ type: '名句', text: '剪不断，理还乱，是离愁，别是一般滋味在心头。' }],
      notes: '课标推荐篇目，但课标只规定 7~9 年级、未指定具体年级；按中考复习阶段归入九年级。',
      variants: [{ label: '版本差异', text: '“别是一般滋味在心头”部分版本作“别有一番滋味在心头”。' }],
      tags: ['词'] },

    { id: 'yu-jia-ao-qiu-si', title: '渔家傲（塞下秋来风景异）', author: '范仲淹', dynasty: '北宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '塞下秋来风景异，衡阳雁去无留意。四面边声连角起，千嶂里，长烟落日孤城闭。浊酒一杯家万里，燕然未勒归无计。羌管悠悠霜满地，人不寐，将军白发征夫泪。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第27篇',
      highlights: [{ type: '名句', text: '浊酒一杯家万里，燕然未勒归无计。' }, { type: '易错字', text: '衡阳 千嶂 勒 羌管 寐' }],
      tags: ['边塞', '词'] },

    { id: 'huan-xi-sha', title: '浣溪沙（一曲新词酒一杯）', author: '晏殊', dynasty: '北宋', stage: '初中', grade: '八年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？无可奈何花落去，似曾相识燕归来。小园香径独徘徊。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第28篇',
      highlights: [{ type: '名句', text: '无可奈何花落去，似曾相识燕归来。' }],
      tags: ['词'] },

    { id: 'deng-fei-lai-feng', title: '登飞来峰', author: '王安石', dynasty: '北宋', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '飞来山上千寻塔，闻说鸡鸣见日升。不畏浮云遮望眼，自缘身在最高层。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第29篇',
      highlights: [{ type: '名句', text: '不畏浮云遮望眼，自缘身在最高层。' }],
      variants: [{ label: '版本差异', text: '“自缘身在最高层”部分版本作“只缘身在最高层”。' }],
      tags: ['登临'] },

    { id: 'jiang-cheng-zi-mi-zhou-chu-lie', title: '江城子·密州出猎', author: '苏轼', dynasty: '北宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。酒酣胸胆尚开张。鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第30篇',
      highlights: [{ type: '名句', text: '会挽雕弓如满月，西北望，射天狼。' }, { type: '易错字', text: '擎苍 貂裘 千骑 酣 鬓 遣' }],
      tags: ['豪放', '词'] },

    { id: 'shui-diao-ge-tou', title: '水调歌头（明月几时有）', author: '苏轼', dynasty: '北宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第31篇',
      highlights: [{ type: '名句', text: '人有悲欢离合，月有阴晴圆缺，此事古难全。' }, { type: '名句', text: '但愿人长久，千里共婵娟。' }, { type: '易错字', text: '宫阙 琼楼玉宇 绮户 婵娟' }],
      tags: ['中秋', '词'] },

    { id: 'yu-jia-ao-tian-jie-yun-tao', title: '渔家傲（天接云涛连晓雾）', author: '李清照', dynasty: '宋', stage: '初中', grade: '八年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '天接云涛连晓雾，星河欲转千帆舞。仿佛梦魂归帝所。闻天语，殷勤问我归何处。我报路长嗟日暮，学诗谩有惊人句。九万里风鹏正举。风休住，蓬舟吹取三山去！',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第32篇',
      highlights: [{ type: '名句', text: '九万里风鹏正举。风休住，蓬舟吹取三山去！' }, { type: '易错字', text: '殷勤 嗟 谩 蓬舟' }],
      tags: ['词'] },

    { id: 'you-shan-xi-cun', title: '游山西村', author: '陆游', dynasty: '南宋', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '莫笑农家腊酒浑，丰年留客足鸡豚。山重水复疑无路，柳暗花明又一村。箫鼓追随春社近，衣冠简朴古风存。从今若许闲乘月，拄杖无时夜叩门。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第33篇',
      highlights: [{ type: '名句', text: '山重水复疑无路，柳暗花明又一村。' }, { type: '易错字', text: '豚 箫鼓 拄杖 叩门' }],
      tags: ['乡村'] },

    { id: 'nan-xiang-zi-deng-jing-kou', title: '南乡子·登京口北固亭有怀', author: '辛弃疾', dynasty: '南宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '何处望神州？满眼风光北固楼。千古兴亡多少事？悠悠。不尽长江滚滚流。年少万兜鍪，坐断东南战未休。天下英雄谁敌手？曹刘。生子当如孙仲谋。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第34篇',
      highlights: [{ type: '名句', text: '千古兴亡多少事？悠悠。不尽长江滚滚流。' }, { type: '易错字', text: '兜鍪 曹刘 孙仲谋' }],
      tags: ['怀古', '词'] },

    { id: 'po-zhen-zi', title: '破阵子·为陈同甫赋壮词以寄之', author: '辛弃疾', dynasty: '南宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第35篇',
      highlights: [{ type: '名句', text: '了却君王天下事，赢得生前身后名。可怜白发生！' }, { type: '易错字', text: '麾下 炙 的卢 霹雳' }],
      tags: ['豪放', '词'] },

    { id: 'guo-ling-ding-yang', title: '过零丁洋', author: '文天祥', dynasty: '南宋', stage: '初中', grade: '九年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '辛苦遭逢起一经，干戈寥落四周星。山河破碎风飘絮，身世浮沉雨打萍。惶恐滩头说惶恐，零丁洋里叹零丁。人生自古谁无死？留取丹心照汗青。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第36篇',
      highlights: [{ type: '名句', text: '人生自古谁无死？留取丹心照汗青。' }, { type: '易错字', text: '寥落 絮 惶恐 汗青' }],
      tags: ['爱国'] },

    { id: 'tian-jing-sha-qiu-si', title: '天净沙·秋思', author: '马致远', dynasty: '元', stage: '初中', grade: '七年级', genre: '曲', sourceType: '课标推荐', required: true, recommended: true,
      text: '枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第37篇',
      highlights: [{ type: '名句', text: '夕阳西下，断肠人在天涯。' }],
      tags: ['散曲'] },

    { id: 'shan-po-yang-tong-guan-huai-gu', title: '山坡羊·潼关怀古', author: '张养浩', dynasty: '元', stage: '初中', grade: '九年级', genre: '曲', sourceType: '课标推荐', required: true, recommended: true,
      text: '峰峦如聚，波涛如怒，山河表里潼关路。望西都，意踌躇。伤心秦汉经行处，宫阙万间都做了土。兴，百姓苦；亡，百姓苦。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第38篇',
      highlights: [{ type: '名句', text: '兴，百姓苦；亡，百姓苦。' }, { type: '易错字', text: '踌躇 宫阙' }],
      tags: ['怀古', '散曲'] },

    { id: 'ji-hai-za-shi-hao-dang', title: '己亥杂诗（浩荡离愁白日斜）', author: '龚自珍', dynasty: '清', stage: '初中', grade: '七年级', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '浩荡离愁白日斜，吟鞭东指即天涯。落红不是无情物，化作春泥更护花。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第39篇',
      highlights: [{ type: '名句', text: '落红不是无情物，化作春泥更护花。' }],
      tags: ['言志'] },

    { id: 'man-jiang-hong-qiu-jin', title: '满江红（小住京华）', author: '秋瑾', dynasty: '清', stage: '初中', grade: '九年级', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '小住京华，早又是中秋佳节。为篱下黄花开遍，秋容如拭。四面歌残终破楚，八年风味徒思浙。苦将侬强派作蛾眉，殊未屑！身不得，男儿列，心却比，男儿烈。算平生肝胆，因人常热。俗子胸襟谁识我？英雄末路当磨折。莽红尘何处觅知音？青衫湿！',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第40篇',
      highlights: [{ type: '名句', text: '身不得，男儿列，心却比，男儿烈。' }, { type: '易错字', text: '拭 侬 蛾眉 胸襟 莽红尘' }],
      tags: ['言志', '词'] },

    { id: 'lun-yu-shi-er-zhang', title: '《论语》十二章', author: '孔子及其弟子', dynasty: '先秦', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”' +
        '曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”' +
        '子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”' +
        '子曰：“温故而知新，可以为师矣。”' +
        '子曰：“学而不思则罔，思而不学则殆。”' +
        '子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”' +
        '子曰：“知之者不如好之者，好之者不如乐之者。”' +
        '子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”' +
        '子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”' +
        '子在川上曰：“逝者如斯夫，不舍昼夜。”' +
        '子曰：“三军可夺帅也，匹夫不可夺志也。”' +
        '子夏曰：“博学而笃志，切问而近思，仁在其中矣。”',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第41篇',
      highlights: [{ type: '名句', text: '学而不思则罔，思而不学则殆。' }, { type: '名句', text: '三人行，必有我师焉。' }, { type: '易错字', text: '愠 逾矩 罔 箪 肱 笃志' }],
      notes: '课标指定的十二章顺序与统编教材一致。',
      tags: ['诸子'] },

    { id: 'cao-gui-lun-zhan', title: '曹刿论战', author: '《左传》', dynasty: '先秦', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '十年春，齐师伐我。公将战，曹刿请见。其乡人曰：“肉食者谋之，又何间焉？”刿曰：“肉食者鄙，未能远谋。”乃入见。问：“何以战？”公曰：“衣食所安，弗敢专也，必以分人。”对曰：“小惠未遍，民弗从也。”公曰：“牺牲玉帛，弗敢加也，必以信。”对曰：“小信未孚，神弗福也。”公曰：“小大之狱，虽不能察，必以情。”对曰：“忠之属也。可以一战。战则请从。”公与之乘，战于长勺。公将鼓之。刿曰：“未可。”齐人三鼓。刿曰：“可矣。”齐师败绩。公将驰之。刿曰：“未可。”下视其辙，登轼而望之，曰：“可矣。”遂逐齐师。既克，公问其故。对曰：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。”',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第42篇',
      highlights: [{ type: '名句', text: '一鼓作气，再而衰，三而竭。' }, { type: '易错字', text: '刿 间焉 孚 辙 登轼 旗靡' }],
      variants: [{ label: '版本差异', text: '“小惠未遍”旧版教材作“小惠未徧”。' }],
      tags: ['史传'] },

    { id: 'meng-zi-san-ze', title: '《孟子》三则', author: '孟子', dynasty: '先秦', stage: '初中', grade: '八年级、九年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      grades: ['八年级', '九年级'],
      text: '【鱼我所欲也】鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美，妻妾之奉，所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。' +
        '【得道多助，失道寡助】天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣；然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也；委而去之，是地利不如人和也。故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。' +
        '【生于忧患，死于安乐】舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第43篇',
      highlights: [{ type: '名句', text: '生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。' }, { type: '名句', text: '得道者多助，失道者寡助。' }, { type: '名句', text: '故天将降大任于是人也，必先苦其心志，劳其筋骨。' }, { type: '易错字', text: '辟 箪 蹴 乡为身死 畎亩 傅说 胶鬲 拂士' }],
      notes: '课标列为《孟子》三则：其中《富贵不能淫》《生于忧患，死于安乐》在统编八年级上册，《鱼我所欲也》在九年级下册；因此八年级、九年级都能筛到。',
      variants: [{ label: '版本差异', text: '“天将降大任于是人也”，部分旧版教材作“天将降大任于斯人也”。' }],
      tags: ['诸子'] },

    { id: 'zhuang-zi-bei-ming', title: '《庄子》一则（北冥有鱼）', author: '庄子', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第44篇',
      highlights: [{ type: '名句', text: '水击三千里，抟扶摇而上者九万里。' }, { type: '易错字', text: '北冥 鲲 齐谐 抟扶摇' }],
      tags: ['诸子'] },

    { id: 'li-ji-sui-you-jia-yao', title: '《礼记》一则（虽有嘉肴）', author: '《礼记》', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰“学学半”，其此之谓乎！',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第45篇',
      highlights: [{ type: '名句', text: '教学相长也。' }, { type: '易错字', text: '嘉肴 旨 兑命 学学半' }],
      tags: ['礼记'] },

    { id: 'lv-shi-chun-qiu-bo-ya', title: '《吕氏春秋》一则（伯牙鼓琴）', author: '《吕氏春秋》', dynasty: '先秦', stage: '初中', grade: '六年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第46篇',
      highlights: [{ type: '名句', text: '巍巍乎若太山；汤汤乎若流水。' }, { type: '易错字', text: '锺子期 少选之间 汤汤 破琴绝弦' }],
      notes: '该篇在统编教材六年级上册（小学六年级）出现；上海五四学制六年级属于初中预备年级，故归入初中六年级。',
      tags: ['寓言'] },

    { id: 'zou-ji-feng-qi-wang', title: '邹忌讽齐王纳谏', author: '《战国策》', dynasty: '先秦', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：“我孰与城北徐公美？”其妻曰：“君美甚，徐公何能及君也？”城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰：“吾孰与徐公美？”妾曰：“徐公何能及君也？”旦日，客从外来，与坐谈，问之客曰：“吾与徐公孰美？”客曰：“徐公不若君之美也。”明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。暮寝而思之，曰：“吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。”于是入朝见威王，曰：“臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。”王曰：“善。”乃下令：“群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。”令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第47篇',
      highlights: [{ type: '名句', text: '群臣进谏，门庭若市。' }, { type: '名句', text: '此所谓战胜于朝廷。' }, { type: '易错字', text: '昳丽 窥镜 孰视之 谤讥 市朝 期年' }],
      tags: ['史传'] },

    { id: 'chu-shi-biao', title: '出师表', author: '诸葛亮', dynasty: '三国', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎。陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。今当远离，临表涕零，不知所言。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第48篇',
      highlights: [{ type: '名句', text: '受任于败军之际，奉命于危难之间。' }, { type: '名句', text: '亲贤臣，远小人，此先汉所以兴隆也。' }, { type: '易错字', text: '崩殂 疲弊 陟罚臧否 费祎 裨补阙漏 猥自枉屈 夙夜 驽钝 咨诹' }],
      tags: ['表'] },

    { id: 'tao-hua-yuan-ji', title: '桃花源记', author: '陶潜', dynasty: '东晋', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第49篇',
      highlights: [{ type: '名句', text: '芳草鲜美，落英缤纷。' }, { type: '名句', text: '阡陌交通，鸡犬相闻。' }, { type: '易错字', text: '俨然 阡陌 黄发垂髫 诣太守 刘子骥 问津' }],
      tags: ['记'] },

    { id: 'da-xie-zhong-shu-shu', title: '答谢中书书', author: '陶弘景', dynasty: '南朝', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第50篇',
      highlights: [{ type: '名句', text: '晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。' }, { type: '易错字', text: '颓 沉鳞 康乐 与' }],
      tags: ['书'] },

    { id: 'san-xia', title: '三峡', author: '郦道元', dynasty: '北魏', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间。清荣峻茂，良多趣味。每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第51篇',
      highlights: [{ type: '名句', text: '重岩叠嶂，隐天蔽日。' }, { type: '名句', text: '巴东三峡巫峡长，猿鸣三声泪沾裳。' }, { type: '易错字', text: '阙处 曦月 襄陵 沿溯 素湍 绝巘 飞漱 属引' }],
      variants: [{ label: '教材异文', text: '“绝巘多生怪柏”部分版本用字作“绝𪞝多生怪柏”（同为“山献”字，字形差异）。' }],
      tags: ['记'] },

    { id: 'ma-shuo', title: '杂说（四）', author: '韩愈', dynasty: '唐', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祇辱于奴隶人之手，骈死于槽枥之间，不以千里称也。马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也！',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第52篇',
      highlights: [{ type: '名句', text: '世有伯乐，然后有千里马。' }, { type: '名句', text: '其真无马邪？其真不知马也！' }, { type: '易错字', text: '祇辱 骈死 槽枥 一食或尽粟一石 外见' }],
      notes: '课标作《杂说（四）》，统编教材作《马说》，为同一篇。',
      variants: [{ label: '版本差异', text: '“祇辱于奴隶人之手”部分版本作“只辱于奴隶人之手”。' }],
      tags: ['杂说'] },

    { id: 'lou-shi-ming', title: '陋室铭', author: '刘禹锡', dynasty: '唐', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第53篇',
      highlights: [{ type: '名句', text: '斯是陋室，惟吾德馨。' }, { type: '名句', text: '苔痕上阶绿，草色入帘青。' }, { type: '易错字', text: '惟吾德馨 鸿儒 白丁 案牍 诸葛庐' }],
      tags: ['铭'] },

    { id: 'xiao-shi-tan-ji', title: '小石潭记', author: '柳宗元', dynasty: '唐', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '从小丘西行百二十步，隔篁竹，闻水声，如鸣佩环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽，似与游者相乐。潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生，曰恕己，曰奉壹。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第54篇',
      highlights: [{ type: '名句', text: '潭中鱼可百许头，皆若空游无所依。' }, { type: '名句', text: '凄神寒骨，悄怆幽邃。' }, { type: '易错字', text: '篁竹 佩环 清冽 坻 屿 嵁 佁然 俶尔 翕忽 悄怆幽邃' }],
      variants: [{ label: '教材异文', text: '“如鸣佩环”“水尤清冽”“日光下澈”部分版本作“如鸣珮环”“水尤清洌”“日光下彻”。' }],
      tags: ['记'] },

    { id: 'yue-yang-lou-ji', title: '岳阳楼记', author: '范仲淹', dynasty: '北宋', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐曜，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？时六年九月十五日。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第55篇',
      highlights: [{ type: '名句', text: '先天下之忧而忧，后天下之乐而乐。' }, { type: '名句', text: '不以物喜，不以己悲。' }, { type: '易错字', text: '谪守 浩浩汤汤 隐曜 樯倾楫摧 岸芷汀兰 沉璧 偕忘' }],
      tags: ['记'] },

    { id: 'zui-weng-ting-ji', title: '醉翁亭记', author: '欧阳修', dynasty: '北宋', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第56篇',
      highlights: [{ type: '名句', text: '醉翁之意不在酒，在乎山水之间也。' }, { type: '名句', text: '醉能同其乐，醒能述以文者，太守也。' }, { type: '易错字', text: '林壑 潺潺 翼然 林霏 岩穴暝 伛偻提携 酒洌 山肴野蔌 觥筹交错 阴翳' }],
      tags: ['记'] },

    { id: 'ai-lian-shuo', title: '爱莲说', author: '周敦颐', dynasty: '北宋', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第57篇',
      highlights: [{ type: '名句', text: '予独爱莲之出淤泥而不染，濯清涟而不妖。' }, { type: '易错字', text: '甚蕃 淤泥 濯清涟 亵玩 鲜有闻' }],
      variants: [{ label: '版本差异', text: '“世人甚爱牡丹”部分版本作“世人盛爱牡丹”。' }],
      tags: ['说'] },

    { id: 'ji-cheng-tian-si-ye-you', title: '记承天寺夜游', author: '苏轼', dynasty: '北宋', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第58篇',
      highlights: [{ type: '名句', text: '庭下如积水空明，水中藻、荇交横，盖竹柏影也。' }, { type: '易错字', text: '藻 荇 交横 竹柏' }],
      tags: ['记'] },

    { id: 'song-dong-yang-ma-sheng-xu', title: '送东阳马生序（节选）', author: '宋濂', dynasty: '明', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。今虽耄老，未有所成，犹幸预君子之列，而承天子之宠光，缀公卿之后，日侍坐备顾问，四海亦谬称其氏名，况才之过于余者乎？',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第59篇（课标指定节选范围）',
      highlights: [{ type: '名句', text: '余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。' }, { type: '易错字', text: '砚冰坚 逾约 加冠 硕师 叱咄 负箧曳屣 皲裂 媵人 缊袍敝衣' }],
      notes: '课标规定范围为“余幼时即嗜学……况才之过于余者乎？”，与统编教材节选一致。',
      tags: ['序'] },

    { id: 'hu-xin-ting-kan-xue', title: '湖心亭看雪', author: '张岱', dynasty: '明末清初', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰：“湖中焉得更有此人！”拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者。”',
      source: '《义务教育语文课程标准（2022年版）》附录1 · 7~9年级第60篇',
      highlights: [{ type: '名句', text: '雾凇沆砀，天与云与山与水，上下一白。' }, { type: '名句', text: '莫说相公痴，更有痴似相公者。' }, { type: '易错字', text: '拏 毳衣 雾凇沆砀 一芥 焉得 喃喃' }],
      tags: ['记'] },

    /* ============ 二、统编教材课内古诗文（课外古诗词诵读亦收录）============ */

    { id: 'yong-xue', title: '咏雪', author: '《世说新语》', dynasty: '南朝', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：“白雪纷纷何所似？”兄子胡儿曰：“撒盐空中差可拟。”兄女曰：“未若柳絮因风起。”公大笑乐。即公大兄无奕女，左将军王凝之妻也。',
      source: '统编（部编）语文教材七年级上册', highlights: [{ type: '名句', text: '未若柳絮因风起。' }, { type: '易错字', text: '俄而 差可拟 无奕女' }], tags: ['世说新语'] },

    { id: 'chen-tai-qiu-yu-you-qi-xing', title: '陈太丘与友期行', author: '《世说新语》', dynasty: '南朝', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：“尊君在不？”答曰：“待君久不至，已去。”友人便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。”友人惭，下车引之。元方入门不顾。',
      source: '统编（部编）语文教材七年级上册', highlights: [{ type: '易错字', text: '尊君在不 相委而去 惭 引之' }], tags: ['世说新语'] },

    { id: 'jie-zi-shu', title: '诫子书', author: '诸葛亮', dynasty: '三国', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！',
      source: '统编（部编）语文教材七年级上册', highlights: [{ type: '名句', text: '非淡泊无以明志，非宁静无以致远。' }, { type: '易错字', text: '淫慢 励精 险躁 枯落 穷庐' }],
      variants: [{ label: '版本差异', text: '“非淡泊无以明志”旧版教材作“非澹泊无以明志”。' }], tags: ['家书'] },

    { id: 'lang', title: '狼', author: '蒲松龄', dynasty: '清', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。',
      source: '统编（部编）语文教材七年级上册', highlights: [{ type: '名句', text: '禽兽之变诈几何哉？止增笑耳。' }, { type: '易错字', text: '缀行 大窘 苫蔽 眈眈 径去 假寐 黠 尻尾' }], tags: ['聊斋'] },

    { id: 'chuan-jing-de-yi-ren', title: '穿井得一人', author: '《吕氏春秋》', dynasty: '先秦', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问之于丁氏，丁氏对曰：“得一人之使，非得一人于井中也。”求闻之若此，不若无闻也。',
      source: '统编（部编）语文教材七年级上册', highlights: [{ type: '易错字', text: '溉汲 及其家穿井 得一人之使' }], tags: ['寓言'] },

    { id: 'qi-ren-you-tian', title: '杞人忧天', author: '《列子》', dynasty: '先秦', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰：“天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”其人曰：“天果积气，日月星宿，不当坠耶？”晓之者曰：“日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。”其人曰：“奈地坏何？”晓之者曰：“地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？”其人舍然大喜，晓之者亦舍然大喜。',
      source: '统编（部编）语文教材七年级上册', highlights: [{ type: '易错字', text: '身亡所寄 星宿 躇步跐蹈 舍然' }], tags: ['寓言'] },

    { id: 'e-mei-shan-yue-ge', title: '峨眉山月歌', author: '李白', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '峨眉山月半轮秋，影入平羌江水流。夜发清溪向三峡，思君不见下渝州。',
      source: '统编（部编）语文教材七年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '峨眉山月半轮秋，影入平羌江水流。' }], tags: ['写景'] },

    { id: 'jiang-nan-feng-li-gui-nian', title: '江南逢李龟年', author: '杜甫', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '岐王宅里寻常见，崔九堂前几度闻。正是江南好风景，落花时节又逢君。',
      source: '统编（部编）语文教材七年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '正是江南好风景，落花时节又逢君。' }, { type: '易错字', text: '岐王 崔九' }], tags: ['感怀'] },

    { id: 'xing-jun-jiu-ri', title: '行军九日思长安故园', author: '岑参', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '强欲登高去，无人送酒来。遥怜故园菊，应傍战场开。',
      source: '统编（部编）语文教材七年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '遥怜故园菊，应傍战场开。' }], tags: ['思乡'] },

    { id: 'ye-shang-shou-jiang-cheng', title: '夜上受降城闻笛', author: '李益', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '回乐烽前沙似雪，受降城外月如霜。不知何处吹芦管，一夜征人尽望乡。',
      source: '统编（部编）语文教材七年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '不知何处吹芦管，一夜征人尽望乡。' }], tags: ['边塞'] },

    { id: 'sun-quan-quan-xue', title: '孙权劝学', author: '《资治通鉴》', dynasty: '北宋', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '初，权谓吕蒙曰：“卿今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。',
      source: '统编（部编）语文教材七年级下册', highlights: [{ type: '名句', text: '士别三日，即更刮目相待。' }, { type: '易错字', text: '当涂掌事 治经为博士邪 涉猎 孰若孤 遂拜蒙母' }], tags: ['史传'] },

    { id: 'mai-you-weng', title: '卖油翁', author: '欧阳修', dynasty: '北宋', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。',
      source: '统编（部编）语文教材七年级下册', highlights: [{ type: '名句', text: '我亦无他，惟手熟尔。' }, { type: '易错字', text: '自矜 家圃 睨之 微颔 酌油 杓 沥' }], tags: ['笔记'] },

    { id: 'he-zhong-shi-shou', title: '河中石兽', author: '纪昀', dynasty: '清', stage: '初中', grade: '七年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '沧州南一寺临河干，山门圮于河，二石兽并沉焉。阅十余岁，僧募金重修，求二石兽于水中，竟不可得，以为顺流下矣。棹数小舟，曳铁钯，寻十余里无迹。一讲学家设帐寺中，闻之笑曰：“尔辈不能究物理。是非木杮，岂能为暴涨携之去？乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。沿河求之，不亦颠乎？”众服为确论。一老河兵闻之，又笑曰：“凡河中失石，当求之于上流。盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴。渐激渐深，至石之半，石必倒掷坎穴中。如是再啮，石又再转。转转不已，遂反溯流逆上矣。求之下流，固颠；求之地中，不更颠乎？”如其言，果得于数里外。然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？',
      source: '统编（部编）语文教材七年级下册', highlights: [{ type: '名句', text: '然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？' }, { type: '易错字', text: '河干 圮 棹 曳 木杮 湮 啮 坎穴 臆断' }], tags: ['笔记'] },

    { id: 'zhu-li-guan', title: '竹里馆', author: '王维', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '独坐幽篁里，弹琴复长啸。深林人不知，明月来相照。',
      source: '统编（部编）语文教材七年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '深林人不知，明月来相照。' }, { type: '易错字', text: '幽篁 长啸' }], tags: ['山水'] },

    { id: 'chun-ye-luo-cheng-wen-di', title: '春夜洛城闻笛', author: '李白', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '谁家玉笛暗飞声，散入春风满洛城。此夜曲中闻折柳，何人不起故园情。',
      source: '统编（部编）语文教材七年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '此夜曲中闻折柳，何人不起故园情。' }], tags: ['思乡'] },

    { id: 'feng-ru-jing-shi', title: '逢入京使', author: '岑参', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安。',
      source: '统编（部编）语文教材七年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '马上相逢无纸笔，凭君传语报平安。' }, { type: '易错字', text: '漫漫 龙钟' }], tags: ['思乡'] },

    { id: 'wan-chun', title: '晚春', author: '韩愈', dynasty: '唐', stage: '初中', grade: '七年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '草树知春不久归，百般红紫斗芳菲。杨花榆荚无才思，惟解漫天作雪飞。',
      source: '统编（部编）语文教材七年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '杨花榆荚无才思，惟解漫天作雪飞。' }, { type: '易错字', text: '芳菲 榆荚' }], tags: ['写景'] },

    { id: 'yu-zhu-yuan-si-shu', title: '与朱元思书', author: '吴均', dynasty: '南朝', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。',
      source: '统编（部编）语文教材八年级上册', highlights: [{ type: '名句', text: '鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。' }, { type: '易错字', text: '缥碧 急湍 轩邈 泠泠 嘤嘤 鸢飞戾天 横柯' }], tags: ['书'] },

    { id: 'yu-gong-yi-shan', title: '愚公移山', author: '《列子》', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”杂曰：“投诸渤海之尾，隐土之北。”遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。河曲智叟笑而止之曰：“甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？”北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”河曲智叟亡以应。操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。',
      source: '统编（部编）语文教材八年级上册', highlights: [{ type: '名句', text: '子子孙孙无穷匮也，而山不加增，何苦而不平？' }, { type: '易错字', text: '万仞 惩 迂 魁父 箕畚 孀妻 始龀 穷匮 一厝朔东' }], tags: ['寓言'] },

    { id: 'zhou-ya-fu-jun-xi-liu', title: '周亚夫军细柳', author: '司马迁', dynasty: '西汉', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：以备胡。上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰：“天子且至！”军门都尉曰：“将军令曰：‘军中闻将军令，不闻天子之诏。’”居无何，上至，又不得入。于是上乃使使持节诏将军：“吾欲入劳军。”亚夫乃传言开壁门。壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。至营，将军亚夫持兵揖曰：“介胄之士不拜，请以军礼见。”天子为动，改容式车。使人称谢：“皇帝敬劳将军。”成礼而去。既出军门，群臣皆惊。文帝曰：“嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！”称善者久之。',
      source: '统编（部编）语文教材八年级上册', highlights: [{ type: '名句', text: '军中闻将军令，不闻天子之诏。' }, { type: '易错字', text: '彀弓弩 持满 都尉 按辔徐行 介胄 式车 曩者' }], tags: ['史记'] },

    { id: 'ting-zhong-you-qi-shu', title: '庭中有奇树', author: '《古诗十九首》', dynasty: '汉', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '庭中有奇树，绿叶发华滋。攀条折其荣，将以遗所思。馨香盈怀袖，路远莫致之。此物何足贵？但感别经时。',
      source: '统编（部编）语文教材八年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '馨香盈怀袖，路远莫致之。' }, { type: '易错字', text: '发华滋 遗所思 馨香 盈怀袖' }], tags: ['古诗十九首'] },

    { id: 'gui-sui-shou', title: '龟虽寿', author: '曹操', dynasty: '东汉', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '神龟虽寿，犹有竟时。腾蛇乘雾，终为土灰。老骥伏枥，志在千里。烈士暮年，壮心不已。盈缩之期，不但在天；养怡之福，可得永年。幸甚至哉，歌以咏志。',
      source: '统编（部编）语文教材八年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '老骥伏枥，志在千里。烈士暮年，壮心不已。' }, { type: '易错字', text: '老骥伏枥 盈缩 养怡' }],
      variants: [{ label: '版本差异', text: '“腾蛇乘雾”部分版本作“螣蛇乘雾”。' }], tags: ['言志'] },

    { id: 'zeng-cong-di', title: '赠从弟（其二）', author: '刘桢', dynasty: '东汉', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '亭亭山上松，瑟瑟谷中风。风声一何盛，松枝一何劲！冰霜正惨凄，终岁常端正。岂不罹凝寒？松柏有本性。',
      source: '统编（部编）语文教材八年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '岂不罹凝寒？松柏有本性。' }, { type: '易错字', text: '瑟瑟 罹凝寒' }], tags: ['咏物'] },

    { id: 'liang-fu-xing', title: '梁甫行', author: '曹植', dynasty: '三国', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '八方各异气，千里殊风雨。剧哉边海民，寄身于草野。妻子象禽兽，行止依林阻。柴门何萧条，狐兔翔我宇。',
      source: '统编（部编）语文教材八年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '柴门何萧条，狐兔翔我宇。' }, { type: '易错字', text: '殊风雨 剧哉 林阻 翔我宇' }], tags: ['民生'] },

    { id: 'zhuang-zi-yu-hui-zi', title: '庄子与惠子游于濠梁之上', author: '《庄子》', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '庄子与惠子游于濠梁之上。庄子曰：“鲦鱼出游从容，是鱼之乐也。”惠子曰：“子非鱼，安知鱼之乐？”庄子曰：“子非我，安知我不知鱼之乐？”惠子曰：“我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣！”庄子曰：“请循其本。子曰‘汝安知鱼乐’云者，既已知吾知之而问我，我知之濠上也。”',
      source: '统编（部编）语文教材八年级下册', highlights: [{ type: '名句', text: '子非鱼，安知鱼之乐？' }, { type: '易错字', text: '濠梁 鲦鱼 请循其本' }], tags: ['诸子'] },

    { id: 'da-dao-zhi-xing-ye', title: '大道之行也', author: '《礼记》', dynasty: '先秦', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。',
      source: '统编（部编）语文教材八年级下册', highlights: [{ type: '名句', text: '大道之行也，天下为公。' }, { type: '易错字', text: '选贤与能 讲信修睦 矜 男有分 货恶 谋闭而不兴' }], tags: ['礼记'] },

    { id: 'he-zhou-ji', title: '核舟记', author: '魏学洢', dynasty: '明', stage: '初中', grade: '八年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。其船背稍夷，则题名其上，文曰“天启壬戌秋日，虞山王毅叔远甫刻”，细若蚊足，钩画了了，其色墨。又用篆章一，文曰“初平山人”，其色丹。通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。而计其长曾不盈寸。盖简桃核修狭者为之。嘻，技亦灵怪矣哉！',
      source: '统编（部编）语文教材八年级下册', highlights: [{ type: '名句', text: '嘻，技亦灵怪矣哉！' }, { type: '易错字', text: '罔不因势象形 箬篷 石青糁之 峨冠 髯 衣褶 椎髻 篆章 修狭' }], tags: ['说明文'] },

    { id: 'ti-po-shan-si-hou-chan-yuan', title: '题破山寺后禅院', author: '常建', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '清晨入古寺，初日照高林。曲径通幽处，禅房花木深。山光悦鸟性，潭影空人心。万籁此都寂，但余钟磬音。',
      source: '统编（部编）语文教材八年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '曲径通幽处，禅房花木深。' }, { type: '易错字', text: '万籁 钟磬' }],
      variants: [{ label: '版本差异', text: '“万籁此都寂”部分版本作“万籁此俱寂”。' }], tags: ['山水'] },

    { id: 'song-you-ren', title: '送友人', author: '李白', dynasty: '唐', stage: '初中', grade: '八年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '青山横北郭，白水绕东城。此地一为别，孤蓬万里征。浮云游子意，落日故人情。挥手自兹去，萧萧班马鸣。',
      source: '统编（部编）语文教材八年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '浮云游子意，落日故人情。' }, { type: '易错字', text: '孤蓬 萧萧班马鸣' }], tags: ['送别'] },

    { id: 'bu-suan-zi-huang-zhou', title: '卜算子·黄州定慧院寓居作', author: '苏轼', dynasty: '北宋', stage: '初中', grade: '八年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '缺月挂疏桐，漏断人初静。谁见幽人独往来？缥缈孤鸿影。惊起却回头，有恨无人省。拣尽寒枝不肯栖，寂寞沙洲冷。',
      source: '统编（部编）语文教材八年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '拣尽寒枝不肯栖，寂寞沙洲冷。' }, { type: '易错字', text: '疏桐 漏断 缥缈 省' }], tags: ['词'] },

    { id: 'bu-suan-zi-yong-mei', title: '卜算子·咏梅', author: '陆游', dynasty: '南宋', stage: '初中', grade: '八年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '驿外断桥边，寂寞开无主。已是黄昏独自愁，更着风和雨。无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。',
      source: '统编（部编）语文教材八年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '零落成泥碾作尘，只有香如故。' }, { type: '易错字', text: '更着 群芳妒 碾作尘' }], tags: ['咏物', '词'] },

    { id: 'qin-yuan-chun-xue', title: '沁园春·雪', author: '毛泽东', dynasty: '现代', stage: '初中', grade: '九年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽；大河上下，顿失滔滔。山舞银蛇，原驰蜡象，欲与天公试比高。须晴日，看红装素裹，分外妖娆。江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。',
      source: '统编（部编）语文教材九年级上册', highlights: [{ type: '名句', text: '江山如此多娇，引无数英雄竞折腰。' }, { type: '名句', text: '俱往矣，数风流人物，还看今朝。' }, { type: '易错字', text: '惟余莽莽 顿失滔滔 红装素裹 妖娆 稍逊风骚 天骄' }], tags: ['现代', '词'] },

    { id: 'yue-ye-yi-she-di', title: '月夜忆舍弟', author: '杜甫', dynasty: '唐', stage: '初中', grade: '九年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '戍鼓断人行，边秋一雁声。露从今夜白，月是故乡明。有弟皆分散，无家问死生。寄书长不达，况乃未休兵。',
      source: '统编（部编）语文教材九年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '露从今夜白，月是故乡明。' }, { type: '易错字', text: '戍鼓 况乃' }], tags: ['思亲'] },

    { id: 'shang-shan-zao-xing', title: '商山早行', author: '温庭筠', dynasty: '唐', stage: '初中', grade: '九年级', genre: '诗', sourceType: '统编教材', required: false, recommended: true,
      text: '晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。',
      source: '统编（部编）语文教材九年级上册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '鸡声茅店月，人迹板桥霜。' }, { type: '易错字', text: '征铎 槲叶 枳花 驿墙 凫雁' }], tags: ['羁旅'] },

    { id: 'tang-ju-bu-ru-shi-ming', title: '唐雎不辱使命', author: '《战国策》', dynasty: '先秦', stage: '初中', grade: '九年级', genre: '文言文', sourceType: '统编教材', required: false, recommended: true,
      text: '秦王使人谓安陵君曰：“寡人欲以五百里之地易安陵，安陵君其许寡人！”安陵君曰：“大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！”秦王不说。安陵君因使唐雎使于秦。秦王谓唐雎曰：“寡人以五百里之地易安陵，安陵君不听寡人，何也？且秦灭韩亡魏，而君以五十里之地存者，以君为长者，故不错意也。今吾以十倍之地，请广于君，而君逆寡人者，轻寡人与？”唐雎对曰：“否，非若是也。安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？”秦王怫然怒，谓唐雎曰：“公亦尝闻天子之怒乎？”唐雎对曰：“臣未尝闻也。”秦王曰：“天子之怒，伏尸百万，流血千里。”唐雎曰：“大王尝闻布衣之怒乎？”秦王曰：“布衣之怒，亦免冠徒跣，以头抢地耳。”唐雎曰：“此庸夫之怒也，非士之怒也。夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。若士必怒，伏尸二人，流血五步，天下缟素，今日是也。”挺剑而起。秦王色挠，长跪而谢之曰：“先生坐！何至于此！寡人谕矣：夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。”',
      source: '统编（部编）语文教材九年级下册', highlights: [{ type: '名句', text: '若士必怒，伏尸二人，流血五步，天下缟素。' }, { type: '易错字', text: '怫然 免冠徒跣 以头抢地 韩傀 休祲 缟素 色挠 长跪而谢' }], tags: ['史传'] },

    { id: 'ding-feng-bo', title: '定风波（莫听穿林打叶声）', author: '苏轼', dynasty: '北宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。',
      source: '统编（部编）语文教材九年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。' }, { type: '易错字', text: '吟啸 芒鞋 料峭 萧瑟' }], tags: ['豪放', '词'] },

    { id: 'lin-jiang-xian-ye-deng-xiao-ge', title: '临江仙·夜登小阁，忆洛中旧游', author: '陈与义', dynasty: '宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。杏花疏影里，吹笛到天明。二十余年如一梦，此身虽在堪惊。闲登小阁看新晴。古今多少事，渔唱起三更。',
      source: '统编（部编）语文教材九年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '杏花疏影里，吹笛到天明。' }, { type: '易错字', text: '午桥 长沟流月 堪惊 渔唱' }], tags: ['怀旧', '词'] },

    { id: 'tai-chang-yin-jian-kang', title: '太常引·建康中秋夜为吕叔潜赋', author: '辛弃疾', dynasty: '南宋', stage: '初中', grade: '九年级', genre: '词', sourceType: '统编教材', required: false, recommended: true,
      text: '一轮秋影转金波，飞镜又重磨。把酒问姮娥：被白发、欺人奈何？乘风好去，长空万里，直下看山河。斫去桂婆娑，人道是、清光更多。',
      source: '统编（部编）语文教材九年级下册 · 课外古诗词诵读', highlights: [{ type: '名句', text: '斫去桂婆娑，人道是、清光更多。' }, { type: '易错字', text: '金波 飞镜 姮娥 斫 婆娑' }], tags: ['中秋', '词'] },

    /* ============ 三、上海地区（沪教版 / 五四学制六年级等）============ */

    { id: 'xi-jiang-yue-ye-xing-huang-sha', title: '西江月·夜行黄沙道中', author: '辛弃疾', dynasty: '南宋', stage: '初中', grade: '六年级', genre: '词', sourceType: '上海地区', required: false, recommended: true,
      text: '明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。',
      source: '原项目题库（上海中考自测 · 沪教版六年级）', highlights: [{ type: '名句', text: '稻花香里说丰年，听取蛙声一片。' }, { type: '易错字', text: '惊鹊 鸣蝉 社林 忽见' }], tags: ['乡村', '词'] },

    { id: 'jiang-nan-chun', title: '江南春', author: '杜牧', dynasty: '唐', stage: '初中', grade: '六年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,
      text: '千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。',
      source: '原项目题库（上海中考自测 · 沪教版六年级）', highlights: [{ type: '名句', text: '南朝四百八十寺，多少楼台烟雨中。' }, { type: '易错字', text: '莺啼 山郭 酒旗' }], tags: ['写景'] },

    { id: 'tiao-tiao-qian-niu-xing', title: '迢迢牵牛星', author: '《古诗十九首》', dynasty: '汉', stage: '初中', grade: '六年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,
      text: '迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许？盈盈一水间，脉脉不得语。',
      source: '原项目题库（上海中考自测 · 沪教版六年级）', highlights: [{ type: '名句', text: '盈盈一水间，脉脉不得语。' }, { type: '易错字', text: '擢素手 札札 机杼 泣涕 脉脉' }], tags: ['古诗十九首'] },

    { id: 'zhu-shi', title: '竹石', author: '郑燮', dynasty: '清', stage: '初中', grade: '六年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,
      text: '咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。',
      source: '原项目题库（上海中考自测 · 沪教版六年级）', highlights: [{ type: '名句', text: '千磨万击还坚劲，任尔东西南北风。' }, { type: '易错字', text: '破岩 坚劲' }], tags: ['咏物'] },

    { id: 'hui-xiang-ou-shu-qi-yi', title: '回乡偶书（其一）', author: '贺知章', dynasty: '唐', stage: '初中', grade: '六年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,
      text: '少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。',
      source: '原项目题库（上海中考自测 · 沪教版六年级）', highlights: [{ type: '名句', text: '儿童相见不相识，笑问客从何处来。' }, { type: '易错字', text: '鬓毛衰' }], tags: ['感怀'] },

    { id: 'shi-yi-yue-si-ri-feng-yu-da-zuo', title: '十一月四日风雨大作（其二）', author: '陆游', dynasty: '南宋', stage: '初中', grade: '七年级', genre: '诗', sourceType: '上海地区', required: false, recommended: true,
      text: '僵卧孤村不自哀，尚思为国戍轮台。夜阑卧听风吹雨，铁马冰河入梦来。',
