/* 古诗文背诵学习系统 —— 默写自测
   出题思路参考原“上海中考古诗词默写自测”：卡片 + 眼睛按钮展开答案 + 显示全部答案。
   在此基础上增加多种题型、随机组合、判分与错题本。

   v1.5：
   - 新增「看译文写原文」（理解性默写），直接使用题库里的逐句翻译；
   - 新增「重点句 / 名句」题目范围，以及「今日复习」练习范围；
   - 错题记录到题目级，支持原题重练；判分只更新当前题卡，不再重建整组。 */
(function (global) {
  'use strict';

  var Utils = global.PoetryUtils;
  var DB = global.PoetryDatabase;
  var Storage = global.PoetryStorage;

  var MODES = [
    { key: 'blank-full', label: '整句挖空', desc: '给出篇目，整句用 □ 表示，自己默写整句。' },
    { key: 'next', label: '给上句写下句', desc: '给出上句，默写下句。' },
    { key: 'prev', label: '给下句写上句', desc: '给出下句，默写上句。' },
    { key: 'keyword', label: '关键词提示', desc: '只保留首字与关键词，提示下完成默写。' },
    { key: 'mixed', label: '随机挖空', desc: '在句中随机挖空词语或易错字。' },
    { key: 'full', label: '整句默写', desc: '只给篇目和句序，完整默写该句。' },
    { key: 'translation', label: '看译文写原文', desc: '给出这句的现代汉语翻译，默写对应原文。' },
  ];
  var MODE_KEY_LIST = MODES.map(function (item) {
    return item.key;
  });

  var state = {
    questions: [],
    answered: {},
    showAll: false,
    notice: '',       // 题目数量不足 / 错题本为空等提示
    scope: 'all',     // 'all' | 'wrong' | 'focus' | 'review'
    focusPoemId: '',  // 指定“只练某一篇”时的篇目 id
    questionFilter: 'none', // 'none' | 'exam' | 'name'
    focusKey: '',     // 从错题本“只练这句”进入时的题目 key
  };
  var lastBatchKeys = [];
  var unitsCache = Object.create(null);
  var translationCache = Object.create(null);
  var focusCache = Object.create(null);
  var nameCache = Object.create(null);

  /** 作者隐形指纹：随题目 / 答案复制而传播 */
  function brandSig() {
    return global.PoetryBrand && global.PoetryBrand.signature ? global.PoetryBrand.signature() : '';
  }

  function modeLabel(key) {
    for (var i = 0; i < MODES.length; i += 1) {
      if (MODES[i].key === key) return MODES[i].label;
    }
    return '默写';
  }

  function blankHtml(text, hideChars) {
    var blanked = Utils.makeBlank(text, hideChars || null);
    return Utils.escapeHtml(blanked).replace(/□+/g, function (run) {
      return '<span class="blank-unit">' + run + '</span>';
    });
  }

  function translationsOf(poem) {
    if (!poem || !poem.id) return [];
    if (!translationCache[poem.id]) translationCache[poem.id] = DB.translationLines(poem);
    return translationCache[poem.id];
  }

  function focusMapOf(poem) {
    if (!poem || !poem.id) return Object.create(null);
    if (!focusCache[poem.id]) focusCache[poem.id] = DB.examFocusMap(poem);
    return focusCache[poem.id];
  }

  function nameMapOf(poem) {
    if (!poem || !poem.id) return Object.create(null);
    if (!nameCache[poem.id]) nameCache[poem.id] = DB.nameSentenceMap(poem);
    return nameCache[poem.id];
  }

  function keywordOf(poem, sentence) {
    var highlights = poem.highlights || [];
    for (var i = 0; i < highlights.length; i += 1) {
      var item = highlights[i];
      var key = Utils.stripPunctuation(item.text).slice(0, 2);
      if (key && (item.type === '名句' || item.type === '关键词') && sentence.indexOf(key) !== -1) {
        return item.text;
      }
    }
    var clauses = Utils.splitClauses(sentence);
    if (!clauses.length) return '';
    return Utils.stripPunctuation(clauses[0]).slice(0, 2);
  }

  function errataOf(poem, sentence) {
    var found = [];
    (poem.highlights || []).forEach(function (item) {
      if (item.type !== '易错字' && item.type !== '错别字') return;
      Utils.stripPunctuation(item.text)
        .split('')
        .forEach(function (ch) {
          if (sentence.indexOf(ch) !== -1 && found.indexOf(ch) === -1) found.push(ch);
        });
    });
    return found.join('');
  }

  /** 为一个篇目收集所有可出题素材（题目级 key 需要稳定的句序 / 小句对序） */
  function unitsOf(poem) {
    if (!poem || !poem.id) return [];
    if (unitsCache[poem.id]) return unitsCache[poem.id];
    var sentences = Utils.splitSentences(poem.text);
    var units = [];
    sentences.forEach(function (sentence, sIndex) {
      var clauses = Utils.splitClauses(sentence);
      if (!Utils.stripPunctuation(sentence).length) return;
      units.push({ kind: 'sentence', sentence: sentence, index: sIndex, clauses: clauses });
      for (var i = 0; i + 1 < clauses.length; i += 1) {
        if (Utils.stripPunctuation(clauses[i]).length < 2) continue;
        if (Utils.stripPunctuation(clauses[i + 1]).length < 2) continue;
        units.push({ kind: 'pair', sentence: sentence, index: sIndex, left: clauses[i], right: clauses[i + 1], pairIndex: i });
      }
    });
    unitsCache[poem.id] = units;
    return units;
  }

  function buildQuestion(poem, unit, mode) {
    var question = {
      poemId: poem.id,
      poemTitle: poem.title,
      poemAuthor: poem.author,
      mode: mode,
      modeLabel: modeLabel(mode),
      key: poem.id + '|' + mode + '|' + unit.index + '|' + (unit.pairIndex == null ? 's' : unit.pairIndex),
      hint: '',
      promptHtml: '',
      answerText: unit.sentence,
      position: unit.index + 1,
      sentenceIndex: unit.index,
      pairIndex: unit.pairIndex == null ? null : unit.pairIndex,
    };

    if (mode === 'next') {
      var pair = unit.kind === 'pair' ? unit : null;
      if (!pair) return null;
      question.promptHtml = Utils.escapeHtml(pair.left) + blankHtml(pair.right);
      question.answerText = pair.left + pair.right;
      question.hint = '写出下句（可与标点一起默写）';
      return question;
    }
    if (mode === 'prev') {
      var pairPrev = unit.kind === 'pair' ? unit : null;
      if (!pairPrev) return null;
      question.promptHtml = blankHtml(pairPrev.left) + Utils.escapeHtml(pairPrev.right);
      question.answerText = pairPrev.left + pairPrev.right;
      question.hint = '补出上句';
      return question;
    }
    if (mode === 'translation') {
      /* 只对整句出题：译文与原文严格一一对应，pair 小句不单独拿译文 */
      if (unit.kind !== 'sentence') return null;
      var line = translationsOf(poem)[unit.index];
      if (!line) return null;
      question.promptHtml = '<span class="context-hint">看译文写原文</span>' +
        '<span class="translation-prompt">' + Utils.escapeHtml(line) + '</span>';
      question.hint = '根据译文写出对应原文（标点可以省略）';
      return question;
    }
    if (unit.kind !== 'sentence') return null;

    if (mode === 'blank-full') {
      question.promptHtml = blankHtml(unit.sentence);
      question.hint = '整句默写';
      return question;
    }
    if (mode === 'full') {
      /* 本题型只给篇目与句序，连 □ 长度提示都不给，和“整句挖空”区分开 */
      question.promptHtml = '<span class="context-hint">请默写本篇第 ' + (unit.index + 1) + ' 句（共 ' + Utils.splitSentences(poem.text).length + ' 句）</span>';
      question.hint = '整句默写';
      return question;
    }
    if (mode === 'keyword') {
      question.promptHtml = unit.clauses
        .map(function (clause) {
          return Utils.escapeHtml(Utils.blankKeepFirst(clause));
        })
        .join('');
      question.hint = '关键词提示：' + keywordOf(poem, unit.sentence);
      return question;
    }
    if (mode === 'mixed') {
      var errata = errataOf(poem, unit.sentence);
      if (errata) {
        question.promptHtml = blankHtml(unit.sentence, errata);
        question.hint = '重点挖空易错字';
      } else if (unit.clauses.length > 1) {
        var blankIndex = Math.floor(Utils.random() * unit.clauses.length);
        question.promptHtml = unit.clauses
          .map(function (clause, idx) {
            return idx === blankIndex ? blankHtml(clause) : Utils.escapeHtml(clause);
          })
          .join('');
        question.hint = '随机挖空其中一句';
      } else {
        question.promptHtml = blankHtml(unit.sentence);
        question.hint = '整句默写';
      }
      return question;
    }
    return null;
  }

  /**
   * 枚举这批篇目 + 这批题型下所有可能的题目。
   * filter(poem, unit) 可选，用于“只练重点句 / 名句”。
   * 这样“最多能出多少题”是算出来的，而不是靠概率去碰，
   * 素材不足时可以如实告诉用户本次只能生成多少题。
   */
  function allCandidates(poems, modes, filter) {
    var seen = Object.create(null);
    var out = [];
    var filterFn = typeof filter === 'function' ? filter : null;
    Utils.shuffle(poems).forEach(function (poem) {
      unitsOf(poem).forEach(function (unit) {
        if (filterFn && !filterFn(poem, unit)) return;
        modes.forEach(function (mode) {
          var question = buildQuestion(poem, unit, mode);
          if (!question || seen[question.key]) return;
          seen[question.key] = true;
          out.push(question);
        });
      });
    });
    return out;
  }

  function pickQuestions(poems, options) {
    var opts = options || {};
    var count = Utils.clamp(Math.floor(Number(opts.count)) || 10, 1, 60);
    // 非法题型直接丢弃；全部非法时按“随机组合”处理
    var modes = Utils.unique(
      Utils.toArray(opts.modes).filter(function (key) {
        return MODE_KEY_LIST.indexOf(key) !== -1;
      })
    );
    if (!modes.length) modes = MODE_KEY_LIST.slice();

    var candidates = allCandidates(poems, modes, opts.filter);
    var onlyKeys = Utils.unique(Utils.toArray(opts.onlyKeys));
    if (onlyKeys.length) {
      var onlySet = Object.create(null);
      onlyKeys.forEach(function (key) { onlySet[key] = true; });
      candidates = candidates.filter(function (question) {
        return !!onlySet[question.key];
      });
    }

    var preferKeys = Utils.unique(Utils.toArray(opts.preferKeys));
    var preferSet = Object.create(null);
    preferKeys.forEach(function (key) { preferSet[key] = true; });
    var preferred = candidates.filter(function (question) {
      return !!preferSet[question.key];
    });
    var rest = candidates.filter(function (question) {
      return !preferSet[question.key];
    });
    var fresh = rest.filter(function (question) {
      return lastBatchKeys.indexOf(question.key) === -1;
    });
    var stale = rest.filter(function (question) {
      return lastBatchKeys.indexOf(question.key) !== -1;
    });

    var ordered = onlyKeys.length
      ? Utils.shuffle(candidates)
      : Utils.shuffle(preferred).concat(
          fresh.length >= count
            ? Utils.shuffle(fresh)
            : Utils.shuffle(fresh).concat(Utils.shuffle(stale))
        );
    var questions = ordered.slice(0, count);
    lastBatchKeys = questions.map(function (item) {
      return item.key;
    });
    return questions;
  }

  function compareAnswer(input, expected) {
    var clean=function(t){return Utils.stripPunctuation(Utils.normalizeText(t)).slice(0,400);};
    var a=Array.from(clean(input)), b=Array.from(clean(expected)), rows=[];
    for(var i=0;i<=a.length;i++){ rows[i]=[]; for(var j=0;j<=b.length;j++) rows[i][j]=i===0?j:j===0?i:0; }
    for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++) rows[i][j]=a[i-1]===b[j-1]?rows[i-1][j-1]:1+Math.min(rows[i-1][j],rows[i][j-1],rows[i-1][j-1]);
    var parts=[]; i=a.length; j=b.length;
    while(i||j){
      if(i&&j&&a[i-1]===b[j-1]){parts.unshift(Utils.escapeHtml(b[--j]));i--;}
      else if(i&&j&&rows[i][j]===rows[i-1][j-1]+1){parts.unshift('<del>'+Utils.escapeHtml(a[--i])+'</del><ins>'+Utils.escapeHtml(b[--j])+'</ins>');}
      else if(j&&rows[i][j]===rows[i][j-1]+1){parts.unshift('<ins>'+Utils.escapeHtml(b[--j])+'</ins>');}
      else {parts.unshift('<del>'+Utils.escapeHtml(a[--i])+'</del>');}
    }
    return {correct:rows[a.length][b.length]===0,html:parts.join('')};
  }
  function renderQuestion(question, index) {
    var answered = state.answered[question.key];
    var show = state.showAll || (answered && answered.showAnswer);
    return (
      '<article class="quiz-card" data-key="' + Utils.escapeHtml(question.key) + '">' +
        '<div class="card-header">' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="card-meta">' +
              '<span>第 ' + (index + 1) + ' 题</span>' +
              '<span class="badge mode-badge">' + Utils.escapeHtml(question.modeLabel) + '</span>' +
              '<span class="badge badge-primary">《' + Utils.escapeHtml(question.poemTitle) + '》· ' + Utils.escapeHtml(question.poemAuthor) + '</span>' +
              (answered ? '<span class="badge ' + (answered.correct ? 'badge-success' : 'badge-danger') + '">' + (answered.correct ? '答对' : '答错') + '</span>' : '') +
            '</div>' +
            '<div class="question-text">' + question.promptHtml + brandSig() + '</div>' +
            (question.hint ? '<div class="tiny muted">' + Utils.escapeHtml(question.hint) + '</div>' : '') +
          '</div>' +
          '<button type="button" class="btn-eye" data-action="toggle-answer" aria-label="显示或隐藏答案" aria-expanded="' + (show ? 'true' : 'false') + '">' +
            '<svg viewBox="0 0 24 24" class="show-eye' + (show ? ' hidden' : '') + '" aria-hidden="true"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>' +
            '<svg viewBox="0 0 24 24" class="hide-eye' + (show ? '' : ' hidden') + '" aria-hidden="true"><path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>' +
          '</button>' +
        '</div>' +
        '<div class="answer-wrapper' + (show ? ' show' : '') + '">' +
          '<div class="answer-content"><div class="answer-inner">' +
            '<div class="answer-badge-text"><span class="badge badge-success">答案</span><span class="answer-text">' + Utils.escapeHtml(question.answerText) + brandSig() + '</span></div>' +
          '</div></div>' +
        '</div>' +
        '<div class="typed-answer"><label>输入默写（可选）<input type="text" maxlength="400" data-typed="'+Utils.escapeHtml(question.key)+'" value="'+Utils.escapeHtml((state.typed||{})[question.key]||'')+'" autocomplete="off"></label>' +
        '<button type="button" class="btn btn-sm" data-action="compare-input" data-key="'+Utils.escapeHtml(question.key)+'">对照错字</button><div data-diff role="status"></div><p class="tiny muted">忽略空白与标点；删除线是多写/错字，下划线是漏字/参考字。异文请核对教材后自行判定。</p></div>' +
        '<div class="grade-row">' +
          '<button type="button" class="btn btn-sm btn-success" data-action="mark-right" data-key="' + Utils.escapeHtml(question.key) + '"' + (answered ? ' disabled' : '') + '>✔ 默写正确</button>' +
          '<button type="button" class="btn btn-sm" data-action="mark-wrong" data-key="' + Utils.escapeHtml(question.key) + '"' + (answered ? ' disabled' : '') + '>✘ 加入错题</button>' +
          (answered ? '<span class="tiny muted">已判定 ' + (answered.correct ? '答对' : '答错') + '，换一批或清空本轮可重做</span>' : '') +
        '</div>' +
      '</article>'
    );
  }

  function statsLine() {
    var answered = Object.keys(state.answered).length;
    var correct = Object.keys(state.answered).filter(function (key) {
      return state.answered[key].correct;
    }).length;
    return '本轮 ' + state.questions.length + ' 题 · 已作答 ' + answered + ' 题 · 正确 ' + correct + ' 题';
  }

  /** 当前是否处于“只练某一篇”模式 */
  function focusOf(list) {
    if (!state.focusPoemId) return null;
    var found = null;
    Utils.toArray(list).forEach(function (poem) {
      if (poem.id === state.focusPoemId) found = poem;
    });
    return found;
  }

  /** 按当前练习范围取出篇目；错题本 / 今日复习为空时回退到全部已选篇目 */
  function scopePoems(list, focusPoem) {
    if (state.scope === 'focus') {
      if (focusPoem) return { list: [focusPoem], notice: '' };
      state.scope = 'all'; // 兜底：focus 篇目不存在时不允许停留在 focus 状态
    }
    if (state.scope === 'wrong') {
      var wrongIds = Storage.getState().wrongBook.map(function (item) {
        return item.id;
      });
      var filtered = list.filter(function (poem) {
        return wrongIds.indexOf(poem.id) !== -1;
      });
      if (filtered.length) return { list: filtered, notice: '' };
      return { list: list, notice: '错题本是空的，已按全部已选篇目出题。' };
    }
    if (state.scope === 'review') {
      var dueIds = Storage.duePoemIds();
      var dueList = list.filter(function (poem) {
        return dueIds.indexOf(poem.id) !== -1;
      });
      if (dueList.length) return { list: dueList, notice: '' };
      return { list: list, notice: '今天没有到期复习的篇目，已按全部已选篇目出题。' };
    }
    return { list: list, notice: '' };
  }

  function questionFilterFn(filter) {
    if (filter === 'exam') {
      return function (poem, unit) {
        return !!focusMapOf(poem)[unit.index];
      };
    }
    if (filter === 'name') {
      return function (poem, unit) {
        return !!nameMapOf(poem)[unit.index];
      };
    }
    return null;
  }

  function renderQuestions(root, options) {
    var box = root.querySelector('#quizList');
    if (!box) return;
    if (!state.questions.length) {
      box.innerHTML = '<div class="card"><div class="empty-state">还没有题目，点击「生成题目 / 换一批」开始默写自测；如果刚切了题目范围，也可以换回「全部句子」。</div></div>';
      updateChrome(root);
      if (options && options.onProgress) options.onProgress();
      return;
    }
    box.innerHTML = state.questions.map(renderQuestion).join('');
    updateChrome(root);
    if (options && options.onProgress) options.onProgress();
  }

  function updateChrome(root) {
    var counter = root.querySelector('#quizCounter');
    if (counter) counter.textContent = statsLine();
    var notice = root.querySelector('#quizNotice');
    if (notice) {
      notice.textContent = state.notice || '';
      notice.hidden = !state.notice;
    }
    var btn = root.querySelector('[data-action="toggle-all"]');
    if (btn) btn.textContent = state.showAll ? '隐藏全部答案' : '显示全部答案';
  }

  function render(root, options) {
    var opts = options || {};
    var prefs = Storage.getState().prefs;
    var modes = prefs.modes && prefs.modes.length ? prefs.modes : [];
    var focusPoem = focusOf(opts.list);
    var wrongCount = Storage.getState().wrongBook.filter(function (item) {
      return opts.list.some(function (poem) {
        return poem.id === item.id;
      });
    }).length;
    var dueIds = Storage.duePoemIds();
    var dueCount = opts.list.filter(function (poem) {
      return dueIds.indexOf(poem.id) !== -1;
    }).length;

    root.innerHTML =

  function generate(root, options) {

    var ids = picked.list.map(function (poem) {
      return poem.id;
    });
    var preferKeys = state.scope === 'wrong' ? Storage.wrongItemKeysForPoems(ids) : [];
    var onlyKeys = state.focusKey ? [state.focusKey] : (state.scope === "review" ? Storage.dueSentenceKeys() : []);
    state.questions = pickQuestions(picked.list, {
      count: requested,
      // 指定原题时由 key 唯一定位，不能被后来修改的题型偏好排除。
      modes: onlyKeys.length ? MODE_KEY_LIST : prefs.modes,
      filter: questionFilterFn(state.questionFilter),
      preferKeys: preferKeys,
      onlyKeys: onlyKeys,
    });
    state.answered = {};
    state.showAll = false;
    var notices = [];
    if (picked.notice) notices.push(picked.notice);
    if (state.scope === 'wrong' && !preferKeys.length) {
      notices.push('错题本里还没有可定位到句子的记录，已按篇目出题。');
    }
    if (state.focusKey && !state.questions.length) {
      notices.push('这条错题已经不在当前题库 / 筛选范围内。');
    }
    if (state.questions.length < requested) {
      notices.push('当前条件最多可生成 ' + state.questions.length + ' 题，本次生成 ' + state.questions.length + ' / ' + requested + ' 题。');
    }
    state.notice = notices.filter(Boolean).join(' ');
    renderQuestions(root, options);

  function escapeAttr(value) {
    return String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/"/g, '\\"');

  function refreshCard(root, key, options) {
    var index = -1;
    state.questions.forEach(function (question, i) {
      if (question.key === key) index = i;
    });
    if (index === -1) return;
    var card = root.querySelector('.quiz-card[data-key="' + escapeAttr(key) + '"]');
    if (!card || !card.parentNode) return;
    var holder = document.createElement('div');
    holder.innerHTML = renderQuestion(state.questions[index], index);
    var next = holder.firstElementChild;
    if (!next) return;
    card.parentNode.replaceChild(next, card);
    updateChrome(root);
    if (options && options.onProgress) options.onProgress();

  function handleClick(root, event, options) {
    var target = event.target;
    var actionEl = target.closest ? target.closest('[data-action]') : null;
    var countEl = target.closest ? target.closest('[data-count]') : null;
    var scopeEl = target.closest ? target.closest('[data-scope]') : null;
    var filterEl = target.closest ? target.closest('[data-question-filter]') : null;

    if (countEl) {
      Storage.getState().prefs.quizCount = Number(countEl.getAttribute('data-count')) || 10;
      Storage.save();
      root.querySelectorAll('[data-count]').forEach(function (el) {
        el.classList.toggle('active', el === countEl);
      });
      return;
    }
    if (scopeEl) {
      var scope = scopeEl.getAttribute('data-scope');
      state.scope = scope === 'wrong' || scope === 'focus' || scope === 'review' ? scope : 'all';
      state.focusKey = '';
      root.querySelectorAll('[data-scope]').forEach(function (el) {

      return;
    }
    if (filterEl) {

      state.focusKey = '';

      });
      return;
    }
    if (!actionEl) return;

    var action = actionEl.getAttribute('data-action');
    if (action === 'generate') {
      generate(root, options);
      return;
    }
    if (action === 'toggle-all') {
      state.showAll = !state.showAll;
      renderQuestions(root, options);
      return;
    }
    if (action === 'clear') {
      state.questions = [];
      state.answered = {};
      state.showAll = false;
      state.notice = '';
      state.focusKey = '';
      renderQuestions(root, options);
      return;
    }
    if (action === 'toggle-answer') {
      var card = actionEl.closest('.quiz-card');
      var key = card ? card.getAttribute('data-key') : '';
      var wrapper = card ? card.querySelector('.answer-wrapper') : null;
      if (!wrapper) return;
      var willShow = !wrapper.classList.contains('show');
      wrapper.classList.toggle('show', willShow);
      var showEye = actionEl.querySelector('.show-eye');
      var hideEye = actionEl.querySelector('.hide-eye');
      if (showEye) showEye.classList.toggle('hidden', willShow);
      if (hideEye) hideEye.classList.toggle('hidden', !willShow);
      actionEl.setAttribute('aria-expanded', willShow ? 'true' : 'false');
      if (state.answered[key]) state.answered[key].showAnswer = willShow;
      return;
    }
    if (action === 'compare-input') {
      var key=actionEl.getAttribute('data-key'), q=state.questions.filter(function(item){return item.key===key;})[0];
      var card=actionEl.closest('.quiz-card'), input=card && card.querySelector('[data-typed]');
      if (!q || !input) return;
      state.typed=state.typed||{}; state.typed[key]=input.value;
      var result=compareAnswer(input.value,q.answerText);
      card.querySelector('[data-diff]').innerHTML=(result.correct?'与当前正文一致：':'请核对差异：')+result.html;
      return;
    }
    if (action === 'mark-right' || action === 'mark-wrong') {
      var qKey = actionEl.getAttribute('data-key');
      var question = null;
      state.questions.forEach(function (item) {
        if (item.key === qKey) question = item;
      });
      if (!question) return;
      /* 一题只计一次分：重复点击不会把统计和错题次数刷高 */
      if (state.answered[qKey]) {
        if (global.PoetryApp) {
          global.PoetryApp.toast(state.answered[qKey].correct ? '本题已判定：默写正确' : '本题已判定：已加入错题本');
        }
        return;
      }
      var correct = action === 'mark-right';
      Storage.recordQuiz(question.poemId, correct, question.mode, {
        key: question.key,
        index: question.sentenceIndex,
        pairIndex: question.pairIndex,
      });
      state.answered[qKey] = { correct: correct, showAnswer: true };
      refreshCard(root, qKey, options);
      if (global.PoetryApp) {
        global.PoetryApp.toast(correct ? '已记录：默写正确' : '已加入错题本，下次优先练习');
      }
    }
  }

  function mount(root, options) {

    state.focusPoemId = focus ? focus.id : '';
    if (opts.initialScope === 'review' || opts.initialScope === 'wrong') state.scope = opts.initialScope;
    else state.scope = state.focusPoemId ? 'focus' : 'all';
    state.questionFilter = 'none';
    state.focusKey = typeof opts.focusKey === 'string' ? opts.focusKey : '';

        var modes = [];
        root.querySelectorAll('[data-mode]').forEach(function (el) {
          if (el.checked) modes.push(el.getAttribute('data-mode'));
        });

        Storage.save();
      }
    });
    generate(root, opts);
  }

/* 古诗文背诵学习系统 —— 打印默写纸

(function (global) {

  }

  function generate() {
    state.notice = '';

    var length = Utils.normalizeText(answerText || '').length;
    /* 有挖空的题型，答案直接写在句中的下划线上，下面只留一行备写；
       整句默写 / 看译文写原文没有可见下划线，才需要多行书写空间。 */
    var lines = mode === 'full' || mode === 'translation'

  /** 打印纸上的挖空改成下划线，比方框更像“填空纸”，截图 / 打印都更干净 */
  function blankMark(run) {

  }

  function printPrompt(html) {
    var src = String(html == null ? '' : html);

    src = src.replace(/<span class="blank-unit">(□+)<\/span>/g, function (_, run) {
      return blankMark(run);
    });
    src = src.replace(/□+/g, function (run) {
      return blankMark(run);
    });
    return src;
  }

  /**
   * 整句挖空 / 整句默写没有可见原句，补上一句 / 下一句作为语境，
   * 否则《梦游天姥吟留别》这种长诗里的“□□□□□□□？”根本无法定位。
   */
  function contextHtml(question) {
    if (!question || (question.mode !== 'blank-full' && question.mode !== 'full')) return '';

    if (!poem) return '';

    if (typeof index !== 'number' || index < 0 || index >= sentences.length) return '';

    if (index + 1 < sentences.length) parts.push('<span><b>下一句</b>' + Utils.escapeHtml(sentences[index + 1]) + '</span>');
    if (!parts.length) return '';

  function render(root) {

  function mount(root, options) {

  function lastNDays(n) {
    var out = [];
    var today = Utils.todayKey();
    for (var i = n - 1; i >= 0; i -= 1) {
      out.push(Utils.addDaysKey(today, -i));
    }
    return out;
  }

  function heatmapDays(daily) {
    return lastNDays(60).map(function (day) {
      var item = daily[day] || { quiz: 0, correct: 0 };
      return { day: day, count: item.quiz, correct: item.correct };
    });
  }

  function streakDays(daily) {
    var cursor = Utils.todayKey();
    if (!daily[cursor] || !daily[cursor].quiz) cursor = Utils.addDaysKey(cursor, -1);
    var count = 0;
    while (daily[cursor] && daily[cursor].quiz > 0) {
      count += 1;
      cursor = Utils.addDaysKey(cursor, -1);
    }
    return count;
  }

  function weeklySummary(daily, byPoem) {
    var days = lastNDays(7);
    var quiz = 0;
    var correct = 0;
    var active = 0;
    days.forEach(function (day) {
      var item = daily[day];
      if (!item || !item.quiz) return;
      quiz += item.quiz;
      correct += item.correct;
      active += 1;
    });
    var weak = byPoem
      .filter(function (row) {
        return row.item.total >= 3;
      })
      .sort(function (a, b) {
        return a.item.correct / a.item.total - b.item.correct / b.item.total;
      })[0];
    return {
      quiz: quiz,
      correct: correct,
      active: active,
      weakest: weak ? weak.poem : null,
    };
  }

  function progressSummary() {
    var saved = Storage.getState();
    var list = selectedPoems();
    var learned = list.filter(function (poem) {
      return saved.learnedIds[poem.id];
    }).length;
    var stats = saved.quizStats;
    var today = Storage.todayStats();
    var byPoem = list
      .map(function (poem) {
        var item = stats.byPoem[poem.id];
        return { poem: poem, item: item };
      })
      .filter(function (row) {
        return row.item && row.item.total > 0;
      })
      .sort(function (a, b) {
        return (b.item.lastTime || 0) - (a.item.lastTime || 0);
      });

    /* 题目级错题按篇目分组，保留具体句子 / 题型 / 次数 */
    var wrongMap = Object.create(null);
    var allowed = Object.create(null);
    list.forEach(function (poem) {
      allowed[poem.id] = true;
    });
    Utils.toArray(saved.wrongItems).forEach(function (item) {
      if (!allowed[item.poemId]) return;
      var poem = DB.byId(item.poemId);
      if (!poem) return;
      var row = wrongMap[item.poemId];
      if (!row) {
        row = {
          poem: poem,
          entry: { id: item.poemId, time: 0, count: 0, mode: '', items: 0 },
          items: [],
        };
        wrongMap[item.poemId] = row;
      }
      row.entry.count += item.count;
      row.entry.items += 1;
      if (item.time >= row.entry.time) {
        row.entry.time = item.time;
        if (item.mode) row.entry.mode = item.mode;
      }
      row.items.push(item);
    });
    var wrongBook = Object.keys(wrongMap)
      .map(function (id) {
        var row = wrongMap[id];
        row.items.sort(function (a, b) {
          return b.time - a.time;
        });
        return row;
      })
      .sort(function (a, b) {
        return b.entry.time - a.entry.time;
      });

    var dueIds = Storage.duePoemIds();
    var due = list.filter(function (poem) {
      return dueIds.indexOf(poem.id) !== -1;
    });

    var focusTotal = 0;
    var focusLearned = 0;
    list.forEach(function (poem) {
      var count = Utils.toArray(poem.examFocus).length;
      focusTotal += count;
      if (saved.learnedIds[poem.id]) focusLearned += count;
    });

    var weekly = weeklySummary(saved.daily, byPoem);

      learned: learned,
      today: today,
      stats: stats,
      byPoem: byPoem,
      wrongBook: wrongBook,
      wrongItems: saved.wrongItems,
      due: due,
      dueCount: due.length,

  /* ---------------- 路由 ---------------- */

  function canShow(view) {

  function navigate(view, hashOptions, opts) {
    if (VIEWS.indexOf(view) === -1) view = 'stage';
    if (!canShow(view)) view = state.stage ? 'select' : 'stage';
    state.view = view;
    var hash = '#/' + view + (hashOptions || '');
    lastHash = hash;
    if (global.location.hash !== hash) {
      try {
        if (opts && opts.replace) {
          global.history.replaceState({ depth: currentDepth(), view: view }, '', hash);
        } else {
          global.history.pushState({ depth: currentDepth() + 1, view: view }, '', hash);
        }
      } catch (err) {
        global.location.hash = hash;
      }
    }
    render();
    /* 换页后回到顶部，避免沿用上一页的滚动位置 */
    if (global.scrollTo) global.scrollTo(0, 0);
  }

  function hashParam(name) {
    var hash = global.location.hash || '';
    var queryIndex = hash.indexOf('?');
    if (queryIndex === -1) return '';
    var query = hash.slice(queryIndex + 1);
    var pairs = query.split('&');
    for (var i = 0; i < pairs.length; i += 1) {
      var eq = pairs[i].indexOf('=');
      var key = eq === -1 ? pairs[i] : pairs[i].slice(0, eq);
      if (safeDecode(key) === name) return safeDecode(eq === -1 ? '' : pairs[i].slice(eq + 1));
    }
    return '';
  }

  /** 链接可能被截断或含非法转义（如 #/study?poem=%），解码失败时按空值处理 */
  function safeDecode(value) {

      return decodeURIComponent(value);
    } catch (err) {
      return '';
    }
  }

  /* ---------------- 篇目清单分享 ---------------- */

  function encodeSelection(ids) {
    var all = DB.all();

    all.forEach(function (poem, i) {
      index[poem.id] = i;
    });
    return Utils.unique(Utils.toArray(ids))
      .map(function (id) {
        return index[id];
      })
      .filter(function (i) {
        return typeof i === 'number' && i >= 0;
      })
      .map(function (i) {
        return i.toString(36);
      })
      .join('.');
  }

  function decodeSelection(code) {
    var all = DB.all();
    return String(code || '')
      .split('.')
      .map(function (token) {
        return parseInt(token, 36);
      })
      .filter(function (i) {
        return Number.isInteger(i) && i >= 0 && i < all.length;
      })
      .map(function (i) {
        return all[i].id;
      });
  }

  /* ---------------- 视图：篇目选择 ---------------- */

  function activeFilterCount() {
    var f = state.filters;

  }

  function matchesProgress(poem) {
    var picked = state.filters.progress;
    if (!picked.length) return true;
    var saved = Storage.getState();
    return picked.some(function (key) {
      if (key === 'unlearned') return !saved.learnedIds[poem.id];
      if (key === 'wrong') {
        return Utils.toArray(saved.wrongItems).some(function (item) {
          return item.poemId === poem.id;
        });
      }
      if (key === 'weak') {
        var item = saved.quizStats.byPoem[poem.id];
        return !!(item && item.total >= 3 && item.correct / item.total < 0.6);
      }
      return false;
    });
  }

  function masteryScore(poem) {
    var item = Storage.getState().quizStats.byPoem[poem.id];
    if (!item || !item.total) return 0.5;
    return item.correct / item.total;

  function filteredPoems() {

      stage: state.stage,
      grade: state.filters.grade,
      genre: state.filters.genre,
      keyword: state.filters.keyword,

    var sorted = DB.sort(list);
    if (state.sort === 'mastery') {
      sorted.sort(function (a, b) {
        return masteryScore(a) - masteryScore(b) || a.title.localeCompare(b.title, 'zh');
      });
    } else if (state.sort === 'recent') {
      sorted.sort(function (a, b) {
        var ta = (Storage.getState().quizStats.byPoem[a.id] || {}).lastTime || 0;
        var tb = (Storage.getState().quizStats.byPoem[b.id] || {}).lastTime || 0;
        return tb - ta;
      });
    }
    return sorted;
  }

  function highlightSnippet(text, keyword) {
    var src = String(text == null ? '' : text);
    var lower = src.toLowerCase();
    var key = String(keyword || '').toLowerCase();
    var idx = lower.indexOf(key);
    if (idx === -1) return Utils.escapeHtml(src);
    var start = Math.max(0, idx - 10);
    var end = Math.min(src.length, idx + key.length + 18);
    var raw = src.slice(start, end);
    var rawLower = raw.toLowerCase();
    var at = rawLower.indexOf(key);
    var prefix = start > 0 ? '…' : '';
    var suffix = end < src.length ? '…' : '';
    if (at === -1) return Utils.escapeHtml(prefix + raw + suffix);
    return prefix +
      Utils.escapeHtml(raw.slice(0, at)) +
      '<mark>' + Utils.escapeHtml(raw.slice(at, at + key.length)) + '</mark>' +
      Utils.escapeHtml(raw.slice(at + key.length)) +
      suffix;
  }

  function matchSnippet(poem, keyword) {
    var key = String(keyword || '').trim();
    if (!key) return '';
    var lower = key.toLowerCase();
    var fields = [
      ['篇名', poem.title],
      ['作者', poem.author],
      ['朝代', poem.dynasty],
      ['年级', poem.grade],
      ['体裁', poem.genre],
      ['来源', poem.sourceType],
      ['说明', poem.notes],
    ];
    for (var i = 0; i < fields.length; i += 1) {
      if (String(fields[i][1] || '').toLowerCase().indexOf(lower) !== -1) {
        return '<span class="poem-match">' + Utils.escapeHtml(fields[i][0]) + '：' + highlightSnippet(fields[i][1], key) + '</span>';
      }
    }
    var sentences = Utils.splitSentences(poem.text);
    for (var j = 0; j < sentences.length; j += 1) {
      if (sentences[j].toLowerCase().indexOf(lower) !== -1) {
        return '<span class="poem-match">正文：' + highlightSnippet(sentences[j], key) + '</span>';
      }
    }
    return '';
  }

  function selectResultsHtml() {

      groups.sort(function (a, b) {
        var oa = order.indexOf(a.key);
        var ob = order.indexOf(b.key);
        return (oa === -1 ? 99 : oa) - (ob === -1 ? 99 : ob);
      });
    } else {
      /* 按掌握度 / 最近练习排序时不再按年级分组，否则年级分组会把全局排序切碎 */
      groups = [{
        key: state.sort === 'mastery' ? '按掌握度排序' : '按最近练习排序',
        items: filtered,
      }];
    }

    if (!groups.length) {
      return '<div class="empty-state">没有找到符合条件的篇目，试着换个关键词或点击「全部」。</div>';
    }
    return groups
      .map(function (group) {
        return (
          '<div class="group-block">' +
            '<div class="group-heading"><span>' + Utils.escapeHtml(group.key) + '</span><span class="muted tiny">' + group.items.length + ' 篇</span><span class="group-line" aria-hidden="true"></span></div>' +
            '<div class="poem-grid">' +
            group.items
              .map(function (poem) {
                var checked = selectedIds.indexOf(poem.id) !== -1;
                var snippet = matchSnippet(poem, keyword);
                return (
                  '<button type="button" class="poem-card' + (checked ? ' checked' : '') + '" data-poem="' + Utils.escapeHtml(poem.id) + '" aria-pressed="' + checked + '">' +
                    '<span class="check" aria-hidden="true">' + (checked ? '✓' : '') + '</span>' +
                    '<span class="poem-main">' +
                      '<span class="poem-title">' + Utils.escapeHtml(poem.title) + '</span>' +
                      '<span class="poem-sub">' + Utils.escapeHtml(poem.author + ' · ' + poem.dynasty) + '</span>' +
                      snippet +
                      '<span class="poem-tags">' +
                        '<span class="badge">' + Utils.escapeHtml(poem.genre) + '</span>' +
                        '<span class="badge' + (poem.required ? ' badge-success' : '') + '">' + Utils.escapeHtml(poem.sourceType) + '</span>' +
                      '</span>' +
                    '</span>' +
                  '</button>'
                );
              })
              .join('') +
            '</div>' +
          '</div>'
        );
      })
      .join('');
  }

  function refreshSelectResults() {
    var box = document.getElementById('selectResults');
    if (box) box.innerHTML = selectResultsHtml();
    var count = document.getElementById('selectCountLabel');
    if (count) {
      var filtered = filteredPoems().length;
      count.textContent = activeFilterCount() ? '已应用 ' + activeFilterCount() + ' 个筛选条件 · 当前 ' + filtered + ' 篇' : '当前显示 ' + filtered + ' 篇';
    }
  }

  function selectedInStage() {
    var selectedIds = Storage.getState().selectedIds;
    return DB.byStage(state.stage).filter(function (poem) {
      return selectedIds.indexOf(poem.id) !== -1;
    });
  }

  /** 局部更新勾选状态：不整页重绘，保留“已选篇目”展开状态、滚动位置和焦点 */
  function updateSelectSelection(changedId) {
    var list = selectedInStage();
    var summary = document.querySelector('.select-summary');
    if (summary) summary.textContent = '已选择 ' + list.length + ' 篇';
    var start = document.getElementById('startBtn');
    if (start) {
      start.disabled = !list.length;
      start.textContent = '进入学习（已选 ' + list.length + ' 篇）';
    }
    var wrap = document.getElementById('selectedPanelWrap');
    if (wrap) {
      if (!list.length) {
        wrap.innerHTML = '';
      } else {
        var details = wrap.querySelector('details');
        if (!details) {
          wrap.innerHTML = selectedPanelHtml(list);
        } else {
          var summaryEl = details.querySelector('summary');
          if (summaryEl) summaryEl.textContent = '已选篇目快速查看（' + list.length + '）';
          var selectedList = details.querySelector('.selected-list');
          if (selectedList) selectedList.innerHTML = selectedChipsHtml(list);
        }
      }
    }
    if (changedId) {
      var card = document.querySelector('.poem-card[data-poem="' + escapeAttr(changedId) + '"]');
      if (card) {
        var checked = Storage.getState().selectedIds.indexOf(changedId) !== -1;
        card.classList.toggle('checked', checked);
        card.setAttribute('aria-pressed', checked ? 'true' : 'false');
        var check = card.querySelector('.check');
        if (check) check.textContent = checked ? '✓' : '';
      }
    }
  }

  function renderSelect(root) {
    var stage = state.stage;
    var all = DB.byStage(stage);
    var list = selectedInStage();
    var grades = Meta.grades[stage] || [];
    var genres = Meta.genres;

    /** items：字符串或 {key,label}；current：已选中的值数组（空数组 = 全部） */
    var chips = function (items, key, current, emptyLabel) {
      var isActive = function (value) {
        return current.indexOf(value) !== -1;
      };
      return (
        '<button type="button" class="chip' + (current.length ? '' : ' active') + '" data-filter="' + key + '" data-value="">' + Utils.escapeHtml(emptyLabel || '全部') + '</button>' +
        items
          .map(function (item) {
            var value = typeof item === 'string' ? item : item.key;
            var label = typeof item === 'string' ? item : item.label;
            return '<button type="button" class="chip' + (isActive(value) ? ' active' : '') + '" data-filter="' + key + '" data-value="' + Utils.escapeHtml(value) + '">' + Utils.escapeHtml(label) + '</button>';
          })
          .join('')
      );
    };

    var filteredCount = filteredPoems().length;
    var sortOptions = [
      ['default', '年级 / 来源顺序'],
      ['mastery', '掌握度（低的在前）'],
      ['recent', '最近练习'],

      .map(function (item) {
        return '<option value="' + item[0] + '"' + (state.sort === item[0] ? ' selected' : '') + '>' + item[1] + '</option>';
      })
      .join('');

    root.innerHTML =
      '<section class="card">' +
        '<h2 class="section-title">请选择要背诵的篇目</h2>' +
        '<p class="section-desc">' + Utils.escapeHtml(stage) + '共有 ' + all.length + ' 篇，支持多选、搜索，' +
          Utils.escapeHtml(stage === '高中' ? '按课程模块' : '按年级') + ' / 体裁 / 掌握度筛选，筛选都可以多选。</p>' +
        '<div class="toolbar" style="margin-top:0.9rem;">' +
          '<div class="search-box">' +
            '<input type="search" id="poemSearch" placeholder="搜索篇名 / 作者 / 朝代 / 关键词（如：李白）" value="' + Utils.escapeHtml(state.filters.keyword) + '" aria-label="搜索篇目">' +
            '<button type="button" class="search-clear" data-action="clear-search" aria-label="清空搜索">✕</button>' +
          '</div>' +
          '<div class="filter-group"><span class="filter-label">' + Utils.escapeHtml((Meta.gradeLabels && Meta.gradeLabels[stage]) || '年级') + '（可多选）</span><div class="chips">' + chips(grades, 'grade', state.filters.grade, stage === '高中' ? '全部模块' : '全部年级') + '</div></div>' +
          '<div class="filter-group"><span class="filter-label">体裁（可多选）</span><div class="chips">' + chips(genres, 'genre', state.filters.genre, '全部体裁') + '</div></div>' +
          '<div class="filter-group"><span class="filter-label">掌握度（可多选）</span><div class="chips">' + chips([
            { key: 'unlearned', label: '未学习' },
            { key: 'wrong', label: '有错题' },
            { key: 'weak', label: '正确率低' },
          ], 'progress', state.filters.progress, '全部') + '</div></div>' +

          '<div class="select-actions">' +
            '<button type="button" class="btn btn-sm" data-action="select-all">全选当前结果</button>' +
            '<button type="button" class="btn btn-sm" data-action="select-none">取消全选</button>' +

          '</div>' +
          '<div id="selectedPanelWrap">' + selectedPanelHtml(list) + '</div>' +

  function wrongItemPreview(item) {
    var poem = DB.byId(item.poemId);
    if (!poem) return '';
    if (item.index == null) return '整篇（旧记录）';
    var sentences = Utils.splitSentences(poem.text);
    var sentence = sentences[item.index] || '';
    return '第 ' + (item.index + 1) + ' 句：' + sentence;
  }

  function renderProgress(root) {
    var summary = progressSummary();
    var rows = summary.byPoem
      .map(function (row) {
        var rate = row.item.total ? Math.round((row.item.correct / row.item.total) * 100) : 0;
        return (
          '<div class="progress-item">' +
            '<div class="pi-main"><div>' + Utils.escapeHtml(row.poem.title) + '</div>' +
            '<div class="pi-sub">' + Utils.escapeHtml(row.poem.author) + ' · 练习 ' + row.item.total + ' 次 · 正确率 ' + rate + '%</div></div>' +
            '<button type="button" class="btn btn-sm" data-study="' + Utils.escapeHtml(row.poem.id) + '">复习</button>' +
          '</div>'
        );
      })
      .join('');

    var heatMax = 1;
    summary.heatmap.forEach(function (day) {
      if (day.count > heatMax) heatMax = day.count;
    });
    var heatCells = summary.heatmap.map(function (day) {
      var level = day.count ? Math.min(4, Math.ceil((day.count / heatMax) * 4)) : 0;
      return '<span class="heat-cell" data-level="' + level + '" title="' + Utils.escapeHtml(day.day + ' · ' + day.count + ' 题') + '"></span>';
    }).join('');

    var wrongHtml = summary.wrongBook.length
      ? summary.wrongBook
          .map(function (row) {
            var items = row.items
              .map(function (item) {
                var mode = item.mode ? (global.PoetryQuiz ? global.PoetryQuiz.modeLabel(item.mode) : item.mode) : '旧记录';
                return (
                  '<div class="wrong-item">' +
                    '<span class="wrong-preview">' + Utils.escapeHtml(wrongItemPreview(item)) + '</span>' +
                    '<span class="tiny muted">' + Utils.escapeHtml(mode) + ' · 错 ' + item.count + ' 次</span>' +
                    (item.index == null
                      ? ''
                      : '<button type="button" class="btn btn-sm" data-practice-item="' + Utils.escapeHtml(item.key) + '" data-practice-poem="' + Utils.escapeHtml(item.poemId) + '">只练这句</button>') +
                    '<button type="button" class="btn btn-sm" data-remove-wrong-item="' + Utils.escapeHtml(item.key) + '">移除</button>' +
                  '</div>'
                );
              })
              .join('');
            return (
              '<div class="wrong-group">' +
                '<div class="progress-item">' +
                  '<div class="pi-main"><div>' + Utils.escapeHtml(row.poem.title) + '</div>' +
                  '<div class="pi-sub">错 ' + row.entry.count + ' 次 · ' + row.items.length + ' 句 · ' + Utils.escapeHtml(Utils.formatDateTime(row.entry.time)) + '</div></div>' +
                  '<div class="pi-actions">' +
                    '<button type="button" class="btn btn-sm btn-primary" data-practice="' + Utils.escapeHtml(row.poem.id) + '">再练一次</button>' +
                    '<button type="button" class="btn btn-sm" data-remove-wrong="' + Utils.escapeHtml(row.poem.id) + '">移除</button>' +
                  '</div>' +
                '</div>' +
                '<details class="wrong-details"><summary>查看错题句（' + row.items.length + '）</summary><div class="wrong-list">' + items + '</div></details>' +
              '</div>'
            );
          })
          .join('')
      : '<div class="empty-state">还没有错题 —— 默写时会自动记录答错的篇目和句子。</div>';

    root.innerHTML =
      '<section class="card">' +
        '<h2 class="section-title">我的进度</h2>' +
        '<div class="stat-row">' +
          '<div class="stat-box"><div class="stat-num">' + summary.learned + ' / ' + summary.list.length + '</div><div class="stat-label">已学习 / 已选择</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.stats.total + '</div><div class="stat-label">累计默写次数</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.accuracy + '%</div><div class="stat-label">整体正确率</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.today.quiz + '</div><div class="stat-label">今日默写</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.streak + '</div><div class="stat-label">连续学习天数</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + summary.focusLearned + ' / ' + summary.focusTotal + '</div><div class="stat-label">已学篇目重点句</div></div>' +
        '</div>' +
        '<p class="tiny muted" style="margin-top:0.6rem;">数据保存在本机浏览器 localStorage 中，清除浏览器数据会同时清除进度。可以在下方导出备份。</p>' +
      '</section>' +
      '<section class="card">' +
        '<h3 class="section-title" style="font-size:1rem;">近 60 天</h3>' +
        '<div class="heatmap" aria-label="近 60 天默写热力图">' + heatCells + '</div>' +
        '<div class="heat-legend"><span class="tiny muted">少</span><span class="heat-cell" data-level="0"></span><span class="heat-cell" data-level="1"></span><span class="heat-cell" data-level="2"></span><span class="heat-cell" data-level="3"></span><span class="heat-cell" data-level="4"></span><span class="tiny muted">多</span></div>' +
        '<p class="tiny muted" style="margin-top:0.6rem;">连续学习 ' + summary.streak + ' 天 · 今日默写 ' + summary.today.quiz + ' 题</p>' +
      '</section>' +
      '<section class="card">' +
        '<h3 class="section-title" style="font-size:1rem;">本周小结</h3>' +
        '<p class="section-desc">本周默写 ' + summary.weekly.quiz + ' 题 · 正确 ' + summary.weekly.correct + ' 题 · 学习 ' + summary.weekly.active + ' 天</p>' +
        (summary.weekly.weakest ? '<p class="tiny muted">最薄弱篇目：《' + Utils.escapeHtml(summary.weekly.weakest.title) + '》——可以优先复习这一篇。</p>' : '') +
        '<div class="select-actions" style="margin-top:0.7rem;"><button type="button" class="btn btn-sm btn-primary" data-action="quiz-review">开始今日复习</button><button type="button" class="btn btn-sm" data-action="quiz-wrong">练习错题</button></div>' +
      '</section>' +
      '<section class="card">' +

  /* ---------------- 数据导出 / 导入 / 分享 ---------------- */

  function downloadText(filename, text) {
    try {
      var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (err) {
      return false;
    }
  }

  function handleExport() {
    var payload = Storage.exportData();
    var text = JSON.stringify(payload, null, 2);
    var ok = downloadText('hison-poetry-backup-' + Utils.todayKey().replace(/-/g, '') + '.json', text);
    if (!ok && global.prompt) global.prompt('复制下面的学习数据并保存：', text);
    toast(ok ? '学习数据已导出' : '浏览器不支持直接下载，已打开复制窗口');
  }

  function handleImportFile(input) {
    var file = input && input.files && input.files[0];
    if (!file) return;
    if (!global.FileReader) {
      toast('当前浏览器不支持导入文件');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var payload = JSON.parse(String(reader.result));
        if (global.confirm && !global.confirm('导入会覆盖本机现有学习数据，确定继续吗？')) return;
        var result = Storage.importData(payload);
        if (!result.ok) {
          toast(result.error || '导入失败');
          return;
        }
        state.stage = Storage.getState().stage;
        // 恢复另一学段或空白备份后，不能沿用导入前的学段 / 年级筛选。
        state.filters = { keyword: '', grade: [], genre: [], progress: [] };
        state.sort = 'default';
        toast('学习数据已导入');
        navigate('home');
      } catch (err) {
        toast('导入失败：文件不是合法 JSON');
      }
    };
    reader.onerror = function () {
      toast('读取文件失败');
    };
    reader.readAsText(file);
    input.value = '';
  }

  function copyText(text) {
    if (global.navigator && global.navigator.clipboard && global.navigator.clipboard.writeText) {
      return global.navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return false;
      });
    }
    return Promise.resolve(false);
  }

  function handleCopyShare() {
    if (!Storage.getState().selectedIds.length) {
      toast('还没有选择篇目');
      return;
    }
    var url = buildShareUrl();
    copyText(url).then(function (ok) {
      if (!ok && global.prompt) global.prompt('复制这篇目清单链接：', url);
      toast(ok ? '已复制篇目清单链接' : '链接已生成，请手动复制');
    });
  }

  /* ---------------- 渲染与事件 ---------------- */

  function updateHeader() {
    if (!els.subtitle) return;
    var summary = {
      stage: state.stage,
      selected: Storage.getState().selectedIds.length,
    };
    var title = VIEW_TITLES[state.view] || Meta.slogan;
    els.subtitle.textContent = title;
    if (els.meta) {
      var due = Storage.duePoemIds().length;
      els.meta.innerHTML = summary.stage
        ? '<span class="badge badge-primary">' + Utils.escapeHtml(summary.stage) + '</span><span class="badge">已选 ' + summary.selected + ' 篇</span>' +
          (due ? '<span class="badge badge-warn">待复习 ' + due + '</span>' : '')
        : '';
    }
    if (els.back) {
      els.back.hidden = state.view === 'stage';
      els.back.setAttribute('aria-label', state.view === 'select' ? '返回选择学习阶段' : '返回');
    }
  }

  function focusView(container) {
    if (!container) return;
    var heading = container.querySelector('h1, h2');
    if (!heading) return;
    heading.setAttribute('tabindex', '-1');
    try {
      heading.focus({ preventScroll: true });
    } catch (err) {
      heading.focus();
    }
  }

  function syncHeaderHeight() {
    var header = document.querySelector('.app-header');
    if (!header) return;
    document.documentElement.style.setProperty('--app-header-height', header.offsetHeight + 'px');
  }

  function render() {
    var container = document.createElement('div');
    /* 入场动画只在真正切换页面时播放；同一页面内的筛选 / 勾选重绘保持静止 */
    var entering = state.view !== render.lastView;
    render.lastView = state.view;
    container.className = entering ? 'view-inner view-inner--enter' : 'view-inner';

    /* 阅读偏好类名只属于学习页：离开学习页时清理，避免专注模式把导航藏到别的页面 */
    if (document.body) document.body.classList.remove('focus-reading', 'font-sm', 'font-md', 'font-lg');

    try {
      if (!DB.all().length) {
        container.innerHTML = '<section class="card"><div class="empty-state">题库为空：请在 data/junior.js、data/senior.js 中补充篇目数据。</div></section>';
      } else if (state.view === 'stage') renderStage(container);
      else if (state.view === 'select') renderSelect(container);
      else if (state.view === 'home') renderHome(container);
      else if (state.view === 'study') {
        var studyList = selectedPoems();
        var lastPoem = hashParam('poem') || global.PoetryStudy.currentPoemId();
        var inList = studyList.some(function (poem) {
          return poem.id === lastPoem;
        });
        global.PoetryStudy.mount(container, {
          list: studyList,
          poemId: inList ? lastPoem : '',
        });
      } else if (state.view === 'quiz') {
        var scopeParam = hashParam('scope');
        global.PoetryQuiz.mount(container, {
          list: selectedPoems(),
          focusPoemId: hashParam('poem'),
          focusKey: hashParam('item'),
          initialScope: scopeParam,
          onProgress: updateHeader,
        });
      } else if (state.view === 'progress') renderProgress(container);
      else if (state.view === 'print') {
        global.PoetryWorksheet.mount(container, {
          list: selectedPoems(),
        });
      }
    } catch (err) {
      console.error('[渲染失败]', err);
      container.innerHTML =
        '<section class="card"><div class="empty-state">页面渲染出现异常，已保护性停止。<br>可以点击下方按钮重置本地数据后重试。</div>' +
        '<div style="margin-top:0.9rem;display:flex;gap:0.5rem;justify-content:center;"><button type="button" class="btn btn-sm" data-safe="home">返回首页</button><button type="button" class="btn btn-sm" data-safe="reset">重置本地数据</button></div></section>';
    }

    els.root.innerHTML = '';
    els.root.appendChild(container);
    if (entering) {
      /* 换页时收起上一页的 toast，避免“已生成 10 道题”压在新页面按钮上 */
      if (els.toast) els.toast.classList.remove('show');
      focusView(container);
    }
    updateHeader();
    syncHeaderHeight();
    if (global.PoetryBrand && global.PoetryBrand.refresh) {
      try {
        global.PoetryBrand.refresh();
      } catch (err) {
        /* 品牌层异常不影响主流程 */
      }
    }
  }

  function handleGlobalClick(event) {
    var target = event.target;
    var el = target.closest ? target.closest('[data-stage],[data-action],[data-poem],[data-remove],[data-filter],[data-study],[data-practice],[data-practice-item],[data-remove-wrong],[data-remove-wrong-item],[data-safe]') : null;
    if (!el) return;

    if (el.hasAttribute('data-stage')) {
      state.stage = el.getAttribute('data-stage');
      Storage.patch({ stage: state.stage });
      state.filters = { keyword: '', grade: [], genre: [], progress: [] };
      state.sort = 'default';
      navigate('select');
      return;
    }
    if (el.hasAttribute('data-filter')) {
      var key = el.getAttribute('data-filter');
      var value = el.getAttribute('data-value') || '';
      // 年级 / 课程模块、体裁、掌握度都支持多选：点“全部”清空，点某一项将其加入或移出
      if (!value) {
        state.filters[key] = [];
      } else {
        var picked = state.filters[key].slice();
        var pickedIndex = picked.indexOf(value);
        if (pickedIndex === -1) picked.push(value);
        else picked.splice(pickedIndex, 1);
        state.filters[key] = picked;
      }
      render();
      return;
    }
    if (el.hasAttribute('data-poem')) {
      var id = el.getAttribute('data-poem');
      var ids = Storage.getState().selectedIds.slice();
      var index = ids.indexOf(id);
      if (index === -1) ids.push(id);
      else ids.splice(index, 1);
      Storage.patch({ selectedIds: ids });
      updateSelectSelection(id);
      return;
    }
    if (el.hasAttribute('data-remove')) {
      var removeId = el.getAttribute('data-remove');
      Storage.patch({
        selectedIds: Storage.getState().selectedIds.filter(function (item) {
          return item !== removeId;
        }),
      });
      updateSelectSelection(removeId);
      return;
    }
    if (el.hasAttribute('data-study')) {
      navigate('study', '?poem=' + encodeURIComponent(el.getAttribute('data-study')));
      return;
    }
    if (el.hasAttribute('data-practice-item')) {
      var itemKey = el.getAttribute('data-practice-item');
      var poemId = el.getAttribute('data-practice-poem') || '';
      navigate('quiz', '?poem=' + encodeURIComponent(poemId) + '&item=' + encodeURIComponent(itemKey));
      return;
    }
    if (el.hasAttribute('data-practice')) {
      /* 只练这一篇：错误次数由判分逻辑维护，打开练习本身不算答错 */
      navigate('quiz', '?poem=' + encodeURIComponent(el.getAttribute('data-practice')));
      return;
    }
    if (el.hasAttribute('data-remove-wrong-item')) {
      Storage.removeWrongItem(el.getAttribute('data-remove-wrong-item'));
      toast('已从错题本移除该句');
      render();
      return;
    }
    if (el.hasAttribute('data-remove-wrong')) {
      Storage.removeWrong(el.getAttribute('data-remove-wrong'));
      toast('已从错题本移除');
      render();
      return;
    }
    if (el.hasAttribute('data-safe')) {
      if (el.getAttribute('data-safe') === 'reset') {
        Storage.reset();
        toast('本地数据已重置');
      }
      navigate('stage');
      return;
    }

    // data-action
    var action = el.getAttribute('data-action');
    if (action === 'continue') {
      var savedStage = Storage.getState().stage;
      if (!savedStage) {
        var first = Storage.getState().selectedIds[0];
        var poem = first ? DB.byId(first) : null;
        savedStage = poem ? poem.stage : '';
      }
      if (!savedStage) return;
      state.stage = savedStage;
      navigate('home');
    } else if (action === 'to-select') {
      navigate('select');
    } else if (action === 'study') {
      navigate('study');
    } else if (action === 'quiz') {
      navigate('quiz');
    } else if (action === 'quiz-wrong') {
      navigate('quiz', '?scope=wrong');
    } else if (action === 'quiz-review') {
      navigate('quiz', '?scope=review');
    } else if (action === 'progress') {
      navigate('progress');
    } else if (action === 'print') {
      navigate('print');
    } else if (action === 'start') {
      if (!Storage.getState().selectedIds.length) {
        toast('请先勾选至少一篇要背诵的篇目');
        return;
      }
      navigate('home');
    } else if (action === 'select-all') {
      var filteredIds = DB.query({
        stage: state.stage,
        grade: state.filters.grade,
        genre: state.filters.genre,
        keyword: state.filters.keyword,
      }).filter(matchesProgress).map(function (poem) {
        return poem.id;
      });
      Storage.patch({ selectedIds: Utils.unique(Storage.getState().selectedIds.concat(filteredIds)) });
      render();
    } else if (action === 'select-none') {
      var stageIds = DB.byStage(state.stage).map(function (poem) {
        return poem.id;
      });
      Storage.patch({
        selectedIds: Storage.getState().selectedIds.filter(function (id) {
          return stageIds.indexOf(id) === -1;
        }),
      });
      render();
    } else if (action === 'select-required') {
      var requiredIds = DB.byStage(state.stage)
        .filter(function (poem) {
          return poem.required;
        })
        .map(function (poem) {
          return poem.id;
        });
      Storage.patch({ selectedIds: Utils.unique(Storage.getState().selectedIds.concat(requiredIds)) });
      toast('已选中课标必背篇目 ' + requiredIds.length + ' 篇');
      render();
    } else if (action === 'clear-search') {
      state.filters.keyword = '';
      var input = document.getElementById('poemSearch');
      if (input) input.value = '';
      refreshSelectResults();
    } else if (action === 'reset') {
      if (global.confirm('确定要清空全部本地学习数据吗？此操作不可恢复。')) {
        Storage.reset();
        toast('本地数据已重置');
        navigate('stage');
      }
    } else if (action === 'export-data') {
      handleExport();
    } else if (action === 'copy-share') {
      handleCopyShare();
    }
  }

  function handleGlobalInput(event) {
    if (event.target && event.target.id === 'poemSearch') {
      state.filters.keyword = event.target.value;
      debouncedSearch();
    }
  }

  function handleGlobalChange(event) {
    var target = event.target;
    if (!target) return;
    if (target.id === 'poemSort') {
      state.sort = target.value;
      render();
      return;
    }
    if (target.id === 'importFile') {
      handleImportFile(target);
    }
  }

  function handleGlobalKeydown(event) {
    if (state.view === 'study' && global.PoetryStudy && global.PoetryStudy.handleKey) {
      global.PoetryStudy.handleKey(event);
    }
  }

  var debouncedSearch = Utils.debounce(function () {
    refreshSelectResults();
  }, 120);

  function goBack() {
    var parent = '';
    if (state.view === 'study' || state.view === 'quiz' || state.view === 'progress' || state.view === 'print') parent = 'home';
    else if (state.view === 'home') parent = 'select';
    else if (state.view === 'select') parent = 'stage';
    if (!parent) return;
    /* 顶栏“返回”是页面上行跳转，不跟着浏览器历史走：
       从进度页点“再练一次”进入默写后，返回应该回到工作台，而不是回到进度页。 */
    navigate(parent, '', { replace: true });
  }

  function applyLocation() {
    var raw = global.location.hash || '';
    if (hashParam('list') && applySharedList()) {
      raw = '#/select';
      try {
        global.history.replaceState({ depth: currentDepth(), view: 'select' }, '', raw);
      } catch (err) {
        /* 忽略 */
      }
    }
    var hash = raw.replace(/^#\/?/, '');
    var parts = hash.split('?');
    var view = parts[0] || '';
    if (VIEWS.indexOf(view) === -1) return;
    if (!state.stage) {
      var savedStage = Storage.getState().stage;
      if (savedStage) state.stage = savedStage;
    }
    if (!canShow(view)) {
      navigate(canShow('select') ? 'select' : 'stage', '', { replace: true });
      return;
    }
    if (state.view !== view || raw !== lastHash) {
      state.view = view;
      lastHash = raw;
      render();
      if (global.scrollTo) global.scrollTo(0, 0);
    }
  }

  function handleHashChange() {
    applyLocation();
  }

  function handlePopState() {
    applyLocation();
  }

  function boot() {
    els.root = document.getElementById('viewRoot');
    els.toast = document.getElementById('toast');
    els.subtitle = document.getElementById('headerSubtitle');
    els.meta = document.getElementById('headerMeta');
    els.back = document.getElementById('headerBack');
    els.themeToggle = document.getElementById('themeToggle');

    var saved = Storage.load();
    state.stage = saved.stage || '';

    applyTheme(readTheme());
    if (els.themeToggle) els.themeToggle.addEventListener('click', toggleTheme);

    if (global.PoetryBrand && global.PoetryBrand.install) {
      try {
        global.PoetryBrand.install();
      } catch (err) {
        console.warn('[品牌层] 初始化失败', err);
      }
    }

    var issue = Storage.getLoadIssue();
    if (issue) toast(issue);

    var sharedApplied = false;
    if (hashParam('list')) {
      sharedApplied = applySharedList();
      if (sharedApplied) {
        try {
          global.history.replaceState({ depth: 0, view: 'select' }, '', '#/select');
        } catch (err) {
          /* 忽略 */
        }
      }
    }

    var hash = (global.location.hash || '').replace(/^#\/?/, '').split('?')[0];
    if (VIEWS.indexOf(hash) !== -1 && canShow(hash)) state.view = hash;
    else if (saved.selectedIds.length && state.stage) state.view = sharedApplied ? 'select' : 'home';
    else state.view = 'stage';
    lastHash = sharedApplied ? '#/select' : (global.location.hash || '');
    try {
      /* 首次打开没有 hash 时不要把 #/stage 写进地址栏：
         否则刷新会从“已选篇目的工作台”掉回学段页。 */
      var initialTarget = lastHash || (global.location.pathname + global.location.search);
      global.history.replaceState({ depth: 0, view: state.view }, '', initialTarget);
    } catch (err) {
      /* 忽略 */
    }

    document.addEventListener('click', handleGlobalClick);
    document.addEventListener('input', handleGlobalInput);
    document.addEventListener('change', handleGlobalChange);
    document.addEventListener('keydown', handleGlobalKeydown);
    global.addEventListener('hashchange', handleHashChange);
    global.addEventListener('popstate', handlePopState);
    if (global.addEventListener) global.addEventListener('resize', syncHeaderHeight);
    if (els.back) els.back.addEventListener('click', goBack);

    render();

    if (DB.problems && DB.problems.length) {
      console.warn('[题库校验]', DB.problems.join('\n'));
    }
  }

  function storageNotice() {
    if (!document.getElementById || !document.createElement || !document.body) return;
    var node=document.getElementById('storageFailure');
    if (Storage.isPersistent()) { if(node)node.remove(); return; }
    if(node)return;
    node=document.createElement('div'); node.id='storageFailure'; node.setAttribute('role','alert');
    node.style.cssText='position:fixed;bottom:12px;left:12px;right:12px;padding:12px;background:#fff2cf;color:#453000;z-index:1000;border:1px solid #a97800';
    node.appendChild(document.createTextNode('保存失败：当前更改仅在此页面有效。请先导出，保留页面后重试。 '));
    var exp=document.createElement('button');exp.textContent='导出当前数据';exp.addEventListener('click',function(){var text=JSON.stringify(Storage.exportData(),null,2);downloadText('poetry-backup.json',text);});
    var retry=document.createElement('button');retry.textContent='重试保存';retry.addEventListener('click',function(){Storage.save();storageNotice();});
    node.appendChild(exp);node.appendChild(retry);document.body.appendChild(node);
  }
  if(global.addEventListener) global.addEventListener('poetry-storage',storageNotice);
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',storageNotice); else storageNotice();
  global.PoetryApp = {
    toast: toast,
    navigate: navigate,
    render: render,
    getState: function () {
      return state;
    },
    buildShareUrl: buildShareUrl,
    encodeSelection: encodeSelection,
    decodeSelection: decodeSelection,
    syncHeaderHeight: syncHeaderHeight,
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

/* ===== js/pwa.js ===== */
/* PWA 注册：只对“模块化 + http(s)”版本启用。
   单文件版（dist）没有 manifest 链接，且通常用 file:// 打开，这里会自动跳过，
   所以不会破坏“双击 HTML 就能离线用”的承诺。 */
(function (global) {
  'use strict';

  function register() {
    if (!global.navigator || !global.navigator.serviceWorker) return;
    var protocol = global.location && global.location.protocol;
    if (protocol !== 'http:' && protocol !== 'https:') return;
    var manifest = document.querySelector('link[rel="manifest"]');
    if (!manifest) return; // 单文件版没有 manifest，不注册
    try {
      global.navigator.serviceWorker.register('sw.js').then(function(reg) {
        var requested=false;
        function notice() {
          if (!reg.waiting || !global.navigator.serviceWorker.controller || document.getElementById('pwaUpdate')) return;
          var button=document.createElement('button');button.id='pwaUpdate';button.className='btn';button.textContent='新版本可用：结束练习后点此更新';
          button.style.cssText='position:fixed;bottom:8px;right:8px;z-index:900';
          button.addEventListener('click',function(){requested=true; reg.waiting.postMessage({type:'SKIP_WAITING'});});
          document.body.appendChild(button);
        }
        notice();reg.addEventListener('updatefound',function(){var worker=reg.installing;if(worker)worker.addEventListener('statechange',notice);});
        global.navigator.serviceWorker.addEventListener('controllerchange',function(){if(requested)global.location.reload();});
      }).catch(function () {
        /* 注册失败不影响主功能：页面仍然可以直接用 */
      });
    } catch (err) {
      /* 某些老浏览器会抛同步异常，忽略 */
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', register);
  else register();
})(window);
  </script>
