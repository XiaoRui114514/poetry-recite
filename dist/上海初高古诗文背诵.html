    { id: 'meng-zi-yi-ze-hao-ran', title: '《孟子》一则（浩然之气）', author: '孟子', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '“敢问夫子恶乎长？”曰：“我知言，我善养吾浩然之气。”“敢问何谓浩然之气？”曰：“难言也。其为气也，至大至刚，以直养而无害，则塞于天地之间。其为气也，配义与道；无是，馁也。是集义所生者，非义袭而取之也。行有不慊于心，则馁矣。我故曰，告子未尝知义，以其外之也。必有事焉，而勿正，心勿忘，勿助长也。无若宋人然：宋人有闵其苗之不长而揠之者，芒芒然归，谓其人曰：‘今日病矣！予助苗长矣！’其子趋而往视之，苗则槁矣。天下之不助苗长者寡矣。以为无益而舍之者，不耘苗者也；助之长者，揠苗者也，非徒无益，而又害之。”' +
        '“何谓知言？”曰：“诐辞知其所蔽，淫辞知其所陷，邪辞知其所离，遁辞知其所穷。生于其心，害于其政；发于其政，害于其事。圣人复起，必从吾言矣。”' +
        '“宰我、子贡善为说辞，冉牛、闵子、颜渊善言德行。孔子兼之，曰：‘我于辞命，则不能也。’”',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第5篇（课标指定节选）',
      highlights: [{ type: '名句', text: '我善养吾浩然之气。' }, { type: '易错字', text: '恶乎长 馁 慊于心 揠之 芒芒然 槁 诐辞 淫辞 遁辞' }],
      tags: ['诸子'],
      translation: [
        '孟子说：我懂言辞，善养浩然之气。它至大至刚，以正直培养就充满天地，须配义与道，否则气馁；由积义而生，非偶然所得。别像宋人拔苗助长，反害了苗；偏邪之辞能知其病。',
      ],
      summary: '本文借孟子与公孙丑的问答，说明浩然之气至大至刚、必须配义与道，靠平日积义自然生成，不能靠偶然的义举取得，也不能违背规律去助长，并用揠苗助长的寓言说明急于求成的危害。',
      examFocus: [
        { index: 0, reason: '含浩然之气的定义与揠苗助长寓言，翻译常考' },
      ] },

    { id: 'xiao-yao-you-jie-xuan', title: '逍遥游（节选）', author: '《庄子》', dynasty: '先秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '惠子谓庄子曰：“魏王贻我大瓠之种，我树之成而实五石。以盛水浆，其坚不能自举也。剖之以为瓢，则瓠落无所容。非不呺然大也，吾为其无用而掊之。”庄子曰：“夫子固拙于用大矣。宋人有善为不龟手之药者，世世以洴澼絖为事。客闻之，请买其方百金。聚族而谋曰：‘我世世为洴澼絖，不过数金。今一朝而鬻技百金，请与之。’客得之，以说吴王。越有难，吴王使之将。冬，与越人水战，大败越人，裂地而封之。能不龟手一也，或以封，或不免于洴澼絖，则所用之异也。今子有五石之瓠，何不虑以为大樽，而浮乎江湖，而忧其瓠落无所容？则夫子犹有蓬之心也夫！”',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第6篇（课标指定节选：惠子谓庄子曰……则夫子犹有蓬之心也夫）',
      highlights: [{ type: '名句', text: '夫子固拙于用大矣。' }, { type: '易错字', text: '大瓠 瓠落 呺然 掊之 龟手 洴澼絖 鬻技 蓬之心' }],
      tags: ['诸子'],
      translation: [
        '惠子对庄子说：魏王送我大葫芦种子，我种下它，结的果实能容五石。用来盛水浆，它坚固得不能举起自己。剖开做瓢，又太平太浅，没东西可装。它不是不够大，而是没有用处，所以我砸碎了它。庄子说：先生实在不善于使用大的东西啊。宋国有人善于制作防手冻裂的药物，世代漂洗丝絮为业。客人听说，请求用百金买药方。他全家商量说：我们世代漂洗丝絮，所得不过几金。如今一下子卖出药方就能得百金，请允许我卖给他。客人得到药方，去游说吴王。越国发难，吴王派他领兵。冬天与越国水战，大败越国，吴王划地封赏他。药方相同，有人靠它得封赏，有人免不了漂洗丝絮，这是用法不同啊。现在你有能容五石的大葫芦，为什么不把它做成大樽，浮游江湖，却发愁它太大没处可容呢？可见先生的心还是像被蓬草塞住一样不通达啊！',
      ],
      summary: '本文写庄子回答惠子大瓠无用的责难，用不龟手之药或封侯或不免漂洗的对比，说明物没有绝对的有用无用，关键在于是否善于用大，批评惠子心思不通达，只会从小处看问题。',
      examFocus: [
        { index: 0, reason: '含词类活用与通假字密集，为常见翻译题句' },
      ] },

    { id: 'jian-zhu-ke-shu', title: '谏逐客书', author: '李斯', dynasty: '秦', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '臣闻吏议逐客，窃以为过矣。昔缪公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来邳豹、公孙支于晋。此五子者，不产于秦，而缪公用之，并国二十，遂霸西戎。孝公用商鞅之法，移风易俗，民以殷盛，国以富强，百姓乐用，诸侯亲服，获楚、魏之师，举地千里，至今治强。惠王用张仪之计，拔三川之地，西并巴、蜀，北收上郡，南取汉中，包九夷，制鄢、郢，东据成皋之险，割膏腴之壤，遂散六国之从，使之西面事秦，功施到今。昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。此四君者，皆以客之功。由此观之，客何负于秦哉！向使四君却客而不内，疏士而不用，是使国无富利之实，而秦无强大之名也。' +
        '今陛下致昆山之玉，有随、和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。此数宝者，秦不生一焉，而陛下说之，何也？必秦国之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。所以饰后宫、充下陈、娱心意、说耳目者，必出于秦然后可，则是宛珠之簪、傅玑之珥、阿缟之衣、锦绣之饰不进于前，而随俗雅化佳冶窈窕赵女不立于侧也。' +
        '臣闻地广者粟多，国大者人众，兵强则士勇。是以太山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。是以地无四方，民无异国，四时充美，鬼神降福，此五帝三王之所以无敌也。今乃弃黔首以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓“藉寇兵而赍盗粮”者也。' +
        '夫物不产于秦，可宝者多；士不产于秦，而愿忠者众。今逐客以资敌国，损民以益仇，内自虚而外树怨于诸侯，求国无危，不可得也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第7篇',
      highlights: [{ type: '名句', text: '太山不让土壤，故能成其大；河海不择细流，故能就其深。' }, { type: '名句', text: '今逐客以资敌国，损民以益仇。' }, { type: '易错字', text: '缪公 邳豹 穰侯 駃騠 傅玑之珥 阿缟 黔首 藉寇兵而赍盗粮' }],
      tags: ['奏疏'],
      translation: [
        '我听说官吏们商议驱逐客卿，我私下认为这是错误的。',
        '从前秦穆公寻求贤士，向西从戎族得到由余，向东从宛地得到百里奚，从宋国迎来蹇叔，从晋国招来邳豹和公孙支。',
        '这五位贤士，都不是在秦国出生的，秦穆公却任用他们，吞并了二十个国家，于是称霸西戎。',
        '秦孝公采用商鞅的新法，改变旧的风俗习惯，百姓因此殷实兴盛，国家因此富足强大，百姓乐于效力，诸侯亲近顺服，俘获楚、魏两国的军队，攻占千里土地，至今政治安定、国力强盛。',
        '秦惠王采用张仪的计策，攻取三川之地，向西吞并巴、蜀，向北收取上郡，向南夺取汉中，吞并九夷，控制鄢、郢，向东占据成皋险要，割取肥沃土地，于是拆散六国合纵，使他们向西事奉秦国，功业延续到今天。',
        '秦昭王得到范雎，废掉穰侯，驱逐华阳君，加强王室权力，堵塞权臣私门，像蚕吃桑叶一样侵占诸侯，使秦国成就帝业。',
        '这四位君主，都是依靠客卿的功劳。',
        '从这些事看来，客卿有什么对不起秦国的地方呢！',
        '假如当初这四位君主拒绝客卿而不接纳，疏远贤士而不任用，这就会使国家没有富足的实际利益，秦国也没有强大的名声了。',
        '如今陛下得到昆山的美玉，拥有随侯珠、和氏璧这样的珍宝，悬挂着明月珠，佩带着太阿剑，乘坐纤离骏马，竖立翠凤旗，架起灵鼍鼓。',
        '这几种宝物，秦国一样也不出产，陛下却喜爱它们，为什么呢？',
        '如果一定要秦国出产的才可用，夜光璧就不该装饰朝廷，犀角象牙的器物就不该供玩赏，郑国、卫国的美女就不该住满后宫，骏马良驹就不该充满外厩，江南金锡就不该用，西蜀丹青就不该采。',
        '如果用来装饰后宫、娱乐心意、愉悦耳目的事物都一定要秦国出产才可用，那么宛珠之簪、傅玑之珥、阿缟之衣、锦绣之饰就不能进献到面前，随俗雅化、佳冶窈窕的赵女也不能站在身旁了。',
        '我听说土地广阔的粮食就多，国家大的人口就多，兵器锋利士兵就勇敢。',
        '因此泰山不拒绝泥土，所以能形成它的高大；河海不排斥细流，所以能形成它的深广；君王不拒绝百姓，所以能彰明他的德行。',
        '因此土地不分四方，百姓不分国别，四季富足美好，鬼神降下福泽，这就是五帝三王无敌于天下的原因。',
        '如今却抛弃百姓去资助敌国，拒绝宾客去成就诸侯的功业，使天下贤士退缩不敢向西来，停步不敢进入秦国，这就是所说的把武器借给敌寇、把粮食送给盗贼啊。',
        '物品不出产在秦国，可宝贵的很多；贤士不出生在秦国，可愿意效忠的很多。',
        '如今驱逐客卿去资助敌国，损害百姓去让仇敌得益，对内自己削弱自己，对外又在诸侯中结下怨恨，想求得国家没有危险，是不可能的。',
      ],
      summary: '本文列举秦国四位国君重用客卿而成就霸业的史实，又以珍宝玩好不产于秦却被陛下喜爱作对比，论证逐客是错误的，指出驱逐客卿等于借兵给敌国、送粮给盗贼，会危及秦国安全。',
      examFocus: [
        { index: 0, reason: '主旨句，开门见山提出逐客为过的中心论点' },
        { index: 6, reason: '关键论断句，总结四君皆以客之功' },
        { index: 7, reason: '关键论断句，以反问总结客不负秦' },
        { index: 14, reason: '名句，以泰山河海为喻论不却众庶' },
        { index: 16, reason: '含藉寇兵而赍盗粮的比喻，默写常考翻译常考' },
        { index: 18, reason: '结论句，指出逐客资敌的危险后果' },
      ] },

    { id: 'lan-ting-ji-xu', title: '兰亭集序', author: '王羲之', dynasty: '东晋', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。' +
        '是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。' +
        '夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至；及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀，况修短随化，终期于尽！古人云：“死生亦大矣。”岂不痛哉！' +
        '每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦犹今之视昔。悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第8篇',
      highlights: [{ type: '名句', text: '仰观宇宙之大，俯察品类之盛。' }, { type: '名句', text: '固知一死生为虚诞，齐彭殇为妄作。' }, { type: '易错字', text: '修禊 流觞曲水 游目骋怀 趣舍万殊 嗟悼 彭殇' }],
      tags: ['序'],
      translation: [
        '永和九年，也就是癸丑年，暮春三月初，我们在会稽郡山阴县的兰亭聚会，举行修禊活动。',
        '众多贤士都到了，年轻的年长的都聚集在一起。',
        '这里有高峻的山岭、茂密的树林和高高的竹子，又有清澈湍急的溪流辉映环绕在左右，引溪水作为流觞的曲水，大家排列坐在水边。',
        '虽然没有音乐演奏的盛况，但喝一杯酒吟一首诗，也足以尽情抒发深远的情怀。',
        '这一天，天空晴朗空气清新，和风温暖舒畅。',
        '抬头看宇宙的广阔，低头看万物的繁盛，借此放眼观赏、开阔胸怀，足以穷尽视听的乐趣，实在是很快乐啊。',
        '人与人相互交往，转眼间就度过一生。',
        '有的人从自己的胸怀中取出抱负，在室内与朋友面对面交谈；有的人就着自己所爱的事物寄托情怀，放纵无拘束地生活。',
        '虽然取舍千差万别，性情动静不同，但遇到高兴的事暂时自得，就快乐满足，不知衰老将至；等到对所追求的事物厌倦，感情随事变化，感慨就随之而来了。',
        '从前所喜爱的事物，转眼之间已经成为旧迹，还不能不因此产生感慨，何况寿命长短听凭造化，最终都要归于消亡。',
        '古人说，死生也是一件大事。这怎么能不让人悲痛呢。',
        '每当看到前人产生感慨的原因，和我像符契一样相合，没有不对着文章叹息悲伤的，心里却说不出是什么缘故。',
        '本来就知道把死和生看作一样是虚妄的，把长寿和短命看作同等是荒谬的。',
        '后人看待今天，也就像今天的人看待从前一样。',
        '真是可悲啊。',
        '所以我一一记下参加聚会的人，收录他们所作的诗，即使时代不同事情不同，人们产生感慨的原因，那情致是一样的。',
        '后世的读者，也将对这篇文章有所感慨。',
      ],
      summary: '本文先叙兰亭雅集的盛况与山水之乐，再由乐转悲，感慨人生短暂、情随事迁，否定把生死、寿夭看作一回事的虚妄说法，指出后之视今亦犹今之视昔，说明记录此次集会是为了让后人同感于斯文。',
      examFocus: [
        { index: 2, reason: '写景名句，对偶工整，默写常考' },
        { index: 5, reason: '名句，总写游目骋怀之乐，易错字密集' },
        { index: 9, reason: '议论名句，感慨情随事迁，易错字密集' },
        { index: 10, reason: '主旨句，借死生亦大抒发悲痛' },
        { index: 12, reason: '关键论断句，否定一死生齐彭殇之说' },
        { index: 16, reason: '结尾名句，说明作序缘由，默写常考' },
      ] },

    { id: 'teng-wang-ge-xu', title: '滕王阁序', author: '王勃', dynasty: '唐', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。家君作宰，路出名区；童子何知，躬逢胜饯。' +
        '时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿；临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。' +
        '披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。' +
        '遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人？萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？' +
        '嗟乎！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！' +
        '勃，三尺微命，一介书生。无路请缨，等终军之弱冠；有怀投笔，慕宗悫之长风。舍簪笏于百龄，奉晨昏于万里。非谢家之宝树，接孟氏之芳邻。他日趋庭，叨陪鲤对；今兹捧袂，喜托龙门。杨意不逢，抚凌云而自惜；钟期既遇，奏流水以何惭？' +
        '呜呼！胜地不常，盛筵难再；兰亭已矣，梓泽丘墟。临别赠言，幸承恩于伟饯；登高作赋，是所望于群公。敢竭鄙怀，恭疏短引；一言均赋，四韵俱成。请洒潘江，各倾陆海云尔。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第9篇',
      highlights: [{ type: '名句', text: '落霞与孤鹜齐飞，秋水共长天一色。' }, { type: '名句', text: '老当益壮，宁移白首之心？穷且益坚，不坠青云之志。' }, { type: '易错字', text: '翼轸 棨戟 襜帷 潦水 骖騑 鹤汀凫渚 绣闼 雕甍 舸舰 遄飞 睇眄 帝阍 舛 涸辙 赊 簪笏 捧袂' }],
      tags: ['序'],
      translation: [
        '这里从前是豫章郡，如今是洪州新设的都督府。',
        '天上的分野属于翼宿和轸宿，地面与衡山和庐山相接。',
        '以三江为衣襟，以五湖为衣带，控制着楚地，连接着瓯越。',
        '物产的精华是上天的珍宝，宝剑的光芒直射牛宿和斗宿之间；人物的俊杰是大地的灵气，徐孺子使陈蕃为他放下悬着的床榻。',
        '雄伟的州城像雾一样涌起，杰出的人才像星星一样飞驰。',
        '城池依傍在蛮夷与华夏交界之处，宾客和主人都是东南一带的俊杰。',
        '都督阎公有崇高的声望，仪仗从远方赶来；新州刺史宇文公有美好的风范，车驾暂时在此停留。',
        '正逢十日一休的假期，好友如云般聚集；远道而来的宾客迎接满座，高朋满座。',
        '文采如蛟龙腾空凤凰飞起，孟学士是文坛的领袖；武器如紫电青霜般锋利，王将军的武库中藏有精良兵器。',
        '我的父亲在外地做县令，我因探望父亲路过这有名的地方；我年幼无知，却有幸亲自参加了这场盛大的宴会。',
        '时间是九月，季节属于深秋。',
        '积水消退了，寒冷的潭水清澈，烟霭凝聚，傍晚的山峦呈现紫色。',
        '驾着车马在高高的道路上，到高山之上寻访美景；来到滕王营建的长洲，见到他当年的旧馆。',
        '层层山峦耸立着青翠的颜色，向上直插云霄；凌空的楼阁涂饰鲜红，向下看不到地面。',
        '白鹤栖息的水滨、野鸭聚集的小洲，把岛屿曲折回环的景致都占尽了；桂木兰木建造的宫殿，依着山冈的形势而建。',
        '推开雕花的阁门，俯视雕刻精美的屋脊，山岭平原辽阔，充满视野，江河湖泽曲折，令人看了十分惊异。',
        '遍地是住宅，尽是钟鸣鼎食的富贵人家；船只布满渡口，船头画着青雀黄龙。',
        '云消雨停，阳光普照，天空明净。',
        '落霞与孤单的野鸭一起飞翔，秋天的江水与辽阔的天空浑然一色。',
        '傍晚渔船上传来歌声，响遍彭蠡湖滨；大雁惊寒而列阵南飞，叫声消失在衡阳的水边。',
        '胸怀顿时舒畅，超逸的兴致迅速飞扬。',
        '排箫的乐声响起，清风随之而生；细微的歌声凝聚，行云为之停留。',
        '像睢园绿竹般的雅集，气概超过陶渊明的酒杯；像邺水朱华般的文采，光辉照耀着谢灵运的诗笔。',
        '音乐、美食、文章、言语这四种美好的事物都已齐备，贤主、嘉宾这两种难得的条件也凑在一起。',
        '放眼远望天空，在闲暇的日子里尽情游乐。',
        '天高地远，感到宇宙的无穷无尽；兴致尽了悲愁袭来，认识到事物的盛衰消长自有定数。',
        '遥望夕阳下的长安，远看云间的吴会。',
        '地势尽于南方而南海深不可测，天柱高耸而北极星遥远。',
        '关山难以越过，谁来同情失意无路的人？',
        '像浮萍随水相逢，都是漂泊他乡的客子。',
        '怀念朝廷却无法见到，什么时候才能像贾谊那样被召见于宣室？',
        '唉！',
        '时运不好，命运多有坎坷。',
        '冯唐容易衰老，李广难以封侯。',
        '使贾谊被贬到长沙，并不是没有圣明的君主；使梁鸿逃隐海边，难道缺少太平盛世？',
        '所依靠的是君子能看清时机，通达的人懂得命运。',
        '年纪老了应当更加壮志不减，哪里能改变白头之人的心志？',
        '境遇困窘应当更加坚定，不放弃凌云的志向。',
        '喝了贪泉的水反而觉得清爽，处在干涸的车辙中仍然欢快。',
        '北海虽然遥远，乘着旋风仍可到达；早晨的时光已经逝去，傍晚的时光也不算晚。',
        '孟尝君品德高洁，只留下报国的情怀；阮籍放纵不羁，我怎能效法他走到穷途就痛哭！',
        '我王勃，不过是地位卑微的一个书生。',
        '没有门路请缨报国，年纪与终军二十岁请缨时相同；有心投笔从戎，仰慕宗悫乘长风破浪的志向。',
        '我舍弃一生的功名仕途，到万里之外侍奉父亲的晨昏起居。',
        '自己不是谢家那样的优秀子弟，却有幸结交孟母那样的好邻居。',
        '将来要到父亲庭院中聆听教诲，像孔鲤那样承受父训；今天在这里恭敬地奉陪，高兴地依托于名流的门下。',
        '没有遇到杨得意那样的引荐者，只能抚摸着凌云之赋而自我惋惜；既然遇到了钟子期那样的知音，弹奏一曲流水又有什么可惭愧的？',
        '唉！',
        '美好的地方不能长存，盛大的宴会难以再遇；兰亭的雅集已经过去，金谷园也成了废墟。',
        '临别时赠言，有幸承蒙您在盛大的饯别宴上施恩；登高作赋，是希望在座诸公的事情。',
        '我冒昧地竭尽浅陋的心意，恭敬地写下这篇短序；大家都要写诗，四韵的诗都已写成。',
        '请诸位像潘岳那样挥洒文采，像陆机那样倾尽才华吧。',
      ],
      summary: '本文先写滕王阁的地理形胜、宴会盛况与秋日美景，再由登临之乐转入身世之感，抒发时运不齐、命途多舛的感慨，表示自己虽遭困顿仍老当益壮、穷且益坚，继续怀抱报国之志。',
      examFocus: [

        { index: 31, reason: '名句，感慨时运不齐、命途多舛' },

    { id: 'huang-gang-zhu-lou-ji', title: '黄冈竹楼记', author: '王禹偁', dynasty: '北宋', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '黄冈之地多竹，大者如椽。竹工破之，刳去其节，用代陶瓦。比屋皆然，以其价廉而工省也。' +
        '子城西北隅，雉堞圮毁，蓁莽荒秽，因作小楼二间，与月波楼通。远吞山光，平挹江濑，幽阒辽夐，不可具状。夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。宜鼓琴，琴调虚畅；宜咏诗，诗韵清绝；宜围棋，子声丁丁然；宜投壶，矢声铮铮然；皆竹楼之所助也。' +
        '公退之暇，被鹤氅衣，戴华阳巾，手执《周易》一卷，焚香默坐，消遣世虑。江山之外，第见风帆沙鸟，烟云竹树而已。待其酒力醒，茶烟歇，送夕阳，迎素月，亦谪居之胜概也。' +
        '彼齐云、落星，高则高矣；井干、丽谯，华则华矣；止于贮妓女，藏歌舞，非骚人之事，吾所不取。' +
        '吾闻竹工云：“竹之为瓦，仅十稔；若重覆之，得二十稔。”噫！吾以至道乙未岁，自翰林出滁上，丙申，移广陵；丁酉，又入西掖；戊戌岁除日，有齐安之命；己亥闰三月，到郡。四年之间，奔走不暇；未知明年又在何处！岂惧竹楼之易朽乎？幸后之人与我同志，嗣而葺之，庶斯楼之不朽也。' +
        '咸平二年八月十五日记。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第10篇',
      highlights: [{ type: '名句', text: '夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。' }, { type: '易错字', text: '刳去其节 雉堞圮毁 蓁莽 平挹江濑 幽阒辽夐 鹤氅 十稔 嗣而葺之' }],
      tags: ['记'],
      translation: [
        '黄冈这个地方竹子很多，大的像椽子一样粗。',
        '竹工把竹子破开，挖去竹节，用来代替陶制的瓦。',
        '家家户户都这样，因为它的价钱便宜而节省人工。',
        '子城的西北角，城墙上的矮墙倒塌毁坏，草木丛生、荒芜污秽，于是我在那里修建了两间小楼，和月波楼相通。',
        '远处可以饱览山色，平视可以舀取江流，幽静深远而辽阔，不能一一描述出来。',
        '夏天适宜下急雨，有瀑布一样的声音；冬天适宜下大雪，有碎玉一样的声音。',
        '适宜弹琴，琴声空灵流畅；适宜吟诗，诗韵清雅至极；适宜下围棋，棋子声丁丁作响；适宜投壶，箭声铮铮作响；这些都是竹楼帮助促成的。',
        '办完公事回来的空闲时候，我披上鹤氅衣，戴上华阳巾，手里拿着一卷《周易》，烧香默默静坐，排遣世间的思虑。',
        '江山之外的景物，只看见风帆、沙鸟、烟云、竹树罢了。',
        '等到酒醒，茶烟散去，送走夕阳，迎来明月，这也是贬谪生活中美好的景致。',
        '那齐云楼、落星楼，高是高啊；井干楼、丽谯楼，华丽是华丽啊；但它们只是用来储藏歌女、收藏歌舞的地方，不是诗人所做的事，我不取。',
        '我听竹工说，竹子做瓦只能用十年；如果重叠着铺，可以用二十年。唉！',
        '我从至道乙未年由翰林院被贬到滁州，丙申年调任广陵；丁酉年又进入西掖；戊戌年除夕，接到到齐安任职的命令；己亥年闰三月，到达郡城。',
        '四年之间，我奔走不停；不知道明年又会在什么地方！',
        '难道我是担心竹楼容易朽坏吗？',
        '希望后来的人与我志趣相同，接着修葺它，或许这座楼就能不朽了。',
        '写于咸平二年八月十五日。',
      ],
      summary: '本文写黄冈竹楼价廉工省、声韵清幽，以及作者公退之后鼓琴咏诗、焚香默坐的闲适生活，表现谪居之中的雅趣；又以齐云、落星等名楼只供享乐作对比，并借竹瓦易朽寄托希望后人修葺、使斯楼不朽的心愿。',
      examFocus: [
        { index: 5, reason: '名句，以声写景，比喻贴切，默写常考' },
        { index: 10, reason: '关键论断句，表明不取流俗的志趣' },
        { index: 15, reason: '主旨句，点明希望斯楼不朽的写作意图' },
      ] },

    { id: 'shang-shu-mi-han-tai-wei-shu', title: '上枢密韩太尉书', author: '苏辙', dynasty: '北宋', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '太尉执事：辙生好为文，思之至深。以为文者气之所形，然文不可以学而能，气可以养而致。孟子曰：“我善养吾浩然之气。”今观其文章，宽厚宏博，充乎天地之间，称其气之小大。太史公行天下，周览四海名山大川，与燕、赵间豪俊交游，故其文疏荡，颇有奇气。此二子者，岂尝执笔学为如此之文哉？其气充乎其中而溢乎其貌，动乎其言而见乎其文，而不自知也。' +
        '辙生十有九年矣。其居家所与游者，不过其邻里乡党之人；所见不过数百里之间，无高山大野可登览以自广；百氏之书，虽无所不读，然皆古人之陈迹，不足以激发其志气。恐遂汩没，故决然舍去，求天下奇闻壮观，以知天地之广大。过秦、汉之故都，恣观终南、嵩、华之高，北顾黄河之奔流，慨然想见古之豪杰。至京师，仰观天子宫阙之壮，与仓廪、府库、城池、苑囿之富且大也，而后知天下之巨丽。见翰林欧阳公，听其议论之宏辩，观其容貌之秀伟，与其门人贤士大夫游，而后知天下之文章聚乎此也。太尉以才略冠天下，天下之所恃以无忧，四夷之所惮以不敢发，入则周公、召公，出则方叔、召虎。而辙也未之见焉。' +
        '且夫人之学也，不志其大，虽多而何为？辙之来也，于山见终南、嵩、华之高，于水见黄河之大且深，于人见欧阳公，而犹以为未见太尉也。故愿得观贤人之光耀，闻一言以自壮，然后可以尽天下之大观而无憾者矣。' +
        '辙少年，未能通习吏事。向之来，非有取于斗升之禄，偶然得之，非其所乐。然幸得赐归待选，使得优游数年之间，将以益治其文，且学为政。太尉苟以为可教而辱教之，又幸矣！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第11篇',
      highlights: [{ type: '名句', text: '文者气之所形，然文不可以学而能，气可以养而致。' }, { type: '易错字', text: '汩没 恣观 苑囿 仓廪 召虎 斗升之禄 辱教之' }],
      tags: ['书信'],
      translation: [
        '太尉阁下：我生来就喜欢写文章，对这件事思考得很深。',
        '我认为文章是气的表现，但文章不能靠学习就会写，气却可以通过修养获得。',
        '孟子说我善于培养我的浩然之气。现在看他的文章，宽厚宏博，充满天地之间，与他的气的大小相称。',
        '太史公走遍天下，遍览四海的名山大川，与燕、赵一带的豪杰交往，所以他的文章疏放洒脱，很有奇特的气概。',
        '这两个人，难道曾经拿着笔学习写这样的文章吗？',
        '他们的气充满内心而流露到外貌上，表现在言语中而显现在文章里，自己却并不知道。',
        '我出生已经十九年了。',
        '在家时所交往的不过是邻里乡党；看到的不过几百里内的地方，没有高山旷野可供登临来开阔心胸；诸子百家的书虽都读过，但都是古人的陈迹，不足以激发志气。',
        '我怕就此埋没，所以决然离开家乡，去寻求天下的奇闻壮观，以了解天地的广大。',
        '经过秦、汉的旧都，尽情观赏终南山、嵩山、华山的高峻，北望黄河的奔流，感慨地想象古代的豪杰。',
        '到了京城，抬头观看皇宫的壮丽，以及粮仓、府库、城池、园林的富足广大，然后才知道天下的宏伟壮丽。',
        '见到翰林学士欧阳公，听他宏辩的议论，看他秀美的容貌，与他的门人贤士大夫交往，然后才知道天下的文章都聚集在这里。',
        '太尉凭才能谋略居天下第一，天下人依靠您而无忧，四方外族畏惧您而不敢发兵，在朝就像周公、召公，出征就像方叔、召虎。',
        '可是我却没有见到您。',
        '况且人们学习，如果不立志于大的方面，即使学得多又有什么用呢？',
        '我这次来，在山方面见到了终南山、嵩山、华山的高峻，在水方面见到了黄河的浩大深广，在人方面见到了欧阳公，但还认为没有见到太尉。',
        '所以希望能看到贤人的风采，听您一句话来激励自己，然后才可以看尽天下的大观而没有遗憾了。',
        '我年纪轻，还不能通晓熟悉官府的事务。',
        '先前到这里来，并不是为了取得微薄的俸禄，偶然得到了它，也不是我所喜欢的。',
        '然而有幸得到恩准回家等待选派，使我能在几年间从容闲暇，将用来更好地钻研文章，并且学习处理政事。',
        '太尉如果认为我可以教导而屈尊指教我，那就更是我的幸运了！',
      ],
      summary: '本文提出文章是作者精神气质的表现，气质可以通过养气获得，并以孟子和司马迁为例；作者说自己居家所见有限，为激发志气而离家远游，见到名山大川与欧阳公，还希望拜见韩太尉，以尽天下之大观。',
      examFocus: [
        { index: 1, reason: '中心论点句，提出文者气之所形、气可以养而致' },
        { index: 3, reason: '关键例证句，说明周览名山大川可养其奇气' },
        { index: 14, reason: '关键论断句，指出为学要不志其大' },
        { index: 20, reason: '结尾句，表达求教的恳切愿望' },
      ] },

    { id: 'gu-dai-wen-lun-xuan-duan', title: '古代文论选段', author: '毛苌、曹丕、钟嵘、白居易、郑燮、王国维', dynasty: '历代', stage: '高中', grade: '选修', genre: '文言文', sourceType: '课标推荐', required: true, recommended: true,
      text: '【毛诗序】诗者，志之所之也，在心为志，发言为诗。情动于中而形于言，言之不足，故嗟叹之，嗟叹之不足，故永歌之，永歌之不足，不知手之舞之足之蹈之也。' +
        '【典论·论文】盖文章，经国之大业，不朽之盛事。年寿有时而尽，荣乐止乎其身，二者必至之常期，未若文章之无穷。是以古之作者，寄身于翰墨，见意于篇籍，不假良史之辞，不托飞驰之势，而声名自传于后。' +
        '【诗品序】若乃春风春鸟，秋月秋蝉，夏云暑雨，冬月祁寒，斯四候之感诸诗者也。嘉会寄诗以亲，离群托诗以怨。至于楚臣去境，汉妾辞宫；或骨横朔野，或魂逐飞蓬；或负戈外戍，杀气雄边；塞客衣单，孀闺泪尽；又士有解佩出朝，一去忘返；女有扬蛾入宠，再盼倾国：凡斯种种，感荡心灵，非陈诗何以展其义？非长歌何以骋其情？故曰：“《诗》可以群，可以怨。”' +
        '【与元九书】感人心者，莫先乎情，莫始乎言，莫切乎声，莫深乎义。诗者：根情，苗言，华声，实义。' +
        '【题画】江馆清秋，晨起看竹，烟光日影露气，皆浮动于疏枝密叶之间。胸中勃勃遂有画意。其实胸中之竹，并不是眼中之竹也。因而磨墨展纸，落笔倏作变相，手中之竹又不是胸中之竹也。总之，意在笔先者，定则也；趣在法外者，化机也。独画云乎哉！' +
        '【人间词话】词以境界为最上。有境界则自成高格，自有名句。境非独谓景物也。喜怒哀乐，亦人心中之一境界。故能写真景物、真感情者，谓之有境界，否则谓之无境界。古今之成大事业、大学问者，必经过三种之境界：“昨夜西风凋碧树。独上高楼，望尽天涯路。”此第一境也。“衣带渐宽终不悔，为伊消得人憔悴。”此第二境也。“众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。”此第三境也。此等语皆非大词人不能道。然遽以此意解释诸词，恐为晏欧诸公所不许也。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 文言文·选修第12篇（含毛诗序、典论·论文、诗品序、与元九书、题画、人间词话六个选段）',
      highlights: [{ type: '名句', text: '诗者，志之所之也，在心为志，发言为诗。' }, { type: '名句', text: '盖文章，经国之大业，不朽之盛事。' }, { type: '名句', text: '词以境界为最上。有境界则自成高格，自有名句。' }, { type: '易错字', text: '嗟叹 翰墨 祁寒 孀闺 扬蛾 倏作变相 灯火阑珊' }],
      tags: ['文论'],
      translation: [
        '诗，是人的志向所指向的地方；在心里就是志向，用语言表达出来就是诗。',
        '感情在心中激荡就会表现在语言上，语言不足以表达，就叹息感慨，叹息感慨还不够，就长声歌唱，长声歌唱歌还不够，就不知不觉地手舞足蹈起来了。',
        '文章是治理国家的重大事业，是可以流传不朽的盛大事功。',
        '人的寿命终有了结的时候，荣耀欢乐也仅限于自己一身，这两者都有必定到来的期限，比不上文章的流传无穷无尽。',
        '所以古代的作家，把自己的身心寄托在写作之中，把心意表现在文章书籍里，不必借助优秀史官的文辞，不必依托显赫的权势，而名声自然流传到后世。',
        '至于春风春鸟、秋月秋蝉、夏云暑雨、冬月严寒，这四季的景象都是能触发诗情的。',
        '在欢乐的聚会上，人们借诗表达亲密之情；离开同伴独处时，人们借诗抒发哀怨。',

      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第7首',
      highlights: [{ type: '名句', text: '心非木石岂无感？吞声踯躅不敢言。' }, { type: '易错字', text: '泻水 酌酒 踯躅' }],
      tags: ['乐府'],
      translation: [
        '把水倒在平地上，水就各自向东西南北流去。',
        '人生也有命运安排，怎么能走着叹息、坐着又发愁呢？',
        '喝酒来宽慰自己，举起酒杯却中断了歌唱行路难的歌声。',
        '人心不是木头石头，怎么能没有感触呢？',
        '我忍气吞声，徘徊不前，不敢说话。',
      ],
      summary: '诗中借水泻平地、流向各异起兴，感叹人生穷达由命，写诗人借酒自宽却愁苦难消，最终只能忍气吞声、不敢言说，抒发了门第压抑下有志难伸的悲愤与无奈。',
      examFocus: [
        { index: 0, reason: '起兴句，以水流方向不同喻人生际遇各异' },
        { index: 3, reason: '反问句，直抒内心的愤懑不平' },
        { index: 4, reason: '主旨句，含易错字「踯躅」，写忍气吞声的无奈' },
      ] },

    { id: 'chun-jiang-hua-yue-ye', title: '春江花月夜', author: '张若虚', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明！江流宛转绕芳甸，月照花林皆似霰。空里流霜不觉飞，汀上白沙看不见。江天一色无纤尘，皎皎空中孤月轮。江畔何人初见月？江月何年初照人？人生代代无穷已，江月年年望相似。不知江月待何人，但见长江送流水。白云一片去悠悠，青枫浦上不胜愁。谁家今夜扁舟子？何处相思明月楼？可怜楼上月裴回，应照离人妆镜台。玉户帘中卷不去，捣衣砧上拂还来。此时相望不相闻，愿逐月华流照君。鸿雁长飞光不度，鱼龙潜跃水成文。昨夜闲潭梦落花，可怜春半不还家。江水流春去欲尽，江潭落月复西斜。斜月沉沉藏海雾，碣石潇湘无限路。不知乘月几人归，落月摇情满江树。',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第8首',
      highlights: [{ type: '名句', text: '江畔何人初见月？江月何年初照人？' }, { type: '名句', text: '人生代代无穷已，江月年年望相似。' }, { type: '易错字', text: '滟滟 芳甸 霰 汀上 纤尘 青枫浦 裴回 捣衣砧 碣石潇湘' }],
      variants: [{ label: '版本差异', text: '“可怜楼上月裴回”部分版本作“可怜楼上月徘徊”。' }],
      tags: ['乐府'],
      translation: [
        '春天的江潮水势浩荡，与大海连成一片，一轮明月从海上随着潮水一同升起。',
        '月光照耀着波光粼粼的江水，随着波浪闪耀千万里，哪一处春天的江上没有明亮的月光呢！',
        '江水曲曲折折地绕过花草丛生的原野，月光照着花林，像撒下了一层雪珠。',
        '空中月光如流霜般洁白，让人感觉不到它在飘飞，洲上的白沙也和月色融在一起，看不分明。',
        '江水和天空连成一色，没有一丝纤尘，明亮的天空中只有一轮孤月。',
        '江边上是什么人最初看见月亮？',
        '江上的月亮又是哪一年最初照耀着人？',
        '人生一代又一代没有穷尽，江上的月亮年年看上去都相似。',
        '不知江上的月亮在等待着什么人，只看见长江不断地送走流水。',
        '一片白云悠悠地飘去，青枫浦上离人愁绪满怀，难以承受。',
        '今夜是谁家的游子漂泊在一条小船上？',
        '又是谁在明月照耀的楼上相思？',
        '可叹楼上徘徊的月光，应该照在离人的梳妆台上。',
        '月光照进华美的门帘，卷也卷不走；照在捣衣石上，拂去了又回来。',
        '这时彼此遥望却听不到对方的声音，我愿追随着月光飞去照耀着你。',
        '鸿雁长久地飞翔，也飞不出月光的笼罩；鱼龙在水中潜跃，激起阵阵波纹。',
        '昨夜梦见落花飘进幽静的潭水，可叹春天已过一半，我还不能回家。',
        '江水流走了春光，春光将要流尽，江潭上的落月又向西斜沉。',
        '西斜的月亮沉沉地隐入海雾，碣石与潇湘之间隔着无限遥远的路途。',
        '不知有几人能趁着月色回家，落月的余晖摇荡着离情，洒满江边的树林。',
      ],
      summary: '诗中描绘春江潮涨、明月共生的清丽夜景，由江月永恒联想到人生短暂而代代无穷，又写游子思妇两地相思，抒发了对宇宙人生的哲理思考和对离人相思的深切同情。',
      examFocus: [
        { index: 0, reason: '名句，开篇写春江明月的壮阔景象，默写常考' },
        { index: 5, reason: '名句，以问句追问宇宙人生的开端' },
        { index: 7, reason: '名句，以江月永恒对比人生代代相续的哲理' },
        { index: 14, reason: '名句，写思妇愿随月光远照对方的深情' },
        { index: 19, reason: '名句，以落月摇情作结，含易错字「摇情」' },
      ] },

    { id: 'shan-ju-qiu-ming', title: '山居秋暝', author: '王维', dynasty: '唐', stage: '高中', grade: '选修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,

      tags: ['山水'],
      translation: [

        '明月的月光照在松林之间，清澈的泉水在山石上流淌。',
        '竹林里传来喧笑，是洗衣的女子归来；莲叶摇动，是渔船顺流而下。',
        '任凭春天的花草凋谢，我这样的人自然可以留在山中。',
      ],
      summary: '诗中描绘秋天傍晚雨后山村的清新景色，写明月照松、清泉流石、竹喧莲动、浣女渔舟，表现了山居环境的清幽美好，抒发了诗人喜爱自然、愿归隐山中的恬淡情怀。',
      examFocus: [

        { index: 3, reason: '主旨句，反用典故表达留居山中的意愿' },
      ] },

    { id: 'shu-dao-nan', title: '蜀道难', author: '李白', dynasty: '唐', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '噫吁嚱，危乎高哉！蜀道之难，难于上青天！蚕丛及鱼凫，开国何茫然！尔来四万八千岁，不与秦塞通人烟。西当太白有鸟道，可以横绝峨眉巅。地崩山摧壮士死，然后天梯石栈相钩连。上有六龙回日之高标，下有冲波逆折之回川。黄鹤之飞尚不得过，猿猱欲度愁攀援。青泥何盘盘，百步九折萦岩峦。扪参历井仰胁息，以手抚膺坐长叹。问君西游何时还？畏途巉岩不可攀。但见悲鸟号古木，雄飞雌从绕林间。又闻子规啼夜月，愁空山。蜀道之难，难于上青天，使人听此凋朱颜！连峰去天不盈尺，枯松倒挂倚绝壁。飞湍瀑流争喧豗，砯崖转石万壑雷。其险也如此，嗟尔远道之人胡为乎来哉！剑阁峥嵘而崔嵬，一夫当关，万夫莫开。所守或匪亲，化为狼与豺。朝避猛虎，夕避长蛇；磨牙吮血，杀人如麻。锦城虽云乐，不如早还家。蜀道之难，难于上青天，侧身西望长咨嗟！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第10首',
      highlights: [{ type: '名句', text: '蜀道之难，难于上青天！' }, { type: '名句', text: '剑阁峥嵘而崔嵬，一夫当关，万夫莫开。' }, { type: '易错字', text: '噫吁嚱 鱼凫 秦塞 石栈 猿猱 萦岩峦 扪参历井 抚膺 巉岩 喧豗 砯崖 崔嵬 吮血 咨嗟' }],
      tags: ['乐府'],
      translation: [
        '唉呀呀，多么危险多么高峻啊！',
        '蜀道难行，比登上青天还难！',
        '蚕丛和鱼凫两位蜀王，开国的年代多么久远渺茫！',
        '从那时以来四万八千年，蜀地和秦地不通人烟。',
        '西面当着太白山只有鸟儿飞越的小路，可以从那里横穿峨眉山顶。',
        '山崩地裂压死了开路的壮士，然后天梯般的山路和石栈才相互连接。',
        '上面有六条龙驾着太阳回车的高峻山峰，下面有波涛冲击、回旋倒流的急流。',
        '黄鹤善于高飞尚且飞不过去，猿猴想过去也发愁无处攀援。',
        '青泥岭多么盘旋曲折，一百步就有九个弯，缠绕着山峦。',
        '仰头可以摸到参星、井宿，紧张得屏住呼吸，用手抚着胸口坐下来长叹。',
        '请问你向西远游什么时候回来？',
        '可怕的路途和险峻的山岩无法攀登。',
        '只见悲伤的鸟在古树上哀号，雄鸟前飞雌鸟跟随，绕着树林飞。',
        '又听见杜鹃在月夜里啼叫，哀愁充满空山。',
        '蜀道难行，比登上青天还难，让人听了就容颜衰老！',
        '连绵的山峰离天不到一尺，干枯的松树倒挂着，倚靠在陡峭的崖壁上。',
        '飞泻的急流和瀑布争相轰鸣，水冲击山崖、转动石头，千山万壑响起雷声。',
        '它这样险要，可叹你们这些远道而来的人为什么到这里来呢！',
        '剑阁高峻而险要，一个人把守关口，一万个人也攻不开。',
        '驻守的人如果不是亲信，就会变成豺狼。',
        '早晨要躲避猛虎，晚上要躲避长蛇；它们磨利牙齿，吸食人血，杀人多得像乱麻。',
        '锦城虽然说快乐，不如早点回家。',
        '蜀道难行，比登上青天还难，侧身向西望去，长声叹息！',
      ],
      summary: '诗中用丰富的想象和夸张，描绘蜀道高峻险恶、山川奇险的景象，并借剑阁险要提醒统治者防范割据叛乱，抒发了对蜀道艰险的惊叹和对国事的忧虑。',
      examFocus: [
        { index: 1, reason: '主旨句，以「难于上青天」揭出全篇之难' },
        { index: 9, reason: '名句，含易错字「扪参历井」「抚膺」，写蜀道高危' },
        { index: 16, reason: '名句，含易错字「喧豗」「砯」「壑」，写水势之险' },
        { index: 18, reason: '名句，含易错字「峥嵘」「崔嵬」，写剑阁险要' },
        { index: 19, reason: '含通假字「匪」通「非」，常见翻译题' },
        { index: 22, reason: '结句反复咏叹蜀道之难，含易错字「咨嗟」' },
      ] },

    { id: 'meng-you-tian-mu-yin-liu-bie', title: '梦游天姥吟留别', author: '李白', dynasty: '唐', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '海客谈瀛洲，烟涛微茫信难求；越人语天姥，云霞明灭或可睹。天姥连天向天横，势拔五岳掩赤城。天台四万八千丈，对此欲倒东南倾。我欲因之梦吴越，一夜飞度镜湖月。湖月照我影，送我至剡溪。谢公宿处今尚在，渌水荡漾清猿啼。脚著谢公屐，身登青云梯。半壁见海日，空中闻天鸡。千岩万转路不定，迷花倚石忽已暝。熊咆龙吟殷岩泉，栗深林兮惊层巅。云青青兮欲雨，水澹澹兮生烟。列缺霹雳，丘峦崩摧。洞天石扉，訇然中开。青冥浩荡不见底，日月照耀金银台。霓为衣兮风为马，云之君兮纷纷而来下。虎鼓瑟兮鸾回车，仙之人兮列如麻。忽魂悸以魄动，恍惊起而长嗟。惟觉时之枕席，失向来之烟霞。世间行乐亦如此，古来万事东流水。别君去兮何时还？且放白鹿青崖间，须行即骑访名山。安能摧眉折腰事权贵，使我不得开心颜！',
      source: '《普通高中语文课程标准（2017年版2020年修订）》附录1 · 诗词曲第11首',
      highlights: [{ type: '名句', text: '安能摧眉折腰事权贵，使我不得开心颜！' }, { type: '易错字', text: '瀛洲 天姥 剡溪 渌水 谢公屐 殷岩泉 栗深林 澹澹 列缺 訇然 魂悸 恍惊起 青崖' }],
      tags: ['古体'],
      translation: [
        '航海的人谈起瀛洲，烟波渺茫实在难以找到；越地的人说起天姥山，云霞忽明忽暗，或许还能看见。',
        '天姥山高耸入云，横贯天空，山势高出五岳，遮蔽了赤城山。',
        '天台山高达四万八千丈，面对天姥山也像要向东南倾倒一样。',
        '我想凭借越人的话梦游吴越，一夜之间飞过洒满月光的镜湖。',
        '湖上的月光照着我的身影，把我送到剡溪。',
        '谢灵运住宿的地方如今还在，清水荡漾，猿猴啼声凄清。',
        '我脚上穿着谢公的木屐，身登直上云霄的山路。',
        '半山腰上看见了海上日出，半空中听见了天鸡啼叫。',
        '山岩千回万转，道路方向不定，我迷恋着花草，倚着山石，忽然天色已经昏暗。',
        '熊在咆哮，龙在长吟，声音震荡着岩石和泉水，使深林战栗，使层层山峰惊动。',
        '云层黑沉沉的，像是要下雨，水波荡漾，升起阵阵烟雾。',
        '闪电雷鸣，山峰崩塌。',
        '仙府的石门，轰隆一声从中间打开。',
        '青色的天空广阔无边，看不到底，日月照耀着金银筑成的宫阙。',
        '用彩虹做衣裳，把风当作马，云中的神仙们纷纷降临。',
        '老虎弹奏着琴瑟，鸾鸟驾着车，仙人们成群结队，多得像麻一样。',
        '忽然我魂魄惊动，猛然惊醒，坐起身来长声叹息。',
        '醒来时身边只有枕席，刚才梦中的烟雾云霞都消失了。',
        '人间的享乐也不过像这样，自古以来万事都如东流的江水一去不返。',
        '告别你们离去啊，什么时候才能回来？',
        '暂且把白鹿放在青青的山崖间，需要出行时就骑上它去访求名山。',
        '怎么能低头弯腰去侍奉权贵，让我不能舒心畅意地露出笑脸！',
      ],
      summary: '诗中叙述诗人梦游天姥山的神奇经历，描绘山中瑰丽壮观的仙境景象，梦醒后感叹世间行乐如流水，表达了鄙弃权贵、不愿摧眉折腰、追求自由和个性解放的思想感情。',
      examFocus: [
        { index: 1, reason: '名句，以夸张写天姥山的高峻，含易错字「拔」' },
        { index: 10, reason: '名句，含易错字「澹澹」，写云水将雨的景象' },
        { index: 14, reason: '名句，写仙人纷纷降临的瑰丽场面，易错字「霓」' },

    { id: 'pi-pa-xing', title: '琵琶行（并序）', author: '白居易', dynasty: '唐', stage: '高中', grade: '必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,
      text: '【序】元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。' +
        '【诗】浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。醉不成欢惨将别，别时茫茫江浸月。忽闻水上琵琶声，主人忘归客不发。寻声暗问弹者谁？琵琶声停欲语迟。移船相近邀相见，添酒回灯重开宴。千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。弦弦掩抑声声思，似诉平生不得志。低眉信手续续弹，说尽心中无限事。轻拢慢捻抹复挑，初为《霓裳》后《六幺》。大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。间关莺语花底滑，幽咽泉流冰下难。冰泉冷涩弦凝绝，凝绝不通声暂歇。别有幽愁暗恨生，此时无声胜有声。银瓶乍破水浆迸，铁骑突出刀枪鸣。曲终收拨当心画，四弦一声如裂帛。东船西舫悄无言，唯见江心秋月白。沉吟放拨插弦中，整顿衣裳起敛容。自言本是京城女，家在虾蟆陵下住。十三学得琵琶成，名属教坊第一部。曲罢曾教善才服，妆成每被秋娘妒。五陵年少争缠头，一曲红绡不知数。钿头银篦击节碎，血色罗裙翻酒污。今年欢笑复明年，秋月春风等闲度。弟走从军阿姨死，暮去朝来颜色故。门前冷落鞍马稀，老大嫁作商人妇。商人重利轻别离，前月浮梁买茶去。去来江口守空船，绕船月明江水寒。夜深忽梦少年事，梦啼妆泪红阑干。我闻琵琶已叹息，又闻此语重唧唧。同是天涯沦落人，相逢何必曾相识！我从去年辞帝京，谪居卧病浔阳城。浔阳地僻无音乐，终岁不闻丝竹声。住近湓江地低湿，黄芦苦竹绕宅生。其间旦暮闻何物？杜鹃啼血猿哀鸣。春江花朝秋月夜，往往取酒还独倾。岂无山歌与村笛，呕哑嘲哳难为听。今夜闻君琵琶语，如听仙乐耳暂明。莫辞更坐弹一曲，为君翻作《琵琶行》。感我此言良久立，却坐促弦弦转急。凄凄不似向前声，满座重闻皆掩泣。座中泣下谁最多？江州司马青衫湿。',

      tags: ['都市', '词'],

        '高耸入云的树木环绕着钱塘江堤的沙路。',

        '秋天有桂花飘香，湖中有十里荷花。',
        '晴天里吹奏着羌笛，夜晚传来采菱的歌声，钓鱼的老翁和采莲的姑娘都喜笑颜开。',

    { id: 'gui-zhi-xiang-jin-ling-huai-gu', title: '桂枝香·金陵怀古', author: '王安石', dynasty: '北宋', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '登临送目。正故国晚秋，天气初肃。千里澄江似练，翠峰如簇。归帆去棹残阳里，背西风、酒旗斜矗。彩舟云淡，星河鹭起，画图难足。念往昔、繁华竞逐。叹门外楼头，悲恨相续。千古凭高对此，谩嗟荣辱。六朝旧事随流水，但寒烟衰草凝绿。至今商女，时时犹唱，《后庭》遗曲。',

        '可叹门外楼头的旧事，悲恨接连不断。',
        '千百年来登高面对这景象，只是徒然感叹荣辱。',

    { id: 'jiang-cheng-zi-yi-mao', title: '江城子·乙卯正月二十日夜记梦', author: '苏轼', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。纵使相逢应不识，尘满面，鬓如霜。夜来幽梦忽还乡。小轩窗，正梳妆。相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。',

    { id: 'nian-nu-jiao-chi-bi-huai-gu', title: '念奴娇·赤壁怀古', author: '苏轼', dynasty: '北宋', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,
      text: '大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。',

        '江山美得像画一样，那个时代出现了多少英雄豪杰。',
        '遥想周瑜当年，小乔刚刚嫁给他，他姿态雄伟，英气勃发。',

        '神游三国故地，多情的人应该笑我，早早生出了花白的头发。',
        '人生就像一场梦，还是举起酒杯把酒洒向江中的明月。',

      summary: '词写登临赤壁所见的大江壮景，追想周瑜当年雄姿英发、谈笑破敌的功业，再对照自身被贬黄州、华发早生的处境，感慨人生如梦。全篇抒发对英雄业绩的仰慕和自己壮志难酬的怅惘与旷达。',

    { id: 'deng-kuai-ge', title: '登快阁', author: '黄庭坚', dynasty: '北宋', stage: '高中', grade: '选择性必修', genre: '诗', sourceType: '课标推荐', required: true, recommended: true,

    { id: 'que-qiao-xian', title: '鹊桥仙（纤云弄巧）', author: '秦观', dynasty: '北宋', stage: '高中', grade: '必修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,

    { id: 'su-mu-zhe', title: '苏幕遮（燎沉香）', author: '周邦彦', dynasty: '北宋', stage: '高中', grade: '选修', genre: '词', sourceType: '课标推荐', required: true, recommended: true,

/* 古诗文背诵学习系统 —— 题库读取层

(function (global) {

    return {

      genre: String(poem.genre || '其他').trim(),

      required: !!poem.required,
      recommended: poem.recommended !== false,
      text: text,

        else if (keys[item.key]) issues.push('wrongItems key 重复: ' + item.key);

        if (typeof item.poemId !== 'string' || !item.poemId) issues.push('wrongItems[' + i + '].poemId 非法');
        if (item.mode && MODE_KEYS.indexOf(item.mode) === -1) issues.push('wrongItems[' + i + '].mode 非法: ' + item.mode);
        if (item.index !== null && (!Number.isInteger(item.index) || item.index < 0)) issues.push('wrongItems[' + i + '].index 非法');
        if (item.pairIndex !== null && (!Number.isInteger(item.pairIndex) || item.pairIndex < 0)) issues.push('wrongItems[' + i + '].pairIndex 非法');
        if (!Number.isInteger(item.count) || item.count < 1) issues.push('wrongItems[' + i + '].count 非法');
      });
    }
    if (!Array.isArray(data.wrongBook)) issues.push('wrongBook 不是数组');
    else {
      var expected = Object.create(null);
      Utils.toArray(data.wrongItems).forEach(function (item) {
        expected[item.poemId] = (expected[item.poemId] || 0) + item.count;
      });
      data.wrongBook.forEach(function (item) {
        if (!isPlainObject(item) || typeof item.id !== 'string' || !item.id) { issues.push('wrongBook 含非法 id'); return; }
        if (!Number.isInteger(item.count) || item.count < 1) issues.push('wrongBook.count 非法');
        if (expected[item.id] !== item.count) issues.push('wrongBook[' + item.id + '] 与 wrongItems 汇总不一致');
      });
    }
    if (!isPlainObject(data.review)) issues.push('review 不是对象');
    else {
      Object.keys(data.review).forEach(function (id) {
        var item = data.review[id];
        if (!isPlainObject(item)) { issues.push('review[' + id + '] 不是对象'); return; }
        if (!Number.isInteger(item.level) || item.level < 0 || item.level > SRS_MAX_LEVEL) issues.push('review[' + id + '].level 非法');
        if (item.due !== '' && !Utils.isValidDayKey(item.due)) issues.push('review[' + id + '].due 非法: ' + item.due);
      });
    }
    if (!isPlainObject(data.daily)) issues.push('daily 不是对象');
    else {
      Object.keys(data.daily).forEach(function (day) {
        if (!Utils.isValidDayKey(day)) issues.push('daily 日期键非法: ' + day);
        var item = data.daily[day];
        if (!isPlainObject(item)) { issues.push('daily[' + day + '] 不是对象'); return; }
        if (!Number.isInteger(item.quiz) || item.quiz < 0) issues.push('daily[' + day + '].quiz 非法');
        if (!Number.isInteger(item.correct) || item.correct < 0 || item.correct > item.quiz) issues.push('daily[' + day + '].correct 非法');
      });
    }
    if (!isPlainObject(data.prefs)) issues.push('prefs 不是对象');
    else {
      if (QUIZ_COUNT_OPTIONS.indexOf(data.prefs.quizCount) === -1) issues.push('prefs.quizCount 非法: ' + data.prefs.quizCount);
      if (!Array.isArray(data.prefs.modes)) issues.push('prefs.modes 不是数组');
      else if (data.prefs.modes.some(function (key) { return MODE_KEYS.indexOf(key) === -1; })) issues.push('prefs.modes 含非法题型');
      if (FONT_SCALES.indexOf(data.prefs.fontScale) === -1) issues.push('prefs.fontScale 非法: ' + data.prefs.fontScale);
      if (typeof data.prefs.showTranslation !== 'boolean') issues.push('prefs.showTranslation 非法');
      if (typeof data.prefs.focusMode !== 'boolean') issues.push('prefs.focusMode 非法');
    }
    return issues;
  }

  /**
   * 清理数据库中已经不存在的“幽灵 ID”（题库升级 / 换设备合并数据后可能残留）。
   * 返回清理条数；默认写入模块内 state，也可传入自定义对象（测试用）。
   */
  function pruneUnknownIds(target, allowedIds) {
    var data = target || state;
    var ids = allowedIds;
    if (!ids) {
      if (!global.PoetryDatabase || typeof global.PoetryDatabase.all !== 'function') return 0;
      ids = global.PoetryDatabase.all().map(function (poem) {
        return poem.id;
      });
    }
    var allowed = Object.create(null);
    Utils.toArray(ids).forEach(function (id) {
      allowed[id] = true;
    });
    var removed = 0;

    data.selectedIds = Utils.toArray(data.selectedIds).filter(function (id) {
      if (allowed[id]) return true;
      removed += 1;
      return false;
    });
    Object.keys(data.learnedIds || {}).forEach(function (id) {
      if (!allowed[id]) {
        delete data.learnedIds[id];
        removed += 1;
      }
    });
    data.recents = Utils.toArray(data.recents).filter(function (item) {
      if (item && allowed[item.id]) return true;
      removed += 1;
      return false;
    });
    Object.keys(data.quizStats && data.quizStats.byPoem ? data.quizStats.byPoem : {}).forEach(function (id) {
      if (!allowed[id]) {
        delete data.quizStats.byPoem[id];
        removed += 1;
      }
    });
    data.wrongItems = Utils.toArray(data.wrongItems).filter(function (item) {
      if (item && allowed[item.poemId]) return true;
      removed += 1;
      return false;
    });
    Object.keys(data.sentenceReview || {}).forEach(function(key) {
      if (!allowed[data.sentenceReview[key].poemId]) { delete data.sentenceReview[key]; removed += 1; }
    });
    Object.keys(data.review || {}).forEach(function (id) {
      if (!allowed[id]) {
        delete data.review[id];
        removed += 1;
      }
    });
    syncWrongBook(data);
    return removed;
  }

  var state = defaults();
  var loadIssue = '';

  function load() {
    var raw = getRaw();
    if (raw == null) {
      state = defaults();
      return state;
    }
    try {
      var parsed = JSON.parse(raw);
      state = sanitize(parsed);
    } catch (err) {
      loadIssue = '本地数据格式异常，已自动重置学习记录。';
      state = defaults();
      setRaw(JSON.stringify(state));
      return state;
    }
    var removed = pruneUnknownIds(state);
    if (removed) loadIssue = '已清理 ' + removed + ' 条题库中不存在的本地记录。';
    var normalized = JSON.stringify(state);
    if (normalized !== raw) setRaw(normalized); // 把修正后的安全状态写回，避免错误数据反复进入系统
    return state;
  }

  function save() {
    state.version = SCHEMA_VERSION;
    syncWrongBook(state);
    return setRaw(JSON.stringify(state));
  }

  function patch(partial) {
    if (partial && typeof partial === 'object') {
      Object.keys(partial).forEach(function (key) {
        state[key] = partial[key];
      });
    }
    // 合并后重新走一遍 schema / 业务校验，避免非法数据直接落盘
    state = sanitize(state);
    syncWrongBook(state);
    save();
    return state;
  }

  /** 只改偏好：合并 prefs，避免调用方每次都手写整份 prefs 丢字段 */
  function updatePrefs(partial) {
    var next = {};
    Object.keys(state.prefs || {}).forEach(function (key) {
      next[key] = state.prefs[key];
    });
    if (partial && typeof partial === 'object') {
      Object.keys(partial).forEach(function (key) {
        next[key] = partial[key];
      });
    }
    state.prefs = next;
    state = sanitize(state);
    syncWrongBook(state);
    save();
    return state.prefs;
  }

  function reset() {
    state = defaults();
    try {
      global.localStorage.removeItem(STORAGE_KEY);
    } catch (err) {
      /* 忽略：内存模式 */
    }
    memoryFallback = null;
    save();
    return state;
  }

  function getState() {
    return state;
  }

  function touchRecent(poemId) {
    if (!poemId) return;
    var list = state.recents.filter(function (item) {
      return item.id !== poemId;
    });
    list.unshift({ id: poemId, time: Date.now() });
    state.recents = list.slice(0, RECENT_LIMIT);
  }

  function scheduleReview(poemId, isCorrect) {
    if (!poemId) return;
    var today = Utils.todayKey();
    var info = state.review[poemId] || { level: 0, due: '', lastTime: 0 };
    if (isCorrect) {
      /* 同一篇目同一天只升一级，避免一组 10 道题把复习间隔一口气推到 30 天 */
      var lastDay = info.lastTime ? Utils.todayKey(new Date(info.lastTime)) : '';
      if (lastDay === today) {
        info.lastTime = Date.now();
        state.review[poemId] = info;
        return;
      }
      info.level = Utils.clamp((info.level || 0) + 1, 0, SRS_MAX_LEVEL);
      var step = SRS_STEPS[Math.max(0, info.level - 1)];
      info.due = Utils.addDaysKey(today, step || SRS_STEPS[0]);
    } else {
      info.level = 0;
      info.due = Utils.addDaysKey(today, SRS_STEPS[0]);
    }
    info.lastTime = Date.now();
    state.review[poemId] = info;
  }

  function markLearned(poemId) {
    if (!poemId) return state;
    state.learnedIds[poemId] = Date.now();
    if (!state.review[poemId]) {
      state.review[poemId] = {
        level: 0,
        due: Utils.addDaysKey(Utils.todayKey(), SRS_STEPS[0]),
        lastTime: Date.now(),
      };
    }
    touchRecent(poemId);
    save();
    return state;
  }

  /** 手动加入错题（没有题目 key 时写一条篇目级 legacy 记录） */
  function addWrong(poemId, mode, silent, meta) {
    if (!poemId) return state;
    if (meta && typeof meta.key === 'string' && meta.key) {
      return addWrongItem({
        key: meta.key,
        poemId: poemId,
        mode: mode,
        index: meta.index,
        pairIndex: meta.pairIndex,
      }, silent);
    }
    var safeMode = normalizeMode(mode);
    var key = 'legacy|' + poemId;
    var found = null;
    state.wrongItems.forEach(function (item) {
      if (item.key === key) found = item;
    });
    if (found) {
      found.count += 1;
      found.time = Date.now();
      if (safeMode) found.mode = safeMode;
    } else {
      state.wrongItems.unshift({
        key: key,
        poemId: poemId,
        mode: safeMode,
        index: null,
        pairIndex: null,
        time: Date.now(),
        count: 1,
      });
    }
    state.wrongItems = state.wrongItems.slice(0, WRONG_ITEM_LIMIT);
    syncWrongBook(state);
    if (!silent) save();
    return state;
  }

  /** 加入一条题目级错题（同一题重复答错累加 count） */
  function addWrongItem(info, silent) {
    if (!info || typeof info.poemId !== 'string' || !info.poemId) return state;
    var key = typeof info.key === 'string' ? info.key.trim() : '';
    if (!key) return state;
    var safeMode = normalizeMode(info.mode);
    var found = null;
    state.wrongItems.forEach(function (item) {
      if (item.key === key) found = item;
    });
    if (found) {
      found.count += 1;
      found.time = Date.now();
      if (safeMode) found.mode = safeMode;
      if (Number.isInteger(info.index)) found.index = info.index;
      if (Number.isInteger(info.pairIndex)) found.pairIndex = info.pairIndex;
    } else {
      state.wrongItems.unshift({
        key: key,
        poemId: info.poemId,
        mode: safeMode,
        index: Number.isInteger(info.index) ? info.index : null,
        pairIndex: Number.isInteger(info.pairIndex) ? info.pairIndex : null,
        time: Date.now(),
        count: 1,
      });
    }
    state.wrongItems = state.wrongItems.slice(0, WRONG_ITEM_LIMIT);
    syncWrongBook(state);
    if (!silent) save();
    return state;
  }

  function removeWrong(poemId, silent) {
    state.wrongItems = state.wrongItems.filter(function (item) {
      return item.poemId !== poemId;
    });
    syncWrongBook(state);
    if (!silent) save();
    return state;
  }

  function removeWrongItem(key, silent) {
    if (!key) return state;
    state.wrongItems = state.wrongItems.filter(function (item) {
      return item.key !== key;
    });
    syncWrongBook(state);
    if (!silent) save();
    return state;
  }

  function recordQuiz(poemId, isCorrect, mode, meta) {
    var day = Utils.todayKey();
    if (!state.daily[day]) state.daily[day] = { quiz: 0, correct: 0 };
    state.daily[day].quiz += 1;
    if (isCorrect) state.daily[day].correct += 1;
    // daily 只保留最近 60 天，避免长时间使用后无限增长
    Utils.sortDayKeys(Object.keys(state.daily)).slice(0, -DAILY_LIMIT).forEach(function (oldDay) {
      delete state.daily[oldDay];
    });

    state.quizStats.total += 1;
    if (isCorrect) state.quizStats.correct += 1;
    else state.quizStats.wrong += 1;

    var safeMode = normalizeMode(mode);
    if (safeMode) {
      var modeItem = state.quizStats.byMode[safeMode] || { total: 0, correct: 0, wrong: 0 };
      modeItem.total += 1;
      if (isCorrect) modeItem.correct += 1;
      else modeItem.wrong += 1;
      state.quizStats.byMode[safeMode] = modeItem;
    }

    if (poemId) {
      var item = state.quizStats.byPoem[poemId] || { total: 0, correct: 0, wrong: 0, lastTime: 0 };
      item.total += 1;
      if (isCorrect) item.correct += 1;
      else item.wrong += 1;
      item.lastTime = Date.now();
      state.quizStats.byPoem[poemId] = item;
      touchRecent(poemId);

      /* 题目级：答对只移除这一题；旧调用 / 旧数据没有 key 时保持整篇移除。 */
      if (isCorrect) {
        if (meta && typeof meta.key === 'string' && meta.key) removeWrongItem(meta.key, true);
        else removeWrong(poemId, true);
      } else if (meta && typeof meta.key === 'string' && meta.key) {
        addWrongItem({
          key: meta.key,
          poemId: poemId,
          mode: safeMode,
          index: meta.index,
          pairIndex: meta.pairIndex,
        }, true);
      } else {
        addWrong(poemId, safeMode, true);
      }
      scheduleReview(poemId, isCorrect);
      if (meta && meta.key && Number.isInteger(meta.index)) {
        var old=state.sentenceReview[meta.key] || {level:0,lastTime:0};
        var same=old.lastTime && Utils.todayKey(new Date(old.lastTime)) === day;
        var level=isCorrect ? Math.min(SRS_MAX_LEVEL,old.level+(same?0:1)) : 0;
        state.sentenceReview[meta.key]={poemId:poemId,mode:safeMode,index:meta.index,pairIndex:meta.pairIndex,
          level:level,due:(same && isCorrect && old.due)?old.due:Utils.addDaysKey(day,SRS_STEPS[Math.max(0,level-1)]),lastTime:Date.now()};
        var keys=Object.keys(state.sentenceReview).sort(function(a,b){return state.sentenceReview[b].lastTime-state.sentenceReview[a].lastTime;});
        keys.slice(WRONG_ITEM_LIMIT).forEach(function(k){delete state.sentenceReview[k];});
      }
    }
    save();
    return state;
  }

  function todayStats() {
    var day = Utils.todayKey();
    return state.daily[day] || { quiz: 0, correct: 0 };
  }

  function wrongItemsForPoem(poemId) {
    return state.wrongItems.filter(function (item) {
      return item.poemId === poemId;
    });
  }

  function wrongItemKeysForPoems(ids) {
    var allowed = Object.create(null);
    Utils.toArray(ids).forEach(function (id) {
      allowed[id] = true;
    });
    return state.wrongItems
      .filter(function (item) {
        return allowed[item.poemId] && item.key.indexOf('legacy|') !== 0;
      })
      .map(function (item) {
        return item.key;
      });
  }

  function duePoemIds(day) {
    var today = Utils.todayKey(day);
    var cards=Object.keys(state.sentenceReview).filter(function(key){return Utils.isDueDay(state.sentenceReview[key].due,today);}).map(function(key){return state.sentenceReview[key].poemId;});
    return Utils.unique(cards.concat(Object.keys(state.review)
      .filter(function (id) {
        var item = state.review[id];
        return item && Utils.isDueDay(item.due, today);
      })
      .sort(function (a, b) {
        var da = state.review[a].due || '';
        var db = state.review[b].due || '';
        if (da !== db) return da < db ? -1 : 1;
        return a < b ? -1 : a > b ? 1 : 0;
      })));
  }

  function reviewFor(poemId) {
    return state.review[poemId] || null;
  }

  /** 导出学习数据（纯本地文件，不上传） */
  function exportData() {
    return {
      app: 'hison-poetry-recite',
      version: (global.PoetryMeta && global.PoetryMeta.version) || '',
      schema: SCHEMA_VERSION,
      exportedAt: Date.now(),
      state: JSON.parse(JSON.stringify(state)),
    };
  }

  /** 导入学习数据：先 sanitize / prune，再整体替换本机数据；返回 { ok, error } */
  function importData(payload) {
    if (!isPlainObject(payload)) {
      return { ok: false, error: '文件里没有可识别的学习数据。' };
    }
    if (Object.prototype.hasOwnProperty.call(payload, 'app') && payload.app !== 'hison-poetry-recite') {
      return { ok: false, error: '这不是古诗文背诵的学习数据备份。' };
    }
    var raw = Object.prototype.hasOwnProperty.call(payload, 'state') ? payload.state : payload;
    // sanitize 的容错不能用于识别备份：{} 和其它应用的 JSON 会被补成空白状态，覆盖现有进度。
    // v1/v2 原始数据均含这两个核心字段；合法的空白备份也包含它们。
    if (!isPlainObject(raw) || !Array.isArray(raw.selectedIds) || !isPlainObject(raw.quizStats)) {
      return { ok: false, error: '文件里没有可识别的学习数据。' };
    }
    var versions = [payload.schema, raw.version];
    if (versions.some(function (version) {
      return version != null && (!Number.isInteger(version) || version < 1 || version > SCHEMA_VERSION);
    })) {
      return { ok: false, error: '备份的数据版本不受当前页面支持，请使用兼容版本导入。' };
    }
    var next = sanitize(raw);
    pruneUnknownIds(next);
    state = next;
    save();
    return { ok: true, state: state };
  }

  global.PoetryStorage = {
    isPersistent: function(){return memoryFallback === null;},
    dueSentenceKeys: function(){return Object.keys(state.sentenceReview).filter(function(key){return Utils.isDueDay(state.sentenceReview[key].due,Utils.todayKey());});},
    KEY: STORAGE_KEY,
    MODE_KEYS: MODE_KEYS,
    QUIZ_COUNT_OPTIONS: QUIZ_COUNT_OPTIONS,
    SRS_STEPS: SRS_STEPS,
    defaults: defaults,
    load: load,
    save: save,
    patch: patch,
    updatePrefs: updatePrefs,
    reset: reset,
    sanitize: sanitize,
    validate: validate,
    pruneUnknownIds: pruneUnknownIds,
    normalizeQuizCount: normalizeQuizCount,
    normalizeFontScale: normalizeFontScale,
    getState: getState,
    getLoadIssue: function () {
      return loadIssue;
    },
    markLearned: markLearned,
    recordQuiz: recordQuiz,
    addWrong: addWrong,
    addWrongItem: addWrongItem,
    removeWrong: removeWrong,
    removeWrongItem: removeWrongItem,
    wrongItemsForPoem: wrongItemsForPoem,
    wrongItemKeysForPoems: wrongItemKeysForPoems,
    duePoemIds: duePoemIds,
    reviewFor: reviewFor,
    exportData: exportData,
    importData: importData,
    touchRecent: function (poemId) {
      touchRecent(poemId);
      save();
    },
    todayStats: todayStats,
  };
})(window);

/* ===== js/study.js ===== */
/* 古诗文背诵学习系统 —— 全文学习模式
   交互：点击句子隐藏/显示、显示全部、逐句隐藏、关键词隐藏、上一句/下一句。
   逐句翻译：每句原文下面挂一条对应的现代汉语翻译（数据来自 poem.translation），
   翻译只在该句原文“完整显示”时可见；隐藏时用 visibility 而不是 display，
   保证翻译的布局占位始终存在，隐藏 / 显示不会让整首诗重新排版、页面跳动。
   考试重点星标：正文左侧是独立的 marker 列（数据来自 poem.examFocus，只存句子下标），
   ★ 只出现在 marker 里，绝不进入正文文本；marker 列宽固定，有没有 ★ 都由 CSS 留位，
   所以任何显隐状态都不会让原文左右移动。

   v1.5 新增（都做成独立开关，不改变默认的全文模式）：
   - 逐句背：一次只显示当前一句，前后句淡化；
   - 只看重点：非 examFocus 句折叠；
   - 固定工具条 + 键盘快捷键 + 手机左右滑；
   - 字号三档、译文开关、专注模式（偏好保存在本机）。 */
(function (global) {
  'use strict';

  var Utils = global.PoetryUtils;
  var DB = global.PoetryDatabase;
  var Storage = global.PoetryStorage;

  var state = {
    poemId: '',
    hidden: {},      // { sentenceIndex: true }
    keywordMode: false,
    activeIndex: -1,
    list: [],
    sentences: [],
    translations: [],
    focusMap: {},
    reciteMode: false,
    focusOnly: false,
    root: null,
  };

  /** 作者隐形指纹：随正文复制而传播（零宽字符，不参与阅读与判分） */
  function brandSig() {
    var brand = global.PoetryBrand;
    return brand && brand.signature ? brand.signature() : '';
  }

  function prefs() {
    var data = Storage.getState ? Storage.getState() : null;
    return (data && data.prefs) || {};
  }

  function resetState(poemId, list) {
    var poem = DB.byId(poemId);
    state.poemId = poemId;
    state.hidden = {};
    state.keywordMode = false;
    state.activeIndex = -1;
    state.list = list;
    state.reciteMode = false;
    state.focusOnly = false;
    state.sentences = poem ? Utils.splitSentences(poem.text) : [];

  function poemTranslations(poem) {

    return typeof DB.translationLines === 'function' ? DB.translationLines(poem) : [];
  }

  /** 翻译区域是否显示（= 该句原文是否完整显示，与 state 单一来源保持一致） */
  function transVisible(index) {

  }

  /* ---------------- 考试重点星标 ---------------- */

  function examFocusMap(poem) {
    if (!poem) return Object.create(null);
    if (poem.id === state.poemId && state.focusMap) return state.focusMap;
    return typeof DB.examFocusMap === 'function' ? DB.examFocusMap(poem) : Object.create(null);
  }

  /**
   * 星标是否可见：同样以“该句原文完整显示”为唯一条件。
   * 逐句隐藏 / 逐句隐藏全部 / 关键词隐藏时原文被挖空，此时不显示 ★。
   */
  function examVisible(index) {
    return !state.hidden[index];
  }

  /* ---------------- 中心思想 / 主旨 ---------------- */

  /** 中心思想属于“文章级信息”，诗词用「主旨」，文言文用「中心思想」 */
  function summaryLabel(poem) {
    return poem && poem.genre === '文言文' ? '中心思想' : '主旨';
  }

  function summaryText(poem) {
    return poem && typeof poem.summary === 'string' ? poem.summary.trim() : '';
  }

  /* ---------------- 渲染 ---------------- */

  function sentenceText(sentence, hidden) {
    if (!hidden) return String(sentence);
    if (state.keywordMode) {
      return Utils.splitClauses(sentence)
        .map(function (clause) {
          return Utils.blankKeepFirst(clause);
        })
        .join('');
    }
    return Utils.makeBlank(sentence, null);
  }

  /**
   * 重点标记列。**始终**输出同一个元素：有重点时里面是 ★，没有重点时是空的，
   * 由 CSS 固定列宽保证「有没有 ★」都不影响原文的横向起始位置。
   * 隐藏只切 is-off（CSS visibility），绝不用 display: none。
   */
  function renderMarker(isFocus, visible) {
    return (
      '<span class="line-marker' + (visible ? '' : ' is-off') + '" aria-hidden="true">' +
      (isFocus ? '★' : '') +
      '</span>'
    );
  }

  /**
   * 逐句翻译的容器。始终留在 DOM 里，隐藏时只去掉类名、由 CSS 用 visibility 收起，
   * 这样高度不变，不会出现“翻译消失后原文整段上移”的抽搐。
   */
  function renderTranslation(text, visible) {
    return (
      '<span class="line-zh' + (visible ? '' : ' is-off') + '" aria-hidden="true">' +
      Utils.escapeHtml(text || '') +
      '</span>'
    );
  }

  function lineClass(index) {
    var hidden = !!state.hidden[index];
    var focused = !!state.focusMap[index];
    return 'line-item' +
      (hidden ? ' is-hidden' : '') +
      (state.activeIndex === index ? ' is-active' : '') +
      (focused ? ' is-focus' : ' is-nonfocus');
  }

  // Keep the original glyph's inline metrics. Different fonts give □ a different
  // width, so replacing glyphs directly can reflow a narrow screen on hide.
  function sentenceHtml(sentence, hidden) {
    if (!hidden) return Utils.escapeHtml(sentence);
    var original = Array.from(String(sentence));
    var masked = Array.from(sentenceText(sentence, true));
    if (original.length !== masked.length) return Utils.escapeHtml(masked.join(''));
    return original.map(function(ch, index) {
      if (masked[index] === ch) return Utils.escapeHtml(ch);
      return '<span class="masked-char" data-original="'+Utils.escapeHtml(ch)+'"><span class="masked-output">'+Utils.escapeHtml(masked[index])+'</span></span>';
    }).join('');
  }

  function renderSentences(poem) {
    var sentences = state.sentences.length ? state.sentences : Utils.splitSentences(poem.text);
    var translations = poemTranslations(poem);
    var focus = examFocusMap(poem);
    return sentences
      .map(function (sentence, index) {
        var hidden = !!state.hidden[index];
        return (
          '<button type="button" class="' + lineClass(index) + '" data-line="' + index + '" aria-pressed="' + (hidden ? 'true' : 'false') + '">' +
          renderMarker(!!focus[index], examVisible(index)) +
          '<span class="line-content">' +
          '<span class="line-text">' + sentenceHtml(sentence, hidden) + brandSig() + '</span>' +
          renderTranslation(translations[index], transVisible(index)) +
          '</span>' +
          '</button>'
        );
      })
      .join('');
  }

  /**
   * 只在原位上改文字与状态，不重建 DOM、不动滚动位置。
   * marker / 翻译的显隐只切 class（CSS 用 visibility），列宽与高度都不变，所以不会整段上移。
   */
  function updateLines(root) {
    var poem = currentPoem();
    var body = root.querySelector('#poemBody');
    if (!poem || !body) return;
    var nodes = body.querySelectorAll('.line-item');
    var sentences = state.sentences.length ? state.sentences : Utils.splitSentences(poem.text);
    if (nodes.length !== sentences.length) {
      refreshBody(root);
      return;
    }
    var translations = poemTranslations(poem);
    var focus = examFocusMap(poem);
    for (var index = 0; index < nodes.length; index += 1) {
      var node = nodes[index];
      var hidden = !!state.hidden[index];
      var textEl = node.querySelector('.line-text');
      var zhEl = node.querySelector('.line-zh');
      var markerEl = node.querySelector('.line-marker');
      if (textEl) textEl.innerHTML = sentenceHtml(sentences[index], hidden) + brandSig();
      if (zhEl) {
        zhEl.textContent = translations[index] || '';
        zhEl.classList.toggle('is-off', !transVisible(index));
      }
      if (markerEl) {
        markerEl.textContent = focus[index] ? '★' : '';
        markerEl.classList.toggle('is-off', !examVisible(index));
      }
      node.classList.toggle('is-hidden', hidden);
      node.classList.toggle('is-active', state.activeIndex === index);
      node.classList.toggle('is-focus', !!focus[index]);
      node.classList.toggle('is-nonfocus', !focus[index]);
      node.setAttribute('aria-pressed', hidden ? 'true' : 'false');
    }
  }

  function renderHints(poem) {
    var map = DB.highlightMap(poem);
    var groups = Object.keys(map);
    if (!groups.length) return '';
    return groups
      .map(function (type) {
        return (
          '<dt>背诵提示 · ' + Utils.escapeHtml(type) + '</dt>' +
          '<dd><div class="hint-list">' +
          map[type]
            .map(function (item) {
              return (
                '<button type="button" class="hint-item" data-hint="' + Utils.escapeHtml(item.text) + '">' +
                Utils.escapeHtml(item.text) +
                (item.note ? '<span class="tiny muted"> · ' + Utils.escapeHtml(item.note) + '</span>' : '') +
                '</button>'
              );
            })
            .join('') +
          '</div></dd>'
        );
      })
      .join('');
  }

  function renderSummary(poem) {
    var text = summaryText(poem);
    if (!text) return '';
    return (
      '<div class="poem-summary">' +
        '<span class="poem-summary-label">' + Utils.escapeHtml(summaryLabel(poem)) + '</span>' +
        '<p class="poem-summary-text">' + Utils.escapeHtml(text) + '</p>' +
      '</div>'
    );
  }

  function renderMeta(poem) {
    var sourceInfo = (global.PoetryMeta.sources || {})[poem.sourceType === '上海地区' ? 'shanghai' : poem.sourceType === '统编教材' ? 'textbook' : poem.stage === '高中' ? 'senior' : 'junior'];
    var rows = [
      ['学段年级', poem.stage + ' · ' + poem.grade],
      ['作者朝代', poem.author + ' · ' + poem.dynasty],
      ['体裁', poem.genre],
      ['来源类型', poem.sourceType + (poem.required ? '（核心必背）' : '')],
      ['数据来源', poem.source || (sourceInfo ? sourceInfo.name : '')],
    ];
    var html = rows
      .filter(function (row) {
        return row[1];
      })
      .map(function (row) {
        return '<dt>' + Utils.escapeHtml(row[0]) + '</dt><dd>' + Utils.escapeHtml(row[1]) + '</dd>';
      })
      .join('');

    if (poem.notes) html += '<dt>说明</dt><dd>' + Utils.escapeHtml(poem.notes) + '</dd>';

    if (poem.variants.length) {
      html += '<dt>版本差异</dt><dd>' + poem.variants
        .map(function (variant) {
          return '<div>' + Utils.escapeHtml(variant.label || '异文') + '：' + Utils.escapeHtml(variant.text) + '</div>';
        })
        .join('') + '</dd>';
    }
    return html;
  }

  function toolbarHtml() {
    var p = prefs();
    var scale = Storage.normalizeFontScale(p.fontScale);
    return (
      '<div class="study-toolbar">' +
        '<button type="button" class="btn btn-sm" data-action="reveal-all">显示全部</button>' +
        '<button type="button" class="btn btn-sm" data-action="hide-all">逐句隐藏</button>' +
        '<button type="button" class="btn btn-sm" data-action="toggle-keyword">关键词隐藏</button>' +
        '<button type="button" class="btn btn-sm" data-action="prev-line">上一句</button>' +
        '<button type="button" class="btn btn-sm" data-action="next-line">下一句</button>' +
        '<span class="toolbar-sep" aria-hidden="true"></span>' +
        '<button type="button" class="btn btn-sm" data-action="toggle-recite">逐句背</button>' +
        '<button type="button" class="btn btn-sm" data-action="toggle-focus">只看重点</button>' +
        '<button type="button" class="btn btn-sm" data-action="toggle-translation">译文：' + (p.showTranslation === false ? '关' : '开') + '</button>' +
        '<button type="button" class="btn btn-sm" data-action="font-down" aria-label="正文字号调小"' + (scale <= 0 ? ' disabled' : '') + '>A−</button>' +
        '<button type="button" class="btn btn-sm" data-action="font-up" aria-label="正文字号调大"' + (scale >= 2 ? ' disabled' : '') + '>A＋</button>' +
        '<button type="button" class="btn btn-sm" data-action="toggle-focusmode">' + (p.focusMode ? '退出专注' : '专注') + '</button>' +
      '</div>' +
      '<div class="study-status">' +
        '<span id="studyProgress">' + Object.keys(state.hidden).length + ' / ' + state.sentences.length + ' 句已隐藏</span>' +
        '<span id="studyPosition">' + positionText() + '</span>' +
      '</div>'
    );
  }

  function positionText() {
    if (!state.sentences.length) return '';
    if (state.activeIndex < 0) return '共 ' + state.sentences.length + ' 句';
    return '第 ' + (state.activeIndex + 1) + ' / ' + state.sentences.length + ' 句';
  }

  function render(root) {
    var poem = currentPoem();
    if (!poem) {
      root.innerHTML =
        '<div class="card"><div class="empty-state">当前没有可学习的篇目，请先返回选择篇目。</div></div>';
      return;
    }

    var learned = !!Storage.getState().learnedIds[poem.id];
    var options = state.list
      .map(function (item) {
        return (
          '<option value="' + Utils.escapeHtml(item.id) + '"' + (item.id === poem.id ? ' selected' : '') + '>' +
          Utils.escapeHtml(item.title + ' · ' + item.author) +
          '</option>'
        );
      })
      .join('');
    var p = prefs();

    root.innerHTML =
      '<section class="card">' +
        '<div class="poem-switch">' +
          '<label class="filter-label" for="studyPoemSelect">切换篇目（共 ' + state.list.length + ' 篇）</label>' +
          '<select id="studyPoemSelect">' + options + '</select>' +
        '</div>' +
      '</section>' +
      '<div class="study-toolbar-wrap">' + toolbarHtml() + '</div>' +
      '<section class="card">' +
        '<div class="poem-head">' +
          '<h2>' + Utils.escapeHtml(poem.title) + '</h2>' +
          '<p class="poem-byline">' + Utils.escapeHtml(poem.author + ' · ' + poem.dynasty) + '</p>' +
          '<div class="poem-tags">' +
            '<span class="badge badge-primary">' + Utils.escapeHtml(poem.stage + ' ' + poem.grade) + '</span>' +
            '<span class="badge">' + Utils.escapeHtml(poem.genre) + '</span>' +
            '<span class="badge' + (poem.required ? ' badge-success' : '') + '">' + Utils.escapeHtml(poem.sourceType) + '</span>' +
            (learned ? '<span class="badge badge-warn">已学习</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="poem-body' + (state.reciteMode ? ' is-recite' : '') + (state.focusOnly ? ' is-focus-only' : '') + (p.showTranslation === false ? ' hide-translation' : '') + '" id="poemBody">' + renderSentences(poem) + '</div>' +
        renderSummary(poem) +
        '<div class="hint-bar">' +
          '<span class="tiny muted">点击任意句子可以隐藏 / 显示；空格键切换当前句，← → 换句。</span>' +
          '<span class="tiny muted" id="studyProgress2">' + Object.keys(state.hidden).length + ' / ' + state.sentences.length + ' 句已隐藏</span>' +
        '</div>' +
        '<dl class="poem-meta-block">' + renderMeta(poem) + renderHints(poem) + '</dl>' +
      '</section>';
    applyReadingPrefs(root);
    syncToolbar(root);
  }

  function updateCounters(root) {
    var hidden = Object.keys(state.hidden).length;
    var text = hidden + ' / ' + state.sentences.length + ' 句已隐藏';
    var counter = root.querySelector('#studyProgress');
    if (counter) counter.textContent = text;
    var counter2 = root.querySelector('#studyProgress2');
    if (counter2) counter2.textContent = text;
    var position = root.querySelector('#studyPosition');
    if (position) position.textContent = positionText();
  }

  /** 全文重建（只在切换篇目 / 首次渲染时用）；日常交互走 updateLines，不重建 DOM */
  function refreshBody(root) {
    var poem = currentPoem();
    var body = root.querySelector('#poemBody');
    if (!poem || !body) return;
    body.innerHTML = renderSentences(poem);
    applyReadingPrefs(root);
    syncToolbar(root);
    updateCounters(root);
  }

  function syncToolbar(root) {
    var keywordBtn = root.querySelector('[data-action="toggle-keyword"]');
    if (keywordBtn) {
      keywordBtn.classList.toggle('btn-primary', state.keywordMode);
      keywordBtn.setAttribute('aria-pressed', state.keywordMode ? 'true' : 'false');
    }
    var reciteBtn = root.querySelector('[data-action="toggle-recite"]');
    if (reciteBtn) {
      reciteBtn.classList.toggle('btn-primary', state.reciteMode);
      reciteBtn.setAttribute('aria-pressed', state.reciteMode ? 'true' : 'false');
      reciteBtn.textContent = state.reciteMode ? '退出逐句' : '逐句背';
    }
    var focusBtn = root.querySelector('[data-action="toggle-focus"]');
    if (focusBtn) {
      focusBtn.classList.toggle('btn-primary', state.focusOnly);
      focusBtn.setAttribute('aria-pressed', state.focusOnly ? 'true' : 'false');
    }
    var p = prefs();
    var scale = Storage.normalizeFontScale(p.fontScale);
    var down = root.querySelector('[data-action="font-down"]');
    var up = root.querySelector('[data-action="font-up"]');
    if (down) down.disabled = scale <= 0;
    if (up) up.disabled = scale >= 2;
    var transBtn = root.querySelector('[data-action="toggle-translation"]');
    if (transBtn) transBtn.textContent = '译文：' + (p.showTranslation === false ? '关' : '开');
    var focusModeBtn = root.querySelector('[data-action="toggle-focusmode"]');
    if (focusModeBtn) focusModeBtn.textContent = p.focusMode ? '退出专注' : '专注';
    updateCounters(root);
  }

  /** 把阅读偏好落到 body / poemBody 上（切页时由 app.js 清理非学习页的类名） */
  function applyReadingPrefs(root) {
    var p = prefs();
    var body = root ? root.querySelector('#poemBody') : null;
    if (body) {
      body.classList.toggle('is-recite', state.reciteMode);
      body.classList.toggle('is-focus-only', state.focusOnly);
      body.classList.toggle('hide-translation', p.showTranslation === false);
    }
    if (document.body) {
      document.body.classList.toggle('focus-reading', !!p.focusMode);
      document.body.classList.remove('font-sm', 'font-md', 'font-lg');
      var scale = Storage.normalizeFontScale(p.fontScale);
      document.body.classList.add(scale === 0 ? 'font-sm' : scale === 2 ? 'font-lg' : 'font-md');
    }
  }

  function syncView(root) {
    updateLines(root);
    syncToolbar(root);
    updateCounters(root);
  }

  function setPoem(root, poemId, options) {
    var poem = DB.byId(poemId);
    if (!poem) return;
    var list = options && options.list ? options.list : state.list;
    // 只允许在“当前已选篇目”范围内切换，异常 URL / 旧状态不会把别的篇目标记为已学习
    if (
      !list.some(function (item) {
        return item.id === poem.id;
      })
    ) {
      return;
    }
    resetState(poem.id, list);
    Storage.markLearned(poem.id);
    render(root);
    if (global.scrollTo) global.scrollTo(0, 0);
  }

  function move(root, delta) {
    var total = state.sentences.length;
    if (!total) return;
    var next;
    if (state.activeIndex < 0) next = delta < 0 ? total - 1 : 0;
    else next = state.activeIndex + delta;
    if (next < 0) next = 0;
    if (next >= total) next = total - 1;
    state.activeIndex = next;
    syncView(root);
    var active = root.querySelector('.line-item.is-active');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function firstFocusIndex() {
    var keys = Object.keys(state.focusMap)
      .map(Number)
      .filter(function (n) { return n >= 0; })
      .sort(function (a, b) { return a - b; });
    return keys.length ? keys[0] : 0;
  }

  function revealAll(root) {
    state.hidden = {};
    state.keywordMode = false;
    state.activeIndex = -1;
    syncView(root);
  }

  function hideAll(root) {
    state.sentences.forEach(function (_, index) {
      state.hidden[index] = true;
    });
    syncView(root);
  }

  function toggleKeyword(root) {
    state.keywordMode = !state.keywordMode;
    if (state.keywordMode) {
      state.sentences.forEach(function (_, index) {
        state.hidden[index] = true;
      });
    }
    syncView(root);
  }

  function toggleRecite(root) {
    state.reciteMode = !state.reciteMode;
    if (state.reciteMode && state.activeIndex < 0) state.activeIndex = 0;
    if (!state.reciteMode) state.activeIndex = -1;
    applyReadingPrefs(root);
    syncView(root);
    if (state.reciteMode) {
      var active = root.querySelector('.line-item.is-active');
      if (active && active.scrollIntoView) active.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  function toggleFocusOnly(root) {
    state.focusOnly = !state.focusOnly;
    if (state.focusOnly) {
      var currentFocus = !!state.focusMap[state.activeIndex];
      if (!currentFocus) state.activeIndex = firstFocusIndex();
    }
    applyReadingPrefs(root);
    syncView(root);
  }

  function stepFont(root, delta) {
    var current = Storage.normalizeFontScale(prefs().fontScale);
    var next = Utils.clamp(current + delta, 0, 2);
    if (next === current) return;
    Storage.updatePrefs({ fontScale: next });
    applyReadingPrefs(root);
    syncView(root);
    if (global.PoetryApp) global.PoetryApp.toast('正文字号：' + ['小', '中', '大'][next]);
  }

  function toggleTranslation(root) {
    var next = prefs().showTranslation === false;
    Storage.updatePrefs({ showTranslation: next });
    applyReadingPrefs(root);
    syncView(root);
    if (global.PoetryApp) global.PoetryApp.toast(next ? '已显示译文' : '已隐藏译文');
  }

  function toggleFocusMode(root) {
    var next = !prefs().focusMode;
    Storage.updatePrefs({ focusMode: next });
    applyReadingPrefs(root);
    syncView(root);
    if (global.PoetryApp) global.PoetryApp.toast(next ? '已进入专注模式' : '已退出专注模式');
  }

  function handleClick(root, event) {
    var line = event.target.closest ? event.target.closest('[data-line]') : null;
    if (line) {
      var index = Number(line.getAttribute('data-line'));
      if (state.hidden[index]) delete state.hidden[index];
      else state.hidden[index] = true;
      state.activeIndex = index;
      syncView(root);
      return;
    }

    var hint = event.target.closest ? event.target.closest('[data-hint]') : null;
    if (hint && global.PoetryApp) {
      global.PoetryApp.toast('提示：' + hint.getAttribute('data-hint'));
      return;
    }

    var button = event.target.closest ? event.target.closest('[data-action]') : null;
    if (!button) return;
    var action = button.getAttribute('data-action');
    var poem = currentPoem();
    if (!poem) return;

    if (action === 'reveal-all') revealAll(root);
    else if (action === 'hide-all') hideAll(root);
    else if (action === 'toggle-keyword') toggleKeyword(root);
    else if (action === 'prev-line') move(root, -1);
    else if (action === 'next-line') move(root, 1);
    else if (action === 'toggle-recite') toggleRecite(root);
    else if (action === 'toggle-focus') toggleFocusOnly(root);
    else if (action === 'font-down') stepFont(root, -1);
    else if (action === 'font-up') stepFont(root, 1);
    else if (action === 'toggle-translation') toggleTranslation(root);
    else if (action === 'toggle-focusmode') toggleFocusMode(root);
  }

  /** 键盘快捷键：只在学习页由 app.js 统一转发，避免 document 监听器泄漏 */
  function handleKey(event) {
    if (!state.poemId || !state.root) return false;
    var target = event.target;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable)) return false;
    var key = event.key;
    if (key === ' ' || key === 'Spacebar' || key === 'ArrowRight' || key === 'ArrowDown') {
      event.preventDefault();
      if (key === ' ') {
        if (state.activeIndex < 0) state.activeIndex = 0;
        else if (state.hidden[state.activeIndex]) delete state.hidden[state.activeIndex];
        else state.hidden[state.activeIndex] = true;
        syncView(state.root);
      } else {
        move(state.root, 1);
      }
      return true;
    }
    if (key === 'ArrowLeft' || key === 'ArrowUp') {
      event.preventDefault();
      move(state.root, -1);
      return true;
    }
    if (key === 'r' || key === 'R') {
      event.preventDefault();
      revealAll(state.root);
      return true;
    }
    if (key === 'k' || key === 'K') {
      event.preventDefault();
      toggleKeyword(state.root);
      return true;
    }
    if (key === 'f' || key === 'F') {
      event.preventDefault();
      toggleFocusOnly(state.root);
      return true;
    }
    return false;
  }

  function mount(root, options) {
    var opts = options || {};
    var list = opts.list && opts.list.length ? opts.list : [];
    if (!list.length) {
      root.innerHTML = '<div class="card"><div class="empty-state">还没有选择篇目，请先返回选择要背诵的篇目。</div></div>';
      return;
    }
    var wanted = opts.poemId && DB.byId(opts.poemId) ? opts.poemId : '';
    var inList = list.some(function (item) {
      return item.id === wanted;
    });
    var poemId = inList ? wanted : list[0].id;
    state.root = root;
    resetState(poemId, list);
    Storage.markLearned(poemId);
    render(root);

    root.addEventListener('click', function (event) {

    });
    root.addEventListener('change', function (event) {
      if (event.target && event.target.id === 'studyPoemSelect') {

    var touchStart = null;

      var dy = event.changedTouches[0].clientY - touchStart.y;

    }, { passive: true });
  }

  global.PoetryStudy = {
    mount: mount,
    handleKey: handleKey,
    currentPoemId: function () {
